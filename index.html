function fichaPlan(pl){
  const B = LONCHERA.BASES;
  const rec = id => recetaPorId(id);
  const tot = pl.dias.reduce((n, d) => n + d[4], 0);

  const domingo = pl.prep.map(k => {
    const b = B[k], r = rec(b.receta);
    return '<div class="lo-base">' +
      '<div class="fila"><span class="nombre">' + b.n + '</span>' +
        (r ? '<button class="lo-ir" data-receta="' + b.receta + '">' + t('loVerReceta') + '</button>' : '') +
      '</div>' +
      '<p class="lo-rinde">' + b.rinde + '</p>' +
      '<p class="lo-dura"><em>' + t('loDura') + '</em> ' + b.dura + '</p>' +
      '<p class="como">' + b.como + '</p>' +
      '<p class="coc-tip">' + b.ojo + '</p></div>';
  }).join('');

  const dias = pl.dias.map(([d, id, base, monta, min, calienta]) => {
    const r = rec(id);
    const n = r ? nutriDe(r) : null;
    return '<div class="lo-dia">' +
      '<div class="lo-d-top"><b>' + d + '</b>' +
        '<span class="lo-min">' + min + ' ' + t('min') + '</span>' +
        '<span class="lo-t ' + (calienta ? 'cal' : 'frio') + '">' +
          t(calienta ? 'loCaliente' : 'loFrio') + '</span></div>' +
      '<button class="lo-plato" data-receta="' + id + '">' + (r ? r.name : id) + '</button>' +
      '<div class="lo-desde">' + t('loDesde') + ' <b>' + B[base].n + '</b></div>' +
      '<p class="como">' + monta + '</p>' +
      (n ? '<div class="lo-nu">' + Math.round(n.porcion.kcal) + ' kcal · ' +
           Math.round(n.porcion.prot) + ' g ' + t('nuProt').toLowerCase() + '</div>' : '') +
    '</div>';
  }).join('');

  const compra = compraDe(pl, 1);
  const lista = GROUPS.map(g => {
    const ids = idsDe(g);
    const mios = compra.filter(x => ids.includes(x.id));
    if(!mios.length) return '';
    return '<div class="f-sec mini">' + trGrupo(g.t) + '</div>' +
      mios.map(x => '<div class="lo-c">' +
        '<span class="lo-c-n">' + trIng(x.id) + '</span>' +
        '<b>' + pesoBonito(x.comprar) + '</b>' +
        (x.rend && x.rend < 95 ? '<em>' + t('loLimpio').replace('{g}', pesoBonito(x.limpio))
          .replace('{p}', x.rend) + '</em>' : '') +
      '</div>').join('');
  }).join('');

  return '<button class="coc-volver" id="loVolver">' + t('loVolver') + '</button>' +
    '<div class="coc-ficha">' +
      '<h3 class="coc-tit">' + pl.n + '</h3>' +
      '<p class="lo-q">' + pl.q + '</p>' +
      '<p class="coc-rinde">' + t('loTotal').replace('{n}', tot) + '</p>' +
      '<div class="f-sec mini">' + t('loDomingo') + '</div>' + domingo +
      '<div class="f-sec mini">' + t('loSemana') + '</div>' + dias +
      '<div class="f-sec mini">' + t('loCompra') + '</div>' +
      '<p class="h2sub">' + t('loCompraSub') + '</p>' + lista +
    '</div>';
}

/* ═══ Lonchera a la medida ═══
   El usuario elige qué almuerza cada día y la app hace el trabajo de cocina
   de restaurante: junta lo que se repite en una sola cocción del domingo,
   separa lo que se corta antes de lo que se corta el mismo día, dice qué
   proteína congelar y saca la lista de compra de toda la semana. */
let loModo = store.get('loModo', 'mia');
let loMia = store.get('loMia', null) || { personas: 1, activos: [0, 1, 2, 3, 4], dias: {} };
let loElige = null, loBusca = '', loCatSel = 'all';
const guardaLo = () => store.set('loMia', loMia);
const diaN = i => t('dia' + i);
const sinTilde = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const LO_CATS = ['all', 'ave', 'carne', 'pescado', 'arroz', 'pasta', 'veg', 'sopa', 'desayuno', 'pan', 'postre'];
// Pollo y papa salen de la base solo si el plato los usa ya cocidos y húmedos:
// un pollo frito o una papa al horno no se hacen con lo desmechado del domingo.
const TEC_HUMEDA = ['Guiso', 'Hervido', 'Cocción', 'Crudo', 'Salteado', 'Absorción', 'Cuajado',
  'Puré', 'Machacado', 'Revuelto', 'Risotto', 'Crema'];
// Lo que pierde si se corta antes: se oxida, se ablanda o se le va el aroma.
const DELICADAS = ['aguacate', 'tomate', 'lechuga', 'rucula', 'espinaca', 'champinon', 'pepino',
  'cilantro', 'perejil', 'albahaca', 'hierbabuena', 'cebollin', 'eneldo', 'berenjena', 'papa',
  'papacriolla', 'manzana', 'banano', 'pera', 'mango', 'fresa', 'brotessoya'];
const HIERBAS_FRESCAS = ['cilantro', 'perejil', 'albahaca', 'hierbabuena', 'cebollin', 'eneldo', 'estragon'];
const loGrupo = nombre => { const g = GROUPS.find(x => x.t === nombre); return g ? idsDe(g) : []; };

// Qué bases del domingo puede aprovechar un plato
function basesDe(r){
  if(!r || !r.ing) return [];
  const ids = r.ing.map(x => x[2]);
  const tiene = lista => ids.some(id => lista.includes(id) || lista.includes(FAMILIA[id]));
  const B = LONCHERA.BASES, out = [];
  Object.keys(B).forEach(k => {
    const b = B[k];
    if(ids.includes(b.receta)) { out.push(k); return; }
    if(r.pais === 'Japón') return;   // el arroz de sushi es otro arroz
    // Un arroz que se cuece en su propio caldo (arroz con pollo, de lisa, paella) no sale
    // del arroz blanco del domingo; uno de acompañamiento o salteado, sí.
    if(k === 'arroz'){ if(tiene(b.insumo) && (r.cat !== 'arroz' || r.tec === 'Salteado')) out.push(k); return; }
    if(['frijol', 'lenteja', 'garbanzo'].includes(k) && tiene(b.insumo)) out.push(k);
    else if(['pollo', 'papa'].includes(k) && tiene(b.insumo) && TEC_HUMEDA.includes(r.tec)) out.push(k);
  });
  return out;
}
const diasDura = k => { const m = (LONCHERA.BASES[k].dura || '').match(/(\d+)/); return m ? +m[1] : 3; };
// Todas las recetas del recetario, ya en el idioma activo
const loRecetas = () => [...(SEED || []), ...(typeof PREPS !== 'undefined' ? PREPS : [])];
const recetaVista = id => loRecetas().find(x => x.id === id) || recetaPorId(id);
function semanaMia(){
  return loMia.activos.slice().sort((a, b) => a - b)
    .map(i => ({ i, r: loMia.dias[i] ? recetaVista(loMia.dias[i]) : null }));
}

function miseMia(sel){
  const P = loMia.personas, B = LONCHERA.BASES;
  const conR = sel.filter(x => x.r);
  const porBase = {};
  conR.forEach(({ i, r }) => basesDe(r).forEach(k => {
    (porBase[k] = porBase[k] || []).push(i);
  }));
  // Una base vale la pena si la usan dos días o más
  const bases = Object.entries(porBase).filter(([, ds]) => ds.length >= 2).map(([k, ds]) => ({ k, ds }));
  const cubre = {};
  bases.forEach(({ k, ds }) => ds.forEach(i => {
    (cubre[i] = cubre[i] || []).push(...B[k].insumo, B[k].receta, k);
  }));
  const cubierto = (i, id) => (cubre[i] || []).includes(id) || (cubre[i] || []).includes(FAMILIA[id]);

  const preps = {}, prot = [], verd = {};
  const verdIds = [...loGrupo('Verduras'), ...HIERBAS_FRESCAS];
  const carnes = new Set([...loGrupo('Res y ternera'), ...loGrupo('Cerdo'), ...loGrupo('Cordero y otras carnes'),
    ...loGrupo('Pescados'), ...loGrupo('Mariscos'), ...loGrupo('Aves y huevos').filter(x => !/huevo/.test(x))]);
  conR.forEach(({ i, r }) => r.ing.forEach(([q, u, id]) => {
    const parte = P / Math.max(1, r.serv || 1);
    const sub = recetaPorId(id);
    if(sub){
      if(cubierto(i, id)) return;
      const p = preps[id] || (preps[id] = { id, ds: [], n: sub.name, min: sub.min || 0 });
      if(!p.ds.includes(i)) p.ds.push(i);
      return;
    }
    const g = gramosDe(q, u, id);
    if(!g || cubierto(i, id)) return;
    if(carnes.has(id) && u !== 'lata'){
      prot.push({ i, id, g: g * parte, fam: PROT[id] || FAMILIA[id] || '' });
      return;
    }
    if(verdIds.includes(id) || verdIds.includes(FAMILIA[id])){
      const v = verd[id] || (verd[id] = { id, g: 0, ds: [] });
      v.g += g * parte;
      if(!v.ds.includes(i)) v.ds.push(i);
    }
  }));
  const ver = Object.values(verd).filter(v => v.g >= 5);
  return {
    bases, cubre, preps: Object.values(preps), prot,
    duras: ver.filter(v => !DELICADAS.includes(v.id) && !DELICADAS.includes(FAMILIA[v.id])),
    delic: ver.filter(v => DELICADAS.includes(v.id) || DELICADAS.includes(FAMILIA[v.id])),
  };
}

// La compra de la semana entera: cada plato por las personas, con lo que se pierde al limpiar
function compraMia(sel){
  const need = {};
  const suma = (r, veces) => {
    if(!r) return;
    (r.ing || []).forEach(([q, u, id]) => {
      const sub = recetaPorId(id);
      if(sub){ suma(sub, veces * (q / Math.max(1, sub.serv))); return; }
      const g = gramosDe(q, u, id);
      if(!g) return;
      need[id] = (need[id] || 0) + g * veces / Math.max(1, r.serv || 1);
    });
  };
  sel.filter(x => x.r).forEach(({ r }) => suma(recetaPorId(r.id) || r, loMia.personas));
  return Object.entries(need).map(([id, limpio]) => {
    const rd = typeof REND !== 'undefined' ? REND[id] : null;
    return { id, limpio, comprar: rd ? limpio * 100 / rd : limpio, rend: rd || null };
  }).filter(x => x.limpio >= 3).sort((a, b) => b.comprar - a.comprar);
}
function htmlCompra(compra){
  return GROUPS.map(g => {
    const ids = idsDe(g);
    const mios = compra.filter(x => ids.includes(x.id));
    if(!mios.length) return '';
    return '<div class="f-sec mini">' + trGrupo(g.t) + '</div>' +
      mios.map(x => '<div class="lo-c">' +
        '<span class="lo-c-n">' + trIng(x.id) + '</span>' +
        '<b>' + pesoBonito(x.comprar) + '</b>' +
        (x.rend && x.rend < 95 ? '<em>' + t('loLimpio').replace('{g}', pesoBonito(x.limpio))
          .replace('{p}', x.rend) + '</em>' : '') +
      '</div>').join('');
  }).join('');
}

function loResultados(){
  const q = sinTilde(loBusca);
  const ya = semanaMia().filter(x => x.r && x.i !== loElige);
  const basesYa = new Set(ya.flatMap(x => basesDe(x.r)));
  const L = loRecetas().filter(r => r.cat !== 'salsa' && r.cat !== 'bebida' &&
      (loCatSel === 'all' || r.cat === loCatSel) &&
      (!q || sinTilde(r.name).includes(q) || sinTilde(r.pais).includes(q)))
    .map(r => ({ r, s: basesDe(r).filter(k => basesYa.has(k)).length }))
    .sort((a, b) => b.s - a.s || (a.r.min || 0) - (b.r.min || 0))
    .slice(0, 40);
  if(!L.length) return '<p class="como">' + t('sinResultados') + '</p>';
  return L.map(({ r, s }) =>
    '<button class="lo-res" data-lo-pon="' + r.id + '">' +
      '<span class="lo-res-n">' + r.name + '</span>' +
      '<span class="lo-res-m">' + trCat(r.cat) + ' · ' + r.min + ' ' + t('min') +
        (s ? ' · <b>' + t('loComparte') + '</b>' : '') + '</span>' +
    '</button>').join('');
}

function cuerpoMia(){
  const sel = semanaMia();
  const chips = [0, 1, 2, 3, 4, 5, 6].map(i =>
    '<button class="ftab' + (loMia.activos.includes(i) ? ' on' : '') + '" data-lo-dia="' + i + '">' +
    diaN(i).slice(0, 3) + '</button>').join('');
  const pers = '<div class="lo-pers"><span>' + t('loPersonas') + '</span>' +
    '<button data-lo-pers="-1">−</button><b>' + loMia.personas + '</b><button data-lo-pers="1">+</button></div>';

  const M = miseMia(sel);
  const dias = sel.map(({ i, r }) => {
    let pick = '';
    if(loElige === i){
      pick = '<div class="lo-pick">' +
        '<div class="calc-in"><input id="loBusca" type="search" placeholder="' + t('loBuscar') + '" value="' +
          (loBusca || '').replace(/"/g, '&quot;') + '"></div>' +
        '<div class="ftabs lo-cats">' + LO_CATS.map(c =>
          '<button class="ftab' + (loCatSel === c ? ' on' : '') + '" data-lo-cat="' + c + '">' +
          (c === 'all' ? t('loTodas') : trCat(c)) + '</button>').join('') + '</div>' +
        '<div id="loLista">' + loResultados() + '</div>' +
        '<button class="lo-ir" id="loCierra">' + t('loCerrar') + '</button></div>';
    }
    if(!r){
      return '<div class="lo-dia"><div class="lo-d-top"><b>' + diaN(i) + '</b></div>' +
        (loElige === i ? pick : '<button class="lo-elige" data-lo-elige="' + i + '">+ ' + t('loElegir') + '</button>') +
      '</div>';
    }
    const n = nutriDe(r);
    const listos = [...new Set(M.bases.filter(b => b.ds.includes(i)).map(b => LONCHERA.BASES[b.k].n)
      .concat(M.preps.filter(p => p.ds.includes(i)).map(p => (recetaVista(p.id) || {}).name || p.n)))];
    return '<div class="lo-dia"><div class="lo-d-top"><b>' + diaN(i) + '</b>' +
        '<span class="lo-min">' + r.min + ' ' + t('min') + '</span></div>' +
      '<button class="lo-plato" data-receta="' + r.id + '">' + r.name + '</button>' +
      htmlPlanDia(r, i) +
      (listos.length ? '<div class="lo-desde">' + t('loYaTienes').replace('{b}', '<b>' + listos.join(', ') + '</b>') + '</div>' : '') +
      (n ? '<div class="lo-nu">' + Math.round(n.porcion.kcal) + ' kcal · ' +
           Math.round(n.porcion.prot) + ' g ' + t('nuProt').toLowerCase() + '</div>' : '') +
      '<div class="lo-acc"><button class="lo-ir" data-lo-elige="' + i + '">' + t('loCambiar') + '</button>' +
        '<button class="lo-ir" data-lo-quita="' + i + '">' + t('loQuitar') + '</button></div>' +
      pick + '</div>';
  }).join('');

  const hay = sel.some(x => x.r);
  let mise = '';
  if(hay){
    const nombresDias = ds => ds.slice().sort((a, b) => a - b).map(diaN).join(', ');
    const B = LONCHERA.BASES;
    const minDom = M.bases.reduce((s, b) => s + ((recetaPorId(B[b.k].receta) || {}).min || 0), 0) +
      M.preps.reduce((s, p) => s + (p.min || 0), 0);
    const htmlBases = M.bases.map(({ k, ds }) => {
      const b = B[k], tarde = ds.filter(i => i + 1 > diasDura(k));
      return '<div class="lo-base"><div class="fila"><span class="nombre">' + b.n + '</span>' +
          (recetaPorId(b.receta) ? '<button class="lo-ir" data-receta="' + b.receta + '">' + t('loVerReceta') + '</button>' : '') +
        '</div>' +
        '<p class="lo-rinde">' + t('loSirve').replace('{d}', nombresDias(ds)) + '</p>' +
        '<p class="lo-dura"><em>' + t('loDura') + '</em> ' + b.dura + '</p>' +
        '<p class="como">' + b.como + '</p>' +
        (tarde.length ? '<p class="coc-tip">' + t('loCongela').replace('{d}', nombresDias(tarde)) + '</p>' : '') +
        '<p class="coc-tip">' + b.ojo + '</p></div>';
    }).join('');
    const htmlPreps = M.preps.map(p => '<div class="lo-c"><span class="lo-c-n">' +
        '<button class="lo-ir" data-receta="' + p.id + '">' + ((recetaVista(p.id) || {}).name || p.n) + '</button></span>' +
        '<em>' + t('loPrepUsa').replace('{d}', nombresDias(p.ds)) + '</em></div>').join('');
    const pesca = f => /pescado|marisco|molusco|camaron|cangrejo|almeja/.test(f || '');
    const htmlProt = M.prot.sort((a, b) => a.i - b.i).map(x => {
      const congelar = x.i >= (pesca(x.fam) ? 1 : 2);
      return '<div class="lo-c"><span class="lo-c-n">' + trIng(x.id) + ' · ' + diaN(x.i) + '</span>' +
        '<b>' + pesoBonito(x.g) + '</b>' +

                           : t('loProtNevera').replace('{d}', diaN(x.i))) + '</em></div>';
    }).join('');
    const htmlVerd = l => l.sort((a, b) => b.g - a.g).map(v => '<div class="lo-c"><span class="lo-c-n">' + trIng(v.id) +
      '</span><b>' + pesoBonito(v.g) + '</b><em>' + nombresDias(v.ds) + '</em></div>').join('');

    mise = htmlProduccion(sel, M) +
      '<div class="f-sec">' + t('loCompra') + '</div>' +
      '<p class="h2sub">' + t('loCompraMia').replace('{n}', loMia.personas) + '</p>' + htmlCompra(compraMia(sel));
  }

  return '<p class="h2sub">' + t('loMiaSub') + '</p>' +
    '<div class="f-sec mini">' + t('loDias') + '</div><div class="ftabs lo-dias">' + chips + '</div>' + pers +
    '<div class="f-sec">' + t('loSemana') + '</div>' +
    (hay ? '' : '<p class="como">' + t('loVacia') + '</p>') + dias + mise;
}

// Rehace la pestaña sin mandar al usuario arriba del todo
function reFicha(tab){
  const sh = document.getElementById('sheet'), y = sh.scrollTop;
  openFichas(tab);
  sh.scrollTop = y;
}
function enlazarLista(){
  document.querySelectorAll('[data-lo-pon]').forEach(b => b.onclick = () => {
    loMia.dias[loElige] = b.dataset.loPon; loElige = null; guardaLo(); reFicha('lonchera');
  });
}
function enlazarLonchera(){
  document.querySelectorAll('[data-lo-modo]').forEach(b => b.onclick = () => {
    loModo = b.dataset.loModo; store.set('loModo', loModo); reFicha('lonchera');
  });
  document.querySelectorAll('[data-lo-dia]').forEach(b => b.onclick = () => {
    const i = +b.dataset.loDia, a = loMia.activos;
    loMia.activos = a.includes(i) ? a.filter(x => x !== i) : a.concat(i);
    guardaLo(); reFicha('lonchera');
  });
  document.querySelectorAll('[data-lo-pers]').forEach(b => b.onclick = () => {
    loMia.personas = Math.min(12, Math.max(1, loMia.personas + (+b.dataset.loPers)));
    guardaLo(); reFicha('lonchera');
  });
  document.querySelectorAll('[data-lo-elige]').forEach(b => b.onclick = () => {
    loElige = +b.dataset.loElige; loBusca = ''; reFicha('lonchera');
    const q = document.getElementById('loBusca'); if(q) q.focus({ preventScroll: true });
  });
  document.querySelectorAll('[data-lo-quita]').forEach(b => b.onclick = () => {
    delete loMia.dias[b.dataset.loQuita]; guardaLo(); reFicha('lonchera');
  });
  document.querySelectorAll('[data-lo-cat]').forEach(b => b.onclick = () => {
    loCatSel = b.dataset.loCat;
    document.querySelectorAll('[data-lo-cat]').forEach(x => x.classList.toggle('on', x.dataset.loCat === loCatSel));
    document.getElementById('loLista').innerHTML = loResultados(); enlazarLista();
  });
  const qb = document.getElementById('loBusca');
  if(qb) qb.addEventListener('input', e => {
    loBusca = e.target.value;
    document.getElementById('loLista').innerHTML = loResultados(); enlazarLista();
  });
  const lc = document.getElementById('loCierra');
  if(lc) lc.onclick = () => { loElige = null; reFicha('lonchera'); };
  document.querySelectorAll('[data-pr-abre]').forEach(b => b.onclick = () => {
    const i = +b.dataset.prAbre;
    if(loPlanAbierto.has(i)) loPlanAbierto.delete(i); else loPlanAbierto.add(i);
    reFicha('lonchera');
  });
  enlazarLista();
}

/* ═══ Producción de restaurante para la lonchera ═══
   Para cada plato de la semana, qué se adelanta el domingo y qué queda para
   el día, con la lógica de una cocina de restaurante: lo largo se cocina una
   vez, la proteína llega porcionada y marinada (o apanada y congelada), las
   verduras firmes picadas, las de hoja lavadas, las salsas y bases hechas, la
   pasta precocida, las papas blanqueadas y congeladas. El día queda el último
   fuego, y ningún almuerzo debería pasar de 20 minutos.                     */
const PR_MAX_DIA = 20;
const PR_PICA = ['cebolla','cebollaroja','chalota','cebollalarga','cebollin','puerro','pimenton','pimentonrojo',

const PR_HOJAS = ['lechuga','rucula','berro','endivia'];

  'sachaculantro','epazote','salvia'];
const PR_DELIC = ['aguacate','tomate','pepino','champinon','portobello','shiitake','setas','berenjena','manzana','banano',
  'pera','mango','fresa','kiwi','durazno','brotessoya','platanomaduro','papaya','pina','sandia','melon'];

const PR_QUESO = ['parmesano','pecorino','quesomanchego','gruyere','quesocotija','cheddar','mozzarella','provolone',
  'quesocosteno','quesooaxaca'];

const PR_GRANO = ['frijol','frijolnegro','frijolrojo','lenteja','lentejaroja','garbanzo','fabes','pallar','arvejaseca',
  'guandu','quinua','cuscus','bulgur','cebada','maizpozolero','trigo'];

  'fettuccine','tagliatelle','pappardelle','bavette','mafaldine','trenette','rigatoni','fusilli','farfalle',
  'orecchiette','conchiglie'];
const PR_MAR = ['pescado','pescado_blanco','pescado_azul','pescado_rio','camaron','molusco','marisco'];

const prTx = (k, v) => { let s = t(k); Object.entries(v || {}).forEach(([a, b]) => { s = s.split('{' + a + '}').join(b); }); return s; };
const prMin1 = x => IDIOMA === 'es' && !/^[A-ZÁÉÍÓÚÑ]{2}/.test(x) ? x.charAt(0).toLowerCase() + x.slice(1) : x;
const prLista = ids => { const n = [...new Set(ids.map(trIng).map(prMin1))];
  return n.length < 2 ? n.join('') : n.slice(0, -1).join(', ') + ' ' + t('prY') + ' ' + n[n.length - 1]; };
const prDia = i => IDIOMA === 'es' ? diaN(i).toLowerCase() : diaN(i);
const prEs = (id, lista) => lista.includes(id) || lista.includes(FAMILIA[id]);

// Lo que se puede saber del plato: proteína principal, si es de mar, si se apana...
const PR_NO_PROT = ['bonito', 'anchoa', 'espinaspescado', 'caparazones', 'salmonahumado', 'tuetano', 'sangre'];
function prLee(r){
  const base = recetaPorId(r.id) || r;
  const pasos = (base.pasos || []).map(p => sinTilde(p[0])).join(' \n ');
  const n = sinTilde(base.name);
  const filas = (base.ing || []).map(([q, u, id]) => ({ id, q, u, g: gramosDe(q, u, id) || 0, sub: recetaPorId(id) }));
  const ids = filas.map(f => f.id);
  const cand = filas.filter(f => PROT[f.id] && PROT[f.id] !== 'huevo' && !PR_NO_PROT.includes(f.id) && f.g >= 40);
  // Los moluscos vivos no mandan: si hay pescado o camarón, ese es el principal
  const peso = f => f.g * (['almeja', 'mejillon', 'berberecho', 'ostra'].includes(f.id) ? 0.25 : 1);
  const prot = cand.filter(f => !PR_EMBUTIDO.includes(f.id)).sort((a, b) => peso(b) - peso(a))[0] ||
               cand.sort((a, b) => b.g - a.g)[0] || null;
  const fam = prot ? PROT[prot.id] : (ids.includes('tofu') ? 'tofu' : (ids.includes('huevo') ? 'huevo' : ''));
  const mar = PR_MAR.includes(fam);
  const apana = (ids.includes('pan') || ids.includes('panko') || ids.includes('galleta')) &&
    /apan|empaniz|pasa (cada|los|las|el|la).{0,40}(pan|harina)|panko|milanesa/.test(pasos + ' ' + n);
  // Minutos de fuego de verdad: sin contar marinadas, reposos ni remojos
  const fuego = (base.pasos || []).reduce((s, p) => s + (p[1] && !/marin|adob|repos|nevera|refriger|vispera|remoj|toda la noche|deja (que )?(tome|enfri)|salmuera/.test(sinTilde(p[0])) ? p[1] : 0), 0);
  const huevoDia = ids.includes('huevo') &&
    (/(casca|rompe|echa|agrega|anade|desliza|vierte) (los|el|un|cada|dos|cuatro|seis|ahi) huevo|huecos|escalfa|poch|huevo frito|a caballo|yema (blanda|liquida)|frie los huevos|huevos fritos/.test(pasos + ' ' + n) || /oyakodon|donburi|shakshuka/.test(n));
  return { base, pasos, n, filas, ids, prot, fam, mar, apana, fuego, huevoDia };
}

function prTipo(r, L){
  const { base, n, ids, prot, mar } = L;
  const tec = base.tec, cat = base.cat;
  const tieneId = x => ids.includes(x);
  if(/^masa|^pate|nixtamal/.test(n)) return 'base';
  if(cat === 'postre'){
    if(/cannoli/.test(n)) return 'cannoli';
    if(tec === 'Fritura' && /churro|picaron|bunuelo|lokma|pastelito|leche frita|rosquilla|tortas fritas|donut/.test(n)) return 'postrefrito';
    if(tec === 'Plancha') return 'masa';
    return 'postre';
  }
  if(/guacamole/.test(n)) return 'rapido';
  // Por nombre: los platos que se arman al momento con todo listo
  if(/enchilada|chilaquil|quesadilla|baleada|bruschetta|pa amb|roll de|pan con |sandwich|molletes|patacon con todo|tostones rellenos|tacos de canasta|rollitos vietnamitas|canape|tabla de|tlayuda|huarache|tlacoyo|sope|panucho|gordita|croque.monsieur/.test(n)) return 'armado';
  if(/ceviche|tiradito|aguachile|tartar|carpaccio|sushi|nigiri|maki|sashimi/.test(n)) return 'crudomar';
  if(/gazpacho|salmorejo|ajoblanco|escabeche|boquerones en vinagre|totopos|granola|yogur|escalivada|encurtid/.test(n) || (tec === 'Licuado' && cat === 'sopa')) return 'frio';
  if(/pizza|focaccia|fugazz|lahmacun|pide |pide$|manakish/.test(n)) return 'pizza';
  if(/sopa wantan|wantan chifa|tortellini in brodo/.test(n)) return 'sopawantan';
  if(/tamal|hayaca|humita en chala|juane|envuelto|bollo|insulso/.test(n)) return 'masa';
  if(/hamburguesa de lenteja|aloo tikki|lapingacho|rosti|falafel/.test(n)) return 'torta';
  if(/empanad|samosa|papa rellena|papas rellenas|marranita|croqueta|kibbeh|gyoza|wantan|siu mai|pastelito|pierogi|suppli|carimanola|ascolana/.test(n)) return 'masafrita';
  if(/tempura|pakora|tofu frito/.test(n)) return 'tempura';
  if(cat === 'pan' || (cat === 'desayuno' && /arepa|pancake|panqueque|waffle|crepe|cachapa|pan |pandebono|bunuelo|tortilla de harina|roti|paratha|naan|tostad|croissant|pain perdu/.test(n))) return 'masa';
  if(tec === 'Machacado' && ['platanoverde', 'yuca', 'guineo', 'platanomaduro'].some(tieneId)) return 'machacado';
  if(cat !== 'pasta' && /^ensalad|ensaladilla|vinagreta|sunomono|som tam|causa|solterito|piyaz|fattoush|tabbouleh|^papa a la huancaina|^ocopa|caprese|insalata/.test(n)) return 'ensalada';
  if(/fideua|fideo seco/.test(n)) return 'fideoseco';
  if(/steak au poivre|teriyaki|al limon con mantequilla|queue de homard|solomillo al whisky|saltimbocca/.test(n)) return 'plancha';
  if(/tikka masala|curry|guvec|baingan|carne en polvo|cochinita|pibil|barbacoa|birria|carnitas/.test(n) && tec !== 'Fritura') return 'olla';
  if(/pulpo|polpo|chipiron|calamar en su tinta/.test(n) && (base.min || 0) > 40 && tec !== 'Fritura') return 'olla';
  if(cat === 'sopa' || ['Crema', 'Infusión'].includes(tec)) return mar ? 'ollamar' : 'olla';
  if(cat === 'pasta'){
    if(tec === 'Horneado' || /lasa|canelon|cannelloni|gratin|al horno|pasticho|moussaka/.test(n)) return 'horno';
    if(/raviol|tortellini|tortelloni|gnocchi|noqui|sorrentino|agnolotti|cappelletti|mezzelune|culurgiones/.test(n)) return 'pastarellena';
    if(/chow mein|lo mein|pad thai|tallarin saltado|yakisoba|fideos con ajo y soya|fideos con camarones/.test(n)) return 'wok';
    if(tec === 'Salteado') return 'pastasalteada';
    if(tec === 'Emulsión' && !/huancaina|amatriciana|pomodoro/.test(n) || /carbonara|cacio|aglio|alfredo|burro|gricia|al limone/.test(n)) return 'pastaemul';
    return 'pasta';
  }
  if(tec === 'Risotto' || /risotto/.test(n)) return 'risotto';
  if(tec === 'Salteado' && !/paella/.test(n)) return 'wok';
  if(cat === 'arroz') return /suppli/.test(n) ? 'masafrita' : (mar ? 'arrozmar' : 'arroz');
  if(tieneId('huevo') && /tortilla|revuelto|omelette|huevo|menemen|machaca|gramajo|foo yong|oeuf|brouill|benedict|poche/.test(n) && (['Revuelto', 'Cuajado', 'Hervido', 'Cocción'].includes(tec) || cat === 'desayuno') && !/rellenos|cocido perfecto|huancaina|ocopa|ají amarillo|aji amarillo/.test(n)) return 'huevo';
  if(/foo yong/.test(n)) return 'huevo';
  if(tec === 'Fritura'){
    if(/agridulce|a la naranja|coreano|chi jau|tipakay|al limon|gai tod|chicharron de pollo|alitas|pollo frito/.test(n)) return 'frito2';
    if(/rancheros|divorciados|rabona|huevos rotos/.test(n)) return 'huevo';
    if(/cuy/.test(n)) return 'fritomar';
    if(/chiles rellenos/.test(n)) return 'chiles';
    if(L.apana) return 'apanado';
    if(mar) return 'fritomar';
    if(prot) return 'fritoprecocido';
    return 'fritoveg';
  }
  if(['Plancha', 'Parrilla', 'Airfryer', 'Asado'].includes(tec)){
    if(/matambre a la pizza/.test(n)) return 'asadolargo';
    if(!prot) return 'plancha';
    // Un corte grande que pasa de 45 minutos de fuego (asado al palo, costillas) se cocina el domingo
    if(L.fuego > 45 && !mar && /al horno|asado|asador|costilla|cordero|cabrito|lechona|porchetta|al palo|vacio|tira|colita|pollo entero|pavo|pernil|brasa|jerk|ternera|matambre|al trapo|pastor|chinchulin|shawarma|cuadril|verdeo|canard|pato/.test(n)) return 'asadolargo';
    return 'plancha';
  }
  if(tec === 'Horneado'){
    if(/cocotte|flamenca/.test(n)) return 'hornohuevo';
    const armado = /pastel|lasa|moussaka|gratin|pie|empanad|cottage|parmigiana|rellen|quiche|tarta|involtini|karn|imam|molletes|croque|txangurro|thermidor|conchitas|bacalao a la|kibbeh|bore/.test(n);
    if(prot && !mar && !armado) return 'asadolargo';
    if(mar && !armado) return 'hornomar';
    if(!prot && !armado && !/plantano|platano|maduro/.test(n)) return /papa|patata/.test(n) ? 'papahorno' : 'hornoveg';
    return 'horno';
  }
  if(tec === 'Crudo' || tec === 'Licuado') return 'ensalada';
  if(['Microondas'].includes(tec)) return 'rapido';
  if(mar && ['Guiso', 'Cocción', 'Reducción', 'Hervido', 'Emulsión'].includes(tec)) return 'ollamar';
  return 'olla';
}

// Cuántos minutos se cocina la proteína el día, según lo que es
const prMinProt = (fam, g) => {
  const m = { pollo: 10, pavo: 10, carne_res: 7, carne_molida: 8, cerdo: 9, cordero: 8, cabra: 8, caza: 8,
    pescado: 6, pescado_blanco: 6, pescado_azul: 6, pescado_rio: 6, camaron: 3, molusco: 3, marisco: 4, tofu: 5, huevo: 5 }[fam];
  return m || 8;
};

// Platos que no caben en ninguna regla: se escriben a mano, como en una ficha de producción
const PR_ESP = {

const prMemo = new Map();
function prPlan(r){
  const clave = IDIOMA + ':' + r.id;
  if(prMemo.has(clave)) return prMemo.get(clave);
  const plan = prPlanCalc(r);
  prMemo.set(clave, plan);
  return plan;
}

// Qué bases compartidas del domingo usa un plato, según su plan: solo las que de verdad
// entran como base cocida aparte (no la papa que va en bastones congelados ni la del ajiaco)
function basesDe(r){
  if(!r || !r.ing) return [];
  const p = prPlan(r), B = LONCHERA.BASES, out = [];
  const planos = p.dom.filter(x => x.k === 'almidon' && x.plano).map(x => x.id);
  const subs = p.dom.filter(x => x.k === 'sub').map(x => x.sub);
  const ids = (r.ing || []).map(x => x[2]);
  Object.keys(B).forEach(k => {
    const b = B[k];
    const de = id => b.insumo.includes(id) || b.insumo.includes(FAMILIA[id]);
    if(subs.includes(b.receta)) out.push(k);
    else if(planos.some(de)) out.push(k);
    else if(k === 'pollo' && ['ensalada', 'armado'].includes(p.tipo) && ids.some(de)) out.push(k);
  });
  return out;
}

      if(f.id === 'yuca'){ D('almidon', t('prYuca'), { id: f.id, g: f.g, vida: 0, congela: true, directo: true }); A(t('prDYuca'), 0); }
      else if(f.id === 'papacriolla') D('almidon', t('prPapaCriolla'), { id: f.id, g: f.g, vida: 3, congela: false });
      else if(frita){ D('almidon', t('prPapaFrita'), { id: f.id, g: f.g, vida: 0, congela: true, directo: true }); A(t('prDPapaFrita'), 0); }
      else if(!(tipo === 'huevo' && /tortilla/.test(n))) D('almidon', t('prPapaCocida'), { id: f.id, g: f.g, vida: 3, congela: false, plano: true });
    });
    filas.filter(f => PR_CHOCLO.includes(f.id) && f.u !== 'lata' && f.id !== 'maizpozolero').forEach(f => D('almidon', t('prChoclo'), { id: f.id, g: f.g, vida: 3, congela: true }));
    const pv = filas.find(f => f.id === 'platanoverde');
    if(pv && /patac|aplasta|tostones/.test(pasos + ' ' + n)){ D('almidon', t('prPatacon'), { id: 'platanoverde', g: pv.g, vida: 0, congela: true, directo: true }); A(t('prDPatacon'), 0); }
    filas.filter(f => prEs(f.id, PR_PASTA)).forEach(f => {
      if(/remoja (los|el) fideo|fideos? de arroz|no se hierve, se remoja/.test(pasos)) D('almidon', t('prFideoArroz'), { id: f.id, g: f.g, vida: 1 });
      else D('almidon', t('prPasta'), { id: f.id, g: f.g, vida: 3, congela: true });
    });
    filas.filter(f => prEs(f.id, PR_GRANO) || ['arroz', 'arrozbasmati', 'arrozjazmin', 'arrozintegral'].includes(f.id)).forEach(f => {
      if(tipo === 'wok' && /^arroz/.test(f.id)) D('almidon', t('prArrozFrio'), { id: f.id, g: f.g, vida: 3, congela: true, plano: true });
      else D('almidon', t('prGrano'), { id: f.id, g: f.g, vida: 3, congela: true, plano: true });
    });
  }
  if(tipo === 'ensalada'){
    const al = filas.filter(f => prEs(f.id, PR_ALINO)).map(f => f.id);
    if(al.length >= 2) D('frasco', prTx('prFrascoAlino', { x: prLista(al) }), { vida: 7 });
  }
  if(['pasta', 'pastaemul', 'pastasalteada', 'pastarellena', 'horno', 'pizza', 'armado', 'huevo', 'ensalada', 'risotto'].includes(tipo)){
    const qs = filas.filter(f => PR_QUESO.includes(f.id));
    if(qs.length) D('queso', prTx('prQueso', { x: prLista(qs.map(f => f.id)) }), { items: qs.map(f => ({ id: f.id, g: f.g })), vida: 7 });
  }
  if(['wok', 'pastaemul', 'pastasalteada', 'huevo', 'fritoveg'].includes(tipo)){
    filas.filter(f => ['chorizo', 'tocino', 'cerdo_panceta', 'guanciale', 'longaniza', 'chorizomex', 'salchicha', 'morcilla', 'butifarra'].includes(f.id) && f.g >= 20 && (!prot || f.id !== prot.id))
      .forEach(f => D('prot', t('prProtTocino'), { id: f.id, g: f.g, vida: 4, cook: 10 }));
  }

  // ── El día: lo que se corta al momento y lo fresco del final ──
  if(!['rapido', 'olla', 'arroz', 'horno', 'postre', 'masa', 'frio', 'ollamar', 'arrozmar', 'asadolargo', 'masafrita', 'machacado', 'sopawantan', 'hornoveg', 'risotto', 'fideoseco', 'torta'].includes(tipo) && !esp){
    const tomateCrudo = ['ensalada', 'crudomar', 'wok', 'plancha', 'armado', 'fritomar', 'apanado', 'fritoprecocido', 'frito2', 'pastasalteada'].includes(tipo) &&
      !(tipo === 'huevo');
    const delic = filas.filter(f => prEs(f.id, PR_DELIC) && (f.id !== 'tomate' || tomateCrudo)).map(f => f.id);
    if(delic.length) A(prTx('prDCorta', { x: prLista(delic) }), Math.min(3, 1 + delic.length));
  }
  const fin = [...new Set(frescos)];
  if(fin.length && ['olla', 'arroz', 'horno', 'ollamar', 'arrozmar', 'risotto', 'asadolargo', 'frio', 'machacado', 'sopawantan', 'fideoseco'].includes(tipo) && !esp)
    A(prTx('prDTermina', { x: prLista(fin) }), 2);
  if(tipo === 'crudomar') D('nota', t('prOjoCrudo'));
  if(tipo === 'fritoveg' && dia.length > 1 && dia.some(x => x.m === 0)){
    const g = dia.findIndex(x => x.txt === t('prDFritoVeg'));
    if(g >= 0){ dia.splice(g, 1); dia.filter(x => x.m === 0).forEach(x => { x.m = 8; }); }
  }
  if(dia.length && !dia.some(x => x.m > 3)){ const z = dia.find(x => !x.m); if(z) z.m = 8; }
  const minDia = dia.reduce((s, x) => s + (x.m || 0), 0);
  return { tipo, dom, dia, min: Math.max(1, minDia) };
}

// ¿Aguanta en nevera hasta ese día, o hay que congelarlo? (i: 0 lunes ... 6 domingo)
function prGuarda(x, i){
  if(x.k === 'nota' || x.k === 'remojo') return '';
  if(x.directo) return t('prGDirecto');
  if(x.crudo && i > 0) return prTx('prGCompra', { d: prDia((i + 6) % 7) });
  const dias = i + 1;
  if(x.vida >= dias) return prTx('prGNevera', { d: prDia(i) });
  if(x.congela) return prTx('prGCongela', { d: prDia((i + 6) % 7) });
  return t('prGMiercoles');
}

const loPlanAbierto = new Set();

// La producción de toda la semana, por estaciones, como se organiza una cocina
function htmlProduccion(sel, M){
  const P = loMia.personas;
  const est = { largo: [], bases: [], prot: [], verd: [], frasco: [], mie: [] };
  const nombresDias = ds => [...new Set(ds)].sort((a, b) => a - b).map(diaN).join(', ');
  const verd = {}, subs = {}, quesos = {}, cubiertas = new Set();
  let cook = 0, activo = 0;
  M.bases.forEach(({ k, ds }) => {
    const b = LONCHERA.BASES[k];
    cubiertas.add(b.receta); (b.insumo || []).forEach(x => cubiertas.add(x));
  });
  sel.filter(x => x.r).forEach(({ i, r }) => {
    const p = prPlan(r);
    const base = recetaPorId(r.id) || r;
    const f = P / Math.max(1, base.serv || 1);
    const usaBase = basesDe(r).filter(k => M.bases.some(b => b.k === k));
    const nombre = '<button class="lo-ir" data-receta="' + r.id + '">' + r.name + '</button>';
    p.dom.forEach(x => {
      const g = prGuarda(x, i);
      const tag = '<em>' + diaN(i) + (g ? ' · ' + g : '') + '</em>';
      if(x.k === 'olla'){
        est.largo.push('<div class="pr-i"><div>' + nombre + ' — ' + x.txt + '</div>' + tag + '</div>');
        cook += x.cook || 0; activo += 10;
      } else if(x.k === 'remojo'){
        est.largo.unshift('<div class="pr-i pr-nota"><div>' + nombre + ' — ' + x.txt + '</div></div>');
      } else if(x.k === 'sub'){
        if(cubiertas.has(x.sub)) return;
        const s = subs[x.sub] || (subs[x.sub] = { ds: [], cook: x.cook, vida: x.vida });
        s.ds.push(i);
      } else if(x.k === 'almidon'){
        if(x.id && cubiertas.has(x.id) && usaBase.length) return;
        est.bases.push('<div class="pr-i"><div><b>' + trIng(x.id) + ' ' + pesoBonito((x.g || 0) * f) + '</b> · ' + r.name + ' — ' + x.txt + '</div>' + tag + '</div>');
        activo += 8;
      } else if(x.k === 'prot'){
        est.prot.push('<div class="pr-i"><div>' + (x.id ? '<b>' + trIng(x.id) + ' ' + pesoBonito((x.g || 0) * f) + '</b> · ' : '') +
          r.name + ' — ' + x.txt + '</div>' + tag + '</div>');
        activo += 6; cook += x.cook || 0;
      } else if(['pica', 'blanq', 'hojas', 'hierba', 'ajo'].includes(x.k)){
        (x.items || []).forEach(y => {
          const key = x.k + ':' + y.id;
          const v = verd[key] || (verd[key] = { k: x.k, id: y.id, g: 0, ds: [], txt: x.txt, vida: x.vida, directo: x.directo });
          v.g += y.g * f; v.ds.push(i);
        });
      } else if(x.k === 'frasco'){
        est.frasco.push('<div class="pr-i"><div>' + nombre + ' — ' + x.txt + '</div>' + tag + '</div>');
        activo += 3;
      } else if(x.k === 'queso'){
        (x.items || []).forEach(y => { const q = quesos[y.id] || (quesos[y.id] = { g: 0, ds: [] }); q.g += y.g * f; q.ds.push(i); });
      } else if(x.k === 'nota'){
        est.largo.push('<div class="pr-i pr-nota"><div>' + nombre + ' — ' + x.txt + '</div></div>');
      }
    });
  });
  Object.entries(subs).forEach(([id, s]) => {
    const tarde = s.ds.filter(i => i + 1 > s.vida);
    est.bases.unshift('<div class="pr-i"><div><button class="lo-ir" data-receta="' + id + '">' + ((recetaVista(id) || {}).name || trIng(id)) +
      '</button> — ' + t('prSubRec') + '</div><em>' + nombresDias(s.ds) + (tarde.length ? ' · ' + prTx('prGCongelaVarios', { d: nombresDias(tarde) }) : '') + '</em></div>');
    cook += s.cook || 0; activo += 8;
  });
  // Verduras: lo que se come de jueves en adelante se corta el miércoles
  const titV = { pica: 'prPicaT', blanq: 'prBlanqT', hojas: 'prHojasT', hierba: 'prHierbaT', ajo: 'prAjoT' };
  ['pica', 'blanq', 'hojas', 'hierba', 'ajo'].forEach(k => {
    const vs = Object.values(verd).filter(v => v.k === k);
    if(!vs.length) return;
    const ahora = [], luego = [];
    vs.forEach(v => {
      const dom = v.directo ? v.ds : v.ds.filter(i => i + 1 <= v.vida);
      const mie = v.directo ? [] : v.ds.filter(i => i + 1 > v.vida);
      const share = v.g / v.ds.length;
      if(dom.length) ahora.push({ id: v.id, g: share * dom.length, ds: dom });
      if(mie.length) luego.push({ id: v.id, g: share * mie.length, ds: mie });
    });
    const fila = x => '<div class="lo-c"><span class="lo-c-n">' + trIng(x.id) + '</span><b>' + pesoBonito(x.g) + '</b><em>' + nombresDias(x.ds) + '</em></div>';
    if(ahora.length){
      est.verd.push('<div class="pr-st">' + t(titV[k]) + '</div><p class="pr-c">' + vs[0].txt + '</p>' + ahora.sort((a, b) => b.g - a.g).map(fila).join(''));
      activo += Math.round(ahora.reduce((s, x) => s + x.g, 0) / 60) + 3;
    }
    if(luego.length) est.mie.push('<div class="pr-st">' + t(titV[k]) + '</div>' + luego.sort((a, b) => b.g - a.g).map(fila).join(''));
  });
  Object.entries(quesos).forEach(([id, q]) => est.frasco.push('<div class="lo-c"><span class="lo-c-n">' + prTx('prQueso', { x: prMin1(trIng(id)) }) +
    '</span><b>' + pesoBonito(q.g) + '</b><em>' + nombresDias(q.ds) + '</em></div>'));

  const horas = Math.max(1, Math.round(((cook * 0.55) + activo) / 15) / 4);
  const hTxt = (Math.round(horas * 2) / 2).toString().replace('.', IDIOMA === 'es' ? ',' : '.');
  const sec = (k, html) => html ? '<div class="f-sec mini">' + t(k) + '</div>' + html : '';
  const basesHtml = M.bases.map(({ k, ds }) => {
    const b = LONCHERA.BASES[k], tarde = ds.filter(i => i + 1 > diasDura(k));
    return '<div class="pr-i"><div><button class="lo-ir" data-receta="' + b.receta + '">' + b.n + '</button> — ' + b.como + '</div><em>' +
      t('loSirve').replace('{d}', nombresDias(ds)) + (tarde.length ? ' · ' + prTx('prGCongelaVarios', { d: nombresDias(tarde) }) : '') + '</em></div>';
  }).join('');
  return '<div class="f-sec">' + t('prTit') + '</div>' +
    '<p class="h2sub">' + t('prSub') + ' ' + prTx('prHoras', { h: hTxt }) + '</p>' +
    sec('prEstLargo', est.largo.join('')) +
    sec('prEstBases', basesHtml + est.bases.join('')) +
    sec('prEstProt', est.prot.join('')) +
    sec('prEstVerd', est.verd.join('')) +
    sec('prEstFrasco', est.frasco.join('')) +
    '<div class="f-sec mini">' + t('prEstGuarda') + '</div>' +
    '<ul class="pr-l pr-reglas">' + ['prR1', 'prR2', 'prR3', 'prR4'].map(k => '<li>' + t(k) + '</li>').join('') + '</ul>' +
    (est.mie.length ? '<div class="f-sec">' + t('prMie') + '</div><p class="h2sub">' + t('prMieSub') + '</p>' + est.mie.join('') : '');
}

/* ═══ Comida saludable por calorías ═══
   Calorías del día con la fórmula de Mifflin-St Jeor, repartidas en cuatro
   comidas, y para cada una las recetas del recetario que encajan por
   calorías y por reparto de proteína, carbohidrato y grasa. La porción se
   ajusta (media, una, una y media...) para llegar a la meta. */
let salud = store.get('salud', null) ||
  { sexo: 'f', edad: '', peso: '', est: '', act: 1.375, obj: 'mantener', tipo: 'equilibrada', manual: '', semana: null };
const guardaSalud = () => store.set('salud', salud);
/* Auditoría del módulo saludable (versión 2):
   · La proteína se calcula por kilo de peso (como la recomiendan las guías),
     no como porcentaje fijo de las calorías: 206 g para un hombre de 80 kg
     era casi el doble de lo razonable.
   · Además de calorías y macros, el plan cuida fibra (mín. 25 g, o 14 g por
     cada 1.000 kcal), sodio (menos de 2.000 mg, la meta de la OMS) y azúcar
     añadida (menos del 10 % de las calorías).
   · Cada receta tiene una nota de calidad: fritura, embutidos, azúcar
     añadida, sodio, fibra y verdura por porción.
   · Desayuno sin pizzas, empanadas ni pastelería; merienda sin postres
     dulces ni bebidas con alcohol; nunca el mismo plato dos veces en el día;
     frituras máx. 2 a la semana y postre máx. 1.
   · Cada día se revisa entero y, si se pasa de sal o le falta fibra o
     proteína, se cambia el plato que más estorba.
   · Menores de 18 no reciben un plan de calorías.                          */
const SA_MACRO = { equilibrada: [20, 50, 30], altaprot: [30, 40, 30], bajacarb: [30, 30, 40], vegetariana: [18, 52, 30] };
// Proteína en gramos por kilo y grasa en % de las calorías, por tipo de dieta
const SA_TIPO = { equilibrada: { pkg: 1.0, pkgBajar: 1.2, gr: 30 }, altaprot: { pkg: 1.8, gr: 30 },
  bajacarb: { pkg: 1.5, gr: 40 }, vegetariana: { pkg: 1.1, pkgBajar: 1.2, gr: 30 } };
const SA_ACT = [[1.2, 'saAct1'], [1.375, 'saAct2'], [1.55, 'saAct3'], [1.725, 'saAct4'], [1.9, 'saAct5']];
const SA_COMIDAS = [
  ['desayuno', 0.25, ['desayuno', 'pan']],
  ['almuerzo', 0.35, ['ave', 'carne', 'pescado', 'arroz', 'pasta', 'veg', 'sopa']],
  ['cena', 0.30, ['ave', 'pescado', 'veg', 'sopa', 'carne', 'pasta']],
  ['merienda', 0.10, ['bebida', 'desayuno', 'veg', 'postre']],
];
const SA_SODIO = 2000;
// Lo que sirve de merienda entre las recetas de verdura: ensaladas, frutas y untables, no un guiso
const SA_MERIENDA_VEG = /ensalad|hummus|guacamole|salpicon|fruta|crudit|baba ganoush|muhammara|tzatziki|cacik|haydari|labneh|pepino|compota/;
const SA_NO_DESAYUNO = /pizza|empanad|fugazz|pide|lahmacun|focaccia|manakish|^masa|nixtamal|brisee|^roll |croque|paneton|pan dulce|rosquill|donut|tortas fritas|medialuna|concha|pan de muerto|bunuelo|hojaldra|pastelito|tabla de|canape|fugaz/;
const SA_NO_PLATO = /^masa|nixtamal|brisee|tabla de|canape|^caldo de (pollo|pescado|res)$|^fondo|^consomme|guacamole|^salsa|encurtid|pico de gallo/;
const SA_ALCOHOL = ['pisco', 'ron', 'vino', 'vinoblanco', 'cerveza', 'brandy', 'whisky', 'tequila', 'mezcal', 'fernet', 'aguardiente', 'sidra', 'marsala', 'vinojerez'];
const SA_AZUCAR = { azucar: 1, azucarmorena: 1, azucarpulverizada: 1, panela: 0.9, miel: 0.82, lechecondensada: 0.54,
  arequipe: 0.5, chocolate: 0.45, chocolateblanco: 0.6, gaseosa: 0.1, helado: 0.21, galleta: 0.3, melazagranada: 0.6 };
const SA_EMBUTIDO = ['chorizo', 'salchicha', 'tocino', 'morcilla', 'jamon', 'jamonserrano', 'butifarra', 'longaniza',
  'salchichon', 'pepperoni', 'guanciale', 'cecina', 'chorizomex', 'cerdo_chicharron'];

function metaSalud(){
  const e = +salud.edad, p = +salud.peso, h = +salud.est, piso = salud.sexo === 'm' ? 1500 : 1200;
  if(e > 0 && e < 18) return { menor: true };
  if((p && (p < 30 || p > 300)) || (h && (h < 120 || h > 230)) || (e && e > 110)) return { rango: true };
  let tdee = null, k = null;
  if(e > 0 && p > 0 && h > 0){
    const bmr = 10 * p + 6.25 * h - 5 * e + (salud.sexo === 'm' ? 5 : -161);
    tdee = bmr * (+salud.act || 1.375);
    // Bajar: déficit de 500 kcal, pero nunca más del 25 % del gasto
    k = salud.obj === 'bajar' ? tdee - Math.min(500, tdee * 0.25) : salud.obj === 'subir' ? tdee + 300 : tdee;
  }
  if(+salud.manual > 0) k = +salud.manual;
  if(k === null) return null;
  const bajo = k < piso;
  if(bajo) k = piso;
  k = Math.round(k / 10) * 10;
  const T = SA_TIPO[salud.tipo] || SA_TIPO.equilibrada;
  const [mp] = SA_MACRO[salud.tipo] || SA_MACRO.equilibrada;
  let prot = p > 0 ? p * (salud.obj === 'bajar' && T.pkgBajar ? T.pkgBajar : T.pkg) : k * mp / 400;
  prot = Math.min(k * 0.35 / 4, Math.max(k * 0.15 / 4, prot));          // entre 15 % y 35 % de las calorías
  const gras = k * T.gr / 900;
  const carb = Math.max(0, (k - prot * 4 - gras * 9) / 4);
  return { k, tdee: tdee && Math.round(tdee), piso, bajo, p: Math.round(prot), c: Math.round(carb), g: Math.round(gras),
    fib: Math.max(25, Math.round(k * 14 / 1000)), sod: SA_SODIO, azu: Math.round(k * 0.10 / 4),
    pp: prot * 4 / k * 100, pc: carb * 4 / k * 100, pg: T.gr };
}

// Azúcar añadida por porción, entrando a las subpreparaciones
function azucarDe(r, hondo){
  if(!r || !r.ing) return 0;
  let a = 0;
  r.ing.forEach(([q, u, id]) => {
    const sub = (hondo || 0) < 2 ? recetaPorId(id) : null;
    if(sub){ const s = azucarDe(sub, (hondo || 0) + 1) * Math.max(1, sub.serv || 1);
      const frac = u === '' ? q / Math.max(1, sub.serv || 1) : 0.25; a += s * Math.min(1, frac); return; }
    if(SA_AZUCAR[id]) a += (gramosDe(q, u, id) || 0) * SA_AZUCAR[id];
  });
  return a / Math.max(1, r.serv || 1);
}

let _saCand = null, _saDe = null, _saMap = null;
function candidatosSalud(){
  if(_saDe === PREPS && _saCand) return _saCand;
  const carnes = new Set([...loGrupo('Res y ternera'), ...loGrupo('Cerdo'), ...loGrupo('Cordero y otras carnes'),
    ...loGrupo('Embutidos y curados'), ...loGrupo('Pescados'), ...loGrupo('Mariscos'),
    ...loGrupo('Aves y huevos').filter(x => !/huevo/.test(x)),
    'caldopollo', 'caldores', 'salsapescado', 'bonito', 'anchoa', 'salsaostras', 'gelatina']);
  const esCarne = id => carnes.has(id) || (PROT[id] && PROT[id] !== 'huevo');
  const esVeg = r => !r.ing.some(([, , id]) => {
    if(esCarne(id)) return true;
    const sub = recetaPorId(id);
    return sub ? sub.ing.some(([, , j]) => esCarne(j)) : false;
  });
  const verde = new Set([...loGrupo('Verduras'), ...loGrupo('Frutas'), 'frijol', 'frijolnegro', 'frijolrojo', 'lenteja',
    'lentejaroja', 'garbanzo', 'arveja', 'arvejaseca', 'fabes', 'pallar', 'haba', 'guandu', 'quinua']);
  _saCand = loRecetas().filter(r => r.cat !== 'salsa').map(r => {
    const base = recetaPorId(r.id) || r;
    const nom = sinTilde(base.name);
    const n = nutriDe(r);
    if(!n || !(n.porcion.kcal >= 60) || n.sinDato > 1) return null;
    if(SA_NO_PLATO.test(nom)) return null;
    const ids = r.ing.map(i => i[2]);
    const alcohol = ids.some(id => SA_ALCOHOL.includes(id));
    if(r.cat === 'bebida' && alcohol) return null;
    const serv = Math.max(1, r.serv || 1);
    const gr = id => r.ing.filter(i => i[2] === id).reduce((s, i) => s + (gramosDe(i[0], i[1], id) || 0), 0) / serv;
    const emb = SA_EMBUTIDO.reduce((s, id) => s + gr(id), 0);
    const vegG = [...new Set(ids)].filter(id => verde.has(id) || verde.has(FAMILIA[id])).reduce((s, id) => s + gr(id), 0);
    const azu = azucarDe(base);
    const frito = base.tec === 'Fritura';
    const k = n.porcion.kcal, sod = n.porcion.sod || 0, fib = n.porcion.fib || 0;
    // Nota de calidad: menos es mejor
    const q = (frito ? 18 : 0) + (emb > 20 ? 14 : 0) + Math.max(0, azu - 10) * 1.5 +
      Math.max(0, sod - 700) / 45 - Math.min(14, fib * 2) - Math.min(10, vegG / 30);
    return { r, k, n: n.porcion, p: n.porcion.prot * 400 / k, c: n.porcion.carb * 400 / k,
             g: n.porcion.gras * 900 / k, veg: esVeg(r), azu, frito, emb: emb > 20, q, nom,
             postre: r.cat === 'postre' };
  }).filter(Boolean);
  _saMap = new Map(_saCand.map(x => [x.r.id, x]));
  _saDe = PREPS;
  return _saCand;
}
const porcionDe = (tk, k) => Math.min(2, Math.max(0.5, Math.round(tk / k * 4) / 4));
function opcionesComida(ci, meta){
  const [nom, pct, cats] = SA_COMIDAS[ci];
  const tk = meta.k * pct;
  return candidatosSalud()
    .filter(x => cats.includes(x.r.cat) && (salud.tipo !== 'vegetariana' || x.veg))
    .filter(x => {
      if(ci === 0) return !SA_NO_DESAYUNO.test(x.nom) && x.azu <= 20 && !x.emb;
      if(ci === 3) return x.k * porcionDe(tk, x.k) <= tk * 1.25 && x.azu <= (x.postre ? 12 : 15) && !x.frito && !x.emb &&
        (x.r.cat !== 'veg' || SA_MERIENDA_VEG.test(x.nom)) && (x.r.cat !== 'desayuno' || x.k <= 380);
      // un almuerzo o una cena tiene que ser un plato, no un acompañamiento escalado al doble
      return x.k >= tk * 0.5 && x.n.sod <= 1500;
    })
    .map(x => {
      const crudo = tk / x.k;
      if(crudo < 0.45 || crudo > 2.2) return null;
      const dev = Math.abs(x.p - meta.pp) + Math.abs(x.c - meta.pc) + Math.abs(x.g - meta.pg);
      return { x, s: dev * 0.8 + Math.abs(1 - crudo) * 30 + x.q +
        (salud.tipo === 'bajacarb' && x.c > 40 ? 50 : 0) + (ci === 3 && x.postre ? 15 : 0) };
    }).filter(Boolean).sort((a, b) => a.s - b.s).map(o => o.x).slice(0, 45);
}

// Lo que pesa un día entero contra las metas
function totalDia(dia, meta){
  const T = { k: 0, p: 0, c: 0, g: 0, fib: 0, sod: 0, azu: 0 };
  dia.forEach((id, ci) => {
    const x = id && _saMap.get(id); if(!x) return;
    const f = porcionDe(meta.k * SA_COMIDAS[ci][1], x.k);
    T.k += x.k * f; T.p += x.n.prot * f; T.c += x.n.carb * f; T.g += x.n.gras * f;
    T.fib += (x.n.fib || 0) * f; T.sod += (x.n.sod || 0) * f; T.azu += x.azu * f;
  });
  return T;
}
function penaDia(dia, meta){
  const T = totalDia(dia, meta);
  return Math.abs(T.k - meta.k) / meta.k * 100 + Math.max(0, T.sod - meta.sod) / 20 +
    Math.max(0, meta.fib - T.fib) * 3 + Math.max(0, meta.p * 0.95 - T.p) * 2 + Math.max(0, T.azu - meta.azu) +
    dia.reduce((s, id) => s + ((_saMap.get(id) || {}).q || 0) * 0.3, 0) +
    (new Set(dia.filter(Boolean)).size < dia.filter(Boolean).length ? 100 : 0);
}

function armarSemana(meta){
  candidatosSalud();
  const pools = SA_COMIDAS.map((c, ci) => opcionesComida(ci, meta));
  const usados = SA_COMIDAS.map(() => []);
  let fritos = 0, postres = 0, estricto = true;
  // Sin repetir plato en el día ni en la semana (si alcanza), una sola sopa al día, y almuerzo y cena de categorías distintas
  const vale = (x, ci, dia) => !dia.includes(x.r.id) && !(estricto ? usados[ci] : usados[ci].slice(-3)).includes(x.r.id) &&
    (!x.frito || fritos < 2) && (!x.postre || postres < 1) &&
    !(x.r.cat === 'sopa' && dia.some(id => ((_saMap.get(id) || {}).r || {}).cat === 'sopa')) &&
    !(ci === 2 && dia[1] && ((_saMap.get(dia[1]) || {}).r || {}).cat === x.r.cat) &&
    !(ci === 1 && dia[2] && ((_saMap.get(dia[2]) || {}).r || {}).cat === x.r.cat);
  // Cada día se arma tres veces desde puntos distintos y se queda el que mejor cumple
  const armaDia = () => {
    const dia = [];
    SA_COMIDAS.forEach((c, ci) => {
      const pool = pools[ci];
      if(!pool.length){ dia.push(null); return; }
      const top = pool.slice(0, 18);
      const salto = Math.floor(Math.random() * Math.min(8, top.length));
      let elegido = null;
      for(const modo of [true, false]){
        estricto = modo;
        for(let j = 0; j < pool.length && !elegido; j++){
          const x = pool[(j + salto) % pool.length];
          if(vale(x, ci, dia)) elegido = x;
        }
        if(elegido) break;
      }
      estricto = true;
      dia.push((elegido || pool[0]).r.id);
    });
    // Repaso del día: si se pasa de sal o le falta fibra o proteína, se cambia lo que más estorba
    for(let vuelta = 0; vuelta < 12; vuelta++){
      const base = penaDia(dia, meta);
      let mejor = null;
      dia.forEach((id, ci) => pools[ci].slice(0, 35).forEach(x => {
        if(x.r.id === id || !vale(x, ci, dia.filter((_, j) => j !== ci))) return;
        const prueba = dia.slice(); prueba[ci] = x.r.id;
        const p = penaDia(prueba, meta);
        if(p < base - 2 && (!mejor || p < mejor.p)) mejor = { p, ci, id: x.r.id };
      }));
      if(!mejor) break;
      dia[mejor.ci] = mejor.id;
    }
    return dia;
  };
  salud.semana = [0, 1, 2, 3, 4, 5, 6].map(() => {
    let dia = null, pena = Infinity;
    for(let intento = 0; intento < 3; intento++){
      const d = armaDia(), p = penaDia(d, meta);
      if(p < pena){ pena = p; dia = d; }
    }
    dia.forEach((id, ci) => { usados[ci].push(id); const x = _saMap.get(id);
      if(x && x.frito) fritos++; if(x && x.postre) postres++; });
    return dia;
  });
  guardaSalud();
}
function otraOpcion(d, ci, meta){
  candidatosSalud();
  const pool = opcionesComida(ci, meta);
  if(!pool.length) return;
  const actual = salud.semana[d][ci];
  const delDia = salud.semana[d];
  // Entre las siguientes opciones, la que deje mejor el día
  const desde = Math.max(0, pool.findIndex(x => x.r.id === actual));
  const cand = [];
  for(let j = 1; j <= Math.min(pool.length - 1, 6); j++){
    const x = pool[(desde + j) % pool.length];
    if(delDia.includes(x.r.id)) continue;
    const prueba = delDia.slice(); prueba[ci] = x.r.id;
    cand.push({ id: x.r.id, p: penaDia(prueba, meta) + j * 1.5 });
  }
  if(cand.length){ cand.sort((a, b) => a.p - b.p); salud.semana[d][ci] = cand[0].id; }
  guardaSalud();
}

            '<button class="lo-ir" data-sa-otra="' + d + ',' + ci + '">' + t('saOtra') + '</button></div>';
        }).join('');

        return '<div class="lo-dia sa-dia"><div class="lo-d-top"><b>' + diaN(d) + '</b>' +

function enlazarSalud(){
  document.querySelectorAll('[data-sa]').forEach(b => b.onclick = () => {
    const k = b.dataset.sa;
    salud[k] = k === 'act' ? +b.dataset.v : b.dataset.v;
    guardaSalud(); reFicha('saludable');
  });
  document.querySelectorAll('[data-sa-in]').forEach(inp => inp.addEventListener('change', () => {
    const v = inp.value.replace(',', '.');
    salud[inp.dataset.saIn] = v === '' ? '' : String(Math.max(0, +v || 0) || '');
    guardaSalud(); reFicha('saludable');
  }));
  const meta = metaSalud();
  document.querySelectorAll('[data-sa-gen]').forEach(b => b.onclick = () => {
    if(!meta) return;
    armarSemana(meta); reFicha('saludable');
  });
  document.querySelectorAll('[data-sa-otra]').forEach(b => b.onclick = () => {
    const [d, ci] = b.dataset.saOtra.split(',').map(Number);
    otraOpcion(d, ci, meta); reFicha('saludable');
  });
  document.querySelectorAll('[data-sa-lon]').forEach(b => b.onclick = () => {
    if(!salud.semana) return;
    [0, 1, 2, 3, 4].forEach(d => { const id = salud.semana[d][1]; if(id) loMia.dias[d] = id; });
    loMia.activos = [...new Set(loMia.activos.concat([0, 1, 2, 3, 4]))];
    loModo = 'mia'; store.set('loModo', loModo); guardaLo();
    openFichas('lonchera');
  });
}

function listaMaridaje(){
  const car = (DICC && DICC.maridaje) || {};
  // con filtro se busca en todo el catálogo, para que caiga también lo heredado
  const universo = filtroMar
    ? Object.keys(ING).filter(id => trIng(id).toLowerCase().includes(filtroMar) && parejasDe(id))
    : Object.keys(PAREJAS);
  // con el filtro puesto, un insumo sin ninguna pareja audaz no tiene nada que mostrar
  // Alfabético por el nombre traducido, no por el id: él busca "cordero",
  // no "cordero_pierna", y en inglés el orden es otro.
  const ids = (soloAudaces
    ? universo.filter(id => parejasDe(id).ids.some(c => c[2] === 2))
    : universo).sort((a, b) => trIng(a).localeCompare(trIng(b), 'es'));
  if(!ids.length) return '<p class="como">' + t('sinResultados') + '</p>';
  const chip = ([p, tipo, fuerza]) =>
    '<span class="par ' + tipo + (pantry.has(p) ? ' si' : '') + (fuerza === 2 ? ' audaz' : '') + '">' +
      trIng(p) + '</span>';
  return ids.map(id => {
    const d = parejasDe(id);
    return '<div class="item mar"><div class="fila">' +
      '<span class="nombre">' + trIng(id) + '</span>' +
      (pantry.has(id) ? '<span class="coc rapida">' + t('especiasTengo') + '</span>' : '') +
      '</div>' +
      (car[d.via || id] ? '<p class="como">' + car[d.via || id] + '</p>' : '') +
      (d.via ? '<p class="heredado">' + t('comoLa').replace('{x}', trIng(d.via)) + '</p>' : '') +
      '<div class="pars">' +
        (soloAudaces ? d.ids.filter(c => c[2] === 2) : d.ids).map(chip).join('') +
      '</div></div>';
  }).join('');
}

      return '<div class="item"><div class="fila">' +
        '<span class="nombre">' + it[0] + '</span>' +
        (it[1] ? '<span class="medida">' + it[1] + '</span>' : '') + '</div>' +
        (mm ? '<div class="escala"><i style="width:' + mm + 'mm;height:' + mm + 'mm"></i></div>' : '') +
        '<p class="como">' + it[2] + '</p></div>';
    }).join('')).join('');
}

/* ======== La base de la cocina ========
   Un mismo renderizador para las dos pestañas: 'salsa' muestra las salsas
   madre con sus derivadas, 'fondo' los fondos y los complementos que los
   alimentan. Al tocar una se abre su ficha; desde ahí se navega hacia
   abajo por sus dependencias.                                          */
let cocAbierta = null;    // id de la preparación abierta, o null = lista
let cocEscala  = 1;       // multiplicador de la receta
let cocFiltro  = '';
let cocNivel   = 'salsa'; // en cuál pestaña estamos
let cocPlato   = null;    // corte elegido dentro de una salsa: el plato armado

const ORDEN_FAM = ['bechamel','veloute_ave','veloute_ternera','veloute_pescado',
                   'demiglace','mantequilla','mayonesa','tomate'];

/* "1200 g" por 0.5 queda "600 g". Lo que no trae número (sal, pimienta)
   se deja igual: no se escala "al gusto". */
function escala(cant){
  if(!cant) return '';
  const m = String(cant).trim().match(/^(\d+(?:[.,]\d+)?)\s*(.*)$/);
  if(!m) return cant;
  let v = parseFloat(m[1].replace(',', '.')) * cocEscala;
  let u = m[2].trim();
  if(u === 'g' && v >= 1000){ v = v / 1000; u = 'kg'; }
  const r = v >= 100 ? Math.round(v)
          : v >= 10  ? Math.round(v * 10) / 10
          : Math.round(v * 100) / 100;
  return String(r).replace('.', ',') + (u ? ' ' + u : '');
}

const cocDe = id => (COCINA && COCINA[id]) || null;

function cuerpoCocina(nivel){
  if(!COCINA) return '<p class="h2sub">' + t('cocinaSinDatos') + '</p>';
  cocNivel = nivel;
  // Una ficha abierta sigue abierta solo si pertenece a esta pestaña. Así,
  // al seguir una dependencia de una salsa hacia su fondo, la ficha del
  // fondo se abre sola; y al cambiar de pestaña a mano, se vuelve a la lista.
  const d = cocAbierta && cocDe(cocAbierta);
  const suya = d && (nivel === 'salsa' ? d.nivel === 'salsa' : d.nivel !== 'salsa');
  if(!suya){ cocAbierta = null; cocFiltro = ''; cocPlato = null; }
  if(cocAbierta && cocPlato) return platoCoc(cocAbierta, cocPlato);
  if(cocAbierta) return fichaCoc(cocAbierta);
  return listaCoc(nivel);
}

function listaCoc(nivel){
  // Las claves que empiezan por __ son metadatos (el cruce, las reglas),
  // no preparaciones: hay que saltarlas o se cuelan en la lista de fondos.
  const todas = Object.entries(COCINA)
    .filter(([k]) => k.slice(0, 2) !== '__')
    .map(([, p]) => p)
    .filter(p => nivel === 'salsa' ? p.nivel === 'salsa' : p.nivel !== 'salsa');
  const q = cocFiltro.trim().toLowerCase();
  const pasa = p => !q || p.n.toLowerCase().includes(q) ||
                    p.ing.some(i => i[1].toLowerCase().includes(q));
  const vis = todas.filter(pasa);

  const grupos = {};
  vis.forEach(p => {
    const k = nivel === 'salsa' ? (p.fam || 'otras')
                                : (p.nivel === 'fondo' ? 'fondos' : 'complementos');
    (grupos[k] = grupos[k] || []).push(p);
  });
  const orden = nivel === 'salsa' ? ORDEN_FAM : ['fondos','complementos'];
  const titulo = k => nivel === 'salsa'
    ? ((vis.find(p => p.fam === k) || {}).famN || k)
    : t(k === 'fondos' ? 'cocFondos' : 'cocComplementos');

  const cuerpo = orden.filter(k => grupos[k]).map(k =>
    '<div class="f-sec">' + titulo(k) + '</div>' +
    grupos[k].map(p =>
      '<button class="coc-fila" data-coc="' + p.id + '">' +
        '<span class="coc-n">' + p.n + '</span>' +
        (p.usa.length ? '<span class="coc-dep">' + p.usa.length + '</span>' : '') +
      '</button>').join('')).join('');

  return '<p class="h2sub">' + t(nivel === 'salsa' ? 'salsasSub' : 'fondosSub') + '</p>' +
    '<div class="calc"><div class="calc-in"><input id="qCoc" type="search" ' +
      'placeholder="' + t('buscarCoc') + '" value="' + cocFiltro + '"></div></div>' +
    (vis.length ? cuerpo : '<p class="vacio">' + t('sinResultados') + '</p>');
}

function fichaCoc(id){
  const p = cocDe(id);
  const chip = (i, clase) => {
    const d = cocDe(i);
    return d ? '<button class="coc-chip ' + clase + '" data-coc="' + i + '">' + d.n + '</button>' : '';
  };
  const ESC = [[0.25,'¼'],[0.5,'½'],[1,'1'],[2,'2']];

  return '<button class="coc-volver" id="cocVolver">' + t('cocVolver') + '</button>' +
    '<div class="coc-ficha">' +
      '<div class="coc-fam">' + (p.famN || t(p.nivel === 'fondo' ? 'cocFondos' : 'cocComplementos')) + '</div>' +
      '<h3 class="coc-tit">' + p.n + '</h3>' +
      (p.rinde ? '<p class="coc-rinde">' + t('cocRinde') + ' ' + p.rinde + '</p>' : '') +

      (p.usa.length ? '<div class="f-sec mini">' + t('cocNecesita') + '</div>' +
        '<div class="coc-chips">' + p.usa.map(i => chip(i, 'antes')).join('') + '</div>' : '') +

      '<div class="f-sec mini">' + t('cocIngredientes') + '</div>' +
      '<div class="coc-esc">' + ESC.map(([v, et]) =>
        '<button class="esc' + (cocEscala === v ? ' on' : '') + '" data-esc="' + v + '">×' + et + '</button>').join('') + '</div>' +
      '<table class="coc-ing">' + p.ing.map(([c, n]) =>
        '<tr><td class="c">' + escala(c) + '</td><td>' + n + '</td></tr>').join('') + '</table>' +

      (p.local.length ? '<div class="f-sec mini">' + t('cocAqui') + '</div>' +
        p.local.map(([q, con, pq]) => '<div class="coc-eq">' +
          '<div class="coc-eq-q"><b>' + q + '</b> → ' + con + '</div>' +
          '<p class="coc-eq-p">' + pq + '</p></div>').join('') : '') +

      (p.mise.length ? '<div class="f-sec mini">' + t('cocMise') + '</div>' +
        '<ul class="coc-mise">' + p.mise.map(x => '<li>' + x + '</li>').join('') + '</ul>' : '') +

      '<div class="f-sec mini">' + t('cocMetodo') + '</div>' +
      '<ol class="coc-prep">' + p.prep.map(x => '<li>' + x + '</li>').join('') + '</ol>' +

      (p.tip.length ? '<div class="f-sec mini">' + t('cocConsejos') + '</div>' +
        p.tip.map(x => '<p class="coc-tip">' + x + '</p>').join('') : '') +

      (p.notas.length ? '<div class="coc-nota"><div class="tc-k">' + t('cocCorregido') + '</div>' +
        p.notas.map(x => '<p>' + x + '</p>').join('') + '</div>' : '') +

      ((p.usan && p.usan.length) ? '<div class="f-sec mini">' + t('cocUsadaEn') + '</div>' +
        '<div class="coc-chips">' + p.usan.map(i => chip(i, 'despues')).join('') + '</div>' : '') +
      vaCon(p) +
    '</div>';
}

/* Los cortes que le van a esta salsa, agrupados por proteína. Las que el
   cocinero marcó como clásicas van primero; las audaces, aparte. */
function vaCon(p){
  const c = COCINA.__cruce && COCINA.__cruce[p.id];
  if(!c || !c.cortes.length) return '';
  const seguras = c.cortes.filter(x => x[1] === 1);
  const audaces = c.cortes.filter(x => x[1] === 2);
  const bloque = (lista, clase) => lista.map(([id]) =>
    '<button class="coc-chip ' + clase + '" data-plato="' + id + '">' + trIng(id) + '</button>').join('');
  return '<div class="f-sec mini">' + t('cocVaCon') + '</div>' +
    '<p class="coc-cuantos">' + c.cortes.length + ' ' + t('cocPlatos') + '</p>' +
    '<div class="coc-chips">' + bloque(seguras, 'corte') + '</div>' +
    (audaces.length ? '<p class="coc-sub">' + t('cocMenosComun') + '</p>' +
      '<div class="coc-chips">' + bloque(audaces, 'corte audaz') + '</div>' : '') +
    (c.nota ? '<p class="coc-tip">' + c.nota + '</p>' : '');
}

/* El plato armado. No está guardado en ningún lado: sale de cruzar el corte
   con la salsa, más el tipo de cocción que el corte ya traía en la app. */
function platoCoc(sid, cid){
  const s = cocDe(sid);
  const c = COCINA.__cruce[sid];
  const R = COCINA.__reglas[s.fam];
  const coc = (typeof COCCION !== 'undefined' && COCCION[cid]) || 'rapida';
  const lenta = coc === 'lenta';
  const ambos = coc === 'ambos';
  return '<button class="coc-volver" id="cocVolverPlato">' + t('cocVolverSalsa') + ' ' + s.n + '</button>' +
    '<div class="coc-ficha">' +
      '<div class="coc-fam">' + t('cocPlatoArmado') + '</div>' +
      '<h3 class="coc-tit">' + trIng(cid) + ' en ' + s.n.replace(/^Salsa /, '') + '</h3>' +
      '<p class="coc-rinde">' + t('coc_' + coc) + '</p>' +

      '<div class="f-sec mini">' + t('cocElCorte') + '</div>' +
      '<p class="coc-para">' + (lenta ? t('cocComoLenta') : ambos ? t('cocComoAmbos') : t('cocComoRapida')) + '</p>' +

      '<div class="f-sec mini">' + t('cocLaSalsa') + '</div>' +
      '<p class="coc-para">' + R.como + '</p>' +
      '<p class="coc-tip">' + R.ojo + '</p>' +
      (c.nota ? '<p class="coc-tip">' + c.nota + '</p>' : '') +

      '<div class="f-sec mini">' + t('cocLaReceta') + '</div>' +
      '<div class="coc-chips"><button class="coc-chip antes" data-coc="' + sid + '">' + s.n + '</button>' +
        (s.usa || []).map(i => cocDe(i)
          ? '<button class="coc-chip" data-coc="' + i + '">' + cocDe(i).n + '</button>' : '').join('') +
      '</div>' +
    '</div>';
}

/* Las especias por proteína pasaron al grafo de maridaje, que es
   exactamente lo que son: qué va con qué, y por tradición. */

/* ============ Ficha: cómo se cocina cada cosa ============ */
function idsDe(g){ return [...g.ids, ...(g.mas||[])]; }
function fichaTiene(g){ return idsDe(g).some(id => COCCION[id] || COCFAM[id]); }
const COC_ETIQ = { rapida:'cocFuego', lenta:'cocTiempo', ambos:'cocAmbas' };

function openFicha(gi){
  const g = GROUPS[gi];
  const ids = idsDe(g);

  // Cortes: cocción y cómo se llaman en otra parte
  const cortes = ids.filter(id => COCCION[id]);
  const orden = { rapida:0, ambos:1, lenta:2 };
  cortes.sort((a,b) => (orden[COCCION[a]] - orden[COCCION[b]]) || trIng(a).localeCompare(trIng(b)));

  const filaCorte = id => {
    const e = EQUIV[id];
    return `<div class="fc">
      <div class="fc-top">
        <b>${trIng(id)}</b>
        <span class="coc ${COCCION[id]}">${t(COC_ETIQ[COCCION[id]])}</span>
      </div>
      ${e ? '<div class="fc-eq">' + e.slice(0,5).map((n,i) =>
          '<span><em>' + PAISES_CORTE[i] + '</em>' + n + '</span>').join('') +
          (e[5] === 0 ? '<span class="dudoso">' + t('variaDesposte') + '</span>' : '') + '</div>' : ''}
      ${MAS_PAISES[id] ? '<div class="mp">' + Object.entries(MAS_PAISES[id]).map(([p,n]) =>
          '<span><em>' + p + '</em>' + n + '</span>').join('') + '</div>' : ''}
    </div>`;
  };

  // Familias de cocción (verduras, granos, legumbres, frutas)
  // El mismo insumo a cuatro fuegos
  const conMetodo = ids.filter(id => DICC && DICC.metodos && DICC.metodos[id]);
  const bloqueMetodo = id => '<div class="ff"><h4>' + trIng(id) + '</h4><div class="met">' +
    DICC.metodos[id].map(m => '<span><em>' + m[0] + '</em>' + m[1] + '</span>').join('') +
    '</div></div>';

  const fams = [];
  ids.forEach(id => { const f = COCFAM[id]; if (f && !fams.includes(f)) fams.push(f); });
  const bloqueFam = f => {
    const info = trFam(f);
    const suyos = ids.filter(id => COCFAM[id] === f).map(trIng).join(' · ');
    return `<div class="ff">
      <h4>${info.t}</h4>
      <p class="como">${info.como}</p>
      <p class="ojo">${info.ojo}</p>
      <p class="quienes">${suyos}</p>
    </div>`;
  };

  document.getElementById('sheetInner').innerHTML = `
    <div class="ficha">
      <button class="back fx" id="fBack"><svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="f-cat">${t('comoSeCocina')}</div>
      <h2>${trGrupo(g.t)}</h2>
      ${cortes.length ? '<div class="f-sec">' + t('porCorte') + '</div>' + cortes.map(filaCorte).join('') : ''}
      ${conMetodo.length ? '<div class="f-sec">' + t('comoSeCocinaIng') + '</div>' + conMetodo.map(bloqueMetodo).join('') : ''}
      ${fams.length   ? '<div class="f-sec">' + t('porFamilia') + '</div>' + fams.map(bloqueFam).join('') : ''}
      ${ids.some(id => PESC_TIPO[id]) ? cuerpoPescados(ids) : ''}
      <p class="f-pie">${t('fichaPie')}</p>
    </div>`;
  document.getElementById('sheet').classList.add('open');
  document.getElementById('fBack').onclick = closeDetail;
  document.getElementById('sheet').scrollTop = 0;
}

/* Los fondos y salsas base que otras preparaciones necesitan hechos.
   Se marcan igual que un insumo y se guardan en la misma despensa, así que
   una bordalesa aparece lista si ya tienes la demi-glace en la nevera. */
function idsHechos(){
  if(!COCINA) return [];
  const necesarios = new Set();
  Object.keys(COCINA).filter(k => k.slice(0,2) !== '__')
    .forEach(k => (COCINA[k].usa || []).forEach(d => necesarios.add(d)));
  const peso = { complemento: 0, fondo: 1, salsa: 2 };
  return [...necesarios].sort((a,b) =>
    peso[COCINA[a].nivel] - peso[COCINA[b].nivel] || COCINA[a].n.localeCompare(COCINA[b].n));
}

function bloqueHecho(filtro){
  const ids = idsHechos().filter(id => !filtro || COCINA[id].n.toLowerCase().includes(filtro));
  if(!ids.length) return '';
  const n = ids.filter(id => pantry.has(id)).length;
  return '<div class="pgroup hechos">' +
    '<div class="gt">' + t('loQueTengoHecho') + (n ? '<span class="n">' + n + '</span>' : '') + '</div>' +
    '<p class="gsub">' + t('loQueTengoHechoSub') + '</p>' +
    '<div class="pills">' + ids.map(id =>
      '<button class="pill hecho ' + (pantry.has(id) ? 'on' : '') + '" data-ing="' + id + '">' +
      COCINA[id].n + '</button>').join('') +
    '</div></div>';
}

function renderPills(filtro){
  const eq=document.getElementById('eqPills');
  eq.innerHTML=Object.keys(EQUIPOS).map(k=>
    `<button class="pill eq ${equipo.has(k)?'on':''}" data-eq="${k}">${trEq(k)}</button>`).join('');
  eq.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.eq; equipo.has(k)?equipo.delete(k):equipo.add(k);
    savePantry(); renderPills(filtro);
  });
  document.getElementById('nEq').textContent=equipo.size;

  // Un argentino escribe "bife de chorizo" y debe encontrar la chata.
  const alias = id => { const e = EQUIV[id]; return e ? e.slice(0,5) : []; };
  const aliasQueCalza = id => alias(id).find(n => n.toLowerCase().includes(filtro));
  const pasa = id => !filtro || trIng(id).toLowerCase().includes(filtro) || !!aliasQueCalza(id);
  document.getElementById('groups').innerHTML = bloqueHecho(filtro) + GROUPS.map((g,gi)=>{
    const abierto = filtro || gruposAbiertos.has(gi);
    // lo marcado siempre se ve, aunque esté en la parte larga
    const extraVisible = (g.mas||[]).filter(id => abierto || pantry.has(id));
    const ids = [...g.ids, ...extraVisible].filter(pasa);
    const ocultos = (g.mas||[]).filter(id => !abierto && !pantry.has(id) && pasa(id)).length;
    if(!ids.length && !ocultos) return '';
    const n = [...g.ids, ...(g.mas||[])].filter(id=>pantry.has(id)).length;
    return `<div class="pgroup">
      <div class="gt">${trGrupo(g.t)} ${n?`<span class="n">${n}</span>`:''}${fichaTiene(g)?`<button class="gi" data-ficha="${gi}" aria-label="${t('comoSeCocina')}">i</button>`:''}</div>
      <div class="pills">${ids.map(id=>
        `<button class="pill ${pantry.has(id)?'on':''}" data-ing="${id}">${trIng(id)}${
           (filtro && !trIng(id).toLowerCase().includes(filtro) && aliasQueCalza(id))
             ? `<i class="aka">${aliasQueCalza(id)}</i>` : ''}</button>`).join('')}
        ${ocultos?`<button class="pill mas" data-mas="${gi}">+ ${ocultos} ${t('masOpciones')}</button>`:''}
        ${(abierto && !filtro && (g.mas||[]).length)?`<button class="pill mas" data-mas="${gi}">${t('verMenos')}</button>`:''}
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('[data-ficha]').forEach(b=>b.onclick=()=>openFicha(+b.dataset.ficha));
  document.querySelectorAll('[data-mas]').forEach(b=>b.onclick=()=>{
    const gi=+b.dataset.mas;
    gruposAbiertos.has(gi) ? gruposAbiertos.delete(gi) : gruposAbiertos.add(gi);
    renderPills(filtro);
  });
  document.querySelectorAll('[data-ing]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.ing; pantry.has(k)?pantry.delete(k):pantry.add(k);
    savePantry(); b.classList.toggle('on');
    actualizarBoton();
    document.querySelectorAll('.pgroup .gt .n').forEach(()=>{});
    renderPills(filtro);
  });
  actualizarBoton();
  pintarSugerencias();
}
function actualizarBoton(){
  const b=document.getElementById('goBtn'); if(!b) return;
  const n=pantry.size;
  b.className='go'+(n<3?' dim':'');
  b.innerHTML = n<3 ? t('marcaMin')
    : `${t('verCarta')} · ${n} ${t('insumos')}`;

/* Con lo que marcó, qué tres cosas le abrirían más puertas.
   No es lo que más combina en abstracto: es lo que más combina con SU despensa. */
/* Las proteínas que son el plato. Si ya tienes una, proponerte otra no es
   maridar: es proponerte cocinar algo distinto. */

const esProteina = id => PROT_PLATO.includes(PROT[id] || PROT[FAMILIA[id]]);

/* Una sugerencia tiene que ganarse el puesto: cuántos platos abre de verdad.
   Solo pueden abrirse los que ya están cerca, así que ahí se busca. */
function sugerencias(){
  const yaTieneProteina = [...pantry].some(esProteina);
  const abre = {}, acerca = {};

  PREPS.forEach(p => {
    if (p.eq.some(e => !equipo.has(e))) return;      // sin el equipo no hay plato
    const faltan = [];
    p.ing.map(i => i[2]).forEach(id => {
      if (tengo(id, p).ok) return;
      if (PRESCINDIBLES.has(id)) return;
      faltan.push(id);
    });
    if (!faltan.length || faltan.length > 3) return;
    if (faltan.length === 1) abre[faltan[0]] = (abre[faltan[0]] || 0) + 1;
    else faltan.forEach(id => acerca[id] = (acerca[id] || 0) + 1);
  });

  const puntua = id => {
    const d = parejasDe(id);
    const afin = !d ? 0 : d.ids.filter(c => pantry.has(c[0]))
                             .reduce((n, c) => n + (c[2] === 1 ? 2 : 1), 0);
    return (abre[id] || 0) * 20 + (acerca[id] || 0) * 2 + afin;
  };
  const todos = [...new Set([...Object.keys(abre), ...Object.keys(acerca)])]
    .filter(id => !pantry.has(id))
    .map(id => ({ id, rol: ROL[id], n: abre[id] || 0, pts: puntua(id) }))
    .filter(x => x.pts > 0)
    .sort((a, b) => b.pts - a.pts);

  // Sin proteína no hay plato: eso es lo primero que falta.
  if (!yaTieneProteina) {
    const prot = todos.filter(x => x.rol === 'proteina').slice(0, 5);
    return prot.length ? [{ rol: 'proteina', items: prot }] : [];
  }

  // Con la proteína puesta, lo que falta es con qué acompañarla y con qué salsearla.
  const de = (...roles) => todos.filter(x => roles.includes(x.rol)).slice(0, 4);
  const g = de('guarnicion');
  const sz = de('salsa', 'aromatico', 'acido', 'grasa');
  const out = [];
  if (g.length)  out.push({ rol: 'guarnicion', items: g });
  if (sz.length) out.push({ rol: 'sazon', items: sz });
  return out;
}

function pintarSugerencias(){
  const el = document.getElementById('sugiere');
  if(!el) return;
  const grupos = sugerencias();
  if(!grupos.length){ el.innerHTML = ''; return; }
  const chip = x => '<button class="pill sug" data-ing="' + x.id + '">+ ' + trIng(x.id) +
    (x.n ? '<i>' + x.n + ' ' + (x.n > 1 ? t('platos') : t('plato')) + '</i>' : '') + '</button>';
  el.innerHTML = '<div class="gt">' + t('sugiereTitulo') + '</div>' +
    '<p class="sug-sub">' + t('sugiereSub') + '</p>' +
    grupos.map(g => '<div class="sug-rol">' + t('rol_' + g.rol) + '</div>' +
      '<div class="pills">' + g.items.map(chip).join('') + '</div>').join('');
  el.querySelectorAll('[data-ing]').forEach(b => b.onclick = () => {
    const id = b.dataset.ing;
    const antes = pantry.size >= 3 ? buscarPreparaciones().listas.length : 0;
    pantry.add(id); savePantry(); renderPills();
    // Sumar un insumo sin ver qué abrió deja al cocinero dando vueltas:
    // la sugerencia tiene que devolverlo al recetario.
    if(pantry.size >= 3){
      const despues = buscarPreparaciones().listas.length;
      const n = despues - antes;
      toast(trIng(id) + (n > 0 ? ' · +' + n + ' ' + (n > 1 ? t('platos') : t('plato')) : ''));
      mostrarResultados();
    } else toast(trIng(id));
  });
}

function mostrarResultados(){
  if(pantry.size<3){ toast(t('marcaMin')); return; }
  const {listas,cerca}=buscarPreparaciones();
  const box=document.getElementById('resultados');
  let html='';

  html+=`<div class="res-head"><span class="badge ok">${t('puedesYa')}</span>
         <span>${listas.length}</span></div>`;
  html+= listas.length
    ? listas.map(r=>cardHTML(r,false)).join('')
    : `<div class="empty" style="padding:26px">
       ${t('nadaAun')}<br>${t('miraAbajo')}</div>`;

  if(cerca.length){
    html+=`<div class="res-head"><span class="badge near">${t('faltaPoco')}</span>
           <span>${cerca.length}</span></div>`;
    html+= cerca.map(r=>cardHTML(r,true)).join('');
  }

  html+=aiBoxHTML();
  box.innerHTML=html;

  box.querySelectorAll('[data-prep]').forEach(c=>c.onclick=()=>{
    const p=PREPS.find(x=>x.id===c.dataset.prep); if(p) openDetail(p);
  });
  document.getElementById('aiBtn').onclick=pedirIA;
  box.scrollIntoView({behavior:'smooth',block:'start'});
}
function cardHTML(r,esCerca){
  const p=r.p;
  const nombres=ids=>ids.map(i=>trIng(i)).join(', ');
  return `<button class="res-card" data-prep="${p.id}">
    ${lienzo(p,'ic','21px')}
    <div class="rc-body">
      <div class="tec">${trTec(p.tec)} · ${trPais(p.pais)}</div>
      <h4>${p.name}</h4>
      <div class="rmeta"><span>${p.min} ${t('min')}</span><span>${p.serv} ${t('porciones')}</span><span>${trDif(p.dif)}</span></div>
      ${esCerca?`<div class="miss">${t('consigue')} ${nombres(r.falta).toLowerCase()} ${t('yLoTienes')}</div>`:''}
      ${(r.opcionalFalta&&r.opcionalFalta.length)?`<div class="uses">${t('sinX')} ${nombres(r.opcionalFalta.slice(0,3)).toLowerCase()} ${t('igualSale')}</div>`:''}
      ${r.sustituciones.length?`<div class="uses">${t('usa')} ${nombres(r.sustituciones.map(s=>s[1])).toLowerCase()} ${t('enVezDe')} ${nombres(r.sustituciones.map(s=>s[0])).toLowerCase()}</div>`:''}
      ${(!esCerca&&r.extras.length)?`<div class="uses">${t('quedaBien')} ${nombres(r.extras.slice(0,3)).toLowerCase()}</div>`:''}
    </div>
  </button>`;
}

   paso en que va. Sin señal, responde la guía de problemas de la app. */

    es: '**Ahora mismo:**\n1. Saca la carne a un plato y **guarda el líquido**: es jugo con sabor, va a la salsa.\n2. Seca cada pieza con papel, por todos lados.\n3. Deja la sartén vacía al fuego **3 o 4 minutos** hasta que esté muy caliente, con una cucharada de aceite.\n4. Vuelve a poner la carne **en tandas**, pocas piezas, sin moverlas 2 o 3 minutos por lado.\n5. Al final reduce ese jugo en la misma sartén para la salsa.\n\n**Por qué pasó:** la sartén se enfrió al recibir mucha carne fría y mojada; por debajo de unos 150 °C la carne no se dora, se cuece en su agua.\n\n**Con estufa de poco fuego:** sartén de hierro o de fondo grueso precalentada más tiempo, piezas más delgadas, carne a temperatura ambiente y sal justo antes. Si tienes horno o airfryer, sella allí a máxima temperatura.',
    en: '**Right now:**\n1. Take the meat out and **keep the liquid**: it is flavourful juice for the sauce.\n2. Pat each piece dry with paper.\n3. Leave the empty pan on the heat **3 to 4 minutes** with a spoon of oil until very hot.\n4. Put the meat back **in batches**, few pieces, without moving them 2 to 3 minutes per side.\n5. Reduce the juice in the same pan for the sauce.\n\n**Why:** the pan cooled down under too much cold, wet meat; below about 150 °C meat steams instead of browning.\n\n**With a weak stove:** cast iron or a heavy pan preheated longer, thinner pieces, meat at room temperature, salt just before. If you have an oven or airfryer, sear there at maximum heat.' },
