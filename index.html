    es: '**Ahora mismo:**\n1. Si es caldo, sopa o guiso: **agrega más líquido sin sal** (agua o caldo casero) y más del ingrediente principal.\n2. Equilibra con un poco de **ácido** (limón o vinagre) y una pizca de azúcar: no quitan sal, pero la disimulan.\n3. Una papa en trozos absorbe algo de líquido salado, pero ayuda poco: lo que de verdad funciona es diluir.\n\n**La próxima vez:** sala al final si el plato se va a reducir, y prueba antes de rectificar.',

  { k: /quem[oó]|se quem|burnt|burned|scorch/i,

  { k: /(muy|demasiado) (l[ií]quid|aguad|ralo|clar)|no espesa|espesar|too (thin|runny|watery)|thicken/i,

    es: '**Si es un corte de guiso (falda, morrillo, costilla):** no está pasada, le falta tiempo. Tapa, fuego bajo con líquido y sigue cocinando hasta que se deshaga.\n**Si es un corte tierno (lomo, pechuga) y se pasó:** córtala muy fina contra la fibra y sírvela con una salsa caliente, o desmenúzala para un salteado o una sopa.\n\n**La próxima vez:** cortes tiernos a fuego alto y poco tiempo; cortes duros, bajo y largo. Un termómetro evita adivinar.',

function chefLocal(q){
  const hit = CHEF_LOCAL.filter(x => x.k.test(q));
  if(!hit.length) return null;
  return hit.slice(0, 2).map(x => IDIOMA === 'en' ? x.en : x.es).join('\n\n---\n\n');
}

function chefContexto(){
  if(!chefCtx) return {};
  const r = (typeof recetaVista === 'function' ? recetaVista(chefCtx.id) : null) ||
            allRecipes().find(x => x.id === chefCtx.id);
  if(!r) return {};
  const ing = (r.ing || []).map(([q, u, id]) =>
    (q ? String(q).replace('.', ',') + ' ' : '') + (u ? trUni(u) + ' ' : '') + trIng(id)).join(', ');
  const pasos = (r.pasos || []).map((p, i) => (i + 1) + '. ' + p[0]).join(' ');
  const receta = r.name + ' (' + trPais(r.pais) + ', ' + trTec(r.tec) + ', ' + r.serv + ' ' + t('porciones') + '). ' +
    'Ingredientes: ' + ing + '. Pasos: ' + pasos;
  const paso = chefCtx.paso != null && r.pasos && r.pasos[chefCtx.paso]
    ? (chefCtx.paso + 1) + '. ' + r.pasos[chefCtx.paso][0] : '';
  return { receta, paso };
}

// El md() de la app deja saltos de línea sueltos; aquí se vuelven <br> salvo detrás de un paso de lista
const mdChef = x => md(x).replace(/<\/div>\n+/g, '</div>').replace(/(<\/h4>)\n+/g, '$1').replace(/\n/g, '<br>');
/* Agregar una receta a la semana desde la receta misma */
function pintarSemDias(r){
  const box = document.getElementById('semDias');
  if(box.classList.contains('open')){ box.classList.remove('open'); box.innerHTML = ''; return; }
  box.classList.add('open');
  box.innerHTML = '<p>' + t('loAgregarDia') + '</p><div class="sem-chips">' +
    [0,1,2,3,4,5,6].map(i => {
      const ya = loMia.dias[i] ? recetaVista(loMia.dias[i]) : null;
      return '<button data-sem-dia="' + i + '"' + (ya ? ' class="ocupado" title="' + ya.name.replace(/"/g, '&quot;') + '"' : '') + '>' +
        diaN(i).slice(0, 3) + '</button>';
    }).join('') + '</div><p class="sem-nota">' + t('loAgregarNota') + '</p>';
  box.querySelectorAll('[data-sem-dia]').forEach(b => b.onclick = () => {
    const i = +b.dataset.semDia;
    loMia.dias[i] = r.id;
    if(!loMia.activos.includes(i)) loMia.activos.push(i);
    guardaLo();
    box.innerHTML = '<p class="sem-ok">' + t('loAgregado').replace('{d}', diaN(i).toLowerCase()) + '</p>' +
      '<button class="sem-ver" id="semVer">' + t('loVerSemana') + '</button>';
    document.getElementById('semVer').onclick = () => { closeDetail(); switchTab('semana'); };
  });
}
function openChef(ctx){
  const id = ctx ? ctx.id : null;
  if(id !== (chefCtx ? chefCtx.id : null)) chefHist = [];   // otra receta, otra conversación
  chefCtx = ctx || null;
  document.getElementById('chef').classList.add('open');
  pintarChef();
  setTimeout(() => { const q = document.getElementById('chefQ'); if(q) q.focus(); }, 60);
}
function cerrarChef(){ document.getElementById('chef').classList.remove('open'); }

function pintarChef(){
  const el = document.getElementById('chef');
  let chip = '';
  if(chefCtx){
    const r = allRecipes().find(x => x.id === chefCtx.id);
    if(r) chip = '<div class="chef-ctx"><span>' + t('chefSobre').replace('{r}', '<b>' + r.name + '</b>') +
      (chefCtx.paso != null ? ' · ' + t('chefPaso').replace('{n}', chefCtx.paso + 1) : '') + '</span>' +
      '<button id="chefSinCtx" aria-label="' + t('chefQuitar') + '">×</button></div>';
  }
  const ejemplos = ['chefEj1', 'chefEj2', 'chefEj3', 'chefEj4'];
  const hilo = chefHist.length
    ? chefHist.map(m => m.role === 'user'
        ? '<div class="chef-msg yo">' + m.content.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</div>'
        : '<div class="chef-msg el' + (m.local ? ' local' : '') + '">' +
            (m.local ? '<div class="chef-aviso">' + t('chefSinRed') + '</div>' : '') + mdChef(m.content) + '</div>').join('')
    : '<p class="chef-intro">' + t('chefIntro') + '</p>' +
      '<div class="chef-ejs">' + ejemplos.map(k => '<button class="chef-ej" data-ej="' + k + '">' + t(k) + '</button>').join('') + '</div>';
  el.innerHTML =
    '<div class="chef-top"><div><div class="chef-k">' + t('chefK') + '</div><h3>' + t('chefTitulo') + '</h3></div>' +
      '<button class="x" id="chefX" aria-label="' + t('loCerrar') + '"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
    chip +
    '<div class="chef-hilo" id="chefHilo">' + hilo +
      (chefOcupado ? '<div class="chef-msg el pensando"><span class="spin"></span> ' + t('chefPensando') + '</div>' : '') +
    '</div>' +
    '<div class="chef-in"><textarea id="chefQ" rows="2" placeholder="' + t('chefPh') + '"' + (chefOcupado ? ' disabled' : '') + '></textarea>' +
      '<button id="chefEnviar"' + (chefOcupado ? ' disabled' : '') + '>' + t('chefEnviar') + '</button></div>' +
    '<p class="chef-ojo">' + t('chefOjo') + '</p>';
  document.getElementById('chefX').onclick = cerrarChef;
  const sc = document.getElementById('chefSinCtx');
  if(sc) sc.onclick = () => { chefCtx = null; chefHist = []; pintarChef(); };
  el.querySelectorAll('[data-ej]').forEach(b => b.onclick = () => {
    const q = document.getElementById('chefQ'); q.value = t(b.dataset.ej); q.focus();
  });
  document.getElementById('chefEnviar').onclick = preguntarChef;
  document.getElementById('chefQ').addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); preguntarChef(); }
  });
  const h = document.getElementById('chefHilo'); h.scrollTop = h.scrollHeight;
}

async function preguntarChef(){
  const q = document.getElementById('chefQ');
  const pregunta = (q.value || '').trim();
  if(!pregunta || chefOcupado) return;
  const historial = chefHist.filter(m => !m.local).map(({ role, content }) => ({ role, content }));
  chefHist.push({ role: 'user', content: pregunta });
  chefOcupado = true; pintarChef();
  const eqs = typeof equipo !== 'undefined' ? [...equipo].map(e => trEq(e)).join(', ') : '';
  let respuesta = null, local = false, error = '';
  try{
    const res = await fetch(CHEF_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ pregunta, historial, equipos: eqs, idioma: IDIOMA }, chefContexto())) });
    const data = await res.json().catch(() => ({}));
    if(res.ok && data.texto) respuesta = data.texto;
    else error = data.error || (t('chefError') + ' (' + res.status + ')');
  }catch(e){ error = t('chefError'); }
  if(!respuesta){
    // Sin el chef en línea, la guía de la app responde lo que conoce
    const guia = chefLocal(pregunta + ' ' + ((chefContexto().receta || '').slice(0, 80)));
    respuesta = guia || t('chefNoSe') + (error ? '\n\n' + error : '');
    local = true;
  }
  chefHist.push({ role: 'assistant', content: respuesta, local });
  chefOcupado = false; pintarChef();
}

function aiBoxHTML(){
  return `<div class="ai-box">
    <h4>${t('pideIdea')}</h4>

  </div>`;

const AI_ENDPOINT = '/.netlify/functions/chef';  // mismo sitio, sin configurar nada

function md(t){  // Markdown mínimo → HTML (seguro: escapa primero)
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc(t)
    .replace(/^## (.+)$/gm,'<h4 style="font-family:var(--disp);font-size:17px;margin:18px 0 6px">$1</h4>')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/^(\d+)\.\s(.+)$/gm,'<div style="margin:3px 0 3px 4px">$1. $2</div>')
    .replace(/^-\s(.+)$/gm,'<div style="margin:3px 0 3px 4px">• $1</div>')
    .replace(/\n{2,}/g,'<br>');
}

/* El chef no debe improvisar: va con las mismas reglas que ve el cocinero
   en pantalla — qué papel juega cada insumo, qué parejas hay entre lo que
   tiene y por qué funcionan, y las bases de la casa. */
function contextoIA(){
  const ETIQ = { puente:'comparten aroma', refuerzo:'profundiza', corte:'corta la grasa',
                 contraste:'contrasta', tradicion:'pareja de siempre', casa:'de la casa' };
  const marcados = [...pantry];

  const porRol = {};
  marcados.forEach(i => { const r = ROL[i] || 'otro'; (porRol[r] = porRol[r] || []).push(trIng(i)); });
  const roles = ['proteina','guarnicion','salsa','aromatico','acido','grasa']
    .filter(r => porRol[r]).map(r => t('rolCorto_' + r) + ': ' + porRol[r].join(', ')).join(' | ');

  // Parejas entre lo que ya tiene: ahí es donde se construye el plato.
  const dentro = [], vistas = new Set();
  marcados.forEach(a => {
    const d = parejasDe(a); if(!d) return;
    d.ids.forEach(([b, tipo]) => {
      if(!pantry.has(b)) return;
      const k = [a,b].sort().join('|'); if(vistas.has(k)) return; vistas.add(k);
      dentro.push(trIng(a) + ' + ' + trIng(b) + ' (' + (ETIQ[tipo]||tipo) + ')');
    });
  });

  // Y lo que le falta, por si vale la pena mandarlo a comprar.
  const fuera = {};
  marcados.forEach(a => {
    const d = parejasDe(a); if(!d) return;
    d.ids.forEach(([b, , fuerza]) => {
      if(pantry.has(b) || ROL[b] === 'base') return;
      fuera[b] = (fuera[b] || 0) + (fuerza === 1 ? 2 : 1);
    });
  });
  const faltan = Object.entries(fuera).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>trIng(x[0]));

  const D = (DICC && DICC.bases) || {};
  const bases = BASES.map(x => { const d = D[x.id]; if(!d) return '';
    return d.n + ' = ' + (d.comp||[]).map((c,i) =>
      c.n + ' (' + (x.comp[i]||[]).map(trIng).join(' + ') + ')').join(' // ');
  }).filter(Boolean).join(' ; ');

  return {
    roles,
    maridaje: dentro.slice(0, 60).join(' ; '),
    faltan: faltan.join(', '),
    bases,
    idioma: IDIOMA,
  };
}

async function pedirIA(){
  const out=document.getElementById('aiOut'), btn=document.getElementById('aiBtn');
  const lista=[...pantry].map(i=>trIng(i)).join(', ');
  const eqs=[...equipo].map(e=>trEq(e)).join(', ');
  if(!lista){ out.textContent=t('marcaAlgunos'); return; }
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> '+t('pensando'); out.textContent='';
  try{
    const res=await fetch(AI_ENDPOINT,{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({ingredientes:lista,equipos:eqs}, contextoIA()))});
    const data=await res.json().catch(()=>({}));
    if(!res.ok || data.error){
      out.textContent = data.error || `El servidor respondió ${res.status}.`;
    } else if(data.texto){
      out.innerHTML = md(data.texto);
    } else {
      out.textContent = t('errorCarga');
    }
  }catch(e){
    out.textContent='No se pudo conectar. Si estás abriendo el archivo localmente, esto solo funciona una vez publicado en Netlify.';
  }
  btn.disabled=false; btn.textContent=t('proponer');
}

}
