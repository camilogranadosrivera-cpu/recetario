<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#15181A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Siete Sabores · Cocina</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Siete Sabores">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     CARTA DE NOCHE · sistema visual
     Tinta profunda, papel cálido y latón. Cada plato se lee como
     una línea de carta de restaurante.
     ============================================================ */
  :root{
    --tinta:#15181A; --tinta-2:#1D2124; --linea-osc:#2C3134;
    --papel:#F2EDE4; --papel-2:#FFFFFF; --papel-linea:#DDD4C4;
    --laton:#B8914F; --laton-claro:#E4C98E; --laton-osc:#8F6E36;
    --oliva:#4A5B45; --vino:#6E2A33;
    --ink:#15181A; --ink-2:#6E6558; --ink-3:#8A8073;
    --gris:#8E9599; --gris-2:#6E7579;
    --sh:0 1px 2px rgba(21,24,26,.05), 0 8px 28px rgba(21,24,26,.07);
    --sh-alta:0 12px 40px rgba(21,24,26,.16);
    --r:14px; --r-g:22px;
    --disp:'Bodoni Moda', Georgia, 'Times New Roman', serif;
    --body:'Karla', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--body); background:var(--tinta); color:var(--papel);
    line-height:1.5; overscroll-behavior-y:none;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:16px}
  ::selection{background:var(--laton);color:var(--tinta)}
  :focus-visible{outline:2px solid var(--laton);outline-offset:2px}

  /* ---------- Armazón ---------- */
  #app{max-width:680px;margin:0 auto;min-height:100%;padding-bottom:124px;background:var(--tinta)}

  .topbar{
    position:sticky;top:0;z-index:20;background:rgba(21,24,26,.92);
    backdrop-filter:saturate(180%) blur(14px);
    padding:max(16px,env(safe-area-inset-top)) 22px 14px;
    border-bottom:1px solid var(--linea-osc);
  }
  .brand{display:flex;align-items:baseline;gap:8px;margin-bottom:14px}
  .brand .cuaderno-btn{margin-left:auto;align-self:center;height:32px;padding:0 10px 0 8px;font-size:11px;letter-spacing:.03em}
  .brand .cuaderno-btn + .lang{margin-left:0}
  @media(max-width:400px){.brand{gap:6px}.brand-mark{letter-spacing:.14em;font-size:11px}.brand h1{font-size:21px}.brand .cuaderno-btn{padding:0 8px 0 7px;letter-spacing:0;gap:5px}.brand .lang{padding:5px 7px}}
  @media(max-width:340px){.brand .cuaderno-btn span{display:none}.brand .cuaderno-btn{padding:0 8px}}
  .brand-mark{
    font-family:var(--disp);font-size:12px;letter-spacing:.34em;
    color:var(--laton);font-weight:500;flex:none;
  }
  .brand h1{
    font-family:var(--disp);font-weight:500;font-size:23px;
    letter-spacing:-.01em;line-height:1.05;color:var(--papel);
  }
  .lang{margin-left:auto;border:1px solid var(--linea-osc);border-radius:3px;
    padding:5px 10px;font-size:11px;font-weight:700;letter-spacing:.08em;
    color:var(--laton);align-self:center}
  .lang:active{background:var(--tinta-2)}
  .brand small{display:none}

  .search{position:relative}
  .search input{
    width:100%;border:1px solid var(--linea-osc);background:var(--tinta-2);
    border-radius:4px;padding:12px 14px 12px 42px;color:var(--papel);
    outline:none;transition:border-color .2s;
  }
  .search input::placeholder{color:var(--gris-2)}
  .search input:focus{border-color:var(--laton)}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:17px;height:17px;stroke:var(--gris-2)}

  .chips{display:flex;gap:7px;overflow-x:auto;padding:14px 22px 6px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--linea-osc);background:transparent;
    border-radius:3px;padding:7px 13px;font-size:13px;font-weight:500;
    color:var(--gris);white-space:nowrap;transition:.18s;display:flex;gap:6px;align-items:center}
  .chip.on{background:var(--laton);color:var(--tinta);border-color:var(--laton);font-weight:600}
  .chip .em{display:none}

  /* ---------- Carta: la lista de platos ---------- */
  .wrap{background:var(--papel);border-radius:var(--r-g) var(--r-g) 0 0;
    margin-top:8px;padding:24px 22px 40px;min-height:72vh}
  .count{font-family:var(--disp);font-size:13px;color:var(--ink-2);
    margin:0 0 4px;letter-spacing:.02em}
  .count::after{content:"";display:block;height:2px;background:var(--tinta);margin-top:10px}

  .grid{display:block}
  .card{
    width:100%;text-align:left;background:transparent;border:none;
    padding:15px 0;border-bottom:1px solid var(--papel-linea);
    display:flex;gap:14px;align-items:flex-start;transition:opacity .15s;
  }
  .card:active{opacity:.55}
  .card .thumb{
    width:62px;height:62px;flex:none;border-radius:4px;
    display:grid;place-items:center;font-size:25px;position:relative;
    background-size:cover;background-position:center;
  }
  .card .fav{flex:none;width:34px;height:34px;display:grid;place-items:center;
    align-self:center;margin-left:4px}
  .card .fav svg{width:18px;height:18px;stroke:var(--papel-linea);fill:none;stroke-width:1.8;transition:stroke .2s}
  .card .fav.on svg{fill:var(--vino);stroke:var(--vino)}
  .card .body{flex:1;min-width:0}
  .card .cat{font-size:11px;font-weight:600;letter-spacing:.07em;color:var(--laton-osc)}
  .card h3{font-family:var(--disp);font-weight:500;font-size:18px;line-height:1.15;
    margin:4px 0 6px;letter-spacing:-.01em;color:var(--ink)}
  .card .meta{display:flex;gap:12px;font-size:12px;color:var(--ink-3)}

  .empty{text-align:center;color:var(--ink-3);padding:56px 20px;font-size:14.5px;line-height:1.6}
  .empty .em{font-size:34px;display:block;margin-bottom:12px;opacity:.5}

  /* ---------- Maridaje ---------- */
  .leyenda{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
  .pars{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .par{font-size:12px;padding:4px 9px;border-radius:2px;border:1px solid;white-space:nowrap}
  .par.puente   {border-color:rgba(122,154,160,.45);color:#9FBEC4}
  .par.refuerzo {border-color:rgba(160,120,78,.5); color:#C9A273}
  .par.corte    {border-color:rgba(126,154,110,.45);color:#A6C293}
  .par.contraste{border-color:rgba(150,74,86,.5);  color:#D8A6AC}
  .par.tradicion{border-color:rgba(184,145,79,.5); color:var(--laton)}
  .par.casa{border-color:rgba(184,145,79,.75);background:rgba(184,145,79,.12);color:var(--laton)}
  .firma{margin:0 0 20px;padding:13px 15px;background:rgba(184,145,79,.1);
    border-left:2px solid var(--laton);font-size:13.5px;line-height:1.6;
    color:rgba(242,237,228,.86)}
  .comp{padding:10px 0 2px 12px;border-left:1px solid rgba(184,145,79,.3);margin:10px 0 0}
  .comp-n{font-family:var(--disp);font-weight:500;font-size:15px;color:var(--papel);margin-bottom:7px}
  .comp-como{font-size:12.5px;line-height:1.6;color:rgba(242,237,228,.6);margin:8px 0 0}
  .base .para{font-size:13px;line-height:1.55;color:rgba(242,237,228,.68);margin:10px 0 0}
  .base .para em{font-style:normal;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--laton);opacity:.8;margin-right:5px}
  .base .como{font-size:13.5px;line-height:1.6;color:rgba(242,237,228,.58);margin:8px 0 0}
  .par.si{background:rgba(242,237,228,.1);font-weight:500}
  .par.audaz{border-style:dashed}
  .mar .como{color:rgba(242,237,228,.6);font-size:13px}
  .ftab.solo{display:block;margin:0 0 16px}
  .heredado{font-size:11px;letter-spacing:.06em;color:var(--laton);opacity:.75;margin:6px 0 0}
  #qMar{width:100%;min-width:0;background:rgba(242,237,228,.05);color:var(--papel);
    border:1px solid rgba(242,237,228,.16);border-radius:2px;padding:11px 13px;
    font-family:var(--cuerpo);font-size:15px}
  #qMar:focus{outline:none;border-color:var(--laton)}
  #sugiere:empty{display:none}
  #sugiere .sug-sub{font-size:12.5px;line-height:1.5;color:rgba(21,24,26,.5);margin:0 0 10px}
  .pill.sug{border-style:dashed;border-color:rgba(184,145,79,.6);color:#8A6A2E}
  .sug-rol{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(21,24,26,.42);margin:12px 0 7px}
  .sug-rol:first-of-type{margin-top:4px}
  .pill.sug i{display:block;font-style:normal;font-size:10px;letter-spacing:.07em;
    text-transform:uppercase;opacity:.7;margin-top:2px}

  /* ---------- Pastas y anatomía ---------- */
  .plato h3{font-family:var(--disp);font-weight:500;font-size:23px;color:var(--papel);
    margin:0 0 8px;line-height:1.15}
  .plato > .como{font-size:14px;line-height:1.6;color:rgba(242,237,228,.76);margin:0 0 16px}
  .parte{display:grid;grid-template-columns:minmax(78px,26%) 1fr;gap:12px;
    padding:11px 0;border-top:1px solid rgba(242,237,228,.07)}
  .parte b{font-family:var(--disp);font-weight:500;font-size:15px;color:var(--laton);
    min-width:0;line-height:1.3}
  .parte b i{font-style:normal;opacity:.8}
  .parte span{font-size:13px;line-height:1.55;color:rgba(242,237,228,.72);min-width:0}
  @media (max-width:360px){ .parte{grid-template-columns:1fr;gap:2px} }

  /* ---------- Seguridad, rendimiento y despiece ---------- */
  .pasos{list-style:none;counter-reset:p;margin:0;padding:0}
  .pasos li{counter-increment:p;display:grid;grid-template-columns:22px 1fr;gap:3px 11px;
    padding:12px 0;border-bottom:1px solid rgba(242,237,228,.07)}
  .pasos li::before{content:counter(p);grid-row:span 2;font-family:var(--disp);font-size:15px;
    color:var(--laton);opacity:.8;padding-top:1px}
  .pasos b{font-family:var(--disp);font-weight:500;font-size:16px;color:var(--papel)}
  .pasos span{font-size:13.5px;line-height:1.55;color:rgba(242,237,228,.72)}
  .alerta{margin:22px 0 4px;padding:14px 16px;background:rgba(110,42,51,.22);
    border-left:2px solid #A4545F}
  .alerta .tc-k{color:#E0A9AF}
  .alerta p{font-size:13.5px;line-height:1.55;color:rgba(242,237,228,.84);margin:5px 0 0}
  .zona{padding:12px 0 12px 12px;border-left:2px solid rgba(242,237,228,.18);margin-bottom:4px}
  .zona.alerta{background:none;padding:12px 0 12px 12px;margin:0 0 4px;border-left-color:#C98A3C}
  .zona.alerta .grados{color:#D9A45F}
  .zona.bien{border-left-color:var(--laton)}
  .zona.frio{border-left-color:#6D93A8}
  .zona.frio .grados{color:#8FB4C8}
  .zona .como{font-size:13px;line-height:1.5;color:rgba(242,237,228,.6);margin:4px 0 0}
  .claves{list-style:none;margin:10px 0 0;padding:0}
  .claves li{position:relative;padding:5px 0 5px 16px;font-size:13px;line-height:1.5;
    color:rgba(242,237,228,.62)}
  .claves li::before{content:'';position:absolute;left:0;top:12px;width:5px;height:5px;
    border-radius:50%;background:var(--laton);opacity:.7}
  .formula{margin:14px 0 18px;padding:12px 14px;border:1px solid rgba(184,145,79,.35);
    border-radius:2px;font-size:13.5px;color:var(--laton);text-align:center;
    font-variant-numeric:tabular-nums}
  .calc{margin:0 0 20px}
  .calc label{display:block;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(242,237,228,.45);margin-bottom:7px}
  .calc-in{display:flex;align-items:center;gap:9px}
  .calc-in input{flex:1;min-width:0;background:rgba(242,237,228,.05);color:var(--papel);
    border:1px solid rgba(242,237,228,.16);border-radius:2px;padding:11px 13px;
    font-family:var(--disp);font-size:21px;font-variant-numeric:tabular-nums}
  .calc-in input:focus{outline:none;border-color:var(--laton)}
  .calc-in span{font-size:13px;color:rgba(242,237,228,.5);flex:none}
  .rend .met b{font-family:var(--disp);font-weight:500;font-size:17px;color:var(--papel);
    font-variant-numeric:tabular-nums}
  .rend .met span:last-child b{color:#D8A6AC}
  .ficha .item > .ojo{font-size:12.5px;line-height:1.55;color:var(--laton);margin:5px 0 0}
  .ficha .item > .ojo em{font-style:normal;font-size:9px;letter-spacing:.14em;
    text-transform:uppercase;opacity:.65;margin-right:4px}

  /* ---------- Fichas de cocina ---------- */
  .ficha .item{padding:15px 0;border-bottom:1px solid rgba(242,237,228,.07)}
  .ficha .fila{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
  .ficha .nombre{font-family:var(--disp);font-weight:500;font-size:18px;
    color:var(--papel);min-width:0}
  .ficha .item > .como{font-size:13.5px;line-height:1.55;
    color:rgba(242,237,228,.74);margin:8px 0 0}
  .ph-top{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .ph-top h2{margin:0;min-width:0}
  .libro.oscuro{margin:0;flex:none}
  .libro{width:34px;height:34px;border-radius:50%;border:1px solid rgba(21,24,26,.16);
    background:none;display:grid;place-items:center;margin-left:auto;margin-right:8px;
    flex:none;align-self:center}
  .libro svg{width:17px;height:17px;stroke:var(--tinta);opacity:.72}
  /* La barra de arriba es oscura: ahí el icono va claro o no se ve. */
  .topbar .libro{border-color:rgba(242,237,228,.22)}
  .topbar .libro svg{stroke:var(--papel);opacity:.8}
  .topbar .libro:active{background:rgba(242,237,228,.08)}
  .ftabs{display:flex;gap:7px;margin:0 0 8px;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    padding-right:max(16px,env(safe-area-inset-right,0px));
    margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
  .ftabs::-webkit-scrollbar{display:none}
  .ftab{flex:none;white-space:nowrap}
  .ftab{font-family:var(--cuerpo);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    background:none;color:rgba(242,237,228,.5);border:1px solid rgba(242,237,228,.14);
    border-radius:2px;padding:7px 12px}
  .ftab.on{background:rgba(184,145,79,.17);border-color:rgba(184,145,79,.55);color:var(--laton)}
  .ficha .h2sub{color:rgba(242,237,228,.5);font-size:13.5px;line-height:1.6;margin:14px 0 4px}
  .f-sec.mini{margin:16px 0 9px;border:none;padding:0}
  .grados{flex:none;font-family:var(--disp);font-size:19px;color:var(--laton);white-space:nowrap}
  .grados em{font-style:normal;font-size:11px;letter-spacing:.08em;color:rgba(242,237,228,.42)}
  .medida{flex:none;font-size:12px;letter-spacing:.1em;color:var(--laton);white-space:nowrap}
  .tc-g{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:4px}
  .tc-g span{font-size:13px;color:rgba(242,237,228,.76);font-variant-numeric:tabular-nums}
  .tc-g em{display:block;font-style:normal;font-size:9px;letter-spacing:.14em;
    text-transform:uppercase;color:rgba(242,237,228,.34);margin-bottom:1px}
  .escala{display:flex;align-items:center;gap:10px;margin:9px 0 2px;min-height:20px}
  .escala i{display:block;background:var(--laton);opacity:.75;border-radius:1px;flex:none}
  .met{display:flex;flex-wrap:wrap;gap:7px 20px;margin-top:3px}
  .met span{font-size:13px;color:rgba(242,237,228,.78)}
  .met em{display:block;font-style:normal;font-size:9px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--laton);opacity:.8;margin-bottom:1px}
  .salsa .base{font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--laton);margin:5px 0 8px}
  .coc-fila{display:flex;align-items:center;justify-content:space-between;gap:10px;
    width:100%;background:none;border:0;border-bottom:1px solid rgba(242,237,228,.07);
    padding:11px 0;text-align:left;cursor:pointer;color:inherit}
  .coc-n{font-family:var(--disp);font-weight:500;font-size:14.5px;color:var(--papel)}
  .coc-dep{flex:none;font-size:9.5px;letter-spacing:.1em;color:var(--laton);
    border:1px solid rgba(184,145,79,.4);border-radius:9px;padding:1px 6px}
  .coc-volver{background:none;border:0;color:var(--laton);font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;padding:0 0 12px;cursor:pointer}
  .coc-fam{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--laton)}
  .coc-tit{font-family:var(--disp);font-weight:400;font-size:23px;line-height:1.2;
    color:var(--papel);margin:5px 0 0}
  .coc-rinde{font-size:12px;color:rgba(242,237,228,.5);margin:5px 0 0}
  .coc-chips{display:flex;flex-wrap:wrap;gap:6px}
  .coc-chip{font-size:12px;border-radius:13px;padding:4px 11px;cursor:pointer;
    background:none;border:1px solid rgba(242,237,228,.18);color:rgba(242,237,228,.78)}
  .coc-chip.antes{border-color:rgba(184,145,79,.5);color:var(--laton)}
  /* Esta sección vive en ¿Qué cocino?, que es la pantalla CLARA: va con las
     variables del papel, no con los blancos de la ficha oscura. */
  .calc.cloro{display:flex;gap:10px}
  .calc.cloro .calc-in{flex:1}
  .calc.cloro label{display:block;font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--laton);margin-bottom:4px}
  .cl-salida{margin:12px 0 4px}
  .cl-fila{display:flex;align-items:baseline;gap:9px;padding:7px 0;
    border-bottom:1px solid rgba(242,237,228,.07)}
  .cl-fila .cl-para{flex:1;font-size:12.5px;color:rgba(242,237,228,.78)}
  .cl-fila b{font-family:var(--disp);font-size:17px;color:var(--laton);
    font-variant-numeric:tabular-nums}
  .cl-fila .cl-cdta{font-size:11px;color:rgba(242,237,228,.45);min-width:74px;text-align:right}
  .cl-vacio{font-size:12.5px;color:rgba(242,237,228,.45)}
  .step .tx .corte{font-weight:600;color:var(--laton-osc);cursor:pointer;
    border-bottom:1px dotted var(--laton)}
  .nutri{margin:18px 0;padding:14px 15px;border-radius:7px;
    background:var(--papel-2);border:1px solid var(--papel-linea)}
  .nu-sub{font-size:11.5px;color:var(--ink-2);opacity:.75;margin:5px 0 11px}
  .nu-g{display:grid;grid-template-columns:repeat(3,1fr);gap:9px 6px}
  .nu-f{text-align:center;padding:7px 2px;border-radius:5px;background:var(--papel)}
  .nu-f span{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-2);opacity:.7;margin-bottom:3px}
  .nu-f b{font-family:var(--disp);font-weight:500;font-size:17px;color:var(--ink);
    font-variant-numeric:tabular-nums}
  .nu-f b em{font-style:normal;font-size:10px;color:var(--ink-2);margin-left:1px}
  .nu-al{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:12px;
    padding-top:11px;border-top:1px solid var(--papel-linea)}
  .nu-al-t{font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--laton-osc);margin-right:3px}
  .nu-x{font-size:11px;padding:2px 8px;border-radius:10px;
    border:1px solid rgba(184,145,79,.45);color:var(--laton-osc)}
  .nu-ojo{font-size:10.5px;line-height:1.5;color:var(--ink-2);opacity:.6;margin:10px 0 0}

<script>
/* ============ Storage (safe: works on Netlify, degrades in preview) ============ */
const store = {
  get(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

/* ============================================================
   IDIOMAS
   Los textos viven en idiomas.json y las recetas traducidas en
   textos.<idioma>.json. Para sumar un idioma basta con agregar
   esos dos bloques: el código no cambia.
   ============================================================ */
const IDIOMAS = [
  {id:'es', nombre:'Español'},
  {id:'en', nombre:'English'},
];
let DICC = null;                 // diccionarios del idioma activo
let TEXTOS = null;               // recetas traducidas del idioma activo

function idiomaGuardado(){
  const g = store.get('rec_idioma', null);
  if (g && IDIOMAS.some(i => i.id === g)) return g;
  const nav = (navigator.language || 'es').slice(0,2).toLowerCase();
  return IDIOMAS.some(i => i.id === nav) ? nav : 'es';
}
let IDIOMA = idiomaGuardado();

/* t('clave') devuelve el texto de interfaz en el idioma activo */
const t = k => (DICC && DICC.ui && DICC.ui[k] !== undefined) ? DICC.ui[k] : k;
/* Traducción de los catálogos cerrados */
// Un ingrediente puede ser otra preparación del árbol (la bordalesa lleva
// demi-glace), y entonces su nombre vive en cocina.json, no en el catálogo.
// Esto lo usan las fichas de receta para no imprimir el id crudo.
const esInsumoConocido = id =>
  !!((typeof ING !== 'undefined' && ING[id]) ||
     (typeof COCINA !== 'undefined' && COCINA && COCINA[id] && COCINA[id].nivel) ||
     recetaPorId(id));
const trIng  = id => (DICC && DICC.ing && DICC.ing[id]) ||
                     (typeof COCINA !== 'undefined' && COCINA && COCINA[id] && COCINA[id].n) ||
                     (recetaPorId(id) || {}).name || id;
const trEq   = id => (DICC && DICC.eq   && DICC.eq[id])   || id;
const trCat  = id => (DICC && DICC.cat  && DICC.cat[id])  || id;
const trTec  = v  => (DICC && DICC.tec  && DICC.tec[v] !== undefined) ? DICC.tec[v] : v;
const trPais = v  => (DICC && DICC.pais && DICC.pais[v])  || v;
const trGrupo= v  => (DICC && DICC.grupos && DICC.grupos[v]) || v;
const trFam  = f  => (DICC && DICC.fam && DICC.fam[f]) || FAMCOC[f];
const trUni  = u  => (DICC && DICC.uni && DICC.uni[u] !== undefined) ? DICC.uni[u] : u;
const DIF_K = {'Fácil':'facil','Media':'media','Difícil':'dificil'};
const trDif  = v  => DIF_K[v] ? t(DIF_K[v]) : v;

async function cargarIdioma(id){
  const res = await fetch('idiomas.json', {cache:'no-cache'});
  const todos = await res.json();
  DICC = todos[id] || todos.es;
  TEXTOS = null;
  if (id !== 'es') {
    try{
      const r2 = await fetch('textos.' + id + '.json', {cache:'no-cache'});
      if (r2.ok) TEXTOS = await r2.json();
    }catch(e){ TEXTOS = null; }
  }
}

/* Aplica la traducción de una receta sobre su versión en español.
   La técnica, el país y los insumos se traducen por diccionario,
   así que aquí solo van nombre, pasos y tip:  [name, [pasos], tip]  */
function trReceta(r){
  if (!TEXTOS) return r;
  const x = TEXTOS[r.id];
  if (!x) return r;
  return Object.assign({}, r, {
    name: x[0] || r.name,
    pasos: (x[1] && x[1].length === r.pasos.length)
            ? r.pasos.map((p,i) => p.length > 1 ? [x[1][i], p[1]] : [x[1][i]])
            : r.pasos,
    tip:  x[2] || r.tip,
  });
}

/* ============ Seed recipes (escritas de forma original) ============ */
/* ============================================================
   BIBLIOTECA DE RECETAS
   Se cargan desde recetas.json (formato compacto) para que este
   archivo se mantenga liviano. Para agregar recetas, solo se
   reemplaza ese archivo.
   ============================================================ */
let SEED = [];
let PREPS = [];
let BASE = [];              // recetas en español, tal como vienen del archivo

/* Una receta puede ser ingrediente de otra (la cazuela lleva hogao, la
   bordalesa lleva demi-glace). Buscarla con BASE.find por cada ingrediente
   de cada receta es cuadrático; este Map se arma una vez y se rehace solo
   cuando BASE se reemplaza, que es al cambiar de idioma. */
let _ixMapa = null, _ixDe = null;
function recetaPorId(id){
  if(_ixDe !== BASE){ _ixMapa = new Map(BASE.map(r => [r.id, r])); _ixDe = BASE; }
  return _ixMapa.get(id);
}
let bibliotecaLista = false;

/* Rearma SEED y PREPS con los textos del idioma activo */
function aplicarIdiomaRecetas(){
  const todas = BASE.map(trReceta);
  SEED  = todas.filter(r => !r.prep);
  PREPS = todas.filter(r =>  r.prep);
}

/* [id,name,cat,pais,tec,min,dif,serv,[eq],[[q,u,ing]],[opt],[[paso,min?]],tip,esReceta] */
function expandir(a){
  return { id:a[0], name:a[1], cat:a[2], pais:a[3], tec:a[4], min:a[5], dif:a[6],
           serv:a[7], eq:a[8], ing:a[9], opt:a[10], pasos:a[11], tip:a[12],
           prep:!a[13], em:'' };
}

let COCINA = null;
async function cargarCocina(){
  try{
    const res = await fetch('cocina.json', {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    COCINA = await res.json();
  }catch(e){ COCINA = null; }
}

async function cargarBiblioteca(){
  try{
    const res = await fetch('recetas.json', {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const datos = await res.json();
    BASE = datos.map(expandir);
    aplicarIdiomaRecetas();
    bibliotecaLista = true;
  }catch(e){
    bibliotecaLista = false;
  }
}

/* ============================================================

   Si no existe, se muestra un monograma tipográfico. No hay que
   tocar el código: basta con subir la foto a esa carpeta.
   ============================================================ */
const FOTOS_DIR = 'fotos/';

/* Monograma + foto encima; si la foto no existe, el monograma queda */
function lienzo(r, clase, tam){
  const ini = (r.name || '?').trim().charAt(0).toUpperCase();
  return '<div class="' + clase + '" style="background:' + tint(r.cat) + ';position:relative;overflow:hidden">' +

}

/* ============ Quantity formatting + scaling ============ */
const FR = {0.25:'¼',0.5:'½',0.75:'¾',0.33:'⅓',0.67:'⅔',0.125:'⅛'};
function fmtQty(n){
  if(n===0) return '';
  const whole = Math.floor(n);
  let frac = +(n-whole).toFixed(2);
  // snap to nearest known fraction
  let best=null,bd=1;
  for(const k in FR){ const d=Math.abs(frac-k); if(d<bd){bd=d;best=k;} }
  if(best && bd<0.06){
    return (whole? whole+' ':'')+FR[best];
  }
  if(n<1) return (+n.toFixed(2)).toString();
  return (+n.toFixed(n<10?1:0)).toString();
}
function scaledIng(ing, base, cur){
  return ing.map(([q,u,name])=>{
    const v = q*(cur/base);
    return {id: name, q: fmtQty(v), u: trUni(u), name: esInsumoConocido(name) ? trIng(name) : name};
  });
}

    + lineaSust(i.id)).join('');
  // Tocar un reemplazo dice qué cambia al usarlo
  document.querySelectorAll('#ingList [data-sust]').forEach(b => b.onclick = () => {
    const [a, c] = b.dataset.sust.split('|');
    const par = (SUST[a] || []).find(x => x[0] === c);
    if (par) toast(trIng(c) + ' — ' + par[2]);
  });

/* Los reemplazos de un insumo, con el que ya tienes marcado por delante.
   Vale la pena señalar cuál tienes: si no, hay que leerlos todos. */
function lineaSust(id){
  const l = SUST[id];
  if (!l || !l.length) return '';
  // Lo que la receta ya lleva no es un reemplazo: proponer langostino en
  // lugar del camarón cuando la cazuela lleva los dos no ayuda a nadie.
  const yaVa = new Set((((state.current || {}).ing) || []).map(x => x[2]));
  const utiles = l.filter(([otro]) => !yaVa.has(otro));
  if (!utiles.length) return '';
  const orden = utiles.sort((a, b) =>
    (pantry.has(b[0]) ? 1 : 0) - (pantry.has(a[0]) ? 1 : 0));
  return '<div class="sust">' +
    orden.map(([otro, clase]) =>
      '<button class="sust-x ' + clase + (pantry.has(otro) ? ' si' : '') +
      '" data-sust="' + id + '|' + otro + '">' + trIng(otro) + '</button>').join('') +
    '</div>';
}

  state.servNow=Math.max(1,Math.min(40,state.servNow+d));
  document.getElementById('servNum').textContent=state.servNow;
  document.getElementById('servLbl').textContent=state.servNow+' '+t('personas');

function startCook(){

function renderCook(){
  const r=state.current, steps=r.pasos, i=state.cookStep, p=steps[i];
  clearTimer();
  document.getElementById('cookNo').textContent=`${t('paso')} ${i+1} ${t('de')} ${steps.length}`;
  // En modo cocina el texto va plano a propósito: se lee de lejos y no
  // se toca. Las medidas de corte se consultan en la lista de pasos.
  document.getElementById('cookTx').textContent=p[0];
  document.getElementById('cookDots').innerHTML=steps.map((_,j)=>
    `<span class="${j<i?'done':j===i?'on':''}"></span>`).join('');
  const tBtn=document.getElementById('cookTimerBtn'), tDisp=document.getElementById('cookTimer');
  tDisp.classList.remove('on');
  if(p[1]){
    tBtn.classList.add('show');
    tBtn.textContent=`${t('iniciarTemp')} · ${p[1]} ${t('min')}`;
    tBtn.onclick=()=>runTimer(p[1]*60);
  } else { tBtn.classList.remove('show'); }
  document.getElementById('cookPrev').style.visibility=i===0?'hidden':'visible';
  document.getElementById('cookNext').textContent=i===steps.length-1?t('terminar'):t('siguiente');
}
function runTimer(sec){
  clearTimer();
  const tDisp=document.getElementById('cookTimer'); tDisp.classList.add('on');
  let left=sec;
  const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  tDisp.textContent=fmt(left);
  state.timer=setInterval(()=>{
    left--; tDisp.textContent=fmt(left);
    if(left<=0){ clearTimer(); beep(); tDisp.textContent=t('listo'); }
  },1000);
}
function clearTimer(){ if(state.timer){clearInterval(state.timer);state.timer=null;} }
function beep(){
  try{ const a=new (window.AudioContext||window.webkitAudioContext)();
    const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);
    o.frequency.value=880;g.gain.value=0.15;o.start();
    setTimeout(()=>{o.stop();a.close();},600);
  }catch(e){}
}
document.getElementById('cookChef').onclick=()=>openChef({ id: state.current.id, paso: state.cookStep });
document.getElementById('cookClose').onclick=()=>{clearTimer();document.getElementById('cook').classList.remove('open');};
document.getElementById('cookPrev').onclick=()=>{if(state.cookStep>0){state.cookStep--;renderCook();}};
document.getElementById('cookNext').onclick=()=>{
  if(state.cookStep<state.current.pasos.length-1){state.cookStep++;renderCook();}
  else{clearTimer();document.getElementById('cook').classList.remove('open');toast(t('provecho'));}
};

function parseQty(s){ // "2 taza" -> [2,'taza'] ; "harina" handled separately
  s=(s||'').trim(); const m=s.match(/^([\d.,/]+)\s*(.*)$/);
  if(!m) return [1,''];
  let num=m[1].replace(',','.'); if(num.includes('/')){const[a,b]=num.split('/');num=(+a/+b);}
  return [parseFloat(num)||1, m[2]||''];
}
function saveRecipe(){
  const v=id=>document.getElementById(id).value.trim();
  const name=v('f-name');
  if(!name){toast(t('ponleNombre'));return;}
  const ing=[...document.querySelectorAll('#ingRows .dyn-row')].map(r=>{
    const q=r.querySelector('.ig-q').value, n=r.querySelector('.ig-n').value.trim();
    if(!n) return null; const [num,unit]=parseQty(q); return [num,unit,n];
  }).filter(Boolean);
  const pasos=[...document.querySelectorAll('#stepRows .dyn-row')].map(r=>{
    const t=r.querySelector('.st-t').value.trim(), m=parseInt(r.querySelector('.st-m').value);
    if(!t) return null; return m?[t,m]:[t];
  }).filter(Boolean);
  if(!ing.length||!pasos.length){toast(t('minIngPaso'));return;}
  const rec={id:'c'+Date.now(),custom:true,name,cat:v('f-cat'),pais:v('f-pais')||'—',
    min:+v('f-min')||30,dif:v('f-dif'),serv:+v('f-serv')||4,em:v('f-em'),ing,pasos,tip:''};
  state.custom=[rec,...state.custom]; store.set('rec_custom',state.custom);
  document.getElementById('sheet').classList.remove('open');
  switchTab('mine'); toast(t('guardada'));
}
function delRecipe(id){
  state.custom=state.custom.filter(r=>r.id!==id); store.set('rec_custom',state.custom);
  closeDetail(); switchTab('mine'); toast(t('eliminada'));
}

/* ============ Toast ============ */
let toastT;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1900);
}

});

const SUST = {"tofu":[["quesocampesino","apuro","En un salteado o una sopa, un queso fresco firme en cubos aguanta parecido, pero no es vegetal y se derrite si hierve."],["pechuga","papel","Cumple el papel de proteína del plato; cambia el sabor y el tiempo de cocción."]],"limoncillo":[["limon","apuro","La cáscara de un limón da el perfume cítrico, pero no el fondo herbal del limoncillo: agrégala al final."],["hojalimon","familia","Dan un aroma cítrico parecido; usa tres o cuatro hojas por cada tallo."]],"hojalimon":[["limon","apuro","Una tira de cáscara de limón sin lo blanco da el aroma; se saca antes de servir."],["limoncillo","familia","Perfuma en la misma dirección cítrica, más herbal."]],"pimentonpicante":[["paprika","papel","El pimentón dulce da el color y el aroma; para el picante, una pizca de cayena por cucharadita."],["cayena","apuro","Da el picante pero no el color ni el ahumado: úsala en pizca y aumenta el pimentón dulce."]],"glutamato":[["sal","apuro","Da el salado pero no el umami: el plato queda correcto pero más plano. Una cucharadita de salsa de soya acerca más."],["soya","papel","La soya trae su propio glutamato natural y sal: media cucharadita por cada pizca de Ajinomoto, sabiendo que también da color."]],"angostura":[["canela","apuro","Perfuma el pisco sour pero no da el amargo que equilibra el dulce. Es lo que se usa en casa cuando no hay amargo; no es lo mismo."]],"papelarroz":[["lechuga","papel","La hoja de lechuga envuelve y se come fresca, y en Vietnam se usa así de verdad; pero no se pega ni se estira, así que el rollito queda abierto."],["masawanton","apuro","Sirve si los vas a freír, pero no para los rollitos frescos: la masa de wantán cruda no se come."]],"pastamiso":[["soya","papel","Da el salado y parte del umami, pero NO el cuerpo ni la fermentación láctea del miso: la sopa queda clara y plana en vez de turbia y redonda. Si cambias, usa la mitad de volumen y acepta que es otra sopa."],["tahini","apuro","Una cucharada de tahini con salsa de soya imita el cuerpo cremoso y el fondo tostado. Es el apaño conocido y funciona mejor de lo que parece, pero no sabe a miso."]],"salsaostras":[["soya","papel","Lo más parecido que hay en una cocina normal: el salado es el mismo, pero falta el dulzor y el cuerpo espeso. Mezclada con una pizca de panela se acerca bastante."],["hoisin","familia","Es la otra salsa espesa china y también da cuerpo, pero es mucho más dulce y especiada: cambia el plato hacia lo dulce."]],"melazagranada":[["tamarindo","papel","Es el reemplazo más cercano: igual de ácido y oscuro, aunque sin el perfume afrutado de la granada. Mezclado con una pizca de panela se acerca bastante."],["balsamico","apuro","Da el ácido y el color pero es mucho más dulce y sabe a uva; hay que usar menos y aceptar que el plato cambia."]],"granada":[["uva","papel","Para decorar y dar el estallido dulce; no tiene la acidez ni el crujido del grano de granada."],["melazagranada","familia","Es la misma fruta concentrada: da el sabor pero no el grano, que es la mitad de la gracia."]],"filo":[["hojaldre","papel","Hornea parecido pero es otra cosa: el hojaldre sube en capas de mantequilla y la filo se queda en láminas finísimas y quebradizas."],["masawanton","apuro","Es igual de fina y sirve para fritos pequeños; para baklava queda demasiado gruesa y pesada."]],"hojaparra":[["repollo","papel","La hoja de repollo escaldada envuelve igual de bien; falta la acidez de la salmuera y el punto amargo."],["acelga","apuro","Se usa en Líbano para los mismos rellenos; es más frágil y hay que doblarla con cuidado."]],"mentaseca":[["hierbabuena","familia","Es la misma planta fresca, pero NO es lo mismo: la seca es más concentrada y menos perfumada, y va al guiso mientras la fresca va al final. Si cambias, usa el triple de fresca."],["oregano","apuro","Otra hierba seca que aguanta el calor, con un perfil muy distinto."]],"curry":[["garammasala","papel","No es lo mismo: el garam masala es una mezcla india de especias cálidas que va al FINAL del plato, y el curry en polvo es una mezcla británica que va al principio. Cambiarlos cambia el plato."],["curcuma","apuro","La cúrcuma es solo una de las especias que lleva la mezcla, y es la que le da el color amarillo. Sola no da el resto."]],"hojacurry":[["","papel","No tiene reemplazo. La hoja de curry no se parece ni al laurel ni a la albahaca ni al curry en polvo, que es otra cosa por completo. Si no la consigues, haz el plato sin ella y acepta que le falta esa capa: es más honesto que poner algo que sabe distinto."],["laurel","apuro","Solo para que la grasa tenga algo aromático mientras se calienta. No sabe igual ni de lejos, y conviene saberlo."]],"asafetida":[["ajopolvo","papel","La asafétida da un fondo entre ajo y cebolla que aparece al freírse. Una pizca de ajo en polvo con otra de cebolla en polvo se le acerca algo."],["ajo","apuro","El ajo fresco cumple a medias; en los dals de la India sin cebolla ni ajo, la asafétida es justo lo que los reemplaza."]],"fenogreco":[["mostazagrano","papel","Otro grano que se tuesta y amarga parecido, aunque el fenogreco tiene un fondo a nuez y a jarabe que nada más tiene."],["apio","apuro","Las hojas secas de fenogreco se parecen vagamente al apio seco; es un reemplazo de emergencia y se nota."]],"chilekashmiri":[["paprika","papel","Es el reemplazo más fiel: da el color rojo intenso sin picar casi nada, que es exactamente para lo que sirve el cachemir."],["chileancho","familia","Otro chile seco de color y poco picante, algo más frutal y oscuro."]],"paneer":[["quesocampesino","papel","Un queso fresco firme que no se derrite: es el más parecido que hay en Colombia y funciona bien."],["cuajada","familia","Se hace igual, cortando leche con ácido; hay que prensarla más para que aguante la sartén."]],"lentejaroja":[["lenteja","familia","La lenteja parda sirve pero NO se deshace igual: la roja se convierte en puré en veinte minutos y la parda queda entera."],["arvejaseca","papel","También se deshace y hace una crema parecida, con otro sabor y más tiempo de cocción."]],"guanciale":[["cerdo_panceta","familia","El tocino de panceta es el reemplazo real y el que casi todos usan; el guanciale es más dulce y su grasa se funde más limpia."],["tocino","apuro","El tocino ahumado cumple, pero el humo no está en ninguna de las tres pastas romanas y se nota."]],"pecorino":[["parmesano","papel","Es el cambio de siempre, pero el pecorino es de oveja: más salado y con un punto picante. Si usas parmesano, sala menos."],["quesomanchego","familia","También de oveja y curado, bastante cercano en sal y en carácter."]],"mascarpone":[["quesocrema","papel","Lo más parecido que se consigue; es más ácido, así que conviene batirlo con un poco de crema."],["requeson","apuro","Mucho más granuloso: hay que colarlo y batirlo mucho para que no quede arenoso."]],"marsala":[["vinojerez","familia","Otro vino fortificado y oxidado: es el reemplazo más fiel que hay."],["vino","apuro","Le falta el dulzor y el cuerpo; agregar una cucharadita de azúcar acerca un poco."]],"arrozbomba":[["arrozarborio","familia","Absorbe parecido pero suelta más almidón: queda cremoso en vez de suelto."],["arroz","apuro","El de grano largo no absorbe el caldo igual y la paella queda seca por dentro."]],"pimientochoricero":[["chileancho","papel","Parecido en dulzor y cuerpo; el ancho es algo más frutal y menos terroso."],["paprika","apuro","Da el color pero no la pulpa, que es lo que espesa la salsa vizcaína."]],"nora":[["pimientochoricero","familia","Casi el mismo pimiento seco, algo más grande y menos concentrado."],["chileancho","papel","Mismo registro dulce y sin picante; cambia un poco el perfume."]],"tintacalamar":[["chipiron","papel","La bolsa de tinta de los chipirones frescos: es la misma tinta, hay que extraerla."],["salsapescado","apuro","Aporta el yodado pero ni el color negro ni el cuerpo."]],"fabes":[["frijol","familia","Otro poroto blanco; la faba es más grande y de piel más fina, y se deshace menos."],["garbanzo","papel","Aguanta la cocción larga, con otra textura y otro sabor."]],"vinagrejerez":[["vinagre","familia","Más plano y más agresivo; el de Jerez tiene un fondo dulce de madera."],["balsamico","apuro","Mucho más dulce y oscuro: cambia el color de un gazpacho."]],"vinojerez":[["vinoblanco","papel","Falta el fondo oxidado y a frutos secos que define al Jerez."],["brandy","apuro","Mucho más fuerte: usar un tercio de la cantidad."]],"sidra":[["vinoblanco","papel","Falta el dulzor de manzana y la acidez particular de la sidra."],["vinagremanzana","apuro","Da el sabor a manzana pero mucho más ácido: rebajar con agua."]],"quesomanchego":[["parmesano","papel","Igual de seco y salado para rallar, con otro sabor."],["quesocosteno","familia","Salado y firme, bastante parecido para una tabla."]],"pinon":[["almendra","familia","Otro fruto seco de la misma cocina; menos mantecoso y más crujiente."],["ajonjoli","apuro","Aporta grasa y tostado, con un sabor bastante distinto."]],"chipiron":[["calamar","mismo","Es el mismo animal, solo que pequeño: el calamar grande hay que cortarlo."],["pulpo","papel","Mucho más firme y pide cocción larga, al revés del chipirón."]],"setas":[["champinon","familia","El champiñón cultivado: más suave y con más agua, sin el sabor de monte."],["champinonlata","apuro","Ya cocido y con agua: hay que escurrirlo y dorarlo aparte."]],"rape":[["merluza","familia","Blanco y fino, aunque se deshace mucho más que el rape."],["pescado","papel","Cualquier blanco firme cumple; el rape es el más firme de todos."]],"carrillera":[["res_osobuco","papel","Mismo colágeno y misma cocción larga, con hueso y menos carne."],["res_morrillo","familia","Corte guisero parecido; algo más fibroso y menos gelatinoso."]],"chufa":[["almendra","papel","Da una horchata buena pero distinta: la de chufa es más terrosa."],["arroz","apuro","Es la horchata mexicana, que es otra bebida con el mismo nombre."]],"piquillo":[["pimenton","familia","El morrón asado y pelado cumple; el piquillo es más dulce y algo picante."],["pimentonamarillo","papel","Mismo papel, con menos dulzor y sin el toque picante."]],"boqueron":[["sardina","familia","Otro pescado azul pequeño, más graso y de sabor más fuerte."],["anchoa","papel","Es el mismo pez pero curado en sal: mucho más salado y sin frescura."]],"chileancho":[["chilemulato","familia","Casi el mismo chile: el mulato es más oscuro y achocolatado, el ancho más frutal."],["guajillo","papel","Da color y acidez pero no el dulzor ni el cuerpo del ancho."]],"chilemulato":[["chileancho","familia","El hermano del mulato: igual de dulce, algo más frutal y menos achocolatado."],["chilepasilla","papel","Más seco y con sabor a pasa; oscurece parecido pero pica un poco más."]],"chilepasilla":[["chilemulato","familia","Otro chile oscuro de mole, más dulce y menos ahumado."],["chileancho","papel","Más dulce y menos picante: cambia el equilibrio pero sirve."]],"chilearbol":[["ajipicante","papel","Pica parecido pero aporta humedad y no el tostado del chile seco."],["hojuelasaji","apuro","Mismo picante seco, sin el sabor tostado que da freír el chile entero."]],"chilemorita":[["chipotle","mismo","Es el mismo jalapeño ahumado: el chipotle es más grande y el morita más frutal."],["chilearbol","papel","Pica igual o más, sin nada del ahumado que define al morita."]],"chileserrano":[["jalapeno","familia","Pica menos y tiene más carne; hay que usar más cantidad."],["ajipicante","papel","Pica parecido pero cambia el sabor fresco y herbal del serrano."]],"chilepoblano":[["pimenton","papel","Misma carnosidad para rellenar, sin nada del picante ni del sabor del poblano."],["jalapeno","apuro","Mucho más chico y más picante: sirve para rajas, no para rellenar."]],"masaharina":[["harinamaiz","apuro","No es lo mismo: sin nixtamalizar no liga y la tortilla se quiebra."],["tortillamaiz","papel","Hechas y molidas sirven para espesar, no para formar masa."]],"epazote":[["cilantro","papel","Sabor distinto por completo, pero cumple el papel de hierba fresca del final."],["oregano","apuro","Seco y mediterráneo; es lo que se usa cuando no hay epazote."]],"naranjaagria":[["naranja","papel","Hay que corregir con limón: dos de naranja por uno de limón imita la acidez."],["limon","apuro","Mucho más ácido y sin el amargor de la cáscara: usar la mitad."]],"quesooaxaca":[["mozzarella","mismo","Es prácticamente el mismo queso de pasta hilada: funde igual."],["quesocampesino","apuro","No hila ni funde parejo, pero sirve donde el queso va en trozos."]],"quesocotija":[["parmesano","papel","Igual de salado y seco, con otro sabor; se ralla y se espolvorea igual."],["quesocosteno","familia","Salado y desmoronable, muy parecido en papel y textura."]],"nopal":[["habichuela","papel","Textura y acidez vegetal parecidas una vez cocida, sin la baba característica."],["calabacin","apuro","Aporta humedad y verdura, sin la acidez del nopal."]],"flordecalabaza":[["espinaca","papel","Se marchita igual y rellena parecido, con sabor más mineral."],["champinon","apuro","Otro relleno suave de quesadilla, con sabor muy distinto."]],"jamaica":[["mora","papel","Da color y acidez parecidos en una bebida, con sabor a fruta."],["tamarindo","apuro","Ácido y oscuro, pero mucho más denso y con otro perfil."]],"chorizomex":[["chorizo","familia","El curado español no se desmorona: hay que picarlo y suelta menos grasa."],["carne_molida","papel","Con pimentón, vinagre y ajo se parece bastante al mexicano crudo."]],"tequila":[["mezcal","familia","El mismo agave, pero el mezcal es ahumado y cambia el trago."],["ron","apuro","Dulce y sin el sabor de agave: cambia la bebida, no la reemplaza."]],"mezcal":[["tequila","familia","Mismo agave sin el ahumado, que es justo lo que define al mezcal."],["whisky","apuro","Comparte el registro ahumado, con un sabor completamente distinto."]],"hojaaguacate":[["laurel","papel","Otra hoja aromática que se retira; no da el anisado de la hoja de aguacate."],["anis","apuro","Imita el anisado, que es lo principal que aporta la hoja."]],"hojamaiz":[["hojaplatano","papel","Envuelve igual y aguanta más, pero perfuma distinto y el tamal cambia."],["chala","mismo","Es la misma hoja de maíz, fresca en vez de seca: hay que hervirla menos."]],"cal":[["bicarbonato","apuro","Ablanda el grano pero no nixtamaliza: la masa no va a ligar igual."],["masaharina","papel","Comprar la masa ya nixtamalizada evita el paso de la cal por completo."]],"harinagarbanzo":[["harina","papel","Cambia el plato: sin el sabor a garbanzo, el fainá deja de serlo."],["harinamaiz","apuro","Da una masa parecida de textura, con sabor a maíz en vez de garbanzo."]],"helado":[["crema","papel","Batida y azucarada cumple en los postres fríos, sin el frío del helado."],["yogur","apuro","Mucho más ácido y menos graso; cambia bastante el postre."]],"res_vacio":[["res_falda","familia","Mismo lugar del animal y misma fibra larga; es el nombre colombiano del corte."],["res_sobrebarriga","papel","Más gruesa y con más nervio: aguanta la parrilla pero pide más tiempo."]],"res_tira":[["costilla","mismo","Es la misma costilla de res, solo que cortada a lo largo del hueso en vez de atravesada."],["cerdo_costilla","papel","Se asa parecido, con menos tiempo y sabor más dulce."]],"res_matambre":[["res_sobrebarriga","familia","La lámina más parecida que hay: se arrolla y se brasea igual."],["res_falda","papel","Más corta y más gruesa, sirve arrollada aunque no se estire tanto."]],"res_bifechorizo":[["res_lomoancho","familia","El mismo lomo, cortado en bife grueso con su tapa de grasa."],["res_chatas","papel","Mismo músculo y mismo punto; el corte es algo más delgado."]],"res_colita":[["res_puntaanca","mismo","Es el mismo corte con otro nombre: la punta del cuadril."],["res_cadera","familia","Vecino y magro; pide cuidado para no pasarlo de punto."]],"res_molleja":[["pollo_molleja","papel","Nada que ver en textura: la de res es cremosa y la de pollo es músculo firme."],["res_corazon","apuro","Otra achura de parrilla, mucho más magra y con sabor fuerte."]],"res_chinchulin":[["res_mondongo","familia","Otra tripa: se limpia igual y pide la misma cocción previa."],["res_molleja","papel","La otra achura imprescindible, de textura opuesta."]],"cabrito":[["cordero","familia","La carne más parecida; algo más grasa y con sabor más marcado."],["cordero_pierna","papel","Para el asado entero, la pierna sola cumple el mismo papel."]],"ciervo":[["res_lomoancho","papel","Magro y de fibra fina parecida, sin el sabor de monte."],["cordero_lomo","apuro","Más graso; pide menos cocción para no pasarse."]],"surubi":[["bagre","mismo","El surubí es un bagre de río: misma carne firme y sin espinas finas."],["pescado","papel","Blanco y firme, aunque con menos sabor de río."]],"pacu":[["bagre","familia","Otro pescado de río de carne grasa; el pacú tiene espinas en Y."],["tilapia","apuro","Mucho más magro y neutro; conviene reforzar la grasa de la receta."]],"centolla":[["cangrejo","familia","La misma carne dulce de crustáceo, en patas más pequeñas."],["langostino","papel","Dulzor parecido y mucho menos trabajo para sacar la carne."]],"ricota":[["requeson","mismo","Es prácticamente lo mismo: cuajada fresca y escurrida."],["quesocampesino","papel","Hay que procesarlo y escurrirlo, pero rellena igual."]],"ajimolido":[["paprika","papel","Da el color pero no el picante ni los trozos de semilla."],["ajipicante","apuro","Pica más y aporta humedad: usar la mitad."]],"peperina":[["hierbabuena","papel","De la misma familia mentolada; es el reemplazo que usan en el Centro."],["oregano","apuro","Otra cosa, pero funciona donde la peperina va seca y en infusión."]],"yerbamate":[["te","papel","Otra infusión amarga con cafeína; cambia el sabor por completo."],["cafe","apuro","Solo sirve para el mate cocido, no para el mate cebado."]],"grasapella":[["manteca","mismo","Es grasa animal de cerdo en vez de res; en masas da el mismo resultado."],["mantequilla","papel","Sabor distinto y más agua: la masa queda menos hojaldrada."]],"chala":[["hojaplatano","papel","Otra envoltura que no se come; aguanta más calor y perfuma distinto."],["hojasbijao","apuro","Envuelve igual, aunque es más rígida y cuesta amarrarla."]],"algarroba":[["harina","papel","Pierde el dulzor y el sabor tostado propios de la algarroba."],["chocolate","apuro","El parecido es de color y amargor, no de sabor."]],"fernet":[["brandy","papel","Otro destilado de sobremesa, dulce en vez de amargo de hierbas."],["anis","apuro","Comparte el registro herbal, pero es dulce y anisado."]],"linaza":[["chia","papel","Forma el mismo gel al remojarse y sirve igual de espesante."],["ajonjoli","apuro","Aporta grasa y sabor tostado, pero no hace gel."]],"vieira":[["mejillon","familia","Otro molusco de valva, más barato y con más sabor a mar."],["camaron","papel","Dulce parecido y aguanta el mismo tiempo corto de cocción."]],"mejillon":[["almeja","familia","Mismo molusco de valva; se abre igual y pide el mismo cuidado."],["vieira","papel","Más suave y más cara; sirve donde el chorito va desconchado."]],"cangrejo":[["langostino","papel","Dulzor parecido y mucho menos trabajo para comerlo."],["camaron","apuro","Más neutro: pide reforzar el aderezo para compensar."]],"pato":[["gallina","familia","Ave de carne firme que aguanta la misma cocción larga."],["pollo_muslo","apuro","Mucho menos grasa y sabor; se hace en la mitad del tiempo."]],"gallina":[["pollo_entero","familia","Más tierno y con menos sabor: pide la mitad de cocción."],["pato","papel","Carne firme parecida, bastante más grasa."]],"pollo_entero":[["gallina","familia","Más dura y más sabrosa: necesita el doble de cocción."],["pollo_muslo","papel","Solo la parte jugosa, sin la pechuga que se seca."]],"cerdo_patita":[["cerdo_espinazo","familia","Da la misma gelatina al caldo, con más carne y menos cuero."],["res_rabo","papel","Mismo papel gelatinoso, con sabor a res en vez de cerdo."]],"pollo_molleja":[["pollo_menudencia","familia","Viene surtida: trae mollejas pero también hígado y corazón."],["res_corazon","papel","Tex function exigeCoccion(p){

}

function proteinaDe(p, soloPlato){
  // Un flan lleva huevo pero nadie lo pincha con termómetro: en la ficha del
  // plato solo cuenta donde la proteína es el plato.
  if(soloPlato && !CAT_TERMOMETRO.includes(p.cat)) return null;
  const prots = (p.ing||[]).map(i => PROT[i[2]] || PROT[FAMILIA[i[2]]]).filter(Boolean);
  for(const k of ORDEN_PROT){ if(prots.includes(k)) return k; }
  return null;
}

/* Un insumo sin tabla propia hereda la de su familia o la de su proteína. */
function nutriIng(id){
  return NUTRI[id] || NUTRI[FAMILIA[id]] ||
         (PROT[id] && NUTRI[PROT[id]]) ||
         (PROT[FAMILIA[id]] && NUTRI[PROT[FAMILIA[id]]]) || null;
}

/* Cuántos gramos son [cantidad, unidad, insumo]. Devuelve null cuando no se
   puede saber, para no inventar un número y contarlo como si fuera cierto. */
function gramosDe(q, u, id){
  if(!(q > 0)) return null;
  if(u === '') { const g = PESO_U[id]; return g === undefined ? null : q * g; }
  if(u === 'taza'){ const g = PESO_T[id]; return q * (g === undefined ? 200 : g); }
  const f = PESO_F[u];
  return f === undefined ? null : q * f;
}

/* El aporte de una receta, por porción. Las preparaciones que son otra
   receta (una bordalesa lleva demi-glace) se resuelven hacia adentro, con
   tope de profundidad para no entrar en un ciclo. */
function nutriDe(r, hondo){
  if(!r || !r.ing) return null;
  const t = { kcal:0, prot:0, carb:0, gras:0, fib:0, sod:0 };
  let pesados = 0, sinDato = 0;
  r.ing.forEach(([q, u, id]) => {
    const sub = (hondo || 0) < 3 ? recetaPorId(id) : null;
    if(sub){
      // Es otra preparación: se cuenta lo que aporta la parte que se usa
      const n = nutriDe(sub, (hondo || 0) + 1);
      if(!n){
        // Una subpreparación que no aporta nada -una bolsita de especias
        // que además se retira- no es un dato que falte, es un cero.
        return;
      }
      // Pedida en gramos o mililitros se pesa; pedida por unidad, "1"
      // quiere decir una porción de esa preparación, que es como se usa.
      const g = gramosDe(q, u, id) ||
                (u === '' ? n.gramos * q / Math.max(1, sub.serv || 1) : null);
      if(!g){ sinDato++; return; }
      const porG = n.gramos > 0 ? g / n.gramos : 0;
      ['kcal','prot','carb','gras','fib','sod'].forEach(k => t[k] += n.total[k] * porG);
      pesados += g;
      return;
    }
    const n = nutriIng(id);
    let g = gramosDe(q, u, id);
    // Una envoltura que no se come -hoja de plátano, hojas de bijao- pesa
    // cero a propósito. Eso es un cero conocido, no un dato que falta.
    if(!n || g === null || g === undefined){ sinDato++; return; }
    if(g === 0) return;
    // La sal que se usa en salmuera, costra, agua de la pasta o baño de hielo no se
    // come: se cuenta como mucho la de sazonar, 1,5 g por porción.
    if(id === 'sal' || id === 'salmarina') g = Math.min(g, 1.5 * Math.max(1, r.serv || 1));
    pesados += g;
    t.kcal += n[0] * g / 100; t.prot += n[1] * g / 100; t.carb += n[2] * g / 100;
    t.gras += n[3] * g / 100; t.fib  += n[4] * g / 100; t.sod  += n[5] * g / 100;
  });
  if(!pesados) return null;
  const serv = Math.max(1, r.serv || 1);
  const porc = {};
  Object.keys(t).forEach(k => porc[k] = t[k] / serv);
  return { total: t, porcion: porc, gramos: pesados,
           gramosPorcion: pesados / serv, sinDato, serv };
}

/* Los alérgenos de una receta, con el insumo que los trae. */
function alergenosDe(r){
  if(!r || !r.ing) return [];
  const ids = r.ing.map(x => x[2]).concat(r.opt || []);
  const todos = [];
  ids.forEach(id => {
    const sub = recetaPorId(id);
    if(sub) ids.push(...sub.ing.map(x => x[2]));
  });
  Object.entries(ALERG).forEach(([k, lista]) => {
    const culpa = ids.filter(i => lista.includes(i) || lista.includes(FAMILIA[i]));
    if(culpa.length) todos.push([k, [...new Set(culpa)].slice(0, 3)]);
  });
  return todos;
}

  const n = nutriDe(r);

    '<p class="nu-sub">' + t('nutriPorcion').replace('{g}', Math.round(n.gramosPorcion)) + '</p>' +

/* Los cortes que nombra un paso, con su medida. Antes vivían en una
   pestaña que había que ir a buscar; ahora salen donde se mencionan. */
let CORTES_MM = null;
function cortesMM(){
  if(CORTES_MM) return CORTES_MM;
  CORTES_MM = {};
  ((DICC && DICC.cuchillo) || []).forEach(g =>
    (g.items || []).forEach(([n, medida, desc]) => {
      if(n) CORTES_MM[n.toLowerCase()] = [medida || '', desc || ''];
    }));
  return CORTES_MM;
}

/* Marca en el texto del paso los nombres de corte que conozca. Se toca y
   dice la medida: así no hay que salirse de la receta para saber qué es
   una brunoise. */
function marcaCortes(txt){
  const C = cortesMM();
  const nombres = Object.keys(C).filter(n => n.length > 4)
    .sort((a, b) => b.length - a.length);
  if(!nombres.length) return txt;
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\function bloqueTemp(p){');
  const re = new RegExp('\\b(' + nombres.map(esc).join('|') + ')\\b', 'gi');
  return txt.replace(re, m =>
    '<b class="corte" data-corte="' + m.toLowerCase() + '">' + m + '</b>');
}

    (nota ? '<p>' + nota + '</p>' : '') +
    (grados.length ? '<div class="tc-g">' + grados.map((g,i) =>
       '<span><em>' + (nombres[i]||'') + '</em>' + g + '</span>').join('') + '</div>' : '') +

}

/* La yuca entra a una fritura, pero cocida de antes. Avisar, no bloquear. */
function previos(p){
  return (p.ing||[]).map(i=>i[2]).filter(id => PRECOCCION.includes(id));
}
function avisoPrevio(p){
  if(!TEC_RAPIDA.includes(p.tec)) return '';
  const l = previos(p);
  if(!l.length) return '';
  return '<div class="previo">' + t('vanCocidos').replace('{x}', l.map(trIng).join(', ')) + '</div>';
}
function pideCorte(p){
  const llevaCarne = p.ing.some(i => FAM_CARNE.includes(i[2]) || FAM_CARNE.includes(FAMILIA[i[2]]));
  if(!llevaCarne) return '';
  const e = exigeCoccion(p);
  return e === 'ambos' ? '' : e;
}

/* ¿Este corte sirve para esta preparación? */
function cocionCompatible(ingId, p){
  const c = COCCION[ingId];
  if(!c || c === 'ambos') return true;
  const e = exigeCoccion(p);
  return e === 'ambos' || e === c;
}

/* ============================================================
   MOTOR DE COINCIDENCIAS
   ============================================================ */
let gruposAbiertos = new Set();
let pantry = new Set(store.get('rec_pantry', BASICOS));
let equipo = new Set(store.get('rec_equipo', ['estufa','sarten','olla']));

function tengo(id, p){
  if(pantry.has(id) && (!p || cocionCompatible(id, p))) return {ok:true, sust:null};
  // Un corte cubre a su familia, pero solo si su cocción encaja con el plato:
  // tener osobuco no habilita un salteado de 20 minutos.
  for(const x of pantry){
    if(FAMILIA[x] === id && (!p || cocionCompatible(x, p))) return {ok:true, sust:x};
  }
  // Y al revés: la receta pide un corte y tienes la familia genérica
  if(FAMILIA[id] && pantry.has(FAMILIA[id])) return {ok:true, sust:FAMILIA[id]};
  const subs = SUSTITUTOS[id]||[];
  for(const s of subs){
    if(pantry.has(s) && (!p || cocionCompatible(s, p))) return {ok:true, sust:s};
  }
  return {ok:false, sust:null};
}

/* Condimentos y apoyos: si solo falta esto, el plato igual sale.
   No deciden si puedes cocinar, solo afinan el sabor. */
const PRESCINDIBLES = new Set(['agua','hielo','comino','oregano','laurel','canela','curry','paprika',
  'ajipicante','cilantro','perejil','albahaca','guascas','vainilla','pimienta',
  'bicarbonato','levadura','caldo','vinagre','mostaza','azucar','miel','soya',
  'enebro']);

function evaluar(p){
  // equipos: si falta alguno, no se puede hacer
  const faltaEq = p.eq.filter(e=>!equipo.has(e));
  const req = p.ing.map(i=>i[2]);
  const falta=[], opcionalFalta=[], sustituciones=[], usa=[];
  req.forEach(id=>{
    const t=tengo(id, p);
    if(t.ok){ usa.push(id); if(t.sust) sustituciones.push([id,t.sust]); }
    else if(PRESCINDIBLES.has(id)) opcionalFalta.push(id);
    else falta.push(id);
  });
  const extras = (p.opt||[]).filter(id=>pantry.has(id));
  const cobertura = usa.length/req.length;
  const score = cobertura*100 + usa.length*4 + extras.length*3
                - opcionalFalta.length*2 - faltaEq.length*100;
  return {p, falta, opcionalFalta, faltaEq, sustituciones, extras, usa, cobertura, score};
}

function buscarPreparaciones(){
  const evaluadas = PREPS.map(evaluar).filter(r=>!r.faltaEq.length);
  const listas = evaluadas.filter(r=>r.falta.length===0).sort((a,b)=>b.score-a.score);
  const cerca  = evaluadas.filter(r=>r.falta.length>0 && r.falta.length<=2)
                          .sort((a,b)=>a.falta.length-b.falta.length || b.score-a.score);
  return {listas, cerca:cerca.slice(0,12)};
}

function cuerpoFicha(k){
  // temp, pescados, cuchillo, despiece, anatomia y especias ya no son
  // pestañas: su contenido vive en la receta y en la despensa.
  if(k === 'seguridad')   return cuerpoSeguridad();
  if(k === 'rendimiento') return cuerpoRendimiento();
  if(k === 'pastas')      return cuerpoPastas();
  if(k === 'lonchera')    return cuerpoLonchera();
  if(k === 'saludable')   return cuerpoSaludable();
  if(k === 'maridaje')    return cuerpoMaridaje();
  if(k === 'bases')       return cuerpoBases();
  if(k === 'salsas')      return cuerpoCocina('salsa');
  if(k === 'fondos')      return cuerpoCocina('fondo');
  return cuerpoMaridaje();
}

/* Cuántos mililitros de blanqueador por litros de agua, a la concentración
   que se quiera. La cuenta es la de la guía: no se copia una tabla porque
   el blanqueador que venden no siempre tiene la misma concentración. */
function mlCloro(litros, ppm, porcentaje){
  if(!(litros > 0) || !(porcentaje > 0)) return null;
  return litros * (ppm / 1000) / (porcentaje / 100);
}

function calcularCloro(){
  const lt = parseFloat((document.getElementById('clLitros') || {}).value);
  const pc = parseFloat((document.getElementById('clPct') || {}).value);
  const out = document.getElementById('clSalida');
  if(!out) return;
  if(!(lt > 0) || !(pc > 0)){ out.innerHTML = '<span class="cl-vacio">' + t('clPide') + '</span>'; return; }
  const fila = (ppm, para) => {
    const ml = mlCloro(lt, ppm, pc);
    const cdta = ml / 5;
    return '<div class="cl-fila"><span class="cl-para">' + para + '</span>' +
      // un decimal solo cuando hace falta: "5 ml", no "5,0 ml"
      '<b>' + (ml < 10 ? (+ml.toFixed(1)).toString().replace('.', ',') : Math.round(ml)) + ' ml</b>' +
      // Media cucharadita (2,5 ml) es el piso para que valga medirlo así
      '<span class="cl-cdta">' + (ml >= 2.5
        ? '≈ ' + (cdta < 10 ? (+cdta.toFixed(1)).toString().replace('.', ',') : Math.round(cdta)) +
          ' ' + t(cdta === 1 ? 'clCdta1' : 'clCdta')
        : t('clGotas')) + '</span></div>';
  };
  out.innerHTML = fila(50, t('clFruta')) + fila(100, t('clVerdura'));
}

/* La lista, agrupada como la despensa y filtrable. Va aparte de la ficha
   para que escribir en el buscador no vuelva a dibujar la calculadora y
   le haga perder el foco al input, que es lo que pasaba en maridaje. */
let filtroRend = '';
function listaRendimiento(){
  const notas = (DICC && DICC.rendimiento) || {};
  const q = (filtroRend || '').trim().toLowerCase();
  const pasa = id => !q || trIng(id).toLowerCase().includes(q) ||
                     (notas[id] || '').toLowerCase().includes(q);
  const fila = id => {
    const pct = REND[id];
    return '<div class="item rend" data-rend="' + id + '">' +
      '<div class="fila"><span class="nombre">' + trIng(id) + '</span>' +
      '<span class="grados">' + pct + ' %</span></div>' +
      '<div class="met">' +
        '<span><em>' + t('rendUtil') + '</em><b class="util">—</b></span>' +
        '<span><em>' + t('rendMerma') + '</em><b class="merma">—</b></span>' +
      '</div>' +
      '<p class="como">' + (notas[id] || '') + '</p></div>';
  };
  // Mismo orden de grupos que la despensa, para no tener que aprender otro.
  // Un insumo puede estar en dos grupos (el haba está en verduras y en
  // granos): se dibuja una sola vez, en el primero que lo reclame.
  const puesto = new Set();
  const salida = GROUPS.map(g => {
    const ids = idsDe(g).filter(id => REND[id] !== undefined && !puesto.has(id))
      .filter(pasa).sort((a, b) => REND[a] - REND[b]);
    ids.forEach(id => puesto.add(id));
    if(!ids.length) return '';
    return '<div class="f-sec">' + trGrupo(g.t) + '</div>' + ids.map(fila).join('');
  }).join('');
  // Lo que no cayó en ningún grupo no se puede perder
  const enGrupos = new Set(GROUPS.flatMap(idsDe));
  const sueltos = Object.keys(REND).filter(id => !enGrupos.has(id)).filter(pasa);
  return (salida || sueltos.length)
    ? salida + (sueltos.length ? '<div class="f-sec">' + t('otros') + '</div>' + sueltos.map(fila).join('') : '')
    : '<p class="vacio">' + t('sinResultados') + '</p>';
}

function calcularRendimiento(){
  const el = document.getElementById('pesoBruto');
  if(!el) return;
  const bruto = parseFloat(el.value);
  document.querySelectorAll('[data-rend]').forEach(fila => {
    const pct = REND[fila.dataset.rend];
    const u = fila.querySelector('.util'), m = fila.querySelector('.merma');
    if(!(bruto > 0)){ u.textContent = '—'; m.textContent = '—'; return; }
    const util = bruto * pct / 100;
    u.textContent = kg(util);
    m.textContent = kg(bruto - util);
  });
}
const kg = n => (n >= 1 ? (+n.toFixed(2)) + ' kg' : Math.round(n * 1000) + ' g');

/* Un insumo sin ficha propia usa la de su familia: la cebolla roja
   combina como la cebolla, y el jalapeño como el ají. */
function parejasDe(id){
  if(PAREJAS[id]) return { ids: PAREJAS[id], via: null };
  const f = FAMILIA[id];
  if(f && PAREJAS[f]) return { ids: PAREJAS[f], via: f };
  return null;
}

nsalada de garbanzos con limón, cebolla y hierbas.",8,false],["Miércoles","p39","verduras","Verduras salteadas al wok con los garbanzos. Las asadas del domingo ya tienen color; aquí solo se calientan y se les suma algo crudo.",12,true],["Jueves","z029","papa","Tortilla de papa y cebolla con la papa ya cocida. Fría o del tiempo es mejor que caliente, y es la que mejor viaja de toda la semana.",18,false],["Viernes","p91","papa","Ensalada de papa con el pollo desmechado del domingo y el aliño aparte.",12,false]]},{"id":"sincarne","n":"Semana sin carne","q":"Lentejas, garbanzos y verduras. Sale más barata que cualquiera con carne y llena igual.","prep":["lenteja","garbanzo","verduras"],"dias":[["Lunes","p119","lenteja","Lentejas guisadas con un sofrito y arroz o pan.",12,true],["Martes","e039","garbanzo","Hummus con las verduras asadas y pan. El hummus se hace en cinco minutos con los garbanzos ya cocidos.",8,false],["Miércoles","a024","garbanzo","Curry de garbanzos con leche de coco. Los garbanzos ya cocidos solo tienen que tomar la salsa diez minutos.",18,true],["Jueves","r015","lenteja","Lentejas a la vinagreta, frías, con verdura cruda. La vinagreta aparte hasta el momento de comer.",10,false],["Viernes","p111","verduras","Pasta precocida del domingo con las verduras asadas que queden: diez minutos en la sartén.",14,true]]}],"CLAVES":[["Enfría antes de tapar","Tapar caliente genera vapor, el vapor se condensa y al día siguiente todo está aguado. Deja enfriar destapado y tapa frío."],["La salsa y el aliño aparte","Un frasquito pequeño. El aliño sobre la ensalada desde la noche anterior la deja marchita. La pasta precocida va sola y se une a la salsa caliente el día."],["Lo crocante encima y al final","Apanados, maní, plátano frito y tostadas no sobreviven la noche con humedad. Llévalos en bolsa aparte y ponlos al momento."],["El arroz es el riesgo real","Es lo único de la lonchera que puede enfermar de verdad. A la nevera antes de dos horas de cocinado, y al recalent let planAbierto = null;

/* Lo que hay que comprar para una semana. Dos cuentas encadenadas:
   primero cuánto se necesita ya limpio, y después cuánto hay que comprar
   para que quede eso, que es lo que cobra el mercado. */
function compraDe(plan, personas){
  const need = {};
  const suma = (r, veces) => {
    if(!r) return;
    (r.ing || []).forEach(([q, u, id]) => {
      const sub = recetaPorId(id);
      if(sub){ suma(sub, veces * (q / Math.max(1, sub.serv))); return; }
      const g = gramosDe(q, u, id);
      if(!g) return;
      need[id] = (need[id] || 0) + g * veces / Math.max(1, r.serv || 1);
    });
  };
  // Las bases del domingo: una tanda para los cinco días
  plan.prep.forEach(k => {
    const bs = LONCHERA.BASES[k];
    suma(BASE.find(x => x.id === bs.receta), 5 * personas);
  });
  // Y lo que cada día agrega ENCIMA. Lo que ya puso la base no se vuelve a
  // contar: el jueves ensambla con la papa del domingo, no compra otra.
  plan.dias.forEach(([, rec, base]) => {
    const r = BASE.find(x => x.id === rec);
    if(!r) return;
    const yaEsta = (LONCHERA.BASES[base] || {}).insumo || [];
    const sinLaBase = Object.assign({}, r, {
      ing: r.ing.filter(([, , id]) =>
        !yaEsta.includes(id) && !yaEsta.includes(FAMILIA[id])),
    });
    suma(sinLaBase, personas);
  });

  return Object.entries(need).map(([id, limpio]) => {
    const r = typeof REND !== 'undefined' ? REND[id] : null;
    const comprar = r ? limpio * 100 / r : limpio;
    return { id, limpio, comprar, rend: r || null };
  }).filter(x => x.limpio >= 3)
    .sort((a, b) => b.comprar - a.comprar);
}

const pesoBonito = g => g >= 1000 ? (Math.round(g / 100) / 10).toString().replace('.', ',') + ' kg'
                      : Math.round(g) + ' g';

function cuerpoLonchera(){
  // Las "semanas armadas" salieron: la lonchera es solo la semana que arma cada usuario
  loModo = 'mia'; planAbierto = null;

}

    LONCHERA.CLAVES.map(([ti, q]) =>
      '<div class="item"><div class="fila"><span class="nombre">' + ti + '</span></div>' +
      '<p class="como">' + q + '</p></div>').join('');
