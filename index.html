<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#15181A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Recetario · Cocina del mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     CARTA DE NOCHE · sistema visual
     Tinta profunda, papel cálido y latón. Cada plato se lee como
     una línea de carta de restaurante.
     ============================================================ */
  :root{
    --tinta:#15181A; --tinta-2:#1D2124; --linea-osc:#2C3134;
    --papel:#F2EDE4; --papel-2:#FFFFFF; --papel-linea:#DDD4C4;
    --laton:#B8914F; --laton-claro:#E4C98E; --laton-osc:#8F6E36;
    --oliva:#4A5B45; --vino:#6E2A33;
    --ink:#15181A; --ink-2:#6E6558; --ink-3:#8A8073;
    --gris:#8E9599; --gris-2:#6E7579;
    --sh:0 1px 2px rgba(21,24,26,.05), 0 8px 28px rgba(21,24,26,.07);
    --sh-alta:0 12px 40px rgba(21,24,26,.16);
    --r:14px; --r-g:22px;
    --disp:'Bodoni Moda', Georgia, 'Times New Roman', serif;
    --body:'Karla', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--body); background:var(--tinta); color:var(--papel);
    line-height:1.5; overscroll-behavior-y:none;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:16px}
  ::selection{background:var(--laton);color:var(--tinta)}
  :focus-visible{outline:2px solid var(--laton);outline-offset:2px}

  /* ---------- Armazón ---------- */
  #app{max-width:680px;margin:0 auto;min-height:100%;padding-bottom:124px;background:var(--tinta)}

  .topbar{
    position:sticky;top:0;z-index:20;background:rgba(21,24,26,.92);
    backdrop-filter:saturate(180%) blur(14px);
    padding:max(16px,env(safe-area-inset-top)) 22px 14px;
    border-bottom:1px solid var(--linea-osc);
  }
  .brand{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
  .brand-mark{
    font-family:var(--disp);font-size:12px;letter-spacing:.34em;
    color:var(--laton);font-weight:500;flex:none;
  }
  .brand h1{
    font-family:var(--disp);font-weight:500;font-size:23px;
    letter-spacing:-.01em;line-height:1.05;color:var(--papel);
  }
  .lang{margin-left:auto;border:1px solid var(--linea-osc);border-radius:3px;
    padding:5px 10px;font-size:11px;font-weight:700;letter-spacing:.08em;
    color:var(--laton);align-self:center}
  .lang:active{background:var(--tinta-2)}
  .brand small{display:none}

  .search{position:relative}
  .search input{
    width:100%;border:1px solid var(--linea-osc);background:var(--tinta-2);
    border-radius:4px;padding:12px 14px 12px 42px;color:var(--papel);
    outline:none;transition:border-color .2s;
  }
  .search input::placeholder{color:var(--gris-2)}
  .search input:focus{border-color:var(--laton)}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:17px;height:17px;stroke:var(--gris-2)}

  .chips{display:flex;gap:7px;overflow-x:auto;padding:14px 22px 6px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--linea-osc);background:transparent;
    border-radius:3px;padding:7px 13px;font-size:13px;font-weight:500;
    color:var(--gris);white-space:nowrap;transition:.18s;display:flex;gap:6px;align-items:center}
  .chip.on{background:var(--laton);color:var(--tinta);border-color:var(--laton);font-weight:600}
  .chip .em{display:none}

  /* ---------- Carta: la lista de platos ---------- */
  .wrap{background:var(--papel);border-radius:var(--r-g) var(--r-g) 0 0;
    margin-top:8px;padding:24px 22px 40px;min-height:72vh}
  .count{font-family:var(--disp);font-size:13px;color:var(--ink-2);
    margin:0 0 4px;letter-spacing:.02em}
  .count::after{content:"";display:block;height:2px;background:var(--tinta);margin-top:10px}

  .grid{display:block}
  .card{
    width:100%;text-align:left;background:transparent;border:none;
    padding:15px 0;border-bottom:1px solid var(--papel-linea);
    display:flex;gap:14px;align-items:flex-start;transition:opacity .15s;
  }
  .card:active{opacity:.55}
  .card .thumb{
    width:62px;height:62px;flex:none;border-radius:4px;
    display:grid;place-items:center;font-size:25px;position:relative;
    background-size:cover;background-position:center;
  }
  .card .fav{flex:none;width:34px;height:34px;display:grid;place-items:center;
    align-self:center;margin-left:4px}
  .card .fav svg{width:18px;height:18px;stroke:var(--papel-linea);fill:none;stroke-width:1.8;transition:stroke .2s}
  .card .fav.on svg{fill:var(--vino);stroke:var(--vino)}
  .card .body{flex:1;min-width:0}
  .card .cat{font-size:11px;font-weight:600;letter-spacing:.07em;color:var(--laton-osc)}
  .card h3{font-family:var(--disp);font-weight:500;font-size:18px;line-height:1.15;
    margin:4px 0 6px;letter-spacing:-.01em;color:var(--ink)}
  .card .meta{display:flex;gap:12px;font-size:12px;color:var(--ink-3)}

  .empty{text-align:center;color:var(--ink-3);padding:56px 20px;font-size:14.5px;line-height:1.6}
  .empty .em{font-size:34px;display:block;margin-bottom:12px;opacity:.5}

  /* ---------- Maridaje ---------- */
  .leyenda{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
  .pars{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .par{font-size:12px;padding:4px 9px;border-radius:2px;border:1px solid;white-space:nowrap}
  .par.puente   {border-color:rgba(122,154,160,.45);color:#9FBEC4}
  .par.refuerzo {border-color:rgba(160,120,78,.5); color:#C9A273}
  .par.corte    {border-color:rgba(126,154,110,.45);color:#A6C293}
  .par.contraste{border-color:rgba(150,74,86,.5);  color:#D8A6AC}
  .par.tradicion{border-color:rgba(184,145,79,.5); color:var(--laton)}
  .par.casa{border-color:rgba(184,145,79,.75);background:rgba(184,145,79,.12);color:var(--laton)}
  .firma{margin:0 0 20px;padding:13px 15px;background:rgba(184,145,79,.1);
    border-left:2px solid var(--laton);font-size:13.5px;line-height:1.6;
    color:rgba(242,237,228,.86)}
  .comp{padding:10px 0 2px 12px;border-left:1px solid rgba(184,145,79,.3);margin:10px 0 0}
  .comp-n{font-family:var(--disp);font-weight:500;font-size:15px;color:var(--papel);margin-bottom:7px}
  .comp-como{font-size:12.5px;line-height:1.6;color:rgba(242,237,228,.6);margin:8px 0 0}
  .base .para{font-size:13px;line-height:1.55;color:rgba(242,237,228,.68);margin:10px 0 0}
  .base .para em{font-style:normal;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--laton);opacity:.8;margin-right:5px}
  .base .como{font-size:13.5px;line-height:1.6;color:rgba(242,237,228,.58);margin:8px 0 0}
  .par.si{background:rgba(242,237,228,.1);font-weight:500}
  .par.audaz{border-style:dashed}
  .mar .como{color:rgba(242,237,228,.6);font-size:13px}
  .ftab.solo{display:block;margin:0 0 16px}
  .heredado{font-size:11px;letter-spacing:.06em;color:var(--laton);opacity:.75;margin:6px 0 0}
  #qMar{width:100%;min-width:0;background:rgba(242,237,228,.05);color:var(--papel);
    border:1px solid rgba(242,237,228,.16);border-radius:2px;padding:11px 13px;
    font-family:var(--cuerpo);font-size:15px}
  #qMar:focus{outline:none;border-color:var(--laton)}
  #sugiere:empty{display:none}
  #sugiere .sug-sub{font-size:12.5px;line-height:1.5;color:rgba(21,24,26,.5);margin:0 0 10px}
  .pill.sug{border-style:dashed;border-color:rgba(184,145,79,.6);color:#8A6A2E}
  .sug-rol{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(21,24,26,.42);margin:12px 0 7px}
  .sug-rol:first-of-type{margin-top:4px}
  .pill.sug i{display:block;font-style:normal;font-size:10px;letter-spacing:.07em;
    text-transform:uppercase;opacity:.7;margin-top:2px}

  /* ---------- Pastas y anatomía ---------- */
  .plato h3{font-family:var(--disp);font-weight:500;font-size:23px;color:var(--papel);
    margin:0 0 8px;line-height:1.15}
  .plato > .como{font-size:14px;line-height:1.6;color:rgba(242,237,228,.76);margin:0 0 16px}
  .parte{display:grid;grid-template-columns:minmax(78px,26%) 1fr;gap:12px;
    padding:11px 0;border-top:1px solid rgba(242,237,228,.07)}
  .parte b{font-family:var(--disp);font-weight:500;font-size:15px;color:var(--laton);
    min-width:0;line-height:1.3}
  .parte b i{font-style:normal;opacity:.8}
  .parte span{font-size:13px;line-height:1.55;color:rgba(242,237,228,.72);min-width:0}
  @media (max-width:360px){ .parte{grid-template-columns:1fr;gap:2px} }

  /* ---------- Seguridad, rendimiento y despiece ---------- */
  .pasos{list-style:none;counter-reset:p;margin:0;padding:0}
  .pasos li{counter-increment:p;display:grid;grid-template-columns:22px 1fr;gap:3px 11px;
    padding:12px 0;border-bottom:1px solid rgba(242,237,228,.07)}
  .pasos li::before{content:counter(p);grid-row:span 2;font-family:var(--disp);font-size:15px;
    color:var(--laton);opacity:.8;padding-top:1px}
  .pasos b{font-family:var(--disp);font-weight:500;font-size:16px;color:var(--papel)}
  .pasos span{font-size:13.5px;line-height:1.55;color:rgba(242,237,228,.72)}
  .alerta{margin:22px 0 4px;padding:14px 16px;background:rgba(110,42,51,.22);
    border-left:2px solid #A4545F}
  .alerta .tc-k{color:#E0A9AF}
  .alerta p{font-size:13.5px;line-height:1.55;color:rgba(242,237,228,.84);margin:5px 0 0}
  .zona{padding:12px 0 12px 12px;border-left:2px solid rgba(242,237,228,.18);margin-bottom:4px}
  .zona.alerta{background:none;padding:12px 0 12px 12px;margin:0 0 4px;border-left-color:#C98A3C}
  .zona.alerta .grados{color:#D9A45F}
  .zona.bien{border-left-color:var(--laton)}
  .zona.frio{border-left-color:#6D93A8}
  .zona.frio .grados{color:#8FB4C8}
  .zona .como{font-size:13px;line-height:1.5;color:rgba(242,237,228,.6);margin:4px 0 0}
  .claves{list-style:none;margin:10px 0 0;padding:0}
  .claves li{position:relative;padding:5px 0 5px 16px;font-size:13px;line-height:1.5;
    color:rgba(242,237,228,.62)}
  .claves li::before{content:'';position:absolute;left:0;top:12px;width:5px;height:5px;
    border-radius:50%;background:var(--laton);opacity:.7}
  .formula{margin:14px 0 18px;padding:12px 14px;border:1px solid rgba(184,145,79,.35);
    border-radius:2px;font-size:13.5px;color:var(--laton);text-align:center;
    font-variant-numeric:tabular-nums}
  .calc{margin:0 0 20px}
  .calc label{display:block;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(242,237,228,.45);margin-bottom:7px}
  .calc-in{display:flex;align-items:center;gap:9px}
  .calc-in input{flex:1;min-width:0;background:rgba(242,237,228,.05);color:var(--papel);
    border:1px solid rgba(242,237,228,.16);border-radius:2px;padding:11px 13px;
    font-family:var(--disp);font-size:21px;font-variant-numeric:tabular-nums}
  .calc-in input:focus{outline:none;border-color:var(--laton)}
  .calc-in span{font-size:13px;color:rgba(242,237,228,.5);flex:none}
  .rend .met b{font-family:var(--disp);font-weight:500;font-size:17px;color:var(--papel);
    font-variant-numeric:tabular-nums}
  .rend .met span:last-child b{color:#D8A6AC}
  .ficha .item > .ojo{font-size:12.5px;line-height:1.55;color:var(--laton);margin:5px 0 0}
  .ficha .item > .ojo em{font-style:normal;font-size:9px;letter-spacing:.14em;
    text-transform:uppercase;opacity:.65;margin-right:4px}

  /* ---------- Fichas de cocina ---------- */
  .ficha .item{padding:15px 0;border-bottom:1px solid rgba(242,237,228,.07)}
  .ficha .fila{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
  .ficha .nombre{font-family:var(--disp);font-weight:500;font-size:18px;
    color:var(--papel);min-width:0}
  .ficha .item > .como{font-size:13.5px;line-height:1.55;
    color:rgba(242,237,228,.74);margin:8px 0 0}
  .ph-top{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .ph-top h2{margin:0;min-width:0}
  .libro.oscuro{margin:0;flex:none}
  .libro{width:34px;height:34px;border-radius:50%;border:1px solid rgba(21,24,26,.16);
    background:none;display:grid;place-items:center;margin-left:auto;margin-right:8px;
    flex:none;align-self:center}
  .libro svg{width:17px;height:17px;stroke:var(--tinta);opacity:.72}
  /* La barra de arriba es oscura: ahí el icono va claro o no se ve. */
  .topbar .libro{border-color:rgba(242,237,228,.22)}
  .topbar .libro svg{stroke:var(--papel);opacity:.8}
  .topbar .libro:active{background:rgba(242,237,228,.08)}
  .ftabs{display:flex;gap:7px;margin:0 0 8px;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    padding-right:max(16px,env(safe-area-inset-right,0px));
    margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
  .ftabs::-webkit-scrollbar{display:none}
  .ftab{flex:none;white-space:nowrap}
  .ftab{font-family:var(--cuerpo);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    background:none;color:rgba(242,237,228,.5);border:1px solid rgba(242,237,228,.14);
    border-radius:2px;padding:7px 12px}
  .ftab.on{background:rgba(184,145,79,.17);border-color:rgba(184,145,79,.55);color:var(--laton)}
  .ficha .h2sub{color:rgba(242,237,228,.5);font-size:13.5px;line-height:1.6;margin:14px 0 4px}
  .f-sec.mini{margin:16px 0 9px;border:none;padding:0}
  .grados{flex:none;font-family:var(--disp);font-size:19px;color:var(--laton);white-space:nowrap}
  .grados em{font-style:normal;font-size:11px;letter-spacing:.08em;color:rgba(242,237,228,.42)}
  .medida{flex:none;font-size:12px;letter-spacing:.1em;color:var(--laton);white-space:nowrap}
  .tc-g{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:4px}
  .tc-g span{font-size:13px;color:rgba(242,237,228,.76);font-variant-numeric:tabular-nums}
  .tc-g em{display:block;font-style:normal;font-size:9px;letter-spacing:.14em;
    text-transform:uppercase;color:rgba(242,237,228,.34);margin-bottom:1px}
  .escala{display:flex;align-items:center;gap:10px;margin:9px 0 2px;min-height:20px}
  .escala i{display:block;background:var(--laton);opacity:.75;border-radius:1px;flex:none}
  .met{display:flex;flex-wrap:wrap;gap:7px 20px;margin-top:3px}
  .met span{font-size:13px;color:rgba(242,237,228,.78)}
  .met em{display:block;font-style:normal;font-size:9px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--laton);opacity:.8;margin-bottom:1px}
  .salsa .base{font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--laton);margin:5px 0 8px}
  .der{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-top:1px solid rgba(242,237,228,.06)}
  .der b{font-family:var(--disp);font-weight:500;font-size:14.5px;color:var(--papel);flex:none}
  .der span{font-size:12.5px;color:rgba(242,237,228,.6);min-width:0}
  .mp{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:7px;padding-top:8px;
    border-top:1px dotted rgba(242,237,228,.12)}
  .mp span{font-size:12px;color:rgba(242,237,228,.6)}
  .mp em{display:block;font-style:normal;font-size:9px;letter-spacing:.14em;
    text-transform:uppercase;color:rgba(242,237,228,.3);margin-bottom:1px}
  .rz{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .rz span{font-size:12.5px;padding:5px 10px;border-radius:2px;
    border:1px solid rgba(242,237,228,.13);color:rgba(242,237,228,.66)}
  .rz span.si{border-color:rgba(184,145,79,.5);background:rgba(184,145,79,.13);color:var(--laton)}
  .rz i{font-style:normal;font-size:10px;letter-spacing:.07em;opacity:.75}
  .tempcard{margin:16px 0 0;padding:14px 16px;background:rgba(21,24,26,.05);
    border-left:2px solid var(--laton)}
  .tc-k{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--laton);margin-bottom:5px}
  .tc-n{font-family:var(--disp);font-weight:500;font-size:26px;color:var(--tinta);line-height:1.1}
  .tc-n em{font-style:normal;font-family:var(--cuerpo);font-size:11.5px;letter-spacing:.07em;
    color:rgba(21,24,26,.5);margin-left:9px}
  .tempcard p{font-size:13px;line-height:1.55;color:rgba(21,24,26,.66);margin:7px 0 0}
  .tempcard .tc-g span{color:rgba(21,24,26,.72)}
  .tempcard .tc-g em{color:rgba(21,24,26,.4)}
  .realza{margin:16px 0 0}
  .realza .tc-k{color:rgba(21,24,26,.45)}
  .realza .rz span{border-color:rgba(21,24,26,.14);color:rgba(21,24,26,.6)}
  .realza .rz span.si{border-color:rgba(184,145,79,.6);background:rgba(184,145,79,.13);color:#8A6A2E}

  /* ---------- Ficha de cortes y cocciones ---------- */
  .pill .aka{display:block;font-style:normal;font-size:10px;letter-spacing:.06em;
    text-transform:uppercase;opacity:.55;margin-top:2px}
  .gi{width:17px;height:17px;border-radius:50%;border:1px solid var(--laton);
    color:var(--laton);background:none;font-family:var(--disp);font-size:11px;
    line-height:1;margin-left:8px;vertical-align:middle;cursor:pointer}
  .ficha{padding:max(22px,env(safe-area-inset-top)) 22px 56px;position:relative}
  .back.fx{position:static;background:none;border:1px solid rgba(242,237,228,.22);margin-bottom:20px}
  .f-cat{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--laton);margin-bottom:6px}
  .ficha h2{font-family:var(--disp);font-weight:500;font-size:30px;line-height:1.12;
    color:var(--papel);margin:0 0 26px}
  .f-sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(242,237,228,.4);
    margin:30px 0 14px;padding-bottom:7px;border-bottom:1px solid rgba(242,237,228,.1)}
  .fc{padding:13px 0;border-bottom:1px solid rgba(242,237,228,.07)}
  .fc-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .fc-top b{font-family:var(--disp);font-weight:500;font-size:17px;color:var(--papel)}
  .coc{flex:none;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
    padding:3px 8px;border-radius:2px;white-space:nowrap}
  .coc.rapida{background:rgba(184,145,79,.17);color:var(--laton)}
  .coc.lenta{background:rgba(110,42,51,.3);color:#D8A6AC}
  .coc.ambos{background:rgba(242,237,228,.08);color:rgba(242,237,228,.6)}
  .fc-eq{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:8px}
  .fc-eq span{font-size:12.5px;color:rgba(242,237,228,.72)}
  .fc-eq em{display:block;font-style:normal;font-size:9px;letter-spacing:.14em;
    text-transform:uppercase;color:rgba(242,237,228,.34);margin-bottom:1px}
  .fc-eq .dudoso{font-size:11px;color:var(--laton);opacity:.8;align-self:flex-end}
  .ff{padding:16px 0;border-bottom:1px solid rgba(242,237,228,.07)}
  .ff h4{font-family:var(--disp);font-weight:500;font-size:18px;color:var(--papel);margin:0 0 7px}

<script>
/* ============ Storage (safe: works on Netlify, degrades in preview) ============ */
const store = {
  get(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

/* ============================================================
   IDIOMAS
   Los textos viven en idiomas.json y las recetas traducidas en
   textos.<idioma>.json. Para sumar un idioma basta con agregar
   esos dos bloques: el código no cambia.
   ============================================================ */
const IDIOMAS = [
  {id:'es', nombre:'Español'},
  {id:'en', nombre:'English'},
];
let DICC = null;                 // diccionarios del idioma activo
let TEXTOS = null;               // recetas traducidas del idioma activo

function idiomaGuardado(){
  const g = store.get('rec_idioma', null);
  if (g && IDIOMAS.some(i => i.id === g)) return g;
  const nav = (navigator.language || 'es').slice(0,2).toLowerCase();
  return IDIOMAS.some(i => i.id === nav) ? nav : 'es';
}
let IDIOMA = idiomaGuardado();

/* t('clave') devuelve el texto de interfaz en el idioma activo */
const t = k => (DICC && DICC.ui && DICC.ui[k] !== undefined) ? DICC.ui[k] : k;
/* Traducción de los catálogos cerrados */
const trIng  = id => (DICC && DICC.ing  && DICC.ing[id])  || id;
const trEq   = id => (DICC && DICC.eq   && DICC.eq[id])   || id;
const trCat  = id => (DICC && DICC.cat  && DICC.cat[id])  || id;
const trTec  = v  => (DICC && DICC.tec  && DICC.tec[v] !== undefined) ? DICC.tec[v] : v;
const trPais = v  => (DICC && DICC.pais && DICC.pais[v])  || v;
const trGrupo= v  => (DICC && DICC.grupos && DICC.grupos[v]) || v;
const trFam  = f  => (DICC && DICC.fam && DICC.fam[f]) || FAMCOC[f];
const trUni  = u  => (DICC && DICC.uni && DICC.uni[u] !== undefined) ? DICC.uni[u] : u;
const DIF_K = {'Fácil':'facil','Media':'media','Difícil':'dificil'};
const trDif  = v  => DIF_K[v] ? t(DIF_K[v]) : v;

async function cargarIdioma(id){
  const res = await fetch('idiomas.json', {cache:'no-cache'});
  const todos = await res.json();
  DICC = todos[id] || todos.es;
  TEXTOS = null;
  if (id !== 'es') {
    try{
      const r2 = await fetch('textos.' + id + '.json', {cache:'no-cache'});
      if (r2.ok) TEXTOS = await r2.json();
    }catch(e){ TEXTOS = null; }
  }
}

/* Aplica la traducción de una receta sobre su versión en español.
   La técnica, el país y los insumos se traducen por diccionario,
   así que aquí solo van nombre, pasos y tip:  [name, [pasos], tip]  */
function trReceta(r){
  if (!TEXTOS) return r;
  const x = TEXTOS[r.id];
  if (!x) return r;
  return Object.assign({}, r, {
    name: x[0] || r.name,
    pasos: (x[1] && x[1].length === r.pasos.length)
            ? r.pasos.map((p,i) => p.length > 1 ? [x[1][i], p[1]] : [x[1][i]])
            : r.pasos,
    tip:  x[2] || r.tip,
  });
}

/* ============ Categories ============ */
const CATS_IDS = ['all','desayuno','sopa','carne','ave','pescado','pasta','arroz','veg','postre','pan','bebida','salsa'];
const CATS = CATS_IDS.map(id => ({id, get name(){ return trCat(id); }}));
const catName = id => trCat(id);

/* ============ Seed recipes (escritas de forma original) ============ */
/* ============================================================
   BIBLIOTECA DE RECETAS
   Se cargan desde recetas.json (formato compacto) para que este
   archivo se mantenga liviano. Para agregar recetas, solo se
   reemplaza ese archivo.
   ============================================================ */
let SEED = [];
let PREPS = [];
let BASE = [];              // recetas en español, tal como vienen del archivo
let bibliotecaLista = false;

/* Rearma SEED y PREPS con los textos del idioma activo */
function aplicarIdiomaRecetas(){
  const todas = BASE.map(trReceta);
  SEED  = todas.filter(r => !r.prep);
  PREPS = todas.filter(r =>  r.prep);
}

/* [id,name,cat,pais,tec,min,dif,serv,[eq],[[q,u,ing]],[opt],[[paso,min?]],tip,esReceta] */
function expandir(a){
  return { id:a[0], name:a[1], cat:a[2], pais:a[3], tec:a[4], min:a[5], dif:a[6],
           serv:a[7], eq:a[8], ing:a[9], opt:a[10], pasos:a[11], tip:a[12],
           prep:!a[13], em:'' };
}

async function cargarBiblioteca(){
  try{
    const res = await fetch('recetas.json', {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const datos = await res.json();
    BASE = datos.map(expandir);
    aplicarIdiomaRecetas();
    bibliotecaLista = true;
  }catch(e){
    bibliotecaLista = false;
  }
}

/* ============ State ============ */
let state = {
  cat:'all', q:'', tab:'home',
  favs: store.get('rec_favs', []),
  custom: store.get('rec_custom', []),
  current:null, cookStep:0, timer:null,
};
const allRecipes = () => [...state.custom, ...SEED, ...(typeof PREPS!=='undefined'?PREPS:[])];
const isFav = id => state.favs.includes(id);

/* ============================================================
   IMÁGENES — Pega aquí la foto de cada plato (generada en Gemini).
   Formato:  r1:'data:image/jpeg;base64,XXXXXXXX',
   Deja '' si todavía no la tienes (se muestra el emoji).
   Consejo: redimensiona a ~800px y JPEG ~70% para no inflar el archivo.
   ============================================================ */
/* ============================================================
   FOTOS
   Cada plato busca su foto en  fotos/<id>.jpg  (ej: fotos/c001.jpg).
   Si no existe, se muestra un monograma tipográfico. No hay que
   tocar el código: basta con subir la foto a esa carpeta.
   ============================================================ */
const FOTOS_DIR = 'fotos/';
const fotoDe = r => r && r.id ? FOTOS_DIR + r.id + '.jpg' : '';

/* Monograma + foto encima; si la foto no existe, el monograma queda */
function lienzo(r, clase, tam){
  const ini = (r.name || '?').trim().charAt(0).toUpperCase();
  return '<div class="' + clase + '" style="background:' + tint(r.cat) + ';position:relative;overflow:hidden">' +
    '<span style="font-family:var(--disp);font-weight:500;font-size:' + tam + ';color:var(--laton-osc);opacity:.75">' + ini + '</span>' +
    '<img src="' + fotoDe(r) + '" alt="" aria-hidden="true" loading="lazy" ' +
    'onerror="this.remove()" ' +
    'style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">' +
  '</div>';
}

/* ============ Quantity formatting + scaling ============ */
const FR = {0.25:'¼',0.5:'½',0.75:'¾',0.33:'⅓',0.67:'⅔',0.125:'⅛'};
function fmtQty(n){
  if(n===0) return '';
  const whole = Math.floor(n);
  let frac = +(n-whole).toFixed(2);
  // snap to nearest known fraction
  let best=null,bd=1;
  for(const k in FR){ const d=Math.abs(frac-k); if(d<bd){bd=d;best=k;} }
  if(best && bd<0.06){
    return (whole? whole+' ':'')+FR[best];
  }
  if(n<1) return (+n.toFixed(2)).toString();
  return (+n.toFixed(n<10?1:0)).toString();
}
function scaledIng(ing, base, cur){
  return ing.map(([q,u,name])=>{
    const v = q*(cur/base);
    return {q: fmtQty(v), u: trUni(u), name: (typeof ING!=='undefined' && ING[name]) ? trIng(name) : name};
  });
}

/* ============ Render: chips ============ */
function renderChips(){
  const el = document.getElementById('chips');
  el.innerHTML = CATS.map(c=>
    `<button class="chip ${state.cat===c.id?'on':''}" data-cat="${c.id}">
       <span class="em">${c.em}</span>${c.name}</button>`).join('');
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;renderChips();renderGrid();});
}

/* ============ Render: grid ============ */
function matches(r){
  if(state.tab==='favs' && !isFav(r.id)) return false;
  if(state.cat!=='all' && r.cat!==state.cat) return false;
  if(state.q){
    const q=state.q.toLowerCase();
    const ingNames=r.ing.map(i=>(typeof ING!=='undefined'&&ING[i[2]])?trIng(i[2]):i[2]).join(' ');
    const hay=(r.name+' '+r.pais+' '+(r.tec||'')+' '+ingNames).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function renderGrid(){
  const grid=document.getElementById('grid');
  const count=document.getElementById('count');
  let list=allRecipes().filter(matches);
  count.textContent = list.length? `${list.length} ${list.length>1?t('recetas'):t('receta')}` : '';
  if(!list.length){
    grid.innerHTML='';
    count.innerHTML=`<div class="empty">
      ${state.tab==='favs'?t('sinFavoritos'):t('sinResultados')}</div>`;
    return;
  }
  grid.innerHTML=list.map(r=>`
    <button class="card" data-id="${r.id}">
      ${lienzo(r,'thumb','24px')}
      <div class="body">
        <div class="cat">${catName(r.cat)}</div>
        <h3>${r.name}</h3>
        <div class="meta"><span>${r.min} ${t('min')}</span><span>${r.serv} ${t('porciones')}</span></div>
      </div>
      <span class="fav ${isFav(r.id)?'on':''}" data-fav="${r.id}" role="button" aria-label="Favorito">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9.5-8.5C.5 9 2 5.5 5.5 5.5 8 5.5 12 8 12 8s4-2.5 6.5-2.5C22 5.5 23.5 9 21.5 12.5 19 16.5 12 21 12 21z"/></svg>
      </span>
    </button>`).join('');
  grid.querySelectorAll('.card').forEach(c=>c.onclick=e=>{
    if(e.target.closest('[data-fav]')) return;
    openDetail(c.dataset.id);
  });
  grid.querySelectorAll('[data-fav]').forEach(f=>f.onclick=e=>{e.stopPropagation();toggleFav(f.dataset.fav);});
}
function tint(cat){
  const map={desayuno:'#EFE7D8',sopa:'#E9E2D4',carne:'#E7DCD2',ave:'#EDE5D2',pescado:'#E0E4E0',
    pasta:'#EEE6D4',arroz:'#EBE4D6',veg:'#E2E6DC',postre:'#EDE2DC',pan:'#EBE1CE',bebida:'#E0E6E4',salsa:'#E9DED2'};
  return map[cat]||'#EAE3D6';
}

/* ============ Favorites ============ */
function toggleFav(id){
  if(isFav(id)) state.favs=state.favs.filter(x=>x!==id);
  else state.favs=[...state.favs,id];
  store.set('rec_favs',state.favs);
  renderGrid();
  if(state.current && state.current.id===id) updateHeartTop();
  toast(isFav(id)?t('favAgregada'):t('favQuitada'));
}

function renderIng(flash){
  const r=state.current;
  const list=scaledIng(r.ing,r.serv,state.servNow);
  document.getElementById('ingList').innerHTML=list.map(i=>`
    <div class="ing ${flash?'flash':''}"><span class="q">${i.q} ${i.u}</span><span class="n">${i.name}</span><span class="fill"></span></div>`).join('');
}
function changeServ(d){
  state.servNow=Math.max(1,Math.min(40,state.servNow+d));
  document.getElementById('servNum').textContent=state.servNow;
  document.getElementById('servLbl').textContent=state.servNow+' '+t('personas');
  renderIng(true);
  setTimeout(()=>document.querySelectorAll('.ing').forEach(e=>e.classList.remove('flash')),350);
}
function updateHeartTop(){
  const h=document.getElementById('heartTop'); if(h) h.classList.toggle('on',isFav(state.current.id));
}
function closeDetail(){ document.getElementById('sheet').classList.remove('open'); }

/* ============ Cook mode ============ */
function startCook(){
  state.cookStep=0;
  document.getElementById('cook').classList.add('open');
  renderCook();
}
function renderCook(){
  const r=state.current, steps=r.pasos, i=state.cookStep, p=steps[i];
  clearTimer();
  document.getElementById('cookNo').textContent=`${t('paso')} ${i+1} ${t('de')} ${steps.length}`;
  document.getElementById('cookTx').textContent=p[0];
  document.getElementById('cookDots').innerHTML=steps.map((_,j)=>
    `<span class="${j<i?'done':j===i?'on':''}"></span>`).join('');
  const tBtn=document.getElementById('cookTimerBtn'), tDisp=document.getElementById('cookTimer');
  tDisp.classList.remove('on');
  if(p[1]){
    tBtn.classList.add('show');
    tBtn.textContent=`${t('iniciarTemp')} · ${p[1]} ${t('min')}`;
    tBtn.onclick=()=>runTimer(p[1]*60);
  } else { tBtn.classList.remove('show'); }
  document.getElementById('cookPrev').style.visibility=i===0?'hidden':'visible';
  document.getElementById('cookNext').textContent=i===steps.length-1?t('terminar'):t('siguiente');
}
function runTimer(sec){
  clearTimer();
  const tDisp=document.getElementById('cookTimer'); tDisp.classList.add('on');
  let left=sec;
  const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  tDisp.textContent=fmt(left);
  state.timer=setInterval(()=>{
    left--; tDisp.textContent=fmt(left);
    if(left<=0){ clearTimer(); beep(); tDisp.textContent=t('listo'); }
  },1000);
}
function clearTimer(){ if(state.timer){clearInterval(state.timer);state.timer=null;} }
function beep(){
  try{ const a=new (window.AudioContext||window.webkitAudioContext)();
    const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);
    o.frequency.value=880;g.gain.value=0.15;o.start();
    setTimeout(()=>{o.stop();a.close();},600);
  }catch(e){}
}
document.getElementById('cookClose').onclick=()=>{clearTimer();document.getElementById('cook').classList.remove('open');};
document.getElementById('cookPrev').onclick=()=>{if(state.cookStep>0){state.cookStep--;renderCook();}};
document.getElementById('cookNext').onclick=()=>{
  if(state.cookStep<state.current.pasos.length-1){state.cookStep++;renderCook();}
  else{clearTimer();document.getElementById('cook').classList.remove('open');toast(t('provecho'));}
};

  {id:'pantry',get name(){return t('tabCocino')},svg:'<path d="M5 3v8a4 4 0 008 0V3M9 11v10M17 3c-1.5 2-2 4-2 7v11"/>'},
  {id:'add',get name(){return t('tabAgregar')},add:true,svg:'<path d="M12 5v14M5 12h14"/>'},
  {id:'favs',get name(){return t('tabFavoritos')},svg:'<path d="M12 21s-7-4.5-9.5-8.5C.5 9 2 5.5 5.5 5.5 8 5.5 12 8 12 8s4-2.5 6.5-2.5C22 5.5 23.5 9 21.5 12.5 19 16.5 12 21 12 21z"/>'},
  {id:'mine',get name(){return t('tabMias')},svg:'<path d="M4 5h16M4 12h16M4 19h10"/>'},
];
function renderTabs(){
  const el=document.getElementById('tabbar');
  el.innerHTML=TABS.map(t=>`
    <button class="tab ${t.add?'add':''} ${state.tab===t.id?'on':''}" data-tab="${t.id}">
      ${t.add?`<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">${t.svg}</svg></span>`
             :`<svg viewBox="0 0 24 24" fill="none">${t.svg}</svg>`}
      <span>${t.name}</span></button>`).join('');
  el.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
}
function switchTab(tab){
  if(tab==='add'){ openForm(); return; }
  state.tab=tab; state.cat='all'; state.q='';
  renderTabs();
  if(tab==='pantry'){ renderPantry(); return; }
  // restaurar la estructura normal de la vista
  const wrap=document.querySelector('.wrap');
  if(!document.getElementById('grid')){
    wrap.innerHTML='<div class="count" id="count"></div><div class="grid" id="grid"></div>';
  }
  document.getElementById('q').value='';
  document.querySelector('.topbar').style.display = tab==='mine'?'none':'block';
  document.querySelector('.chips').style.display = (tab==='favs')?'flex':(tab==='mine'?'none':'flex');
  if(tab==='mine') renderMine(); else { renderChips(); renderGrid(); }
  window.scrollTo(0,0);
}

function parseQty(s){ // "2 taza" -> [2,'taza'] ; "harina" handled separately
  s=(s||'').trim(); const m=s.match(/^([\d.,/]+)\s*(.*)$/);
  if(!m) return [1,''];
  let num=m[1].replace(',','.'); if(num.includes('/')){const[a,b]=num.split('/');num=(+a/+b);}
  return [parseFloat(num)||1, m[2]||''];
}
function saveRecipe(){
  const v=id=>document.getElementById(id).value.trim();
  const name=v('f-name');
  if(!name){toast(t('ponleNombre'));return;}
  const ing=[...document.querySelectorAll('#ingRows .dyn-row')].map(r=>{
    const q=r.querySelector('.ig-q').value, n=r.querySelector('.ig-n').value.trim();
    if(!n) return null; const [num,unit]=parseQty(q); return [num,unit,n];
  }).filter(Boolean);
  const pasos=[...document.querySelectorAll('#stepRows .dyn-row')].map(r=>{
    const t=r.querySelector('.st-t').value.trim(), m=parseInt(r.querySelector('.st-m').value);
    if(!t) return null; return m?[t,m]:[t];
  }).filter(Boolean);
  if(!ing.length||!pasos.length){toast(t('minIngPaso'));return;}
  const rec={id:'c'+Date.now(),custom:true,name,cat:v('f-cat'),pais:v('f-pais')||'—',
    min:+v('f-min')||30,dif:v('f-dif'),serv:+v('f-serv')||4,em:v('f-em'),ing,pasos,tip:''};
  state.custom=[rec,...state.custom]; store.set('rec_custom',state.custom);
  document.getElementById('sheet').classList.remove('open');
  switchTab('mine'); toast(t('guardada'));
}
function delRecipe(id){
  state.custom=state.custom.filter(r=>r.id!==id); store.set('rec_custom',state.custom);
  closeDetail(); switchTab('mine'); toast(t('eliminada'));
}

/* ============ Toast ============ */
let toastT;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1900);
}

/* ============ Search ============ */
document.getElementById('q').addEventListener('input',e=>{
  state.q=e.target.value; if(state.tab==='mine'){state.tab='home';renderTabs();} renderGrid();
});

function exigeCoccion(p){
  if(TEC_RAPIDA.includes(p.tec)) return 'rapida';
  if(TEC_LENTA.includes(p.tec) && p.min >= 60) return 'lenta';
  return 'ambos';
}

const CAT_TERMOMETRO = ['carne','ave','pescado'];
function proteinaDe(p, soloPlato){
  // Un flan lleva huevo pero nadie lo pincha con termómetro: en la ficha del
  // plato solo cuenta donde la proteína es el plato.
  if(soloPlato && !CAT_TERMOMETRO.includes(p.cat)) return null;
  const prots = (p.ing||[]).map(i => PROT[i[2]] || PROT[FAMILIA[i[2]]]).filter(Boolean);
  for(const k of ORDEN_PROT){ if(prots.includes(k)) return k; }
  return null;
}
function bloqueTemp(p){
  const k = proteinaDe(p, true); const T = k && TEMP_C[k];
  if(!T) return '';
  const nota = (DICC && DICC.temp && DICC.temp[k]) || '';
  const grados = T.grados || [];
  const nombres = (DICC && DICC.terminos) || [];
  return '<div class="tempcard">' +
    '<div class="tc-k">' + t('tempPlato') + '</div>' +
    '<div class="tc-n">' + T.t + ' °C' +
      (T.reposo ? '<em>' + t('tempReposo').replace('{n}', T.reposo) + '</em>' : '') + '</div>' +
    (nota ? '<p>' + nota + '</p>' : '') +
    (grados.length ? '<div class="tc-g">' + grados.map((g,i) =>
       '<span><em>' + (nombres[i]||'') + '</em>' + g + '</span>').join('') + '</div>' : '') +
    '</div>';
}
function bloqueEspecias(p){
  const k = proteinaDe(p, true); const l = k && ESPECIAS[k];
  if(!l) return '';
  return '<div class="realza"><div class="tc-k">' + t('realzaCon') + '</div><div class="rz">' +
    l.map(s => '<span class="' + (pantry.has(s) ? 'si' : '') + '">' + trIng(s) + '</span>').join('') +
    '</div></div>';
}

/* La yuca entra a una fritura, pero cocida de antes. Avisar, no bloquear. */
function previos(p){
  return (p.ing||[]).map(i=>i[2]).filter(id => PRECOCCION.includes(id));
}
function avisoPrevio(p){
  if(!TEC_RAPIDA.includes(p.tec)) return '';
  const l = previos(p);
  if(!l.length) return '';
  return '<div class="previo">' + t('vanCocidos').replace('{x}', l.map(trIng).join(', ')) + '</div>';
}
function pideCorte(p){
  const llevaCarne = p.ing.some(i => FAM_CARNE.includes(i[2]) || FAM_CARNE.includes(FAMILIA[i[2]]));
  if(!llevaCarne) return '';
  const e = exigeCoccion(p);
  return e === 'ambos' ? '' : e;
}

/* ¿Este corte sirve para esta preparación? */
function cocionCompatible(ingId, p){
  const c = COCCION[ingId];
  if(!c || c === 'ambos') return true;
  const e = exigeCoccion(p);
  return e === 'ambos' || e === c;
}

/* ============================================================
   MOTOR DE COINCIDENCIAS
   ============================================================ */
let gruposAbiertos = new Set();
let pantry = new Set(store.get('rec_pantry', BASICOS));
let equipo = new Set(store.get('rec_equipo', ['estufa','sarten','olla']));

function tengo(id, p){
  if(pantry.has(id) && (!p || cocionCompatible(id, p))) return {ok:true, sust:null};
  // Un corte cubre a su familia, pero solo si su cocción encaja con el plato:
  // tener osobuco no habilita un salteado de 20 minutos.
  for(const x of pantry){
    if(FAMILIA[x] === id && (!p || cocionCompatible(x, p))) return {ok:true, sust:x};
  }
  // Y al revés: la receta pide un corte y tienes la familia genérica
  if(FAMILIA[id] && pantry.has(FAMILIA[id])) return {ok:true, sust:FAMILIA[id]};
  const subs = SUSTITUTOS[id]||[];
  for(const s of subs){
    if(pantry.has(s) && (!p || cocionCompatible(s, p))) return {ok:true, sust:s};
  }
  return {ok:false, sust:null};
}

   No deciden si puedes cocinar, solo afinan el sabor. */
const PRESCINDIBLES = new Set(['agua','hielo','comino','oregano','laurel','canela','curry','paprika',
  'ajipicante','cilantro','perejil','albahaca','guascas','vainilla','pimienta',
  'bicarbonato','levadura','caldo','vinagre','mostaza','azucar','miel','soya']);

function evaluar(p){
  // equipos: si falta alguno, no se puede hacer
  const faltaEq = p.eq.filter(e=>!equipo.has(e));
  const req = p.ing.map(i=>i[2]);
  const falta=[], opcionalFalta=[], sustituciones=[], usa=[];
  req.forEach(id=>{
    const t=tengo(id, p);
    if(t.ok){ usa.push(id); if(t.sust) sustituciones.push([id,t.sust]); }
    else if(PRESCINDIBLES.has(id)) opcionalFalta.push(id);
    else falta.push(id);
  });
  const extras = (p.opt||[]).filter(id=>pantry.has(id));
  const cobertura = usa.length/req.length;
  const score = cobertura*100 + usa.length*4 + extras.length*3
                - opcionalFalta.length*2 - faltaEq.length*100;
  return {p, falta, opcionalFalta, faltaEq, sustituciones, extras, usa, cobertura, score};
}

function buscarPreparaciones(){
  const evaluadas = PREPS.map(evaluar).filter(r=>!r.faltaEq.length);
  const listas = evaluadas.filter(r=>r.falta.length===0).sort((a,b)=>b.score-a.score);
  const cerca  = evaluadas.filter(r=>r.falta.length>0 && r.falta.length<=2)
                          .sort((a,b)=>a.falta.length-b.falta.length || b.score-a.score);
  return {listas, cerca:cerca.slice(0,12)};
}

function calcularRendimiento(){
  const el = document.getElementById('pesoBruto');
  if(!el) return;
  const bruto = parseFloat(el.value);
  document.querySelectorAll('[data-rend]').forEach(fila => {
    const pct = REND[fila.dataset.rend];
    const u = fila.querySelector('.util'), m = fila.querySelector('.merma');
    if(!(bruto > 0)){ u.textContent = '—'; m.textContent = '—'; return; }
    const util = bruto * pct / 100;
    u.textContent = kg(util);
    m.textContent = kg(bruto - util);
  });
}
const kg = n => (n >= 1 ? (+n.toFixed(2)) + ' kg' : Math.round(n * 1000) + ' g');

function listaMaridaje(){
  const car = (DICC && DICC.maridaje) || {};
  // con filtro se busca en todo el catálogo, para que caiga también lo heredado
  const universo = filtroMar
    ? Object.keys(ING).filter(id => trIng(id).toLowerCase().includes(filtroMar) && parejasDe(id))
    : Object.keys(PAREJAS);
  // con el filtro puesto, un insumo sin ninguna pareja audaz no tiene nada que mostrar
  const ids = soloAudaces
    ? universo.filter(id => parejasDe(id).ids.some(c => c[2] === 2))
    : universo;
  if(!ids.length) return '<p class="como">' + t('sinResultados') + '</p>';
  const chip = ([p, tipo, fuerza]) =>
    '<span class="par ' + tipo + (pantry.has(p) ? ' si' : '') + (fuerza === 2 ? ' audaz' : '') + '">' +
      trIng(p) + '</span>';
  return ids.map(id => {
    const d = parejasDe(id);
    return '<div class="item mar"><div class="fila">' +
      '<span class="nombre">' + trIng(id) + '</span>' +
      (pantry.has(id) ? '<span class="coc rapida">' + t('especiasTengo') + '</span>' : '') +
      '</div>' +

      (d.via ? '<p class="heredado">' + t('comoLa').replace('{x}', trIng(d.via)) + '</p>' : '') +
      '<div class="pars">' +
        (soloAudaces ? d.ids.filter(c => c[2] === 2) : d.ids).map(chip).join('') +
      '</div></div>';
  }).join('');
}

/* ============ Ficha: cómo se cocina cada cosa ============ */
function idsDe(g){ return [...g.ids, ...(g.mas||[])]; }
function fichaTiene(g){ return idsDe(g).some(id => COCCION[id] || COCFAM[id]); }
const COC_ETIQ = { rapida:'cocFuego', lenta:'cocTiempo', ambos:'cocAmbas' };

function openFicha(gi){
  const g = GROUPS[gi];
  const ids = idsDe(g);

  // Cortes: cocción y cómo se llaman en otra parte
  const cortes = ids.filter(id => COCCION[id]);
  const orden = { rapida:0, ambos:1, lenta:2 };
  cortes.sort((a,b) => (orden[COCCION[a]] - orden[COCCION[b]]) || trIng(a).localeCompare(trIng(b)));

  const filaCorte = id => {
    const e = EQUIV[id];
    return `<div class="fc">
      <div class="fc-top">
        <b>${trIng(id)}</b>
        <span class="coc ${COCCION[id]}">${t(COC_ETIQ[COCCION[id]])}</span>
      </div>
      ${e ? '<div class="fc-eq">' + e.slice(0,5).map((n,i) =>
          '<span><em>' + PAISES_CORTE[i] + '</em>' + n + '</span>').join('') +
          (e[5] === 0 ? '<span class="dudoso">' + t('variaDesposte') + '</span>' : '') + '</div>' : ''}
      ${MAS_PAISES[id] ? '<div class="mp">' + Object.entries(MAS_PAISES[id]).map(([p,n]) =>
          '<span><em>' + p + '</em>' + n + '</span>').join('') + '</div>' : ''}
    </div>`;
  };

  // Familias de cocción (verduras, granos, legumbres, frutas)
  // El mismo insumo a cuatro fuegos
  const conMetodo = ids.filter(id => DICC && DICC.metodos && DICC.metodos[id]);
  const bloqueMetodo = id => '<div class="ff"><h4>' + trIng(id) + '</h4><div class="met">' +
    DICC.metodos[id].map(m => '<span><em>' + m[0] + '</em>' + m[1] + '</span>').join('') +
    '</div></div>';

  const fams = [];
  ids.forEach(id => { const f = COCFAM[id]; if (f && !fams.includes(f)) fams.push(f); });
  const bloqueFam = f => {
    const info = trFam(f);
    const suyos = ids.filter(id => COCFAM[id] === f).map(trIng).join(' · ');
    return `<div class="ff">
      <h4>${info.t}</h4>
      <p class="como">${info.como}</p>
      <p class="ojo">${info.ojo}</p>
      <p class="quienes">${suyos}</p>
    </div>`;
  };

  document.getElementById('sheetInner').innerHTML = `
    <div class="ficha">
      <button class="back fx" id="fBack"><svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="f-cat">${t('comoSeCocina')}</div>
      <h2>${trGrupo(g.t)}</h2>
      ${cortes.length ? '<div class="f-sec">' + t('porCorte') + '</div>' + cortes.map(filaCorte).join('') : ''}
      ${conMetodo.length ? '<div class="f-sec">' + t('comoSeCocinaIng') + '</div>' + conMetodo.map(bloqueMetodo).join('') : ''}
      ${fams.length   ? '<div class="f-sec">' + t('porFamilia') + '</div>' + fams.map(bloqueFam).join('') : ''}
      <p class="f-pie">${t('fichaPie')}</p>
    </div>`;
  document.getElementById('sheet').classList.add('open');
  document.getElementById('fBack').onclick = closeDetail;
  document.getElementById('sheet').scrollTop = 0;
}

function renderPills(filtro){
  const eq=document.getElementById('eqPills');
  eq.innerHTML=Object.keys(EQUIPOS).map(k=>
    `<button class="pill eq ${equipo.has(k)?'on':''}" data-eq="${k}">${trEq(k)}</button>`).join('');
  eq.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{

    savePantry(); renderPills(filtro);
  });
  document.getElementById('nEq').textContent=equipo.size;

  // Un argentino escribe "bife de chorizo" y debe encontrar la chata.
  const alias = id => { const e = EQUIV[id]; return e ? e.slice(0,5) : []; };
  const aliasQueCalza = id => alias(id).find(n => n.toLowerCase().includes(filtro));
  const pasa = id => !filtro || trIng(id).toLowerCase().includes(filtro) || !!aliasQueCalza(id);
  document.getElementById('groups').innerHTML=GROUPS.map((g,gi)=>{
    const abierto = filtro || gruposAbiertos.has(gi);
    // lo marcado siempre se ve, aunque esté en la parte larga
    const extraVisible = (g.mas||[]).filter(id => abierto || pantry.has(id));
    const ids = [...g.ids, ...extraVisible].filter(pasa);
    const ocultos = (g.mas||[]).filter(id => !abierto && !pantry.has(id) && pasa(id)).length;
    if(!ids.length && !ocultos) return '';
    const n = [...g.ids, ...(g.mas||[])].filter(id=>pantry.has(id)).length;

      <div class="gt">${trGrupo(g.t)} ${n?`<span class="n">${n}</span>`:''}${fichaTiene(g)?`<button class="gi" data-ficha="${gi}" aria-label="${t('comoSeCocina')}">i</button>`:''}</div>
      <div class="pills">${ids.map(id=>
        `<button class="pill ${pantry.has(id)?'on':''}" data-ing="${id}">${trIng(id)}${
           (filtro && !trIng(id).toLowerCase().includes(filtro) && aliasQueCalza(id))
             ? `<i class="aka">${aliasQueCalza(id)}</i>` : ''}</button>`).join('')}

      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('[data-ficha]').forEach(b=>b.onclick=()=>openFicha(+b.dataset.ficha));
  document.querySelectorAll('[data-mas]').forEach(b=>b.onclick=()=>{
    const gi=+b.dataset.mas;
    gruposAbiertos.has(gi) ? gruposAbiertos.delete(gi) : gruposAbiertos.add(gi);
    renderPills(filtro);
  });
  document.querySelectorAll('[data-ing]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.ing; pantry.has(k)?pantry.delete(k):pantry.add(k);
    savePantry(); b.classList.toggle('on');
    actualizarBoton();
    document.querySelectorAll('.pgroup .gt .n').forEach(()=>{});
    renderPills(filtro);
  });
  actualizarBoton();
  pintarSugerencias();
}

/* Una sugerencia tiene que ganarse el puesto: cuántos platos abre de verdad.
   Solo pueden abrirse los que ya están cerca, así que ahí se busca. */
function sugerencias(){
  const yaTieneProteina = [...pantry].some(esProteina);
  const abre = {}, acerca = {};

  PREPS.forEach(p => {
    if (p.eq.some(e => !equipo.has(e))) return;      // sin el equipo no hay plato
    const faltan = [];
    p.ing.map(i => i[2]).forEach(id => {
      if (tengo(id, p).ok) return;
      if (PRESCINDIBLES.has(id)) return;
      faltan.push(id);
    });
    if (!faltan.length || faltan.length > 3) return;
    if (faltan.length === 1) abre[faltan[0]] = (abre[faltan[0]] || 0) + 1;
    else faltan.forEach(id => acerca[id] = (acerca[id] || 0) + 1);
  });

  const puntua = id => {
    const d = parejasDe(id);
    const afin = !d ? 0 : d.ids.filter(c => pantry.has(c[0]))
                             .reduce((n, c) => n + (c[2] === 1 ? 2 : 1), 0);
    return (abre[id] || 0) * 20 + (acerca[id] || 0) * 2 + afin;
  };
  const todos = [...new Set([...Object.keys(abre), ...Object.keys(acerca)])]
    .filter(id => !pantry.has(id))
    .map(id => ({ id, rol: ROL[id], n: abre[id] || 0, pts: puntua(id) }))
    .filter(x => x.pts > 0)
    .sort((a, b) => b.pts - a.pts);

  // Sin proteína no hay plato: eso es lo primero que falta.
  if (!yaTieneProteina) {
    const prot = todos.filter(x => x.rol === 'proteina').slice(0, 5);
    return prot.length ? [{ rol: 'proteina', items: prot }] : [];
  }

  // Con la proteína puesta, lo que falta es con qué acompañarla y con qué salsearla.
  const de = (...roles) => todos.filter(x => roles.includes(x.rol)).slice(0, 4);
  const g = de('guarnicion');
  const sz = de('salsa', 'aromatico', 'acido', 'grasa');
  const out = [];
  if (g.length)  out.push({ rol: 'guarnicion', items: g });
  if (sz.length) out.push({ rol: 'sazon', items: sz });
  return out;
}

function md(t){  // Markdown mínimo → HTML (seguro: escapa primero)
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc(t)
    .replace(/^## (.+)$/gm,'<h4 style="font-family:var(--disp);font-size:17px;margin:18px 0 6px">$1</h4>')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')

/* El chef no debe improvisar: va con las mismas reglas que ve el cocinero
   en pantalla — qué papel juega cada insumo, qué parejas hay entre lo que
   tiene y por qué funcionan, y las bases de la casa. */
function contextoIA(){
  const ETIQ = { puente:'comparten aroma', refuerzo:'profundiza', corte:'corta la grasa',
                 contraste:'contrasta', tradicion:'pareja de siempre', casa:'de la casa' };
  const marcados = [...pantry];

  const porRol = {};
  marcados.forEach(i => { const r = ROL[i] || 'otro'; (porRol[r] = porRol[r] || []).push(trIng(i)); });
  const roles = ['proteina','guarnicion','salsa','aromatico','acido','grasa']
    .filter(r => porRol[r]).map(r => t('rolCorto_' + r) + ': ' + porRol[r].join(', ')).join(' | ');

  // Parejas entre lo que ya tiene: ahí es donde se construye el plato.
  const dentro = [], vistas = new Set();
  marcados.forEach(a => {
    const d = parejasDe(a); if(!d) return;
    d.ids.forEach(([b, tipo]) => {
      if(!pantry.has(b)) return;
      const k = [a,b].sort().join('|'); if(vistas.has(k)) return; vistas.add(k);
      dentro.push(trIng(a) + ' + ' + trIng(b) + ' (' + (ETIQ[tipo]||tipo) + ')');
    });
  });

  // Y lo que le falta, por si vale la pena mandarlo a comprar.
  const fuera = {};
  marcados.forEach(a => {
    const d = parejasDe(a); if(!d) return;
    d.ids.forEach(([b, , fuerza]) => {
      if(pantry.has(b) || ROL[b] === 'base') return;
      fuera[b] = (fuera[b] || 0) + (fuerza === 1 ? 2 : 1);
    });
  });
  const faltan = Object.entries(fuera).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>trIng(x[0]));

  const D = (DICC && DICC.bases) || {};
  const bases = BASES.map(x => { const d = D[x.id]; if(!d) return '';
    return d.n + ' = ' + (d.comp||[]).map((c,i) =>
      c.n + ' (' + (x.comp[i]||[]).map(trIng).join(' + ') + ')').join(' // ');
  }).filter(Boolean).join(' ; ');

  return {
    roles,
    maridaje: dentro.slice(0, 60).join(' ; '),
    faltan: faltan.join(', '),
    bases,
    idioma: IDIOMA,
  };
}

async function pedirIA(){
  const out=document.getElementById('aiOut'), btn=document.getElementById('aiBtn');
  const lista=[...pantry].map(i=>trIng(i)).join(', ');
  const eqs=[...equipo].map(e=>trEq(e)).join(', ');
  if(!lista){ out.textContent=t('marcaAlgunos'); return; }
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> '+t('pensando'); out.textContent='';
  try{
    const res=await fetch(AI_ENDPOINT,{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({ingredientes:lista,equipos:eqs}, contextoIA()))});
    const data=await res.json().catch(()=>({}));
    if(!res.ok || data.error){
      out.textContent = data.error || `El servidor respondió ${res.status}.`;
    } else if(data.texto){
      out.innerHTML = md(data.texto);
    } else {
      out.textContent = t('errorCarga');
    }
  }catch(e){
    out.textContent='No se pudo conectar. Si estás abriendo el archivo localmente, esto solo funciona una vez publicado en Netlify.';
  }
  btn.disabled=false; btn.textContent=t('proponer');
}

/* ============ Textos de interfaz en el marcado ============ */
function pintarTextos(){
  const q = document.getElementById('q');
  if (q) q.placeholder = t('buscar');
  const tit = document.getElementById('tituloCarta');
  if (tit) tit.textContent = t('carta');
  const lb = document.getElementById('langBtn');
  if (lb) lb.textContent = IDIOMA.toUpperCase();
  document.documentElement.lang = IDIOMA;
}

async function cambiarIdioma(id){
  IDIOMA = id;
  store.set('rec_idioma', id);
  await cargarIdioma(id);
  aplicarIdiomaRecetas();
  pintarTextos();
  renderTabs();
  if (state.tab === 'pantry') renderPantry();
  else { renderChips(); state.tab==='mine' ? renderMine() : renderGrid(); }
  toast(IDIOMAS.find(i=>i.id===id).nombre);
}

function menuIdioma(){
  const i = IDIOMAS.findIndex(x => x.id === IDIOMA);
  cambiarIdioma(IDIOMAS[(i + 1) % IDIOMAS.length].id);
}

/* ============ Init ============ */
document.getElementById('count').innerHTML =
  '<div class="empty" style="padding:50px">…</div>';

Promise.all([cargarIdioma(IDIOMA), cargarBiblioteca()]).then(() => {
  aplicarIdiomaRecetas();   // ambos ya llegaron: recién aquí se puede traducir
  pintarTextos();
  renderChips();
  renderTabs();
  document.getElementById('langBtn').onclick = menuIdioma;
  document.getElementById('fichasBtn').onclick = () => openFichas();
  if (bibliotecaLista) {
    renderGrid();
  } else {
    document.getElementById('count').innerHTML =
      '<div class="empty" style="padding:40px">' + t('errorCarga') + '<br>' + t('errorCargaSub') + '</div>';
  }
}).catch(() => {
  document.getElementById('count').innerHTML =
    '<div class="empty" style="padding:40px">No se pudo cargar la app.<br>Revisa que idiomas.json y recetas.json estén publicados.</div>';
});
</script>
