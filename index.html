const SUST = {"papelarroz":[["lechuga","papel","La hoja de lechuga envuelve y se come fresca, y en Vietnam se usa así de verdad; pero no se pega ni se estira, así que el rollito queda abierto."],["masawanton","apuro","Sirve si los vas a freír, pero no para los rollitos frescos: la masa de wantán cruda no se come."]],"pastamiso":[["soya","papel","Da el salado y parte del umami, pero NO el cuerpo ni la fermentación láctea del miso: la sopa queda clara y plana en vez de turbia y redonda. Si cambias, usa la mitad de volumen y acepta que es otra sopa."],["tahini","apuro","Una cucharada de tahini con salsa de soya imita el cuerpo cremoso y el fondo tostado. Es el apaño conocido y funciona mejor de lo que parece, pero no sabe a miso."]],"salsaostras":[["soya","papel","Lo más parecido que hay en una cocina normal: el salado es el mismo, pero falta el dulzor y el cuerpo espeso. Mezclada con una pizca de panela se acerca bastante."],["hoisin","familia","Es la otra salsa espesa china y también da cuerpo, pero es mucho más dulce y especiada: cambia el plato hacia lo dulce."]],"melazagranada":[["tamarindo","papel","Es el reemplazo más cercano: igual de ácido y oscuro, aunque sin el perfume afrutado de la granada. Mezclado con una pizca de panela se acerca bastante."],["balsamico","apuro","Da el ácido y el color pero es mucho más dulce y sabe a uva; hay que usar menos y aceptar que el plato cambia."]],"granada":[["uva","papel","Para decorar y dar el estallido dulce; no tiene la acidez ni el crujido del grano de granada."],["melazagranada","familia","Es la misma fruta concentrada: da el sabor pero no el grano, que es la mitad de la gracia."]],"filo":[["hojaldre","papel","Hornea parecido pero es otra cosa: el hojaldre sube en capas de mantequilla y la filo se queda en láminas finísimas y quebradizas."],["masawanton","apuro","Es igual de fina y sirve para fritos pequeños; para baklava queda demasiado gruesa y pesada."]],"hojaparra":[["repollo","papel","La hoja de repollo escaldada envuelve igual de bien; falta la acidez de la salmuera y el punto amargo."],["acelga","apuro","Se usa en Líbano para los mismos rellenos; es más frágil y hay que doblarla con cuidado."]],"mentaseca":[["hierbabuena","familia","Es la misma planta fresca, pero NO es lo mismo: la seca es más concentrada y menos perfumada, y va al guiso mientras la fresca va al final. Si cambias, usa el triple de fresca."],["oregano","apuro","Otra hierba seca que aguanta el calor, con un perfil muy distinto."]],"curry":[["garammasala","papel","No es lo mismo: el garam masala es una mezcla india de especias cálidas que va al FINAL del plato, y el curry en polvo es una mezcla británica que va al principio. Cambiarlos cambia el plato."],["curcuma","apuro","La cúrcuma es solo una de las especias que lleva la mezcla, y es la que le da el color amarillo. Sola no da el resto."]],"hojacurry":[["","papel","No tiene reemplazo. La hoja de curry no se parece ni al laurel ni a la albahaca ni al curry en polvo, que es otra cosa por completo. Si no la consigues, haz el plato sin ella y acepta que le falta esa capa: es más honesto que poner algo que sabe distinto."],["laurel","apuro","Solo para que la grasa tenga algo aromático mientras se calienta. No sabe igual ni de lejos, y conviene saberlo."]],"asafetida":[["ajopolvo","papel","La asafétida da un fondo entre ajo y cebolla que aparece al freírse. Una pizca de ajo en polvo con otra de cebolla en polvo se le acerca algo."],["ajo","apuro","El ajo fresco cumple a medias; en los dals de la India sin cebolla ni ajo, la asafétida es justo lo que los reemplaza."]],"fenogreco":[["mostazagrano","papel","Otro grano que se tuesta y amarga parecido, aunque el fenogreco tiene un fondo a nuez y a jarabe que nada más tiene."],["apio","apuro","Las hojas secas de fenogreco se parecen vagamente al apio seco; es un reemplazo de emergencia y se nota."]],"chilekashmiri":[["paprika","papel","Es el reemplazo más fiel: da el color rojo intenso sin picar casi nada, que es exactamente para lo que sirve el cachemir."],["chileancho","familia","Otro chile seco de color y poco picante, algo más frutal y oscuro."]],"paneer":[["quesocampesino","papel","Un queso fresco firme que no se derrite: es el más parecido que hay en Colombia y funciona bien."],["cuajada","familia","Se hace igual, cortando leche con ácido; hay que prensarla más para que aguante la sartén."]],"lentejaroja":[["lenteja","familia","La lenteja parda sirve pero NO se deshace igual: la roja se convierte en puré en veinte minutos y la parda queda entera."],["arvejaseca","papel","También se deshace y hace una crema parecida, con otro sabor y más tiempo de cocción."]],"guanciale":[["cerdo_panceta","familia","El tocino de panceta es el reemplazo real y el que casi todos usan; el guanciale es más dulce y su grasa se funde más limpia."],["tocino","apuro","El tocino ahumado cumple, pero el humo no está en ninguna de las tres pastas romanas y se nota."]],"pecorino":[["parmesano","papel","Es el cambio de siempre, pero el pecorino es de oveja: más salado y con un punto picante. Si usas parmesano, sala menos."],["quesomanchego","familia","También de oveja y curado, bastante cercano en sal y en carácter."]],"mascarpone":[["quesocrema","papel","Lo más parecido que se consigue; es más ácido, así que conviene batirlo con un poco de crema."],["requeson","apuro","Mucho más granuloso: hay que colarlo y batirlo mucho para que no quede arenoso."]],"marsala":[["vinojerez","familia","Otro vino fortificado y oxidado: es el reemplazo más fiel que hay."],["vino","apuro","Le falta el dulzor y el cuerpo; agregar una cucharadita de azúcar acerca un poco."]],"arrozbomba":[["arrozarborio","familia","Absorbe parecido pero suelta más almidón: queda cremoso en vez de suelto."],["arroz","apuro","El de grano largo no absorbe el caldo igual y la paella queda seca por dentro."]],"pimientochoricero":[["chileancho","papel","Parecido en dulzor y cuerpo; el ancho es algo más frutal y menos terroso."],["paprika","apuro","Da el color pero no la pulpa, que es lo que espesa la salsa vizcaína."]],"nora":[["pimientochoricero","familia","Casi el mismo pimiento seco, algo más grande y menos concentrado."],["chileancho","papel","Mismo registro dulce y sin picante; cambia un poco el perfume."]],"tintacalamar":[["chipiron","papel","La bolsa de tinta de los chipirones frescos: es la misma tinta, hay que extraerla."],["salsapescado","apuro","Aporta el yodado pero ni el color negro ni el cuerpo."]],"fabes":[["frijol","familia","Otro poroto blanco; la faba es más grande y de piel más fina, y se deshace menos."],["garbanzo","papel","Aguanta la cocción larga, con otra textura y otro sabor."]],"vinagrejerez":[["vinagre","familia","Más plano y más agresivo; el de Jerez tiene un fondo dulce de madera."],["balsamico","apuro","Mucho más dulce y oscuro: cambia el color de un gazpacho."]],"vinojerez":[["vinoblanco","papel","Falta el fondo oxidado y a frutos secos que define al Jerez."],["brandy","apuro","Mucho más fuerte: usar un tercio de la cantidad."]],"sidra":[["vinoblanco","papel","Falta el dulzor de manzana y la acidez particular de la sidra."],["vinagremanzana","apuro","Da el sabor a manzana pero mucho más ácido: rebajar con agua."]],"quesomanchego":[["parmesano","papel","Igual de seco y salado para rallar, con otro sabor."],["quesocosteno","familia","Salado y firme, bastante parecido para una tabla."]],"pinon":[["almendra","familia","Otro fruto seco de la misma cocina; menos mantecoso y más crujiente."],["ajonjoli","apuro","Aporta grasa y tostado, con un sabor bastante distinto."]],"chipiron":[["calamar","mismo","Es el mismo animal, solo que pequeño: el calamar grande hay que cortarlo."],["pulpo","papel","Mucho más firme y pide cocción larga, al revés del chipirón."]],"setas":[["champinon","familia","El champiñón cultivado: más suave y con más agua, sin el sabor de monte."],["champinonlata","apuro","Ya cocido y con agua: hay que escurrirlo y dorarlo aparte."]],"rape":[["merluza","familia","Blanco y fino, aunque se deshace mucho más que el rape."],["pescado","papel","Cualquier blanco firme cumple; el rape es el más firme de todos."]],"carrillera":[["res_osobuco","papel","Mismo colágeno y misma cocción larga, con hueso y menos carne."],["res_morrillo","familia","Corte guisero parecido; algo más fibroso y menos gelatinoso."]],"chufa":[["almendra","papel","Da una horchata buena pero distinta: la de chufa es más terrosa."],["arroz","apuro","Es la horchata mexicana, que es otra bebida con el mismo nombre."]],"piquillo":[["pimenton","familia","El morrón asado y pelado cumple; el piquillo es más dulce y algo picante."],["pimentonamarillo","papel","Mismo papel, con menos dulzor y sin el toque picante."]],"boqueron":[["sardina","familia","Otro pescado azul pequeño, más graso y de sabor más fuerte."],["anchoa","papel","Es el mismo pez pero curado en sal: mucho más salado y sin frescura."]],"chileancho":[["chilemulato","familia","Casi el mismo chile: el mulato es más oscuro y achocolatado, el ancho más frutal."],["guajillo","papel","Da color y acidez pero no el dulzor ni el cuerpo del ancho."]],"chilemulato":[["chileancho","familia","El hermano del mulato: igual de dulce, algo más frutal y menos achocolatado."],["chilepasilla","papel","Más seco y con sabor a pasa; oscurece parecido pero pica un poco más."]],"chilepasilla":[["chilemulato","familia","Otro chile oscuro de mole, más dulce y menos ahumado."],["chileancho","papel","Más dulce y menos picante: cambia el equilibrio pero sirve."]],"chilearbol":[["ajipicante","papel","Pica parecido pero aporta humedad y no el tostado del chile seco."],["hojuelasaji","apuro","Mismo picante seco, sin el sabor tostado que da freír el chile entero."]],"chilemorita":[["chipotle","mismo","Es el mismo jalapeño ahumado: el chipotle es más grande y el morita más frutal."],["chilearbol","papel","Pica igual o más, sin nada del ahumado que define al morita."]],"chileserrano":[["jalapeno","familia","Pica menos y tiene más carne; hay que usar más cantidad."],["ajipicante","papel","Pica parecido pero cambia el sabor fresco y herbal del serrano."]],"chilepoblano":[["pimenton","papel","Misma carnosidad para rellenar, sin nada del picante ni del sabor del poblano."],["jalapeno","apuro","Mucho más chico y más picante: sirve para rajas, no para rellenar."]],"masaharina":[["harinamaiz","apuro","No es lo mismo: sin nixtamalizar no liga y la tortilla se quiebra."],["tortillamaiz","papel","Hechas y molidas sirven para espesar, no para formar masa."]],"epazote":[["cilantro","papel","Sabor distinto por completo, pero cumple el papel de hierba fresca del final."],["oregano","apuro","Seco y mediterráneo; es lo que se usa cuando no hay epazote."]],"naranjaagria":[["naranja","papel","Hay que corregir con limón: dos de naranja por uno de limón imita la acidez."],["limon","apuro","Mucho más ácido y sin el amargor de la cáscara: usar la mitad."]],"quesooaxaca":[["mozzarella","mismo","Es prácticamente el mismo queso de pasta hilada: funde igual."],["quesocampesino","apuro","No hila ni funde parejo, pero sirve donde el queso va en trozos."]],"quesocotija":[["parmesano","papel","Igual de salado y seco, con otro sabor; se ralla y se espolvorea igual."],["quesocosteno","familia","Salado y desmoronable, muy parecido en papel y textura."]],"nopal":[["habichuela","papel","Textura y acidez vegetal parecidas una vez cocida, sin la baba característica."],["calabacin","apuro","Aporta humedad y verdura, sin la acidez del nopal."]],"flordecalabaza":[["espinaca","papel","Se marchita igual y rellena parecido, con sabor más mineral."],["champinon","apuro","Otro relleno suave de quesadilla, con sabor muy distinto."]],"jamaica":[["mora","papel","Da color y acidez parecidos en una bebida, con sabor a fruta."],["tamarindo","apuro","Ácido y oscuro, pero mucho más denso y con otro perfil."]],"chorizomex":[["chorizo","familia","El curado español no se desmorona: hay que picarlo y suelta menos grasa."],["carne_molida","papel","Con pimentón, vinagre y ajo se parece bastante al mexicano crudo."]],"tequila":[["mezcal","familia","El mismo agave, pero el mezcal es ahumado y cambia el trago."],["ron","apuro","Dulce y sin el sabor de agave: cambia la bebida, no la reemplaza."]],"mezcal":[["tequila","familia","Mismo agave sin el ahumado, que es justo lo que define al mezcal."],["whisky","apuro","Comparte el registro ahumado, con un sabor completamente distinto."]],"hojaaguacate":[["laurel","papel","Otra hoja aromática que se retira; no da el anisado de la hoja de aguacate."],["anis","apuro","Imita el anisado, que es lo principal que aporta la hoja."]],"hojamaiz":[["hojaplatano","papel","Envuelve igual y aguanta más, pero perfuma distinto y el tamal cambia."],["chala","mismo","Es la misma hoja de maíz, fresca en vez de seca: hay que hervirla menos."]],"cal":[["bicarbonato","apuro","Ablanda el grano pero no nixtamaliza: la masa no va a ligar igual."],["masaharina","papel","Comprar la masa ya nixtamalizada evita el paso de la cal por completo."]],"harinagarbanzo":[["harina","papel","Cambia el plato: sin el sabor a garbanzo, el fainá deja de serlo."],["harinamaiz","apuro","Da una masa parecida de textura, con sabor a maíz en vez de garbanzo."]],"helado":[["crema","papel","Batida y azucarada cumple en los postres fríos, sin el frío del helado."],["yogur","apuro","Mucho más ácido y menos graso; cambia bastante el postre."]],"res_vacio":[["res_falda","familia","Mismo lugar del animal y misma fibra larga; es el nombre colombiano del corte."],["res_sobrebarriga","papel","Más gruesa y con más nervio: aguanta la parrilla pero pide más tiempo."]],"res_tira":[["costilla","mismo","Es la misma costilla de res, solo que cortada a lo largo del hueso en vez de atravesada."],["cerdo_costilla","papel","Se asa parecido, con menos tiempo y sabor más dulce."]],"res_matambre":[["res_sobrebarriga","familia","La lámina más parecida que hay: se arrolla y se brasea igual."],["res_falda","papel","Más corta y más gruesa, sirve arrollada aunque no se estire tanto."]],"res_bifechorizo":[["res_lomoancho","familia","El mismo lomo, cortado en bife grueso con su tapa de grasa."],["res_chatas","papel","Mismo músculo y mismo punto; el corte es algo más delgado."]],"res_colita":[["res_puntaanca","mismo","Es el mismo corte con otro nombre: la punta del cuadril."],["res_cadera","familia","Vecino y magro; pide cuidado para no pasarlo de punto."]],"res_molleja":[["pollo_molleja","papel","Nada que ver en textura: la de res es cremosa y la de pollo es músculo firme."],["res_corazon","apuro","Otra achura de parrilla, mucho más magra y con sabor fuerte."]],"res_chinchulin":[["res_mondongo","familia","Otra tripa: se limpia igual y pide la misma cocción previa."],["res_molleja","papel","La otra achura imprescindible, de textura opuesta."]],"cabrito":[["cordero","familia","La carne más parecida; algo más grasa y con sabor más marcado."],["cordero_pierna","papel","Para el asado entero, la pierna sola cumple el mismo papel."]],"ciervo":[["res_lomoancho","papel","Magro y de fibra fina parecida, sin el sabor de monte."],["cordero_lomo","apuro","Más graso; pide menos cocción para no pasarse."]],"surubi":[["bagre","mismo","El surubí es un bagre de río: misma carne firme y sin espinas finas."],["pescado","papel","Blanco y firme, aunque con menos sabor de río."]],"pacu":[["bagre","familia","Otro pescado de río de carne grasa; el pacú tiene espinas en Y."],["tilapia","apuro","Mucho más magro y neutro; conviene reforzar la grasa de la receta."]],"centolla":[["cangrejo","familia","La misma carne dulce de crustáceo, en patas más pequeñas."],["langostino","papel","Dulzor parecido y mucho menos trabajo para sacar la carne."]],"ricota":[["requeson","mismo","Es prácticamente lo mismo: cuajada fresca y escurrida."],["quesocampesino","papel","Hay que procesarlo y escurrirlo, pero rellena igual."]],"ajimolido":[["paprika","papel","Da el color pero no el picante ni los trozos de semilla."],["ajipicante","apuro","Pica más y aporta humedad: usar la mitad."]],"peperina":[["hierbabuena","papel","De la misma familia mentolada; es el reemplazo que usan en el Centro."],["oregano","apuro","Otra cosa, pero funciona donde la peperina va seca y en infusión."]],"yerbamate":[["te","papel","Otra infusión amarga con cafeína; cambia el sabor por completo."],["cafe","apuro","Solo sirve para el mate cocido, no para el mate cebado."]],"grasapella":[["manteca","mismo","Es grasa animal de cerdo en vez de res; en masas da el mismo resultado."],["mantequilla","papel","Sabor distinto y más agua: la masa queda menos hojaldrada."]],"chala":[["hojaplatano","papel","Otra envoltura que no se come; aguanta más calor y perfuma distinto."],["hojasbijao","apuro","Envuelve igual, aunque es más rígida y cuesta amarrarla."]],"algarroba":[["harina","papel","Pierde el dulzor y el sabor tostado propios de la algarroba."],["chocolate","apuro","El parecido es de color y amargor, no de sabor."]],"fernet":[["brandy","papel","Otro destilado de sobremesa, dulce en vez de amargo de hierbas."],["anis","apuro","Comparte el registro herbal, pero es dulce y anisado."]],"linaza":[["chia","papel","Forma el mismo gel al remojarse y sirve igual de espesante."],["ajonjoli","apuro","Aporta grasa y sabor tostado, pero no hace gel."]],"vieira":[["mejillon","familia","Otro molusco de valva, más barato y con más sabor a mar."],["camaron","papel","Dulce parecido y aguanta el mismo tiempo corto de cocción."]],"mejillon":[["almeja","familia","Mismo molusco de valva; se abre igual y pide el mismo cuidado."],["vieira","papel","Más suave y más cara; sirve donde el chorito va desconchado."]],"cangrejo":[["langostino","papel","Dulzor parecido y mucho menos trabajo para comerlo."],["camaron","apuro","Más neutro: pide reforzar el aderezo para compensar."]],"pato":[["gallina","familia","Ave de carne firme que aguanta la misma cocción larga."],["pollo_muslo","apuro","Mucho menos grasa y sabor; se hace en la mitad del tiempo."]],"gallina":[["pollo_entero","familia","Más tierno y con menos sabor: pide la mitad de cocción."],["pato","papel","Carne firme parecida, bastante más grasa."]],"pollo_entero":[["gallina","familia","Más dura y más sabrosa: necesita el doble de cocción."],["pollo_muslo","papel","Solo la parte jugosa, sin la pechuga que se seca."]],"cerdo_patita":[["cerdo_espinazo","familia","Da la misma gelatina al caldo, con más carne y menos cuero."],["res_rabo","papel","Mismo papel gelatinoso, con sabor a res en vez de cerdo."]],"pollo_molleja":[["pollo_menudencia","familia","Viene surtida: trae mollejas pero también hígado y corazón."],["res_corazon","papel","Textura firme parecida, aunque mucho más grande y con otro sabor."]],"res_rinon":[["res_corazon","familia","Otra víscera firme, sin el sabor amoniacal que hay que desaguar."],["higado","papel","Más blando y más mineral; se cocina en la mitad del tiempo."]],"res_bofe":[["res_corazon","papel","Más firme y sin la esponjosidad del bofe, que es lo que define la chanfainita."],["higado","papel","Se deshace más y amarga un poco; pide menos cocción."]],"masawanton":[["masafilo","apuro","Mucho más delgada y quebradiza: sirve frita pero no aguanta la sopa."],["harina","papel","Se puede hacer la masa en casa con harina, huevo y agua."]],"papaseca":[["chuno","familia","También es papa deshidratada, pero el chuño es esponjoso y la papa seca granulada; cambia la textura."],["papa","apuro","Hace un guiso de papa, no una carapulcra: le falta justo la textura que da el secado."]],"res_corazon":[["carne_res","papel","Hace un anticucho bueno pero distinto: le falta la textura firme y el sabor mineral del corazón."],["res_lengua","familia","Otra víscera de textura firme, aunque mucho más grasa y más larga de cocinar."],["res_falda","papel","Aguanta bien el adobo y la brasa; queda más fibrosa."]],"ajimirasol":[["ajiamarillo","mismo","Es el mismo ají, fresco en vez de seco: menos concentrado y sin el tostado."],["ajipanca","familia","Más oscuro y ahumado, menos frutal; cambia el color del plato."]],"ajicharapita":[["habanero","papel","Pica parecido pero sin el perfume cítrico, que es lo que la distingue."],["ajipicante","apuro","Mucho menos aroma; sirve solo para el picante."]],"huacatay":[["hierbabuena","papel","Lo más cercano que se consigue fuera de Perú, pero más dulce y menos resinoso."],["albahaca","apuro","Otro perfume por completo; úsalo sabiendo que ya no es ocopa."]],"chincho":[["huacatay","familia","Primo cercano y el reemplazo natural: algo más suave."],["hierbabuena","papel","Más dulce y sin el amargo verde del chincho."]],"palillo":[["curcuma","mismo","Es prácticamente lo mismo: color amarillo y amargo suave."],["achiote","papel","Da color pero anaranjado, no amarillo, y con otro sabor."]],"sachaculantro":[["cilantro","papel","Mucho más suave: para un juane hay que poner casi el doble."],["cilantrocimarron","mismo","Es la misma hoja ancha y dentada, con otro nombre."]],"choclo":[["maiz","familia","Grano mucho más pequeño y más dulce; el choclo peruano es harinoso y grande."],["maiztierno","familia","Más dulce todavía; cambia el equilibrio del plato."]],"cancha":[["maizpozolero","papel","Revienta distinto: queda blando en vez de crocante."],["mani","apuro","Acompaña igual al cebiche pero no es lo mismo ni de cerca."]],"maizmorado":[["mora","papel","Da color morado a una bebida, pero sin el sabor a maíz tostado."],["maiz","apuro","Pierde todo el color, que es el punto de la chicha morada."]],"pallar":[["haba","familia","Parecida en textura, algo más terrosa y con piel más gruesa."],["frijol","papel","Más firme y tiñe el caldo; el pallar se deshace cremoso."]],"tarwi":[["haba","papel","Mucho menos proteína y sin el amargo característico ya desaguado."],["garbanzo","papel","Más firme; sirve en ensaladas pero no en un cebiche de chocho."]],"kiwicha":[["quinua","familia","Grano más grande y menos pegajoso al cocinar."],["canihua","familia","Casi el mismo uso, con grano todavía más pequeño."]],"canihua":[["quinua","familia","Más grande y más neutra; la cañihua es más tostada de sabor."],["kiwicha","familia","Mismo tamaño pequeño y mismo uso en harinas."]],"maca":[["avena","apuro","Solo sirve para dar cuerpo a una bebida; no aporta el sabor terroso."]],"papaamarilla":[["papacriolla","mismo","Es prácticamente la misma papa: amarilla, harinosa y se deshace."],["papa","papel","Más firme y menos dulce: para una causa hay que machacarla más."]],"chuno":[["papa","papel","Es papa, pero fresca: le falta la textura esponjosa y el sabor del chuño."]],"olluco":[["papa","papel","El olluco no se deshace nunca y la papa sí; es justo lo contrario."],["oca","familia","Mismo tubérculo andino y misma firmeza."]],"oca":[["olluco","familia","Mismo grupo andino; la oca es dulce y el olluco no."],["batata","papel","Dulce como la oca pero más blanda y más fibrosa."]],"mashua":[["oca","familia","Parecida en textura, pero la mashua es picantita y la oca dulce."],["nabo","papel","Ese punto picante se parece, aunque la textura no."]],"limonsutil":[["limon","familia","El limón común es menos ácido y menos perfumado; para un cebiche hay que poner más."],["lima","familia","Lo más cercano que hay: pequeño, muy ácido y aromático."]],"lucuma":[["batata","apuro","Un dulzor parecido a caramelo, pero sin el perfume de la lúcuma."],["ahuyama","apuro","Color y cuerpo parecidos, sabor no."]],"camucamu":[["limon","papel","Igual de ácido, mucho menos perfumado."],["maracuya","papel","Ácido y aromático; el más cercano de los que se consiguen."]],"chirimoya":[["pera","apuro","Textura blanda parecida, sin el perfume."]],"membrillo":[["manzana","familia","Se cocina parecido pero sin la pectina ni el perfume del membrillo."],["guayaba","papel","También cuaja bien en dulces, con otro sabor."]],"aguaje":[["batata","apuro","Solo se parece en el color y en el cuerpo graso."]],"cuy":[["conejo","papel","Es el reemplazo clásico: carne magra, de hueso fino y tamaño parecido."],["pollo","apuro","Mucho más blando y sin el sabor de caza; cambia el plato."]],"alpaca":[["carne_res","papel","Más grasa que la alpaca, que es muy magra y se seca rápido."],["cordero","familia","Del mismo mundo andino; más grasa y más sabor fuerte."]],"paiche":[["bagre","papel","Carne compacta y sin espinas finas, que es lo que se busca."],["pescado","papel","Cualquier filete grueso y firme sirve."]],"pejerrey":[["sardina","familia","Pequeño y graso igual; la espina se come en los dos."],["mojarra","papel","Más espinudo pero del mismo tamaño para freír."]],"cecina":[["tocino","papel","Mucha más grasa y sin el ahumado seco de la cecina."],["jamonserrano","papel","Curado y salado parecido, pero se come crudo."]],"castana":[["nuez","familia","Grasa parecida y mismo uso; la castaña es más mantecosa."],["maranon","familia","Más dulce y menos grasa."]],"pisco":[["brandy","papel","Es la uva destilada más cercana; menos aromático y con madera."],["ron","apuro","Cambia el trago por completo: dulce y de caña, no de uva."]],"chichajora":[["cerveza","papel","Fermentada de cereal igual; menos ácida y sin el dulzor del maíz."],["vinoblanco","apuro","Solo sirve para el ácido en un guiso, no para beber."]],"bicarbonatosodio":[["bicarbonato","apuro","No es lo mismo: el polvo de hornear ya trae ácido y no sube el pH igual."]],"chunchullo":[["morcilla","papel","Otra pieza de fritanga, pero blanda: no da lo crocante."],["cerdo_chicharron","papel","Queda crocante igual, aunque es grasa y no víscera."]],"sangre":[["morcilla","papel","Ya viene rellena y cocida: sirve para el sabor, no para armar la morcilla."]],"papayuela":[["papaya","familia","Mucho más dulce y blanda: hay que bajarle la panela y el tiempo."],["guayaba","papel","Otro dulce distinto, más perfumado y con semilla."]],"lisa":[["mojarra","familia","Menos grasa y menos sabor a río."],["bocachico","familia","Igual de espinudo y del mismo río."],["pescado","papel","En filete pierde la gracia: la lisa se usa entera y con sus huevas."]],"gaseosa":[["cerveza","papel","Es la otra mitad del refajo: con las dos se hace, co /* Un insumo sin tabla propia hereda la de su familia o la de su proteína. */
function nutriIng(id){
  return NUTRI[id] || NUTRI[FAMILIA[id]] ||
         (PROT[id] && NUTRI[PROT[id]]) ||
         (PROT[FAMILIA[id]] && NUTRI[PROT[FAMILIA[id]]]) || null;
}

/* Cuántos gramos son [cantidad, unidad, insumo]. Devuelve null cuando no se
   puede saber, para no inventar un número y contarlo como si fuera cierto. */
function gramosDe(q, u, id){
  if(!(q > 0)) return null;
  if(u === '') { const g = PESO_U[id]; return g === undefined ? null : q * g; }
  if(u === 'taza'){ const g = PESO_T[id]; return q * (g === undefined ? 200 : g); }
  const f = PESO_F[u];
  return f === undefined ? null : q * f;
}

/* El aporte de una receta, por porción. Las preparaciones que son otra
   receta (una bordalesa lleva demi-glace) se resuelven hacia adentro, con
   tope de profundidad para no entrar en un ciclo. */
function nutriDe(r, hondo){
  if(!r || !r.ing) return null;
  const t = { kcal:0, prot:0, carb:0, gras:0, fib:0, sod:0 };
  let pesados = 0, sinDato = 0;
  r.ing.forEach(([q, u, id]) => {
    const sub = (hondo || 0) < 3 ? recetaPorId(id) : null;
    if(sub){
      // Es otra preparación: se cuenta lo que aporta la parte que se usa
      const n = nutriDe(sub, (hondo || 0) + 1);
      if(!n){
        // Una subpreparación que no aporta nada -una bolsita de especias
        // que además se retira- no es un dato que falte, es un cero.
        return;
      }
      // Pedida en gramos o mililitros se pesa; pedida por unidad, "1"
      // quiere decir una porción de esa preparación, que es como se usa.
      const g = gramosDe(q, u, id) ||
                (u === '' ? n.gramos * q / Math.max(1, sub.serv || 1) : null);
      if(!g){ sinDato++; return; }
      const porG = n.gramos > 0 ? g / n.gramos : 0;
      ['kcal','prot','carb','gras','fib','sod'].forEach(k => t[k] += n.total[k] * porG);
      pesados += g;
      return;
    }
    const n = nutriIng(id);
    const g = gramosDe(q, u, id);
    // Una envoltura que no se come -hoja de plátano, hojas de bijao- pesa
    // cero a propósito. Eso es un cero conocido, no un dato que falta.
    if(!n || g === null || g === undefined){ sinDato++; return; }
    if(g === 0) return;
    pesados += g;
    t.kcal += n[0] * g / 100; t.prot += n[1] * g / 100; t.carb += n[2] * g / 100;
    t.gras += n[3] * g / 100; t.fib  += n[4] * g / 100; t.sod  += n[5] * g / 100;
  });
  if(!pesados) return null;
  const serv = Math.max(1, r.serv || 1);
  const porc = {};
  Object.keys(t).forEach(k => porc[k] = t[k] / serv);
  return { total: t, porcion: porc, gramos: pesados,
           gramosPorcion: pesados / serv, sinDato, serv };
}

/* Los alérgenos de una receta, con el insumo que los trae. */
function alergenosDe(r){
  if(!r || !r.ing) return [];
  const ids = r.ing.map(x => x[2]).concat(r.opt || []);
  const todos = [];
  ids.forEach(id => {
    const sub = recetaPorId(id);
    if(sub) ids.push(...sub.ing.map(x => x[2]));
  });
  Object.entries(ALERG).forEach(([k, lista]) => {
    const culpa = ids.filter(i => lista.includes(i) || lista.includes(FAMILIA[i]));
    if(culpa.length) todos.push([k, [...new Set(culpa)].slice(0, 3)]);
  });
  return todos;
}

let CORTES_MM = null;
function cortesMM(){
  if(CORTES_MM) return CORTES_MM;
  CORTES_MM = {};
  ((DICC && DICC.cuchillo) || []).forEach(g =>
    (g.items || []).forEach(([n, medida, desc]) => {

    }));
  return CORTES_MM;

/* Marca en el texto del paso los nombres de corte que conozca. Se toca y
   dice la medida: así no hay que salirse de la receta para saber qué es
   una brunoise. */
function marcaCortes(txt){
  const C = cortesMM();
  const nombres = Object.keys(C).filter(n => n.length > 4)
    .sort((a, b) => b.length - a.length);
  if(!nombres.length) return txt;
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\function bloqueTemp(p){');
  const re = new RegExp('\\b(' + nombres.map(esc).join('|') + ')\\b', 'gi');
  return txt.replace(re, m =>
    '<b class="corte" data-corte="' + m.toLowerCase() + '">' + m + '</b>');
}

/* ¿Este corte sirve para esta preparación? */
function cocionCompatible(ingId, p){
  const c = COCCION[ingId];
  if(!c || c === 'ambos') return true;
  const e = exigeCoccion(p);
  return e === 'ambos' || e === c;
}

/* ============================================================
   MOTOR DE COINCIDENCIAS
   ============================================================ */
let gruposAbiertos = new Set();
let pantry = new Set(store.get('rec_pantry', BASICOS));
let equipo = new Set(store.get('rec_equipo', ['estufa','sarten','olla']));

function tengo(id, p){
  if(pantry.has(id) && (!p || cocionCompatible(id, p))) return {ok:true, sust:null};
  // Un corte cubre a su familia, pero solo si su cocción encaja con el plato:
  // tener osobuco no habilita un salteado de 20 minutos.
  for(const x of pantry){
    if(FAMILIA[x] === id && (!p || cocionCompatible(x, p))) return {ok:true, sust:x};
  }
  // Y al revés: la receta pide un corte y tienes la familia genérica
  if(FAMILIA[id] && pantry.has(FAMILIA[id])) return {ok:true, sust:FAMILIA[id]};
  const subs = SUSTITUTOS[id]||[];
  for(const s of subs){
    if(pantry.has(s) && (!p || cocionCompatible(s, p))) return {ok:true, sust:s};
  }
  return {ok:false, sust:null};
}

/* Condimentos y apoyos: si solo falta esto, el plato igual sale.
   No deciden si puedes cocinar, solo afinan el sabor. */
const PRESCINDIBLES = new Set(['agua','hielo','comino','oregano','laurel','canela','curry','paprika',
  'ajipicante','cilantro','perejil','albahaca','guascas','vainilla','pimienta',
  'bicarbonato','levadura','caldo','vinagre','mostaza','azucar','miel','soya',
  'enebro']);

function evaluar(p){
  // equipos: si falta alguno, no se puede hacer
  const faltaEq = p.eq.filter(e=>!equipo.has(e));
  const req = p.ing.map(i=>i[2]);
  const falta=[], opcionalFalta=[], sustituciones=[], usa=[];
  req.forEach(id=>{
    const t=tengo(id, p);
    if(t.ok){ usa.push(id); if(t.sust) sustituciones.push([id,t.sust]); }
    else if(PRESCINDIBLES.has(id)) opcionalFalta.push(id);
    else falta.push(id);
  });
  const extras = (p.opt||[]).filter(id=>pantry.has(id));
  const cobertura = usa.length/req.length;
  const score = cobertura*100 + usa.length*4 + extras.length*3
                - opcionalFalta.length*2 - faltaEq.length*100;
  return {p, falta, opcionalFalta, faltaEq, sustituciones, extras, usa, cobertura, score};
}

function buscarPreparaciones(){
  const evaluadas = PREPS.map(evaluar).filter(r=>!r.faltaEq.length);
  const listas = evaluadas.filter(r=>r.falta.length===0).sort((a,b)=>b.score-a.score);
  const cerca  = evaluadas.filter(r=>r.falta.length>0 && r.falta.length<=2)
                          .sort((a,b)=>a.falta.length-b.falta.length || b.score-a.score);
  return {listas, cerca:cerca.slice(0,12)};
}

/* Cuántos mililitros de blanqueador por litros de agua, a la concentración
   que se quiera. La cuenta es la de la guía: no se copia una tabla porque
   el blanqueador que venden no siempre tiene la misma concentración. */
function mlCloro(litros, ppm, porcentaje){
  if(!(litros > 0) || !(porcentaje > 0)) return null;
  return litros * (ppm / 1000) / (porcentaje / 100);
}

function calcularCloro(){
  const lt = parseFloat((document.getElementById('clLitros') || {}).value);
  const pc = parseFloat((document.getElementById('clPct') || {}).value);
  const out = document.getElementById('clSalida');
  if(!out) return;
  if(!(lt > 0) || !(pc > 0)){ out.innerHTML = '<span class="cl-vacio">' + t('clPide') + '</span>'; return; }
  const fila = (ppm, para) => {
    const ml = mlCloro(lt, ppm, pc);
    const cdta = ml / 5;
    return '<div class="cl-fila"><span class="cl-para">' + para + '</span>' +
      // un decimal solo cuando hace falta: "5 ml", no "5,0 ml"
      '<b>' + (ml < 10 ? (+ml.toFixed(1)).toString().replace('.', ',') : Math.round(ml)) + ' ml</b>' +
      // Media cucharadita (2,5 ml) es el piso para que valga medirlo así
      '<span class="cl-cdta">' + (ml >= 2.5
        ? '≈ ' + (cdta < 10 ? (+cdta.toFixed(1)).toString().replace('.', ',') : Math.round(cdta)) +
          ' ' + t(cdta === 1 ? 'clCdta1' : 'clCdta')
        : t('clGotas')) + '</span></div>';
  };
  out.innerHTML = fila(50, t('clFruta')) + fila(100, t('clVerdura'));
}

/* La lista, agrupada como la despensa y filtrable. Va aparte de la ficha
   para que escribir en el buscador no vuelva a dibujar la calculadora y
   le haga perder el foco al input, que es lo que pasaba en maridaje. */
let filtroRend = '';
function listaRendimiento(){
  const notas = (DICC && DICC.rendimiento) || {};
  const q = (filtroRend || '').trim().toLowerCase();
  const pasa = id => !q || trIng(id).toLowerCase().includes(q) ||
                     (notas[id] || '').toLowerCase().includes(q);
  const fila = id => {
    const pct = REND[id];
    return '<div class="item rend" data-rend="' + id + '">' +
      '<div class="fila"><span class="nombre">' + trIng(id) + '</span>' +
      '<span class="grados">' + pct + ' %</span></div>' +
      '<div class="met">' +
        '<span><em>' + t('rendUtil') + '</em><b class="util">—</b></span>' +
        '<span><em>' + t('rendMerma') + '</em><b class="merma">—</b></span>' +
      '</div>' +
      '<p class="como">' + (notas[id] || '') + '</p></div>';
  };
  // Mismo orden de grupos que la despensa, para no tener que aprender otro.
  // Un insumo puede estar en dos grupos (el haba está en verduras y en
  // granos): se dibuja una sola vez, en el primero que lo reclame.
  const puesto = new Set();
  const salida = GROUPS.map(g => {
    const ids = idsDe(g).filter(id => REND[id] !== undefined && !puesto.has(id))
      .filter(pasa).sort((a, b) => REND[a] - REND[b]);
    ids.forEach(id => puesto.add(id));
    if(!ids.length) return '';
    return '<div class="f-sec">' + trGrupo(g.t) + '</div>' + ids.map(fila).join('');
  }).join('');
  // Lo que no cayó en ningún grupo no se puede perder
  const enGrupos = new Set(GROUPS.flatMap(idsDe));
  const sueltos = Object.keys(REND).filter(id => !enGrupos.has(id)).filter(pasa);
  return (salida || sueltos.length)
    ? salida + (sueltos.length ? '<div class="f-sec">' + t('otros') + '</div>' + sueltos.map(fila).join('') : '')
    : '<p class="vacio">' + t('sinResultados') + '</p>';
}

function calcularRendimiento(){
  const el = document.getElementById('pesoBruto');
  if(!el) return;
  const bruto = parseFloat(el.value);
  document.querySelectorAll('[data-rend]').forEach(fila => {
    const pct = REND[fila.dataset.rend];
    const u = fila.querySelector('.util'), m = fila.querySelector('.merma');
    if(!(bruto > 0)){ u.textContent = '—'; m.textContent = '—'; return; }
    const util = bruto * pct / 100;
    u.textContent = kg(util);
    m.textContent = kg(bruto - util);
  });
}

/* Lo que hay que comprar para una semana. Dos cuentas encadenadas:
   primero cuánto se necesita ya limpio, y después cuánto hay que comprar
   para que quede eso, que es lo que cobra el mercado. */
function compraDe(plan, personas){
  const need = {};
  const suma = (r, veces) => {
    if(!r) return;
    (r.ing || []).forEach(([q, u, id]) => {
      const sub = recetaPorId(id);
      if(sub){ suma(sub, veces * (q / Math.max(1, sub.serv))); return; }
      const g = gramosDe(q, u, id);
      if(!g) return;
      need[id] = (need[id] || 0) + g * veces / Math.max(1, r.serv || 1);
    });
  };
  // Las bases del domingo: una tanda para los cinco días
  plan.prep.forEach(k => {
    const bs = LONCHERA.BASES[k];
    suma(BASE.find(x => x.id === bs.receta), 5 * personas);
  });
  // Y lo que cada día agrega ENCIMA. Lo que ya puso la base no se vuelve a
  // contar: el jueves ensambla con la papa del domingo, no compra otra.
  plan.dias.forEach(([, rec, base]) => {
    const r = BASE.find(x => x.id === rec);
    if(!r) return;
    const yaEsta = (LONCHERA.BASES[base] || {}).insumo || [];
    const sinLaBase = Object.assign({}, r, {
      ing: r.ing.filter(([, , id]) =>
        !yaEsta.includes(id) && !yaEsta.includes(FAMILIA[id])),
    });
    suma(sinLaBase, personas);
  });

  return Object.entries(need).map(([id, limpio]) => {
    const r = typeof REND !== 'undefined' ? REND[id] : null;
    const comprar = r ? limpio * 100 / r : limpio;
    return { id, limpio, comprar, rend: r || null };
  }).filter(x => x.limpio >= 3)
    .sort((a, b) => b.comprar - a.comprar);
}

const pesoBonito = g => g >= 1000 ? (Math.round(g / 100) / 10).toString().replace('.', ',') + ' kg'
                      : Math.round(g) + ' g';

function fichaPlan(pl){
  const B = LONCHERA.BASES;
  const rec = id => recetaPorId(id);
  const tot = pl.dias.reduce((n, d) => n + d[4], 0);

  const domingo = pl.prep.map(k => {
    const b = B[k], r = rec(b.receta);
    return '<div class="lo-base">' +
      '<div class="fila"><span class="nombre">' + b.n + '</span>' +
        (r ? '<button class="lo-ir" data-receta="' + b.receta + '">' + t('loVerReceta') + '</button>' : '') +
      '</div>' +
      '<p class="lo-rinde">' + b.rinde + '</p>' +
      '<p class="lo-dura"><em>' + t('loDura') + '</em> ' + b.dura + '</p>' +
      '<p class="como">' + b.como + '</p>' +
      '<p class="coc-tip">' + b.ojo + '</p></div>';
  }).join('');

  const dias = pl.dias.map(([d, id, base, monta, min, calienta]) => {
    const r = rec(id);
    const n = r ? nutriDe(r) : null;
    return '<div class="lo-dia">' +
      '<div class="lo-d-top"><b>' + d + '</b>' +
        '<span class="lo-min">' + min + ' ' + t('min') + '</span>' +
        '<span class="lo-t ' + (calienta ? 'cal' : 'frio') + '">' +
          t(calienta ? 'loCaliente' : 'loFrio') + '</span></div>' +
      '<button class="lo-plato" data-receta="' + id + '">' + (r ? r.name : id) + '</button>' +
      '<div class="lo-desde">' + t('loDesde') + ' <b>' + B[base].n + '</b></div>' +
      '<p class="como">' + monta + '</p>' +
      (n ? '<div class="lo-nu">' + Math.round(n.porcion.kcal) + ' kcal · ' +
           Math.round(n.porcion.prot) + ' g ' + t('nuProt').toLowerCase() + '</div>' : '') +
    '</div>';
  }).join('');

  const compra = compraDe(pl, 1);
  const lista = GROUPS.map(g => {
    const ids = idsDe(g);
    const mios = compra.filter(x => ids.includes(x.id));
    if(!mios.length) return '';
    return '<div class="f-sec mini">' + trGrupo(g.t) + '</div>' +
      mios.map(x => '<div class="lo-c">' +
        '<span class="lo-c-n">' + trIng(x.id) + '</span>' +
        '<b>' + pesoBonito(x.comprar) + '</b>' +
        (x.rend && x.rend < 95 ? '<em>' + t('loLimpio').replace('{g}', pesoBonito(x.limpio))
          .replace('{p}', x.rend) + '</em>' : '') +
      '</div>').join('');
  }).join('');

  return '<button class="coc-volver" id="loVolver">' + t('loVolver') + '</button>' +
    '<div class="coc-ficha">' +
      '<h3 class="coc-tit">' + pl.n + '</h3>' +
      '<p class="lo-q">' + pl.q + '</p>' +
      '<p class="coc-rinde">' + t('loTotal').replace('{n}', tot) + '</p>' +
      '<div class="f-sec mini">' + t('loDomingo') + '</div>' + domingo +
      '<div class="f-sec mini">' + t('loSemana') + '</div>' + dias +
      '<div class="f-sec mini">' + t('loCompra') + '</div>' +
      '<p class="h2sub">' + t('loCompraSub') + '</p>' + lista +
    '</div>';
}

function listaMaridaje(){
  const car = (DICC && DICC.maridaje) || {};
  // con filtro se busca en todo el catálogo, para que caiga también lo heredado
  const universo = filtroMar
    ? Object.keys(ING).filter(id => trIng(id).toLowerCase().includes(filtroMar) && parejasDe(id))
    : Object.keys(PAREJAS);
  // con el filtro puesto, un insumo sin ninguna pareja audaz no tiene nada que mostrar
  // Alfabético por el nombre traducido, no por el id: él busca "cordero",
  // no "cordero_pierna", y en inglés el orden es otro.
  const ids = (soloAudaces
    ? universo.filter(id => parejasDe(id).ids.some(c => c[2] === 2))
    : universo).sort((a, b) => trIng(a).localeCompare(trIng(b), 'es'));
  if(!ids.length) return '<p class="como">' + t('sinResultados') + '</p>';
  const chip = ([p, tipo, fuerza]) =>
    '<span class="par ' + tipo + (pantry.has(p) ? ' si' : '') + (fuerza === 2 ? ' audaz' : '') + '">' +
      trIng(p) + '</span>';
  return ids.map(id => {
    const d = parejasDe(id);
    return '<div class="item mar"><div class="fila">' +
      '<span class="nombre">' + trIng(id) + '</span>' +
      (pantry.has(id) ? '<span class="coc rapida">' + t('especiasTengo') + '</span>' : '') +
      '</div>' +
      (car[d.via || id] ? '<p class="como">' + car[d.via || id] + '</p>' : '') +
      (d.via ? '<p class="heredado">' + t('comoLa').replace('{x}', trIng(d.via)) + '</p>' : '') +
      '<div class="pars">' +
        (soloAudaces ? d.ids.filter(c => c[2] === 2) : d.ids).map(chip).join('') +
      '</div></div>';
  }).join('');
}

    '<div class="f-sec">' + sec.t + '</div>' + sec.items.map((it, ii) => {
      const mm = CUCHILLO_MM[si] && CUCHILLO_MM[si][ii];
      return '<div class="item"><div class="fila">' +
        '<span class="nombre">' + it[0] + '</span>' +
        (it[1] ? '<span class="medida">' + it[1] + '</span>' : '') + '</div>' +
        (mm ? '<div class="escala"><i style="width:' + mm + 'mm;height:' + mm + 'mm"></i></div>' : '') +
        '<p class="como">' + it[2] + '</p></div>';
    }).join('')).join('');
}

/* ======== La base de la cocina ========
   Un mismo renderizador para las dos pestañas: 'salsa' muestra las salsas
   madre con sus derivadas, 'fondo' los fondos y los complementos que los
   alimentan. Al tocar una se abre su ficha; desde ahí se navega hacia
   abajo por sus dependencias.                                          */
let cocAbierta = null;    // id de la preparación abierta, o null = lista
let cocEscala  = 1;       // multiplicador de la receta
let cocFiltro  = '';
let cocNivel   = 'salsa'; // en cuál pestaña estamos
let cocPlato   = null;    // corte elegido dentro de una salsa: el plato armado

const ORDEN_FAM = ['bechamel','veloute_ave','veloute_ternera','veloute_pescado',
                   'demiglace','mantequilla','mayonesa','tomate'];

/* "1200 g" por 0.5 queda "600 g". Lo que no trae número (sal, pimienta)
   se deja igual: no se escala "al gusto". */
function escala(cant){
  if(!cant) return '';
  const m = String(cant).trim().match(/^(\d+(?:[.,]\d+)?)\s*(.*)$/);
  if(!m) return cant;
  let v = parseFloat(m[1].replace(',', '.')) * cocEscala;
  let u = m[2].trim();
  if(u === 'g' && v >= 1000){ v = v / 1000; u = 'kg'; }
  const r = v >= 100 ? Math.round(v)
          : v >= 10  ? Math.round(v * 10) / 10
          : Math.round(v * 100) / 100;
  return String(r).replace('.', ',') + (u ? ' ' + u : '');
}

const cocDe = id => (COCINA && COCINA[id]) || null;

function cuerpoCocina(nivel){
  if(!COCINA) return '<p class="h2sub">' + t('cocinaSinDatos') + '</p>';
  cocNivel = nivel;
  // Una ficha abierta sigue abierta solo si pertenece a esta pestaña. Así,
  // al seguir una dependencia de una salsa hacia su fondo, la ficha del
  // fondo se abre sola; y al cambiar de pestaña a mano, se vuelve a la lista.
  const d = cocAbierta && cocDe(cocAbierta);
  const suya = d && (nivel === 'salsa' ? d.nivel === 'salsa' : d.nivel !== 'salsa');
  if(!suya){ cocAbierta = null; cocFiltro = ''; cocPlato = null; }
  if(cocAbierta && cocPlato) return platoCoc(cocAbierta, cocPlato);
  if(cocAbierta) return fichaCoc(cocAbierta);
  return listaCoc(nivel);
}

function listaCoc(nivel){
  // Las claves que empiezan por __ son metadatos (el cruce, las reglas),
  // no preparaciones: hay que saltarlas o se cuelan en la lista de fondos.
  const todas = Object.entries(COCINA)
    .filter(([k]) => k.slice(0, 2) !== '__')
    .map(([, p]) => p)
    .filter(p => nivel === 'salsa' ? p.nivel === 'salsa' : p.nivel !== 'salsa');
  const q = cocFiltro.trim().toLowerCase();
  const pasa = p => !q || p.n.toLowerCase().includes(q) ||
                    p.ing.some(i => i[1].toLowerCase().includes(q));
  const vis = todas.filter(pasa);

  const grupos = {};
  vis.forEach(p => {
    const k = nivel === 'salsa' ? (p.fam || 'otras')
                                : (p.nivel === 'fondo' ? 'fondos' : 'complementos');
    (grupos[k] = grupos[k] || []).push(p);
  });
  const orden = nivel === 'salsa' ? ORDEN_FAM : ['fondos','complementos'];
  const titulo = k => nivel === 'salsa'
    ? ((vis.find(p => p.fam === k) || {}).famN || k)
    : t(k === 'fondos' ? 'cocFondos' : 'cocComplementos');

  const cuerpo = orden.filter(k => grupos[k]).map(k =>
    '<div class="f-sec">' + titulo(k) + '</div>' +
    grupos[k].map(p =>
      '<button class="coc-fila" data-coc="' + p.id + '">' +
        '<span class="coc-n">' + p.n + '</span>' +
        (p.usa.length ? '<span class="coc-dep">' + p.usa.length + '</span>' : '') +
      '</button>').join('')).join('');

  return '<p class="h2sub">' + t(nivel === 'salsa' ? 'salsasSub' : 'fondosSub') + '</p>' +
    '<div class="calc"><div class="calc-in"><input id="qCoc" type="search" ' +
      'placeholder="' + t('buscarCoc') + '" value="' + cocFiltro + '"></div></div>' +
    (vis.length ? cuerpo : '<p class="vacio">' + t('sinResultados') + '</p>');
}

function fichaCoc(id){
  const p = cocDe(id);
  const chip = (i, clase) => {
    const d = cocDe(i);
    return d ? '<button class="coc-chip ' + clase + '" data-coc="' + i + '">' + d.n + '</button>' : '';
  };
  const ESC = [[0.25,'¼'],[0.5,'½'],[1,'1'],[2,'2']];

  return '<button class="coc-volver" id="cocVolver">' + t('cocVolver') + '</button>' +
    '<div class="coc-ficha">' +
      '<div class="coc-fam">' + (p.famN || t(p.nivel === 'fondo' ? 'cocFondos' : 'cocComplementos')) + '</div>' +
      '<h3 class="coc-tit">' + p.n + '</h3>' +
      (p.rinde ? '<p class="coc-rinde">' + t('cocRinde') + ' ' + p.rinde + '</p>' : '') +

      (p.usa.length ? '<div class="f-sec mini">' + t('cocNecesita') + '</div>' +
        '<div class="coc-chips">' + p.usa.map(i => chip(i, 'antes')).join('') + '</div>' : '') +

      '<div class="f-sec mini">' + t('cocIngredientes') + '</div>' +
      '<div class="coc-esc">' + ESC.map(([v, et]) =>
        '<button class="esc' + (cocEscala === v ? ' on' : '') + '" data-esc="' + v + '">×' + et + '</button>').join('') + '</div>' +
      '<table class="coc-ing">' + p.ing.map(([c, n]) =>
        '<tr><td class="c">' + escala(c) + '</td><td>' + n + '</td></tr>').join('') + '</table>' +

      (p.local.length ? '<div class="f-sec mini">' + t('cocAqui') + '</div>' +
        p.local.map(([q, con, pq]) => '<div class="coc-eq">' +
          '<div class="coc-eq-q"><b>' + q + '</b> → ' + con + '</div>' +
          '<p class="coc-eq-p">' + pq + '</p></div>').join('') : '') +

      (p.mise.length ? '<div class="f-sec mini">' + t('cocMise') + '</div>' +
        '<ul class="coc-mise">' + p.mise.map(x => '<li>' + x + '</li>').join('') + '</ul>' : '') +

      '<div class="f-sec mini">' + t('cocMetodo') + '</div>' +
      '<ol class="coc-prep">' + p.prep.map(x => '<li>' + x + '</li>').join('') + '</ol>' +

      (p.tip.length ? '<div class="f-sec mini">' + t('cocConsejos') + '</div>' +
        p.tip.map(x => '<p class="coc-tip">' + x + '</p>').join('') : '') +

      (p.notas.length ? '<div class="coc-nota"><div class="tc-k">' + t('cocCorregido') + '</div>' +
        p.notas.map(x => '<p>' + x + '</p>').join('') + '</div>' : '') +

      ((p.usan && p.usan.length) ? '<div class="f-sec mini">' + t('cocUsadaEn') + '</div>' +
        '<div class="coc-chips">' + p.usan.map(i => chip(i, 'despues')).join('') + '</div>' : '') +
      vaCon(p) +
    '</div>';
}

/* Los cortes que le van a esta salsa, agrupados por proteína. Las que el
   cocinero marcó como clásicas van primero; las audaces, aparte. */
function vaCon(p){
  const c = COCINA.__cruce && COCINA.__cruce[p.id];
  if(!c || !c.cortes.length) return '';
  const seguras = c.cortes.filter(x => x[1] === 1);
  const audaces = c.cortes.filter(x => x[1] === 2);
  const bloque = (lista, clase) => lista.map(([id]) =>
    '<button class="coc-chip ' + clase + '" data-plato="' + id + '">' + trIng(id) + '</button>').join('');
  return '<div class="f-sec mini">' + t('cocVaCon') + '</div>' +
    '<p class="coc-cuantos">' + c.cortes.length + ' ' + t('cocPlatos') + '</p>' +
    '<div class="coc-chips">' + bloque(seguras, 'corte') + '</div>' +
    (audaces.length ? '<p class="coc-sub">' + t('cocMenosComun') + '</p>' +
      '<div class="coc-chips">' + bloque(audaces, 'corte audaz') + '</div>' : '') +
    (c.nota ? '<p class="coc-tip">' + c.nota + '</p>' : '');
}

/* El plato armado. No está guardado en ningún lado: sale de cruzar el corte
   con la salsa, más el tipo de cocción que el corte ya traía en la app. */
function platoCoc(sid, cid){
  const s = cocDe(sid);
  const c = COCINA.__cruce[sid];
  const R = COCINA.__reglas[s.fam];
  const coc = (typeof COCCION !== 'undefined' && COCCION[cid]) || 'rapida';
  const lenta = coc === 'lenta';
  const ambos = coc === 'ambos';
  return '<button class="coc-volver" id="cocVolverPlato">' + t('cocVolverSalsa') + ' ' + s.n + '</button>' +
    '<div class="coc-ficha">' +
      '<div class="coc-fam">' + t('cocPlatoArmado') + '</div>' +
      '<h3 class="coc-tit">' + trIng(cid) + ' en ' + s.n.replace(/^Salsa /, '') + '</h3>' +
      '<p class="coc-rinde">' + t('coc_' + coc) + '</p>' +

      '<div class="f-sec mini">' + t('cocElCorte') + '</div>' +
      '<p class="coc-para">' + (lenta ? t('cocComoLenta') : ambos ? t('cocComoAmbos') : t('cocComoRapida')) + '</p>' +

      '<div class="f-sec mini">' + t('cocLaSalsa') + '</div>' +
      '<p class="coc-para">' + R.como + '</p>' +
      '<p class="coc-tip">' + R.ojo + '</p>' +
      (c.nota ? '<p class="coc-tip">' + c.nota + '</p>' : '') +

      '<div class="f-sec mini">' + t('cocLaReceta') + '</div>' +
      '<div class="coc-chips"><button class="coc-chip antes" data-coc="' + sid + '">' + s.n + '</button>' +
        (s.usa || []).map(i => cocDe(i)
          ? '<button class="coc-chip" data-coc="' + i + '">' + cocDe(i).n + '</button>' : '').join('') +
      '</div>' +
    '</div>';
}

/* Las especias por proteína pasaron al grafo de maridaje, que es
   exactamente lo que son: qué va con qué, y por tradición. */

/* ============ Ficha: cómo se cocina cada cosa ============ */
function idsDe(g){ return [...g.ids, ...(g.mas||[])]; }
function fichaTiene(g){ return idsDe(g).some(id => COCCION[id] || COCFAM[id]); }
const COC_ETIQ = { rapida:'cocFuego', lenta:'cocTiempo', ambos:'cocAmbas' };

function openFicha(gi){
  const g = GROUPS[gi];
  const ids = idsDe(g);

  // Cortes: cocción y cómo se llaman en otra parte
  const cortes = ids.filter(id => COCCION[id]);
  const orden = { rapida:0, ambos:1, lenta:2 };
  cortes.sort((a,b) => (orden[COCCION[a]] - orden[COCCION[b]]) || trIng(a).localeCompare(trIng(b)));

  const filaCorte = id => {
    const e = EQUIV[id];
    return `<div class="fc">
      <div class="fc-top">
        <b>${trIng(id)}</b>
        <span class="coc ${COCCION[id]}">${t(COC_ETIQ[COCCION[id]])}</span>
      </div>
      ${e ? '<div class="fc-eq">' + e.slice(0,5).map((n,i) =>
          '<span><em>' + PAISES_CORTE[i] + '</em>' + n + '</span>').join('') +
          (e[5] === 0 ? '<span class="dudoso">' + t('variaDesposte') + '</span>' : '') + '</div>' : ''}
      ${MAS_PAISES[id] ? '<div class="mp">' + Object.entries(MAS_PAISES[id]).map(([p,n]) =>
          '<span><em>' + p + '</em>' + n + '</span>').join('') + '</div>' : ''}
    </div>`;
  };

  // Familias de cocción (verduras, granos, legumbres, frutas)
  // El mismo insumo a cuatro fuegos
  const conMetodo = ids.filter(id => DICC && DICC.metodos && DICC.metodos[id]);
  const bloqueMetodo = id => '<div class="ff"><h4>' + trIng(id) + '</h4><div class="met">' +
    DICC.metodos[id].map(m => '<span><em>' + m[0] + '</em>' + m[1] + '</span>').join('') +
    '</div></div>';

  const fams = [];
  ids.forEach(id => { const f = COCFAM[id]; if (f && !fams.includes(f)) fams.push(f); });
  const bloqueFam = f => {
    const info = trFam(f);
    const suyos = ids.filter(id => COCFAM[id] === f).map(trIng).join(' · ');
    return `<div class="ff">
      <h4>${info.t}</h4>
      <p class="como">${info.como}</p>
      <p class="ojo">${info.ojo}</p>
      <p class="quienes">${suyos}</p>
    </div>`;
  };

  document.getElementById('sheetInner').innerHTML = `
    <div class="ficha">
      <button class="back fx" id="fBack"><svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="f-cat">${t('comoSeCocina')}</div>
      <h2>${trGrupo(g.t)}</h2>
      ${cortes.length ? '<div class="f-sec">' + t('porCorte') + '</div>' + cortes.map(filaCorte).join('') : ''}
      ${conMetodo.length ? '<div class="f-sec">' + t('comoSeCocinaIng') + '</div>' + conMetodo.map(bloqueMetodo).join('') : ''}
      ${fams.length   ? '<div class="f-sec">' + t('porFamilia') + '</div>' + fams.map(bloqueFam).join('') : ''}
      ${ids.some(id => PESC_TIPO[id]) ? cuerpoPescados(ids) : ''}
      <p class="f-pie">${t('fichaPie')}</p>
    </div>`;
  document.getElementById('sheet').classList.add('open');
  document.getElementById('fBack').onclick = closeDetail;
  document.getElementById('sheet').scrollTop = 0;
}

function savePantry(){

/* Los fondos y salsas base que otras preparaciones necesitan hechos.
   Se marcan igual que un insumo y se guardan en la misma despensa, así que
   una bordalesa aparece lista si ya tienes la demi-glace en la nevera. */
function idsHechos(){
  if(!COCINA) return [];
  const necesarios = new Set();
  Object.keys(COCINA).filter(k => k.slice(0,2) !== '__')
    .forEach(k => (COCINA[k].usa || []).forEach(d => necesarios.add(d)));
  const peso = { complemento: 0, fondo: 1, salsa: 2 };
  return [...necesarios].sort((a,b) =>
    peso[COCINA[a].nivel] - peso[COCINA[b].nivel] || COCINA[a].n.localeCompare(COCINA[b].n));
}

function bloqueHecho(filtro){
  const ids = idsHechos().filter(id => !filtro || COCINA[id].n.toLowerCase().includes(filtro));
  if(!ids.length) return '';
  const n = ids.filter(id => pantry.has(id)).length;
  return '<div class="pgroup hechos">' +
    '<div class="gt">' + t('loQueTengoHecho') + (n ? '<span class="n">' + n + '</span>' : '') + '</div>' +
    '<p class="gsub">' + t('loQueTengoHechoSub') + '</p>' +
    '<div class="pills">' + ids.map(id =>
      '<button class="pill hecho ' + (pantry.has(id) ? 'on' : '') + '" data-ing="' + id + '">' +
      COCINA[id].n + '</button>').join('') +
    '</div></div>';
}

function renderPills(filtro){
  const eq=document.getElementById('eqPills');
  eq.innerHTML=Object.keys(EQUIPOS).map(k=>
    `<button class="pill eq ${equipo.has(k)?'on':''}" data-eq="${k}">${trEq(k)}</button>`).join('');
  eq.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.eq; equipo.has(k)?equipo.delete(k):equipo.add(k);
    savePantry(); renderPills(filtro);
  });
  document.getElementById('nEq').textContent=equipo.size;

  // Un argentino escribe "bife de chorizo" y debe encontrar la chata.
  const alias = id => { const e = EQUIV[id]; return e ? e.slice(0,5) : []; };
  const aliasQueCalza = id => alias(id).find(n => n.toLowerCase().includes(filtro));
  const pasa = id => !filtro || trIng(id).toLowerCase().includes(filtro) || !!aliasQueCalza(id);
  document.getElementById('groups').innerHTML = bloqueHecho(filtro) + GROUPS.map((g,gi)=>{
    const abierto = filtro || gruposAbiertos.has(gi);
    // lo marcado siempre se ve, aunque esté en la parte larga
    const extraVisible = (g.mas||[]).filter(id => abierto || pantry.has(id));
    const ids = [...g.ids, ...extraVisible].filter(pasa);
    const ocultos = (g.mas||[]).filter(id => !abierto && !pantry.has(id) && pasa(id)).length;
    if(!ids.length && !ocultos) return '';
    const n = [...g.ids, ...(g.mas||[])].filter(id=>pantry.has(id)).length;
    return `<div class="pgroup">
      <div class="gt">${trGrupo(g.t)} ${n?`<span class="n">${n}</span>`:''}${fichaTiene(g)?`<button class="gi" data-ficha="${gi}" aria-label="${t('comoSeCocina')}">i</button>`:''}</div>
      <div class="pills">${ids.map(id=>
        `<button class="pill ${pantry.has(id)?'on':''}" data-ing="${id}">${trIng(id)}${
           (filtro && !trIng(id).toLowerCase().includes(filtro) && aliasQueCalza(id))
             ? `<i class="aka">${aliasQueCalza(id)}</i>` : ''}</button>`).join('')}
        ${ocultos?`<button class="pill mas" data-mas="${gi}">+ ${ocultos} ${t('masOpciones')}</button>`:''}
        ${(abierto && !filtro && (g.mas||[]).length)?`<button class="pill mas" data-mas="${gi}">${t('verMenos')}</button>`:''}
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('[data-ficha]').forEach(b=>b.onclick=()=>openFicha(+b.dataset.ficha));
  document.querySelectorAll('[data-mas]').forEach(b=>b.onclick=()=>{
    const gi=+b.dataset.mas;
    gruposAbiertos.has(gi) ? gruposAbiertos.delete(gi) : gruposAbiertos.add(gi);
    renderPills(filtro);
  });
  document.querySelectorAll('[data-ing]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.ing; pantry.has(k)?pantry.delete(k):pantry.add(k);
    savePantry(); b.classList.toggle('on');
    actualizarBoton();
    document.querySelectorAll('.pgroup .gt .n').forEach(()=>{});
    renderPills(filtro);
  });
  actualizarBoton();
  pintarSugerencias();
}
function actualizarBoton(){
  const b=document.getElementById('goBtn'); if(!b) return;
  const n=pantry.size;
  b.className='go'+(n<3?' dim':'');
  b.innerHTML = n<3 ? t('marcaMin')
    : `${t('verCarta')} · ${n} ${t('insumos')}`;
}

/* Con lo que marcó, qué tres cosas le abrirían más puertas.
   No es lo que más combina en abstracto: es lo que más combina con SU despensa. */
/* Las proteínas que son el plato. Si ya tienes una, proponerte otra no es
   maridar: es proponerte cocinar algo distinto. */

const esProteina = id => PROT_PLATO.includes(PROT[id] || PROT[FAMILIA[id]]);

/* Una sugerencia tiene que ganarse el puesto: cuántos platos abre de verdad.
   Solo pueden abrirse los que ya están cerca, así que ahí se busca. */
function sugerencias(){
  const yaTieneProteina = [...pantry].some(esProteina);
  const abre = {}, acerca = {};

  PREPS.forEach(p => {
    if (p.eq.some(e => !equipo.has(e))) return;      // sin el equipo no hay plato
    const faltan = [];
    p.ing.map(i => i[2]).forEach(id => {
      if (tengo(id, p).ok) return;
      if (PRESCINDIBLES.has(id)) return;
      faltan.push(id);
    });
    if (!faltan.length || faltan.length > 3) return;
    if (faltan.length === 1) abre[faltan[0]] = (abre[faltan[0]] || 0) + 1;
    else faltan.forEach(id => acerca[id] = (acerca[id] || 0) + 1);
  });

  const puntua = id => {
    const d = parejasDe(id);
    const afin = !d ? 0 : d.ids.filter(c => pantry.has(c[0]))
                             .reduce((n, c) => n + (c[2] === 1 ? 2 : 1), 0);
    return (abre[id] || 0) * 20 + (acerca[id] || 0) * 2 + afin;
  };
  const todos = [...new Set([...Object.keys(abre), ...Object.keys(acerca)])]
    .filter(id => !pantry.has(id))
    .map(id => ({ id, rol: ROL[id], n: abre[id] || 0, pts: puntua(id) }))
    .filter(x => x.pts > 0)
    .sort((a, b) => b.pts - a.pts);

  // Sin proteína no hay plato: eso es lo primero que falta.
  if (!yaTieneProteina) {
    const prot = todos.filter(x => x.rol === 'proteina').slice(0, 5);
    return prot.length ? [{ rol: 'proteina', items: prot }] : [];
  }

  // Con la proteína puesta, lo que falta es con qué acompañarla y con qué salsearla.
  const de = (...roles) => todos.filter(x => roles.includes(x.rol)).slice(0, 4);
  const g = de('guarnicion');
  const sz = de('salsa', 'aromatico', 'acido', 'grasa');
  const out = [];
  if (g.length)  out.push({ rol: 'guarnicion', items: g });
  if (sz.length) out.push({ rol: 'sazon', items: sz });
  return out;
}

function pintarSugerencias(){
  const el = document.getElementById('sugiere');
  if(!el) return;
  const grupos = sugerencias();
  if(!grupos.length){ el.innerHTML = ''; return; }
  const chip = x => '<button class="pill sug" data-ing="' + x.id + '">+ ' + trIng(x.id) +
    (x.n ? '<i>' + x.n + ' ' + (x.n > 1 ? t('platos') : t('plato')) + '</i>' : '') + '</button>';
  el.innerHTML = '<div class="gt">' + t('sugiereTitulo') + '</div>' +
    '<p class="sug-sub">' + t('sugiereSub') + '</p>' +
    grupos.map(g => '<div class="sug-rol">' + t('rol_' + g.rol) + '</div>' +
      '<div class="pills">' + g.items.map(chip).join('') + '</div>').join('');
  el.querySelectorAll('[data-ing]').forEach(b => b.onclick = () => {
    const id = b.dataset.ing;
    const antes = pantry.size >= 3 ? buscarPreparaciones().listas.length : 0;
    pantry.add(id); savePantry(); renderPills();
    // Sumar un insumo sin ver qué abrió deja al cocinero dando vueltas:
    // la sugerencia tiene que devolverlo al recetario.
    if(pantry.size >= 3){
      const despues = buscarPreparaciones().listas.length;
      const n = despues - antes;
      toast(trIng(id) + (n > 0 ? ' · +' + n + ' ' + (n > 1 ? t('platos') : t('plato')) : ''));
      mostrarResultados();
    } else toast(trIng(id));
  });
}

function mostrarResultados(){
  if(pantry.size<3){ toast(t('marcaMin')); return; }
  const {listas,cerca}=buscarPreparaciones();
  const box=document.getElementById('resultados');
  let html='';

  html+=`<div class="res-head"><span class="badge ok">${t('puedesYa')}</span>
         <span>${listas.length}</span></div>`;
  html+= listas.length
    ? listas.map(r=>cardHTML(r,false)).join('')
    : `<div class="empty" style="padding:26px">
       ${t('nadaAun')}<br>${t('miraAbajo')}</div>`;

  if(cerca.length){
    html+=`<div class="res-head"><span class="badge near">${t('faltaPoco')}</span>
           <span>${cerca.length}</span></div>`;
    html+= cerca.map(r=>cardHTML(r,true)).join('');
  }

  html+=aiBoxHTML();
  box.innerHTML=html;

  box.querySelectorAll('[data-prep]').forEach(c=>c.onclick=()=>{
    const p=PREPS.find(x=>x.id===c.dataset.prep); if(p) openDetail(p);
  });
  document.getElementById('aiBtn').onclick=pedirIA;
  box.scrollIntoView({behavior:'smooth',block:'start'});
}

const AI_ENDPOINT = '/.netlify/functions/chef';  // mismo sitio, sin configurar nada

function md(t){  // Markdown mínimo → HTML (seguro: escapa primero)
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc(t)
    .replace(/^## (.+)$/gm,'<h4 style="font-family:var(--disp);font-size:17px;margin:18px 0 6px">$1</h4>')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/^(\d+)\.\s(.+)$/gm,'<div style="margin:3px 0 3px 4px">$1. $2</div>')
    .replace(/^-\s(.+)$/gm,'<div style="margin:3px 0 3px 4px">• $1</div>')
    .replace(/\n{2,}/g,'<br>');
}

/* El chef no debe improvisar: va con las mismas reglas que ve el cocinero
   en pantalla — qué papel juega cada insumo, qué parejas hay entre lo que
   tiene y por qué funcionan, y las bases de la casa. */
function contextoIA(){
  const ETIQ = { puente:'comparten aroma', refuerzo:'profundiza', corte:'corta la grasa',
                 contraste:'contrasta', tradicion:'pareja de siempre', casa:'de la casa' };
  const marcados = [...pantry];

  const porRol = {};
  marcados.forEach(i => { const r = ROL[i] || 'otro'; (porRol[r] = porRol[r] || []).push(trIng(i)); });
  const roles = ['proteina','guarnicion','salsa','aromatico','acido','grasa']
    .filter(r => porRol[r]).map(r => t('rolCorto_' + r) + ': ' + porRol[r].join(', ')).join(' | ');

  // Parejas entre lo que ya tiene: ahí es donde se construye el plato.
  const dentro = [], vistas = new Set();
  marcados.forEach(a => {
    const d = parejasDe(a); if(!d) return;
    d.ids.forEach(([b, tipo]) => {
      if(!pantry.has(b)) return;
      const k = [a,b].sort().join('|'); if(vistas.has(k)) return; vistas.add(k);
      dentro.push(trIng(a) + ' + ' + trIng(b) + ' (' + (ETIQ[tipo]||tipo) + ')');
    });
  });

  // Y lo que le falta, por si vale la pena mandarlo a comprar.
  const fuera = {};
  marcados.forEach(a => {
    const d = parejasDe(a); if(!d) return;
    d.ids.forEach(([b, , fuerza]) => {
      if(pantry.has(b) || ROL[b] === 'base') return;
      fuera[b] = (fuera[b] || 0) + (fuerza === 1 ? 2 : 1);
    });
  });
  const faltan = Object.entries(fuera).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>trIng(x[0]));

  const D = (DICC && DICC.bases) || {};
  const bases = BASES.map(x => { const d = D[x.id]; if(!d) return '';
    return d.n + ' = ' + (d.comp||[]).map((c,i) =>
      c.n + ' (' + (x.comp[i]||[]).map(trIng).join(' + ') + ')').join(' // ');
  }).filter(Boolean).join(' ; ');

  return {
    roles,
    maridaje: dentro.slice(0, 60).join(' ; '),
    faltan: faltan.join(', '),
    bases,
    idioma: IDIOMA,
  };
}

async function pedirIA(){
  const out=document.getElementById('aiOut'), btn=document.getElementById('aiBtn');
  const lista=[...pantry].map(i=>trIng(i)).join(', ');
  const eqs=[...equipo].map(e=>trEq(e)).join(', ');
  if(!lista){ out.textContent=t('marcaAlgunos'); return; }
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> '+t('pensando'); out.textContent='';
  try{
    const res=await fetch(AI_ENDPOINT,{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({ingredientes:lista,equipos:eqs}, contextoIA()))});
    const data=await res.json().catch(()=>({}));
    if(!res.ok || data.error){
      out.textContent = data.error || `El servidor respondió ${res.status}.`;
    } else if(data.texto){
      out.innerHTML = md(data.texto);
    } else {
      out.textContent = t('errorCarga');
    }
  }catch(e){
    out.textContent='No se pudo conectar. Si estás abriendo el archivo localmente, esto solo funciona una vez publicado en Netlify.';
  }
  btn.disabled=false; btn.textContent=t('proponer');
}

/* ============ Textos de interfaz en el marcado ============ */
function pintarTextos(){
  const q = document.getElementById('q');
  if (q) q.placeholder = t('buscar');
  const tit = document.getElementById('tituloCarta');
  if (tit) tit.textContent = t('carta');
  const lb = document.getElementById('langBtn');
  if (lb) lb.textContent = IDIOMA.toUpperCase();
  document.documentElement.lang = IDIOMA;
}

async function cambiarIdioma(id){
  IDIOMA = id;
  store.set('rec_idioma', id);
  await cargarIdioma(id);
  aplicarIdiomaRecetas();
  pintarTextos();
  renderTabs();
  if (state.tab === 'pantry') renderPantry();
  else { renderChips(); state.tab==='mine' ? renderMine() : renderGrid(); }
  toast(IDIOMAS.find(i=>i.id===id).nombre);
}

function menuIdioma(){
  const i = IDIOMAS.findIndex(x => x.id === IDIOMA);
  cambiarIdioma(IDIOMAS[(i + 1) % IDIOMAS.length].id);
}

/* ============ Init ============ */
document.getElementById('count').innerHTML =
  '<div class="empty" style="padding:50px">…</div>';

/* El recetario tiene que abrir aunque la cocina no tenga senal. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

Promise.all([cargarIdioma(IDIOMA), cargarBiblioteca(), cargarCocina()]).then(() => {
  aplicarIdiomaRecetas();   // ambos ya llegaron: recién aquí se puede traducir
  pintarTextos();
  renderChips();
  renderTabs();
  document.getElementById('langBtn').onclick = menuIdioma;
  document.getElementById('fichasBtn').onclick = () => openFichas();
  if (bibliotecaLista) {
    renderGrid();
  } else {
    document.getElementById('count').innerHTML =
      '<div class="empty" style="padding:40px">' + t('errorCarga') + '<br>' + t('errorCargaSub') + '</div>';
  }
}).catch(() => {
  document.getElementById('count').innerHTML =
    '<div class="empty" style="padding:40px">No se pudo cargar la app.<br>Revisa que idiomas.json y recetas.json estén publicados.</div>';
});
</script>
</body>
</html>
