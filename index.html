<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#15181A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Siete Sabores · Cocina</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Siete Sabores">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     CARTA DE NOCHE · sistema visual
     Tinta profunda, papel cálido y latón. Cada plato se lee como
     una línea de carta de restaurante.
     ============================================================ */
  :root{
    --tinta:#15181A; --tinta-2:#1D2124; --linea-osc:#2C3134;
    --papel:#F2EDE4; --papel-2:#FFFFFF; --papel-linea:#DDD4C4;
    --laton:#B8914F; --laton-claro:#E4C98E; --laton-osc:#8F6E36;
    --oliva:#4A5B45; --vino:#6E2A33;
    --ink:#15181A; --ink-2:#6E6558; --ink-3:#8A8073;
    --gris:#8E9599; --gris-2:#6E7579;
    --sh:0 1px 2px rgba(21,24,26,.05), 0 8px 28px rgba(21,24,26,.07);
    --sh-alta:0 12px 40px rgba(21,24,26,.16);
    --r:14px; --r-g:22px;
    --disp:'Bodoni Moda', Georgia, 'Times New Roman', serif;
    --body:'Karla', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--body); background:var(--tinta); color:var(--papel);
    line-height:1.5; overscroll-behavior-y:none;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:16px}
  ::selection{background:var(--laton);color:var(--tinta)}
  :focus-visible{outline:2px solid var(--laton);outline-offset:2px}

  /* ---------- Armazón ---------- */
  #app{max-width:680px;margin:0 auto;min-height:100%;padding-bottom:124px;background:var(--tinta)}

  .topbar{
    position:sticky;top:0;z-index:20;background:rgba(21,24,26,.92);
    backdrop-filter:saturate(180%) blur(14px);
    padding:max(16px,env(safe-area-inset-top)) 22px 14px;
    border-bottom:1px solid var(--linea-osc);
  }
  .brand{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
  .brand-mark{
    font-family:var(--disp);font-size:12px;letter-spacing:.34em;
    color:var(--laton);font-weight:500;flex:none;
  }
  .brand h1{
    font-family:var(--disp);font-weight:500;font-size:23px;
    letter-spacing:-.01em;line-height:1.05;color:var(--papel);
  }
  .lang{margin-left:auto;border:1px solid var(--linea-osc);border-radius:3px;
    padding:5px 10px;font-size:11px;font-weight:700;letter-spacing:.08em;
    color:var(--laton);align-self:center}
  .lang:active{background:var(--tinta-2)}
  .brand small{display:none}

  .search{position:relative}
  .search input{
    width:100%;border:1px solid var(--linea-osc);background:var(--tinta-2);
    border-radius:4px;padding:12px 14px 12px 42px;color:var(--papel);
    outline:none;transition:border-color .2s;
  }
  .search input::placeholder{color:var(--gris-2)}
  .search input:focus{border-color:var(--laton)}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:17px;height:17px;stroke:var(--gris-2)}

  .chips{display:flex;gap:7px;overflow-x:auto;padding:14px 22px 6px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--linea-osc);background:transparent;
    border-radius:3px;padding:7px 13px;font-size:13px;font-weight:500;
    color:var(--gris);white-space:nowrap;transition:.18s;display:flex;gap:6px;align-items:center}
  .chip.on{background:var(--laton);color:var(--tinta);border-color:var(--laton);font-weight:600}
  .chip .em{display:none}

  /* ---------- Carta: la lista de platos ---------- */
  .wrap{background:var(--papel);border-radius:var(--r-g) var(--r-g) 0 0;
    margin-top:8px;padding:24px 22px 40px;min-height:72vh}
  .count{font-family:var(--disp);font-size:13px;color:var(--ink-2);
    margin:0 0 4px;letter-spacing:.02em}
  .count::after{content:"";display:block;height:2px;background:var(--tinta);margin-top:10px}

  .grid{display:block}
  .card{
    width:100%;text-align:left;background:transparent;border:none;
    padding:15px 0;border-bottom:1px solid var(--papel-linea);
    display:flex;gap:14px;align-items:flex-start;transition:opacity .15s;
  }
  .card:active{opacity:.55}
  .card .thumb{
    width:62px;height:62px;flex:none;border-radius:4px;
    display:grid;place-items:center;font-size:25px;position:relative;
    background-size:cover;background-position:center;
  }
  .card .fav{flex:none;width:34px;height:34px;display:grid;place-items:center;
    align-self:center;margin-left:4px}
  .card .fav svg{width:18px;height:18px;stroke:var(--papel-linea);fill:none;stroke-width:1.8;transition:stroke .2s}
  .card .fav.on svg{fill:var(--vino);stroke:var(--vino)}
  .card .body{flex:1;min-width:0}
  .card .cat{font-size:11px;font-weight:600;letter-spacing:.07em;color:var(--laton-osc)}
  .card h3{font-family:var(--disp);font-weight:500;font-size:18px;line-height:1.15;
    margin:4px 0 6px;letter-spacing:-.01em;color:var(--ink)}
  .card .meta{display:flex;gap:12px;font-size:12px;color:var(--ink-3)}

  .empty{text-align:center;color:var(--ink-3);padding:56px 20px;font-size:14.5px;line-height:1.6}
  .empty .em{font-size:34px;display:block;margin-bottom:12px;opacity:.5}

  /* ---------- Maridaje ---------- */
  .leyenda{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
  .pars{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .par{font-size:12px;padding:4px 9px;border-radius:2px;border:1px solid;white-space:nowrap}
  .par.puente   {border-color:rgba(122,154,160,.45);color:#9FBEC4}
  .par.refuerzo {border-color:rgba(160,120,78,.5); color:#C9A273}
  .par.corte    {border-color:rgba(126,154,110,.45);color:#A6C293}
  .par.contraste{border-color:rgba(150,74,86,.5);  color:#D8A6AC}
  .par.tradicion{border-color:rgba(184,145,79,.5); color:var(--laton)}
  .par.casa{border-color:rgba(184,145,79,.75);background:rgba(184,145,79,.12);color:var(--laton)}
  .firma{margin:0 0 20px;padding:13px 15px;background:rgba(184,145,79,.1);
    border-left:2px solid var(--laton);font-size:13.5px;line-height:1.6;
    color:rgba(242,237,228,.86)}
  .comp{padding:10px 0 2px 12px;border-left:1px solid rgba(184,145,79,.3);margin:10px 0 0}
  .comp-n{font-family:var(--disp);font-weight:500;font-size:15px;color:var(--papel);margin-bottom:7px}
  .comp-como{font-size:12.5px;line-height:1.6;color:rgba(242,237,228,.6);margin:8px 0 0}
  .base .para{font-size:13px;line-height:1.55;color:rgba(242,237,228,.68);margin:10px 0 0}
  .base .para em{font-style:normal;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--laton);opacity:.8;margin-right:5px}
  .base .como{font-size:13.5px;line-height:1.6;color:rgba(242,237,228,.58);margin:8px 0 0}
  .par.si{background:rgba(242,237,228,.1);font-weight:500}
  .par.audaz{border-style:dashed}
  .mar .como{color:rgba(242,237,228,.6);font-size:13px}
  .ftab.solo{display:block;margin:0 0 16px}
  .heredado{font-size:11px;letter-spacing:.06em;color:var(--laton);opacity:.75;margin:6px 0 0}
  #qMar{width:100%;min-width:0;background:rgba(242,237,228,.05);color:var(--papel);
    border:1px solid rgba(242,237,228,.16);border-radius:2px;padding:11px 13px;
    font-family:var(--cuerpo);font-size:15px}
  #qMar:focus{outline:none;border-color:var(--laton)}
  #sugiere:empty{display:none}
  #sugiere .sug-sub{font-size:12.5px;line-height:1.5;color:rgba(21,24,26,.5);margin:0 0 10px}
  .pill.sug{border-style:dashed;border-color:rgba(184,145,79,.6);color:#8A6A2E}
  .sug-rol{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(21,24,26,.42);margin:12px 0 7px}
  .sug-rol:first-of-type{margin-top:4px}
  .pill.sug i{display:block;font-style:normal;font-size:10px;letter-spacing:.07em;
    text-transform:uppercase;opacity:.7;margin-top:2px}

  /* ---------- Pastas y anatomía ---------- */
  .plato h3{font-family:var(--disp);font-weight:500;font-size:23px;color:var(--papel);
    margin:0 0 8px;line-height:1.15}
  .plato > .como{font-size:14px;line-height:1.6;color:rgba(242,237,228,.76);margin:0 0 16px}
  .parte{display:grid;grid-template-columns:minmax(78px,26%) 1fr;gap:12px;
    padding:11px 0;border-top:1px solid rgba(242,237,228,.07)}
  .parte b{font-family:var(--disp);font-weight:500;font-size:15px;color:var(--laton);
    min-width:0;line-height:1.3}
  .parte b i{font-style:normal;opacity:.8}
  .parte span{font-size:13px;line-height:1.55;color:rgba(242,237,228,.72);min-width:0}
  @media (max-width:360px){ .parte{grid-template-columns:1fr;gap:2px} }

  /* ---------- Seguridad, rendimiento y despiece ---------- */
  .pasos{list-style:none;counter-reset:p;margin:0;padding:0}
  .pasos li{counter-increment:p;display:grid;grid-template-columns:22px 1fr;gap:3px 11px;
    padding:12px 0;border-bottom:1px solid rgba(242,237,228,.07)}
  .pasos li::before{content:counter(p);grid-row:span 2;font-family:var(--disp);font-size:15px;
    color:var(--laton);opacity:.8;padding-top:1px}
  .pasos b{font-family:var(--disp);font-weight:500;font-size:16px;color:var(--papel)}
  .pasos span{font-size:13.5px;line-height:1.55;color:rgba(242,237,228,.72)}
  .alerta{margin:22px 0 4px;padding:14px 16px;background:rgba(110,42,51,.22);
    border-left:2px solid #A4545F}
  .alerta .tc-k{color:#E0A9AF}
  .alerta p{font-size:13.5px;line-height:1.55;color:rgba(242,237,228,.84);margin:5px 0 0}
  .zona{padding:12px 0 12px 12px;border-left:2px solid rgba(242,237,228,.18);margin-bottom:4px}
  .zona.alerta{background:none;padding:12px 0 12px 12px;margin:0 0 4px;border-left-color:#C98A3C}
  .zona.alerta .grados{color:#D9A45F}
  .zona.bien{border-left-color:var(--laton)}
  .zona.frio{border-left-color:#6D93A8}
  .zona.frio .grados{color:#8FB4C8}
  .zona .como{font-size:13px;line-height:1.5;color:rgba(242,237,228,.6);margin:4px 0 0}
  .claves{list-style:none;margin:10px 0 0;padding:0}
  .claves li{position:relative;padding:5px 0 5px 16px;font-size:13px;line-height:1.5;
    color:rgba(242,237,228,.62)}
  .claves li::before{content:'';position:absolute;left:0;top:12px;width:5px;height:5px;
    border-radius:50%;background:var(--laton);opacity:.7}
  .formula{margin:14px 0 18px;padding:12px 14px;border:1px solid rgba(184,145,79,.35);
    border-radius:2px;font-size:13.5px;color:var(--laton);text-align:center;
    font-variant-numeric:tabular-nums}
  .calc{margin:0 0 20px}
  .calc label{display:block;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(242,237,228,.45);margin-bottom:7px}
  .calc-in{display:flex;align-items:center;gap:9px}
  .calc-in input{flex:1;min-width:0;background:rgba(242,237,228,.05);color:var(--papel);
    border:1px solid rgba(242,237,228,.16);border-radius:2px;padding:11px 13px;
    font-family:var(--disp);font-size:21px;font-variant-numeric:tabular-nums}
  .calc-in input:focus{outline:none;border-color:var(--laton)}
  .calc-in span{font-size:13px;color:rgba(242,237,228,.5);flex:none}
  .rend .met b{font-family:var(--disp);font-weight:500;font-size:17px;color:var(--papel);
    font-variant-numeric:tabular-nums}
  .rend .met span:last-child b{color:#D8A6AC}
  .ficha .item > .ojo{font-size:12.5px;line-height:1.55;color:var(--laton);margin:5px 0 0}
  .ficha .item > .ojo em{font-style:normal;font-size:9px;letter-spacing:.14em;
    text-transform:uppercase;opacity:.65;margin-right:4px}

  /* ---------- Fichas de cocina ---------- */
  .ficha .item{padding:15px 0;border-bottom:1px solid rgba(242,237,228,.07)}
  .ficha .fila{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
  .ficha .nombre{font-family:var(--disp);font-weight:500;font-size:18px;
    color:var(--papel);min-width:0}
  .ficha .item > .como{font-size:13.5px;line-height:1.55;
    color:rgba(242,237,228,.74);margin:8px 0 0}
  .ph-top{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .ph-top h2{margin:0;min-width:0}
  .libro.oscuro{margin:0;flex:none}
  .libro{width:34px;height:34px;border-radius:50%;border:1px solid rgba(21,24,26,.16);
    background:none;display:grid;place-items:center;margin-left:auto;margin-right:8px;
    flex:none;align-self:center}
  .libro svg{width:17px;height:17px;stroke:var(--tinta);opacity:.72}
  /* La barra de arriba es oscura: ahí el icono va claro o no se ve. */
  .topbar .libro{border-color:rgba(242,237,228,.22)}
  .topbar .libro svg{stroke:var(--papel);opacity:.8}
  .topbar .libro:active{background:rgba(242,237,228,.08)}
  .ftabs{display:flex;gap:7px;margin:0 0 8px;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    padding-right:max(16px,env(safe-area-inset-right,0px));
    margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
  .ftabs::-webkit-scrollbar{display:none}
  .ftab{flex:none;white-space:nowrap}
  .ftab{font-family:var(--cuerpo);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    background:none;color:rgba(242,237,228,.5);border:1px solid rgba(242,237,228,.14);
    border-radius:2px;padding:7px 12px}
  .ftab.on{background:rgba(184,145,79,.17);border-color:rgba(184,145,79,.55);color:var(--laton)}
  .ficha .h2sub{color:rgba(242,237,228,.5);font-size:13.5px;line-height:1.6;margin:14px 0 4px}
  .f-sec.mini{margin:16px 0 9px;border:none;padding:0}
  .grados{flex:none;font-family:var(--disp);font-size:19px;color:var(--laton);white-space:nowrap}
  .grados em{font-style:normal;font-size:11px;letter-spacing:.08em;color:rgba(242,237,228,.42)}
  .medida{flex:none;font-size:12px;letter-spacing:.1em;color:var(--laton);white-space:nowrap}
  .tc-g{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:4px}
  .tc-g span{font-size:13px;color:rgba(242,237,228,.76);font-variant-numeric:tabular-nums}
  .tc-g em{display:block;font-style:normal;font-size:9px;letter-spacing:.14em;
    text-transform:uppercase;color:rgba(242,237,228,.34);margin-bottom:1px}
  .escala{display:flex;align-items:center;gap:10px;margin:9px 0 2px;min-height:20px}
  .escala i{display:block;background:var(--laton);opacity:.75;border-radius:1px;flex:none}
  .met{display:flex;flex-wrap:wrap;gap:7px 20px;margin-top:3px}
  .met span{font-size:13px;color:rgba(242,237,228,.78)}
  .met em{display:block;font-style:normal;font-size:9px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--laton);opacity:.8;margin-bottom:1px}
  .salsa .base{font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--laton);margin:5px 0 8px}
  .coc-fila{display:flex;align-items:center;justify-content:space-between;gap:10px;
    width:100%;background:none;border:0;border-bottom:1px solid rgba(242,237,228,.07);
    padding:11px 0;text-align:left;cursor:pointer;color:inherit}
  .coc-n{font-family:var(--disp);font-weight:500;font-size:14.5px;color:var(--papel)}
  .coc-dep{flex:none;font-size:9.5px;letter-spacing:.1em;color:var(--laton);
    border:1px solid rgba(184,145,79,.4);border-radius:9px;padding:1px 6px}
  .coc-volver{background:none;border:0;color:var(--laton);font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;padding:0 0 12px;cursor:pointer}
  .coc-fam{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--laton)}
  .coc-tit{font-family:var(--disp);font-weight:400;font-size:23px;line-height:1.2;
    color:var(--papel);margin:5px 0 0}
  .coc-rinde{font-size:12px;color:rgba(242,237,228,.5);margin:5px 0 0}
  .coc-chips{display:flex;flex-wrap:wrap;gap:6px}
  .coc-chip{font-size:12px;border-radius:13px;padding:4px 11px;cursor:pointer;
    background:none;border:1px solid rgba(242,237,228,.18);color:rgba(242,237,228,.78)}
  .coc-chip.antes{border-color:rgba(184,145,79,.5);color:var(--laton)}
  /* Esta sección vive en ¿Qué cocino?, que es la pantalla CLARA: va con las
     variables del papel, no con los blancos de la ficha oscura. */
  .calc.cloro{display:flex;gap:10px}
  .calc.cloro .calc-in{flex:1}
  .calc.cloro label{display:block;font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--laton);margin-bottom:4px}
  .cl-salida{margin:12px 0 4px}
  .cl-fila{display:flex;align-items:baseline;gap:9px;padding:7px 0;
    border-bottom:1px solid rgba(242,237,228,.07)}
  .cl-fila .cl-para{flex:1;font-size:12.5px;color:rgba(242,237,228,.78)}
  .cl-fila b{font-family:var(--disp);font-size:17px;color:var(--laton);
    font-variant-numeric:tabular-nums}
  .cl-fila .cl-cdta{font-size:11px;color:rgba(242,237,228,.45);min-width:74px;text-align:right}
  .cl-vacio{font-size:12.5px;color:rgba(242,237,228,.45)}
  .step .tx .corte{font-weight:600;color:var(--laton-osc);cursor:pointer;
    border-bottom:1px dotted var(--laton)}
  .nutri{margin:18px 0;padding:14px 15px;border-radius:7px;
    background:var(--papel-2);border:1px solid var(--papel-linea)}
  .nu-sub{font-size:11.5px;color:var(--ink-2);opacity:.75;margin:5px 0 11px}
  .nu-g{display:grid;grid-template-columns:repeat(3,1fr);gap:9px 6px}
  .nu-f{text-align:center;padding:7px 2px;border-radius:5px;background:var(--papel)}
  .nu-f span{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-2);opacity:.7;margin-bottom:3px}
  .nu-f b{font-family:var(--disp);font-weight:500;font-size:17px;color:var(--ink);
    font-variant-numeric:tabular-nums}
  .nu-f b em{font-style:normal;font-size:10px;color:var(--ink-2);margin-left:1px}
  .nu-al{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:12px;
    padding-top:11px;border-top:1px solid var(--papel-linea)}
  .nu-al-t{font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--laton-osc);margin-right:3px}
  .nu-x{font-size:11px;padding:2px 8px;border-radius:10px;
    border:1px solid rgba(184,145,79,.45);color:var(--laton-osc)}
  .nu-ojo{font-size:10.5px;line-height:1.5;color:var(--ink-2);opacity:.6;margin:10px 0 0}
  .anat{margin:18px 0;padding:14px 15px;border-radius:7px;
    background:var(--papel-2);border:1px solid var(--papel-linea)}
  .anat-q{font-size:13px;line-height:1.65;color:var(--ink-2);margin:6px 0 11px}
  .anat .parte{display:flex;gap:10px;align-items:baseline;padding:6px 0;
    border-top:1px solid var(--papel-linea)}
  .anat .parte b{flex:none;min-width:88px;font-family:var(--disp);font-weight:600;
    font-size:13px;color:var(--ink)}
  .anat .parte span{font-size:12.5px;line-height:1.6;color:var(--ink-2)}
  .sust{display:flex;flex-wrap:wrap;align-items:center;gap:5px;
    padding:0 0 9px 14px;margin-top:-4px}
  .sust-x{font-size:11.5px;padding:2px 8px;border-radius:11px;cursor:pointer;
    background:none;border:1px solid var(--papel-linea);color:var(--ink-2)}
  .sust-x.apuro{border-style:dashed;opacity:.72}
  .sust-x.si{border-color:var(--laton);color:var(--laton-osc);font-weight:600}
  .lo-plan{display:block;width:100%;text-align:left;background:none;border:0;
    border-bottom:1px solid rgba(242,237,228,.08);padding:15px 0;cursor:pointer;color:inherit}
  .lo-n{font-family:var(--disp);font-weight:500;font-size:17px;color:var(--papel)}
  .lo-q{font-size:13px;line-height:1.6;color:rgba(242,237,228,.68);margin:6px 0 0}
  .lo-m{display:flex;gap:7px;margin-top:9px}
  .lo-m span{font-size:10.5px;letter-spacing:.06em;color:var(--laton);
    border:1px solid rgba(184,145,79,.35);border-radius:11px;padding:2px 9px}
  .lo-base{padding:13px 0;border-bottom:1px solid rgba(242,237,228,.07)}
  .lo-rinde{font-size:12.5px;color:var(--laton);margin:5px 0 0}
  .lo-dura{font-size:12px;color:rgba(242,237,228,.6);margin:4px 0 0}
  .lo-dura em{font-style:normal;font-size:9px;letter-spacing:.11em;text-transform:uppercase;
    color:rgba(242,237,228,.4);margin-right:4px}
  .lo-ir,.lo-plato{background:none;border:0;cursor:pointer;color:var(--laton);
    font-size:11.5px;letter-spacing:.04em}
  .lo-plato{font-family:var(--disp);font-size:16px;padding:5px 0 0;text-align:left;
    text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(184,145,79,.4)}
  .lo-dia{padding:14px 0;border-bottom:1px solid rgba(242,237,228,.07)}
  .lo-d-top{display:flex;align-items:center;gap:8px}
  .lo-d-top b{font-family:var(--disp);font-weight:500;font-size:13px;color:var(--papel);
    letter-spacing:.04em;flex:1}
  .lo-min{font-size:10.5px;color:var(--laton);font-variant-numeric:tabular-nums}
  .lo-t{font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:9px}
  .lo-t.cal{background:rgba(184,145,79,.18);color:var(--laton-claro)}
  .lo-t.frio{background:rgba(155,175,185,.15);color:#9BB0BA}
  .lo-desde{font-size:11px;color:rgba(242,237,228,.45);margin:4px 0 6px}
  .lo-desde b{color:rgba(242,237,228,.72);font-weight:500}
  .lo-nu{font-size:11px;color:rgba(242,237,228,.5);margin-top:7px;
    font-variant-numeric:tabular-nums}
  .lo-c{display:flex;align-items:baseline;gap:9px;padding:6px 0;
    border-bottom:1px solid rgba(242,237,228,.05)}
  .lo-c-n{flex:1;font-size:13px;color:rgba(242,237,228,.85)}
  .lo-c b{font-family:var(--disp);font-size:14px;color:var(--laton);
    font-variant-numeric:tabular-nums}
  .lo-c em{font-style:normal;font-size:10px;color:rgba(242,237,228,.4);
    min-width:112px;text-align:right}
  .pgroup.hechos .gt{color:var(--laton-osc)}
  .pgroup.hechos .gsub{font-size:11.5px;line-height:1.55;color:var(--ink-2);
    margin:0 0 10px;opacity:.8}
  .pill.hecho{border-color:var(--laton);color:var(--laton-osc)}
  .pill.hecho.on{background:var(--laton);border-color:var(--laton);
    color:var(--tinta);font-weight:600}
  .coc-chip.corte{border-color:rgba(242,237,228,.22)}
  .coc-chip.corte.audaz{border-style:dashed;color:rgba(242,237,228,.6)}
  .coc-cuantos{font-size:12px;color:var(--laton);margin:0 0 7px}
  .coc-sub{font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:rgba(242,237,228,.4);margin:10px 0 6px}
  .coc-para{font-size:13.5px;line-height:1.7;color:rgba(242,237,228,.86);margin:0}
  .coc-esc{display:flex;gap:6px;margin-bottom:9px}
  .coc-esc .esc{font-size:12px;padding:3px 11px;border-radius:12px;cursor:pointer;
    background:none;border:1px solid rgba(242,237,228,.18);color:rgba(242,237,228,.6)}
  .coc-esc .esc.on{border-color:var(--laton);color:var(--laton)}
  .coc-ing{width:100%;border-collapse:collapse;font-size:13px}
  .coc-ing td{padding:4px 0;border-bottom:1px solid rgba(242,237,228,.05);
    color:rgba(242,237,228,.82);vertical-align:baseline}
  .coc-ing td.c{width:88px;color:var(--laton);font-variant-numeric:tabular-nums;white-space:nowrap}
  .coc-eq{padding:8px 0;border-bottom:1px solid rgba(242,237,228,.05)}
  .coc-eq-q{font-size:13px;color:rgba(242,237,228,.9)}
  .coc-eq-q b{font-weight:500;color:var(--laton)}
  .coc-eq-p{font-size:12px;line-height:1.55;color:rgba(242,237,228,.55);margin:3px 0 0}
  .coc-mise{margin:0;padding-left:17px;font-size:13px;line-height:1.65;color:rgba(242,237,228,.72)}
  .coc-prep{margin:0;padding-left:17px;font-size:13.5px;line-height:1.7;color:rgba(242,237,228,.86)}
  .coc-prep li{margin-bottom:5px}
  .coc-tip{font-size:12.5px;line-height:1.6;color:rgba(242,237,228,.6);margin:5px 0 0}
  .coc-nota{margin-top:15px;padding:11px 13px;border-radius:7px;
    background:rgba(184,145,79,.08);border:1px solid rgba(184,145,79,.22)}
  .coc-nota p{font-size:12.5px;line-height:1.6;color:rgba(242,237,228,.75);margin:5px 0 0}
  .der{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-top:1px solid rgba(242,237,228,.06)}
  .der b{font-family:var(--disp);font-weight:500;font-size:14.5px;color:var(--papel);flex:none}
  .der span{font-size:12.5px;color:rgba(242,237,228,.6);min-width:0}
  .mp{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:7px;padding-top:8px;
    border-top:1px dotted rgba(242,237,228,.12)}
  .mp span{font-size:12px;color:rgba(242,237,228,.6)}
  .mp em{display:block;font-style:normal;font-size:9px;letter-spacing:.14em;
    text-transform:uppercase;color:rgba(242,237,228,.3);margin-bottom:1px}
  .rz{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .rz span{font-size:12.5px;padding:5px 10px;border-radius:2px;
    border:1px solid rgba(242,237,228,.13);color:rgba(242,237,228,.66)}
  .rz span.si{border-color:rgba(184,145,79,.5);background:rgba(184,145,79,.13);color:var(--laton)}
  .rz i{font-style:normal;font-size:10px;letter-spacing:.07em;opacity:.75}
  .tempcard.crudo{border-left-color:#2b6a8f}
.tempcard{margin:16px 0 0;padding:14px 16px;background:rgba(21,24,26,.05);
    border-left:2px solid var(--laton)}
  .tc-k{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--laton);margin-bottom:5px}
  .tc-n{font-family:var(--disp);font-weight:500;font-size:26px;color:var(--tinta);line-height:1.1}
  .tc-n em{font-style:normal;font-family:var(--cuerpo);font-size:11.5px;letter-spacing:.07em;
    color:rgba(21,24,26,.5);margin-left:9px}
  .tempcard p{font-size:13px;line-height:1.55;color:rgba(21,24,26,.66);margin:7px 0 0}
  .tempcard .tc-g span{color:rgba(21,24,26,.72)}
  .tempcard .tc-g em{color:rgba(21,24,26,.4)}
  .realza{margin:16px 0 0}
  .realza .tc-k{color:rgba(21,24,26,.45)}
  .realza .rz span{border-color:rgba(21,24,26,.14);color:rgba(21,24,26,.6)}
  .realza .rz span.si{border-color:rgba(184,145,79,.6);background:rgba(184,145,79,.13);color:#8A6A2E}

  /* ---------- Ficha de cortes y cocciones ---------- */
  .pill .aka{display:block;font-style:normal;font-size:10px;letter-spacing:.06em;
    text-transform:uppercase;opacity:.55;margin-top:2px}
  .gi{width:17px;height:17px;border-radius:50%;border:1px solid var(--laton);
    color:var(--laton);background:none;font-family:var(--disp);font-size:11px;
    line-height:1;margin-left:8px;vertical-align:middle;cursor:pointer}
  .ficha{padding:max(22px,env(safe-area-inset-top)) 22px 56px;position:relative}
  .back.fx{position:static;background:none;border:1px solid rgba(242,237,228,.22);margin-bottom:20px}
  .f-cat{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--laton);margin-bottom:6px}
  .ficha h2{font-family:var(--disp);font-weight:500;font-size:30px;line-height:1.12;
    color:var(--papel);margin:0 0 26px}
  .f-sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(242,237,228,.4);
    margin:30px 0 14px;padding-bottom:7px;border-bottom:1px solid rgba(242,237,228,.1)}
  .fc{padding:13px 0;border-bottom:1px solid rgba(242,237,228,.07)}
  .fc-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .fc-top b{font-family:var(--disp);font-weight:500;font-size:17px;color:var(--papel)}
  .coc{flex:none;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
    padding:3px 8px;border-radius:2px;white-space:nowrap}
  .coc.rapida{background:rgba(184,145,79,.17);color:var(--laton)}
  .coc.lenta{background:rgba(110,42,51,.3);color:#D8A6AC}
  .coc.ambos{background:rgba(242,237,228,.08);color:rgba(242,237,228,.6)}
  .fc-eq{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:8px}
  .fc-eq span{font-size:12.5px;color:rgba(242,237,228,.72)}
  .fc-eq em{display:block;font-style:normal;font-size:9px;letter-spacing:.14em;
    text-transform:uppercase;color:rgba(242,237,228,.34);margin-bottom:1px}
  .fc-eq .dudoso{font-size:11px;color:var(--laton);opacity:.8;align-self:flex-end}
  .ff{padding:16px 0;border-bottom:1px solid rgba(242,237,228,.07)}
  .ff h4{font-family:var(--disp);font-weight:500;font-size:18px;color:var(--papel);margin:0 0 7px}
  .ff .como{font-size:14px;line-height:1.55;color:rgba(242,237,228,.8);margin:0 0 7px}
  .ff .ojo{font-size:13.5px;line-height:1.55;color:var(--laton);margin:0 0 9px}
  .ff .quienes{font-size:11.5px;line-height:1.6;color:rgba(242,237,228,.42);margin:0}
  .f-pie{font-size:12px;line-height:1.6;color:rgba(242,237,228,.38);margin:30px 0 0;
    padding-top:16px;border-top:1px solid rgba(242,237,228,.1)}
  .previo{font-size:12.5px;line-height:1.5;color:var(--laton);
    border-left:2px solid var(--laton);padding:2px 0 2px 11px;margin:12px 0 0}

  /* ---------- Ficha del plato ---------- */
  .sheet{position:fixed;inset:0;z-index:40;background:var(--tinta);overflow-y:auto;
    transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
  .sheet.open{transform:translateX(0)}
  .sheet-inner{max-width:680px;margin:0 auto}
  .hero{padding:72px 24px 52px;display:grid;place-items:center;font-size:62px;position:relative;
    background-size:cover;background-position:center}
  .back,.heart-top{position:absolute;top:max(16px,env(safe-area-inset-top));
    width:38px;height:38px;border-radius:50%;background:rgba(21,24,26,.6);
    backdrop-filter:blur(8px);display:grid;place-items:center;z-index:2}
  .back{left:16px} .heart-top{right:16px}
  .back svg{width:18px;height:18px;stroke:var(--papel);stroke-width:2.2;fill:none}
  .heart-top svg{width:17px;height:17px;stroke:var(--laton-claro);fill:none;stroke-width:2.2}
  .heart-top.on svg{fill:var(--laton-claro)}

  .detail{background:var(--papel);border-radius:var(--r-g) var(--r-g) 0 0;margin-top:-22px;
    padding:28px 24px 44px;position:relative;min-height:62vh}
  .d-cat{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--laton-osc)}
  .detail h2{font-family:var(--disp);font-weight:500;font-size:29px;line-height:1.08;
    letter-spacing:-.02em;margin:7px 0 5px;color:var(--ink)}
  .d-country{color:var(--ink-3);font-size:13.5px}
  .corte{color:var(--vino);font-weight:600}

  .stats{display:flex;gap:0;margin:22px 0 4px;border-top:2px solid var(--tinta);
    border-bottom:1px solid var(--papel-linea)}
  .stat{flex:1;padding:12px 0;text-align:center;border-right:1px solid var(--papel-linea)}
  .stat:last-child{border-right:none}
  .stat .k{font-size:10.5px;letter-spacing:.08em;color:var(--ink-3)}
  .stat .v{font-family:var(--disp);font-weight:600;font-size:16px;margin-top:3px;color:var(--ink)}

  .scaler-card{border:1px solid var(--papel-linea);border-radius:var(--r);padding:14px 16px;
    margin:22px 0;display:flex;align-items:center;justify-content:space-between;background:var(--papel-2)}
  .scaler-card .lab{font-size:12px;color:var(--ink-3)}
  .scaler-card .lab b{display:block;font-family:var(--disp);font-size:17px;color:var(--ink);
    font-weight:500;margin-top:2px}
  .stepper{display:flex;align-items:center;background:var(--papel);
    border:1px solid var(--papel-linea);border-radius:100px;overflow:hidden}
  .stepper button{width:44px;height:44px;font-size:21px;color:var(--laton-osc);
    font-weight:500;display:grid;place-items:center}
  .stepper button:active{background:var(--papel-linea)}
  .stepper .num{font-family:var(--disp);font-weight:600;font-size:18px;min-width:34px;text-align:center;color:var(--ink)}

  .sec-title{font-family:var(--disp);font-weight:500;font-size:20px;margin:30px 0 4px;
    letter-spacing:-.01em;color:var(--ink)}
  .sec-title::after{content:"";display:block;height:2px;background:var(--tinta);margin-top:10px}

  /* Ingredientes como línea de carta, con puntos guía */
  .ing{display:flex;align-items:baseline;gap:9px;padding:10px 0;
    border-bottom:1px solid var(--papel-linea)}
  .ing .q{font-family:var(--disp);font-weight:600;font-size:14.5px;color:var(--laton-osc);
    flex:none;transition:color .25s;white-space:nowrap}
  .ing .n{font-size:14.5px;color:var(--ink)}
  .ing .fill{flex:1;border-bottom:1.5px dotted var(--papel-linea);transform:translateY(-4px)}
  .ing.flash .q{color:var(--vino)}

  .step{display:flex;gap:15px;padding:15px 0;border-bottom:1px solid var(--papel-linea)}
  .step .no{font-family:var(--disp);font-weight:600;color:var(--laton-osc);font-size:15px;
    flex:none;width:27px;text-align:center;line-height:1.5}
  .step .tx{font-size:15px;line-height:1.6;color:var(--ink)}
  .step .tmr{margin-top:9px;display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--papel-linea);border-radius:3px;padding:5px 10px;
    font-size:12px;font-weight:600;color:var(--vino)}
  .step .tmr svg{width:13px;height:13px;stroke:var(--vino);fill:none;stroke-width:2}

  .tip{background:var(--tinta);color:var(--papel);border-radius:var(--r);
    padding:18px 18px;margin-top:26px;font-size:14px;line-height:1.65}
  .tip b{color:var(--laton-claro);font-family:var(--disp);font-weight:600;
    display:block;margin-bottom:5px;font-size:12px;letter-spacing:.1em}

  .cook-btn{position:sticky;bottom:18px;width:100%;margin-top:28px;
    background:var(--tinta);color:var(--laton-claro);border:1px solid var(--laton-osc);
    border-radius:4px;padding:17px;font-weight:600;font-size:14.5px;letter-spacing:.04em;
    box-shadow:var(--sh-alta);display:flex;align-items:center;justify-content:center;gap:10px}
  .cook-btn:active{background:var(--tinta-2)}

  /* ---------- Modo cocina ---------- */
  .cook{position:fixed;inset:0;z-index:60;background:var(--tinta);color:var(--papel);
    display:none;flex-direction:column;padding:max(22px,env(safe-area-inset-top)) 26px 32px}
  .cook.open{display:flex}
  .cook-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:auto}
  .cook-top .x{width:38px;height:38px;border-radius:50%;background:var(--tinta-2);
    display:grid;place-items:center}
  .cook-top .x svg{width:18px;height:18px;stroke:var(--papel);stroke-width:2.2}
  .cook-dots{display:flex;gap:6px;flex-wrap:wrap;max-width:62%;justify-content:center}
  .cook-dots span{width:6px;height:6px;border-radius:50%;background:var(--linea-osc)}
  .cook-dots span.on{background:var(--laton)}
  .cook-dots span.done{background:var(--papel)}
  .cook-body{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
  .cook-no{font-family:var(--disp);font-size:12px;letter-spacing:.24em;color:var(--laton)}
  .cook-tx{font-family:var(--disp);font-weight:500;font-size:26px;line-height:1.38;
    margin-top:18px;color:var(--papel)}
  .cook-timer{margin:28px auto 0;font-family:var(--disp);font-weight:600;font-size:50px;
    letter-spacing:.02em;color:var(--laton-claro);display:none}
  .cook-timer.on{display:block}
  .cook-timer-btn{margin:20px auto 0;background:transparent;color:var(--laton-claro);
    border:1px solid var(--laton-osc);border-radius:100px;padding:11px 24px;
    font-size:13.5px;font-weight:600;display:none}
  .cook-timer-btn.show{display:inline-block}
  .cook-nav{display:flex;gap:12px;margin-top:auto}
  .cook-nav button{flex:1;border-radius:4px;padding:17px;font-weight:600;font-size:14.5px;letter-spacing:.03em}
  .cook-nav .prev{background:var(--tinta-2);color:var(--gris)}
  .cook-nav .next{background:var(--laton);color:var(--tinta)}

  /* ---------- Barra inferior ---------- */
  .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:rgba(21,24,26,.95);backdrop-filter:blur(14px);border-top:1px solid var(--linea-osc);
    display:flex;max-width:680px;margin:0 auto;padding:9px 8px max(10px,env(safe-area-inset-bottom))}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:5px 0;
    color:var(--gris-2);font-size:10px;font-weight:600;letter-spacing:.02em}
  .tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6}
  .tab.on{color:var(--laton)}
  .tab.add .ic{width:44px;height:36px;border-radius:4px;background:var(--laton);
    display:grid;place-items:center;margin-top:-12px}
  .tab.add svg{stroke:var(--tinta);stroke-width:2.2}
  .tab.add{color:var(--gris-2)}

  /* ---------- Despensa ---------- */
  .pantry{background:var(--papel);border-radius:var(--r-g) var(--r-g) 0 0;
    margin-top:8px;padding:26px 22px 40px;min-height:80vh}
  .pantry-head{margin-bottom:20px}
  .pantry-head h2{font-family:var(--disp);font-weight:500;font-size:27px;
    letter-spacing:-.02em;color:var(--ink);line-height:1.1}
  .pantry-head p{color:var(--ink-3);font-size:13.5px;margin-top:7px;line-height:1.5}
  .pgroup{margin-bottom:20px}
  .pgroup .gt{font-family:var(--disp);font-size:14px;font-weight:600;color:var(--ink);
    margin-bottom:10px;display:flex;align-items:center;gap:8px;
    padding-bottom:7px;border-bottom:1px solid var(--papel-linea)}
  .pgroup .gt .n{background:var(--laton-osc);color:var(--papel);border-radius:2px;
    padding:1px 7px;font-size:10.5px;font-family:var(--body);font-weight:700}
  .pills{display:flex;flex-wrap:wrap;gap:6px}
  .pill{border:1px solid var(--papel-linea);background:var(--papel-2);border-radius:3px;
    padding:7px 12px;font-size:12.5px;font-weight:500;color:var(--ink-2);transition:.15s}
  .pill.on{background:var(--tinta);border-color:var(--tinta);color:var(--papel);font-weight:600}
  .pill.eq.on{background:var(--laton);border-color:var(--laton);color:var(--tinta)}
  .pill.mas{border-style:dashed;color:var(--laton-osc);font-weight:600}
  .psearch{margin-bottom:18px}
  .psearch input{width:100%;border:1px solid var(--papel-linea);background:var(--papel-2);
    border-radius:4px;padding:12px 14px;outline:none;color:var(--ink)}
  .psearch input:focus{border-color:var(--laton-osc)}

  .pantry-bar{position:sticky;bottom:84px;z-index:15;padding-top:10px;
    background:linear-gradient(to top,var(--papel) 68%,transparent)}

  .res-card .tec{font-size:11px;font-weight:600;letter-spacing:.07em;color:var(--laton-osc)}

  .res-card .rmeta{font-size:12px;color:var(--ink-3);display:flex;gap:12px;flex-wrap:wrap}
  .miss{margin-top:8px;font-size:12.5px;color:var(--vino);font-weight:500}

  .ai-box{border-top:2px solid var(--tinta);padding:22px 0 8px;margin-top:30px}
  .ai-box h4{font-family:var(--disp);font-size:19px;font-weight:500;margin-bottom:6px;color:var(--ink)}
  .ai-box p{font-size:13px;color:var(--ink-3);line-height:1.55;margin-bottom:14px}
  .ai-btn{width:100%;background:var(--vino);color:var(--papel);border-radius:4px;
    padding:15px;font-weight:600;font-size:14px;letter-spacing:.03em}
  .ai-btn:disabled{opacity:.5}
  .ai-out{margin-top:18px;font-size:14.5px;line-height:1.65;color:var(--ink);white-space:pre-wrap}
  .ai-cfg{display:none}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(242,237,228,.3);
    border-top-color:var(--papel);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- Formulario ---------- */
  .form{background:var(--papel);border-radius:var(--r-g) var(--r-g) 0 0;
    margin-top:0;padding:24px 22px 44px;min-height:100vh}
  .form h2{font-family:var(--disp);font-weight:500;font-size:26px;margin-bottom:5px;color:var(--ink)}
  .form .sub{color:var(--ink-3);font-size:13.5px;margin-bottom:22px}
  .fld{margin-bottom:15px}
  .fld label{display:block;font-size:12px;font-weight:600;color:var(--ink-3);
    margin-bottom:6px;letter-spacing:.04em}
  .fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--papel-linea);
    background:var(--papel-2);border-radius:4px;padding:12px 14px;color:var(--ink);outline:none}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--laton-osc)}
  .row2{display:flex;gap:10px}.row2>*{flex:1}
  .dyn-row{display:flex;gap:8px;margin-bottom:8px}
  .dyn-row input{flex:1;border:1px solid var(--papel-linea);background:var(--papel-2);
    border-radius:4px;padding:11px 12px;color:var(--ink);outline:none}
  .dyn-row .q{flex:none;width:88px}
  .dyn-row .del{flex:none;width:42px;border:1px solid var(--papel-linea);
    border-radius:4px;color:var(--vino);font-size:17px;background:var(--papel-2)}
  .addline{font-size:12.5px;font-weight:600;color:var(--laton-osc);padding:9px 0}
  .save{width:100%;background:var(--tinta);color:var(--laton-claro);border-radius:4px;
    padding:17px;font-weight:600;font-size:14.5px;letter-spacing:.03em;margin-top:12px}
  .ghost{width:100%;background:transparent;border:1px solid var(--papel-linea);
    border-radius:4px;padding:14px;font-weight:600;color:var(--ink-3);margin-top:10px}

  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(16px);
    background:var(--tinta);color:var(--laton-claro);padding:13px 22px;border-radius:4px;
    font-size:13px;font-weight:500;opacity:0;transition:.3s;z-index:80;pointer-events:none;
    box-shadow:var(--sh-alta)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <span class="brand-mark">SIETE SABORES</span>
      <h1 id="tituloCarta">Carta</h1>
      <button class="libro" id="fichasBtn" aria-label="Fichas">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M4 4h7a2 2 0 012 2v14a2 2 0 00-2-2H4zM20 4h-7a2 2 0 00-2 2v14a2 2 0 012-2h7z"/></svg>
      </button>
      <button class="lang" id="langBtn" aria-label="Idioma"></button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="" autocomplete="off">
    </div>
  </div>

  <div class="chips" id="chips"></div>

  <div class="wrap">
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- Detail sheet -->
<div class="sheet" id="sheet"><div class="sheet-inner" id="sheetInner"></div></div>

<!-- Cook mode -->
<div class="cook" id="cook">
  <div class="cook-top">
    <button class="x" id="cookClose" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="cook-dots" id="cookDots"></div>
    <div style="width:40px"></div>
  </div>
  <div class="cook-body">
    <div class="cook-no" id="cookNo"></div>
    <div class="cook-tx" id="cookTx"></div>
    <div class="cook-timer" id="cookTimer"></div>
    <button class="cook-timer-btn" id="cookTimerBtn"></button>
  </div>
  <div class="cook-nav">
    <button class="prev" id="cookPrev">Anterior</button>
    <button class="next" id="cookNext">Siguiente</button>
  </div>
</div>

<!-- Tab bar -->
<nav class="tabbar" id="tabbar"></nav>

<div class="toast" id="toast"></div>

<script>
/* ============ Storage (safe: works on Netlify, degrades in preview) ============ */
const store = {
  get(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

/* ============================================================
   IDIOMAS
   Los textos viven en idiomas.json y las recetas traducidas en
   textos.<idioma>.json. Para sumar un idioma basta con agregar
   esos dos bloques: el código no cambia.
   ============================================================ */
const IDIOMAS = [
  {id:'es', nombre:'Español'},
  {id:'en', nombre:'English'},
];
let DICC = null;                 // diccionarios del idioma activo
let TEXTOS = null;               // recetas traducidas del idioma activo

function idiomaGuardado(){
  const g = store.get('rec_idioma', null);
  if (g && IDIOMAS.some(i => i.id === g)) return g;
  const nav = (navigator.language || 'es').slice(0,2).toLowerCase();
  return IDIOMAS.some(i => i.id === nav) ? nav : 'es';
}
let IDIOMA = idiomaGuardado();

/* t('clave') devuelve el texto de interfaz en el idioma activo */
const t = k => (DICC && DICC.ui && DICC.ui[k] !== undefined) ? DICC.ui[k] : k;
/* Traducción de los catálogos cerrados */
// Un ingrediente puede ser otra preparación del árbol (la bordalesa lleva
// demi-glace), y entonces su nombre vive en cocina.json, no en el catálogo.
// Esto lo usan las fichas de receta para no imprimir el id crudo.
const esInsumoConocido = id =>
  !!((typeof ING !== 'undefined' && ING[id]) ||
     (typeof COCINA !== 'undefined' && COCINA && COCINA[id] && COCINA[id].nivel) ||
     recetaPorId(id));
const trIng  = id => (DICC && DICC.ing && DICC.ing[id]) ||
                     (typeof COCINA !== 'undefined' && COCINA && COCINA[id] && COCINA[id].n) ||
                     (recetaPorId(id) || {}).name || id;
const trEq   = id => (DICC && DICC.eq   && DICC.eq[id])   || id;
const trCat  = id => (DICC && DICC.cat  && DICC.cat[id])  || id;
const trTec  = v  => (DICC && DICC.tec  && DICC.tec[v] !== undefined) ? DICC.tec[v] : v;
const trPais = v  => (DICC && DICC.pais && DICC.pais[v])  || v;
const trGrupo= v  => (DICC && DICC.grupos && DICC.grupos[v]) || v;
const trFam  = f  => (DICC && DICC.fam && DICC.fam[f]) || FAMCOC[f];
const trUni  = u  => (DICC && DICC.uni && DICC.uni[u] !== undefined) ? DICC.uni[u] : u;
const DIF_K = {'Fácil':'facil','Media':'media','Difícil':'dificil'};
const trDif  = v  => DIF_K[v] ? t(DIF_K[v]) : v;

async function cargarIdioma(id){
  const res = await fetch('idiomas.json', {cache:'no-cache'});
  const todos = await res.json();
  DICC = todos[id] || todos.es;
  TEXTOS = null;
  if (id !== 'es') {
    try{
      const r2 = await fetch('textos.' + id + '.json', {cache:'no-cache'});
      if (r2.ok) TEXTOS = await r2.json();
    }catch(e){ TEXTOS = null; }
  }
}

/* Aplica la traducción de una receta sobre su versión en español.
   La técnica, el país y los insumos se traducen por diccionario,
   así que aquí solo van nombre, pasos y tip:  [name, [pasos], tip]  */
function trReceta(r){
  if (!TEXTOS) return r;
  const x = TEXTOS[r.id];
  if (!x) return r;
  return Object.assign({}, r, {
    name: x[0] || r.name,
    pasos: (x[1] && x[1].length === r.pasos.length)
            ? r.pasos.map((p,i) => p.length > 1 ? [x[1][i], p[1]] : [x[1][i]])
            : r.pasos,
    tip:  x[2] || r.tip,
  });
}

/* ============ Categories ============ */
const CATS_IDS = ['all','desayuno','sopa','carne','ave','pescado','pasta','arroz','veg','postre','pan','bebida','salsa'];
const CATS = CATS_IDS.map(id => ({id, get name(){ return trCat(id); }}));
const catName = id => trCat(id);

/* ============ Seed recipes (escritas de forma original) ============ */
/* ============================================================
   BIBLIOTECA DE RECETAS
   Se cargan desde recetas.json (formato compacto) para que este
   archivo se mantenga liviano. Para agregar recetas, solo se
   reemplaza ese archivo.
   ============================================================ */
let SEED = [];
let PREPS = [];
let BASE = [];              // recetas en español, tal como vienen del archivo

/* Una receta puede ser ingrediente de otra (la cazuela lleva hogao, la
   bordalesa lleva demi-glace). Buscarla con BASE.find por cada ingrediente
   de cada receta es cuadrático; este Map se arma una vez y se rehace solo
   cuando BASE se reemplaza, que es al cambiar de idioma. */
let _ixMapa = null, _ixDe = null;
function recetaPorId(id){
  if(_ixDe !== BASE){ _ixMapa = new Map(BASE.map(r => [r.id, r])); _ixDe = BASE; }
  return _ixMapa.get(id);
}
let bibliotecaLista = false;

/* Rearma SEED y PREPS con los textos del idioma activo */
function aplicarIdiomaRecetas(){
  const todas = BASE.map(trReceta);
  SEED  = todas.filter(r => !r.prep);
  PREPS = todas.filter(r =>  r.prep);
}

/* [id,name,cat,pais,tec,min,dif,serv,[eq],[[q,u,ing]],[opt],[[paso,min?]],tip,esReceta] */
function expandir(a){
  return { id:a[0], name:a[1], cat:a[2], pais:a[3], tec:a[4], min:a[5], dif:a[6],
           serv:a[7], eq:a[8], ing:a[9], opt:a[10], pasos:a[11], tip:a[12],
           prep:!a[13], em:'' };
}

let COCINA = null;
async function cargarCocina(){
  try{
    const res = await fetch('cocina.json', {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    COCINA = await res.json();
  }catch(e){ COCINA = null; }
}

async function cargarBiblioteca(){
  try{
    const res = await fetch('recetas.json', {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const datos = await res.json();
    BASE = datos.map(expandir);
    aplicarIdiomaRecetas();
    bibliotecaLista = true;
  }catch(e){
    bibliotecaLista = false;
  }
}

/* ============ State ============ */
let state = {
  cat:'all', q:'', tab:'home',
  favs: store.get('rec_favs', []),
  custom: store.get('rec_custom', []),
  current:null, cookStep:0, timer:null,
};
const allRecipes = () => [...state.custom, ...SEED, ...(typeof PREPS!=='undefined'?PREPS:[])];
const isFav = id => state.favs.includes(id);

/* ============================================================
   IMÁGENES — Pega aquí la foto de cada plato (generada en Gemini).
   Formato:  r1:'data:image/jpeg;base64,XXXXXXXX',
   Deja '' si todavía no la tienes (se muestra el emoji).
   Consejo: redimensiona a ~800px y JPEG ~70% para no inflar el archivo.
   ============================================================ */
/* ============================================================
   FOTOS
   Cada plato busca su foto en  fotos/<id>.jpg  (ej: fotos/c001.jpg).
   Si no existe, se muestra un monograma tipográfico. No hay que
   tocar el código: basta con subir la foto a esa carpeta.
   ============================================================ */
const FOTOS_DIR = 'fotos/';
const fotoDe = r => r && r.id ? FOTOS_DIR + r.id + '.jpg' : '';

/* Monograma + foto encima; si la foto no existe, el monograma queda */
function lienzo(r, clase, tam){
  const ini = (r.name || '?').trim().charAt(0).toUpperCase();
  return '<div class="' + clase + '" style="background:' + tint(r.cat) + ';position:relative;overflow:hidden">' +
    '<span style="font-family:var(--disp);font-weight:500;font-size:' + tam + ';color:var(--laton-osc);opacity:.75">' + ini + '</span>' +
    '<img src="' + fotoDe(r) + '" alt="" aria-hidden="true" loading="lazy" ' +
    'onerror="this.remove()" ' +
    'style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">' +
  '</div>';
}

/* ============ Quantity formatting + scaling ============ */
const FR = {0.25:'¼',0.5:'½',0.75:'¾',0.33:'⅓',0.67:'⅔',0.125:'⅛'};
function fmtQty(n){
  if(n===0) return '';
  const whole = Math.floor(n);
  let frac = +(n-whole).toFixed(2);
  // snap to nearest known fraction
  let best=null,bd=1;
  for(const k in FR){ const d=Math.abs(frac-k); if(d<bd){bd=d;best=k;} }
  if(best && bd<0.06){
    return (whole? whole+' ':'')+FR[best];
  }
  if(n<1) return (+n.toFixed(2)).toString();
  return (+n.toFixed(n<10?1:0)).toString();
}
function scaledIng(ing, base, cur){
  return ing.map(([q,u,name])=>{
    const v = q*(cur/base);
    return {id: name, q: fmtQty(v), u: trUni(u), name: esInsumoConocido(name) ? trIng(name) : name};
  });
}

/* ============ Render: chips ============ */
function renderChips(){
  const el = document.getElementById('chips');
  el.innerHTML = CATS.map(c=>
    `<button class="chip ${state.cat===c.id?'on':''}" data-cat="${c.id}">
       <span class="em">${c.em}</span>${c.name}</button>`).join('');
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;renderChips();renderGrid();});
}

/* ============ Render: grid ============ */
function matches(r){
  if(state.tab==='favs' && !isFav(r.id)) return false;
  if(state.cat!=='all' && r.cat!==state.cat) return false;
  if(state.q){
    const q=state.q.toLowerCase();
    const ingNames=r.ing.map(i=>esInsumoConocido(i[2])?trIng(i[2]):i[2]).join(' ');
    const hay=(r.name+' '+r.pais+' '+(r.tec||'')+' '+ingNames).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function renderGrid(){
  const grid=document.getElementById('grid');
  const count=document.getElementById('count');
  let list=allRecipes().filter(matches);
  count.textContent = list.length? `${list.length} ${list.length>1?t('recetas'):t('receta')}` : '';
  if(!list.length){
    grid.innerHTML='';
    count.innerHTML=`<div class="empty">
      ${state.tab==='favs'?t('sinFavoritos'):t('sinResultados')}</div>`;
    return;
  }
  grid.innerHTML=list.map(r=>`
    <button class="card" data-id="${r.id}">
      ${lienzo(r,'thumb','24px')}
      <div class="body">
        <div class="cat">${catName(r.cat)}</div>
        <h3>${r.name}</h3>
        <div class="meta"><span>${r.min} ${t('min')}</span><span>${r.serv} ${t('porciones')}</span></div>
      </div>
      <span class="fav ${isFav(r.id)?'on':''}" data-fav="${r.id}" role="button" aria-label="Favorito">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9.5-8.5C.5 9 2 5.5 5.5 5.5 8 5.5 12 8 12 8s4-2.5 6.5-2.5C22 5.5 23.5 9 21.5 12.5 19 16.5 12 21 12 21z"/></svg>
      </span>
    </button>`).join('');
  grid.querySelectorAll('.card').forEach(c=>c.onclick=e=>{
    if(e.target.closest('[data-fav]')) return;
    openDetail(c.dataset.id);
  });
  grid.querySelectorAll('[data-fav]').forEach(f=>f.onclick=e=>{e.stopPropagation();toggleFav(f.dataset.fav);});
}
function tint(cat){
  const map={desayuno:'#EFE7D8',sopa:'#E9E2D4',carne:'#E7DCD2',ave:'#EDE5D2',pescado:'#E0E4E0',
    pasta:'#EEE6D4',arroz:'#EBE4D6',veg:'#E2E6DC',postre:'#EDE2DC',pan:'#EBE1CE',bebida:'#E0E6E4',salsa:'#E9DED2'};
  return map[cat]||'#EAE3D6';
}

/* ============ Favorites ============ */
function toggleFav(id){
  if(isFav(id)) state.favs=state.favs.filter(x=>x!==id);
  else state.favs=[...state.favs,id];
  store.set('rec_favs',state.favs);
  renderGrid();
  if(state.current && state.current.id===id) updateHeartTop();
  toast(isFav(id)?t('favAgregada'):t('favQuitada'));
}

/* ============ Detail ============ */
function openDetail(id){
  const r = (typeof id === 'object' && id) ? id : allRecipes().find(x=>x.id===id);
  if(!r) return;
  state.current=r; state.servNow=r.serv;
  const inner=document.getElementById('sheetInner');
  inner.innerHTML=`
    <div class="hero" style="background:${tint(r.cat)};min-height:220px">
      <img src="${fotoDe(r)}" alt="" aria-hidden="true" onerror="this.remove()"
           style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
      <button class="back" id="back"><svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="heart-top ${isFav(r.id)?'on':''}" id="heartTop"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9.5-8.5C.5 9 2 5.5 5.5 5.5 8 5.5 12 8 12 8s4-2.5 6.5-2.5C22 5.5 23.5 9 21.5 12.5 19 16.5 12 21 12 21z"/></svg></button>
      <span style="position:relative;font-family:var(--disp);font-weight:500;font-size:76px;color:var(--laton-osc);opacity:.6">${(r.name||'?').trim().charAt(0).toUpperCase()}</span>
    </div>
    <div class="detail">
      <div class="d-cat">${catName(r.cat)}</div>
      <h2>${r.name}</h2>
      <div class="d-country">${trPais(r.pais)}${pideCorte(r)?` · <span class="corte">${t(pideCorte(r)==='rapida'?'corteTierno':'corteLento')}</span>`:''}</div>
      ${avisoPrevio(r)}
      ${bloqueTemp(r)}
      ${bloqueNutri(r)}
      ${bloqueAnatomia(r)}
      ${bloqueEspecias(r)}
      <div class="stats">
        <div class="stat"><div class="k">${t('tiempo')}</div><div class="v">${r.min} ${t('min')}</div></div>
        <div class="stat"><div class="k">${t('dificultad')}</div><div class="v">${trDif(r.dif)}</div></div>
        <div class="stat"><div class="k">${t('base')}</div><div class="v">${r.serv} ${t('porcAbrev')}</div></div>
      </div>

      <div class="scaler-card">
        <div class="lab">${t('ajustar')}<b id="servLbl">${r.serv} ${t('personas')}</b></div>
        <div class="stepper">
          <button id="minus">−</button>
          <span class="num" id="servNum">${r.serv}</span>
          <button id="plus">+</button>
        </div>
      </div>

function renderIng(flash){
  const r=state.current;
  const list=scaledIng(r.ing,r.serv,state.servNow);
  document.getElementById('ingList').innerHTML=list.map(i=>`
    <div class="ing ${flash?'flash':''}"><span class="q">${i.q} ${i.u}</span><span class="n">${i.name}</span><span class="fill"></span></div>`
    + lineaSust(i.id)).join('');
  // Tocar un reemplazo dice qué cambia al usarlo
  document.querySelectorAll('#ingList [data-sust]').forEach(b => b.onclick = () => {
    const [a, c] = b.dataset.sust.split('|');
    const par = (SUST[a] || []).find(x => x[0] === c);
    if (par) toast(trIng(c) + ' — ' + par[2]);
  });
}

/* Los reemplazos de un insumo, con el que ya tienes marcado por delante.
   Vale la pena señalar cuál tienes: si no, hay que leerlos todos. */
function lineaSust(id){
  const l = SUST[id];
  if (!l || !l.length) return '';
  // Lo que la receta ya lleva no es un reemplazo: proponer langostino en
  // lugar del camarón cuando la cazuela lleva los dos no ayuda a nadie.
  const yaVa = new Set((((state.current || {}).ing) || []).map(x => x[2]));
  const utiles = l.filter(([otro]) => !yaVa.has(otro));
  if (!utiles.length) return '';
  const orden = utiles.sort((a, b) =>
    (pantry.has(b[0]) ? 1 : 0) - (pantry.has(a[0]) ? 1 : 0));
  return '<div class="sust">' +
    orden.map(([otro, clase]) =>
      '<button class="sust-x ' + clase + (pantry.has(otro) ? ' si' : '') +
      '" data-sust="' + id + '|' + otro + '">' + trIng(otro) + '</button>').join('') +
    '</div>';
}
function changeServ(d){
  state.servNow=Math.max(1,Math.min(40,state.servNow+d));
  document.getElementById('servNum').textContent=state.servNow;

/* ============ Cook mode ============ */
function startCook(){
  state.cookStep=0;
  document.getElementById('cook').classList.add('open');
  renderCook();
}
function renderCook(){
  const r=state.current, steps=r.pasos, i=state.cookStep, p=steps[i];
  clearTimer();
  document.getElementById('cookNo').textContent=`${t('paso')} ${i+1} ${t('de')} ${steps.length}`;
  // En modo cocina el texto va plano a propósito: se lee de lejos y no
  // se toca. Las medidas de corte se consultan en la lista de pasos.
  document.getElementById('cookTx').textContent=p[0];
  document.getElementById('cookDots').innerHTML=steps.map((_,j)=>
    `<span class="${j<i?'done':j===i?'on':''}"></span>`).join('');
  const tBtn=document.getElementById('cookTimerBtn'), tDisp=document.getElementById('cookTimer');
  tDisp.classList.remove('on');
  if(p[1]){
    tBtn.classList.add('show');
    tBtn.textContent=`${t('iniciarTemp')} · ${p[1]} ${t('min')}`;
    tBtn.onclick=()=>runTimer(p[1]*60);
  } else { tBtn.classList.remove('show'); }
  document.getElementById('cookPrev').style.visibility=i===0?'hidden':'visible';
  document.getElementById('cookNext').textContent=i===steps.length-1?t('terminar'):t('siguiente');
}
function runTimer(sec){
  clearTimer();
  const tDisp=document.getElementById('cookTimer'); tDisp.classList.add('on');
  let left=sec;
  const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  tDisp.textContent=fmt(left);
  state.timer=setInterval(()=>{
    left--; tDisp.textContent=fmt(left);
    if(left<=0){ clearTimer(); beep(); tDisp.textContent=t('listo'); }
  },1000);
}
function clearTimer(){ if(state.timer){clearInterval(state.timer);state.timer=null;} }
function beep(){
  try{ const a=new (window.AudioContext||window.webkitAudioContext)();
    const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);
    o.frequency.value=880;g.gain.value=0.15;o.start();
    setTimeout(()=>{o.stop();a.close();},600);
  }catch(e){}
}
document.getElementById('cookClose').onclick=()=>{clearTimer();document.getElementById('cook').classList.remove('open');};
document.getElementById('cookPrev').onclick=()=>{if(state.cookStep>0){state.cookStep--;renderCook();}};
document.getElementById('cookNext').onclick=()=>{
  if(state.cookStep<state.current.pasos.length-1){state.cookStep++;renderCook();}
  else{clearTimer();document.getElementById('cook').classList.remove('open');toast(t('provecho'));}
};

function parseQty(s){ // "2 taza" -> [2,'taza'] ; "harina" handled separately
  s=(s||'').trim(); const m=s.match(/^([\d.,/]+)\s*(.*)$/);
  if(!m) return [1,''];
  let num=m[1].replace(',','.'); if(num.includes('/')){const[a,b]=num.split('/');num=(+a/+b);}
  return [parseFloat(num)||1, m[2]||''];
}
function saveRecipe(){
  const v=id=>document.getElementById(id).value.trim();
  const name=v('f-name');
  if(!name){toast(t('ponleNombre'));return;}
  const ing=[...document.querySelectorAll('#ingRows .dyn-row')].map(r=>{
    const q=r.querySelector('.ig-q').value, n=r.querySelector('.ig-n').value.trim();
    if(!n) return null; const [num,unit]=parseQty(q); return [num,unit,n];
  }).filter(Boolean);
  const pasos=[...document.querySelectorAll('#stepRows .dyn-row')].map(r=>{
    const t=r.querySelector('.st-t').value.trim(), m=parseInt(r.querySelector('.st-m').value);
    if(!t) return null; return m?[t,m]:[t];
  }).filter(Boolean);
  if(!ing.length||!pasos.length){toast(t('minIngPaso'));return;}
  const rec={id:'c'+Date.now(),custom:true,name,cat:v('f-cat'),pais:v('f-pais')||'—',
    min:+v('f-min')||30,dif:v('f-dif'),serv:+v('f-serv')||4,em:v('f-em'),ing,pasos,tip:''};
  state.custom=[rec,...state.custom]; store.set('rec_custom',state.custom);
  document.getElementById('sheet').classList.remove('open');
  switchTab('mine'); toast(t('guardada'));
}

}
