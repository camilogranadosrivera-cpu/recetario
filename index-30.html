<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2E6B43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Recetario · Cocina del mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF8F3; --surface:#FFFFFF; --surface-2:#F5EFE6;
    --ink:#241F1B; --ink-soft:#75695C; --line:#EAE1D4;
    --green:#2E6B43; --green-dark:#1F4D30; --green-soft:#E4EFE6;
    --honey:#E0962A; --paprika:#C0492B;
    --sh:0 1px 2px rgba(40,30,20,.05),0 6px 20px rgba(40,30,20,.06);
    --r:18px;
    --disp:'Fraunces',Georgia,serif;
    --body:'Inter',system-ui,sans-serif;
    --mono:'Space Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--body);background:var(--bg);color:var(--ink);
    line-height:1.5;overscroll-behavior-y:none;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:16px}
  ::selection{background:var(--green);color:#fff}

  /* ---------- App shell ---------- */
  #app{max-width:680px;margin:0 auto;min-height:100%;padding-bottom:84px}

  .topbar{
    position:sticky;top:0;z-index:20;background:rgba(251,248,243,.86);
    backdrop-filter:saturate(180%) blur(12px);
    padding:max(14px,env(safe-area-inset-top)) 18px 12px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .brand-mark{
    width:38px;height:38px;border-radius:11px;flex:none;
    background:linear-gradient(145deg,var(--green),var(--green-dark));
    display:grid;place-items:center;color:#fff;font-size:20px;
    box-shadow:0 4px 12px rgba(46,107,67,.3);
  }
  .brand h1{font-family:var(--disp);font-weight:600;font-size:21px;letter-spacing:-.01em;line-height:1.05}
  .brand small{display:block;font-family:var(--body);font-weight:500;font-size:11px;
    text-transform:uppercase;letter-spacing:.14em;color:var(--ink-soft)}

  .search{position:relative}
  .search input{
    width:100%;border:1px solid var(--line);background:var(--surface);
    border-radius:14px;padding:12px 14px 12px 42px;color:var(--ink);
    outline:none;transition:border-color .2s,box-shadow .2s;
  }
  .search input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;stroke:var(--ink-soft)}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 4px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:var(--surface);
    border-radius:100px;padding:8px 14px;font-size:13.5px;font-weight:500;
    color:var(--ink-soft);white-space:nowrap;transition:.18s;display:flex;gap:6px;align-items:center}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip .em{font-size:15px}

  /* ---------- Grid ---------- */
  .wrap{padding:8px 18px 0}
  .count{font-size:12.5px;color:var(--ink-soft);margin:8px 2px 14px;letter-spacing:.02em}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(min-width:560px){.grid{grid-template-columns:1fr 1fr 1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    overflow:hidden;box-shadow:var(--sh);text-align:left;display:flex;flex-direction:column;
    transition:transform .15s,box-shadow .15s}
  .card:active{transform:scale(.975)}
  .card .thumb{aspect-ratio:1.25;display:grid;place-items:center;font-size:44px;position:relative}
  .card .fav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;
    background:rgba(255,255,255,.82);display:grid;place-items:center;backdrop-filter:blur(4px)}
  .card .fav svg{width:16px;height:16px;stroke:var(--paprika);fill:none;stroke-width:2}
  .card .fav.on svg{fill:var(--paprika)}
  .card .body{padding:11px 12px 13px}
  .card .cat{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--green)}
  .card h3{font-family:var(--disp);font-weight:600;font-size:15.5px;line-height:1.15;margin:3px 0 7px;letter-spacing:-.01em}
  .card .meta{display:flex;gap:10px;font-size:11.5px;color:var(--ink-soft);font-family:var(--mono)}
  .empty{text-align:center;color:var(--ink-soft);padding:60px 20px}
  .empty .em{font-size:40px;display:block;margin-bottom:10px}

  /* ---------- Detail ---------- */
  .sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;
    transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
  .sheet.open{transform:translateX(0)}
  .sheet-inner{max-width:680px;margin:0 auto}
  .hero{padding:46px 22px;display:grid;place-items:center;font-size:74px;position:relative}
  .back{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;
    width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);
    display:grid;place-items:center;box-shadow:var(--sh);z-index:2}
  .back svg{width:20px;height:20px;stroke:var(--ink);stroke-width:2.2;fill:none}
  .heart-top{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;
    width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);
    display:grid;place-items:center;box-shadow:var(--sh);z-index:2}
  .heart-top svg{width:19px;height:19px;stroke:var(--paprika);fill:none;stroke-width:2}
  .heart-top.on svg{fill:var(--paprika)}

  .detail{background:var(--surface);border-radius:26px 26px 0 0;margin-top:-22px;
    padding:24px 22px 40px;position:relative;min-height:60vh}
  .d-cat{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--green)}
  .detail h2{font-family:var(--disp);font-weight:600;font-size:27px;line-height:1.1;letter-spacing:-.015em;margin:5px 0 4px}
  .d-country{color:var(--ink-soft);font-size:13.5px}
  .stats{display:flex;gap:8px;margin:18px 0 6px;flex-wrap:wrap}
  .stat{background:var(--surface-2);border-radius:12px;padding:9px 13px;flex:1;min-width:88px}
  .stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft)}
  .stat .v{font-family:var(--mono);font-weight:700;font-size:15px;margin-top:2px}

  .scaler-card{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
    margin:20px 0;display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(180deg,var(--green-soft),#fff)}
  .scaler-card .lab{font-size:12.5px;color:var(--green-dark);font-weight:600}
  .scaler-card .lab b{display:block;font-family:var(--disp);font-size:16px;color:var(--ink);font-weight:600}
  .stepper{display:flex;align-items:center;gap:0;background:#fff;border:1px solid var(--line);
    border-radius:100px;overflow:hidden}
  .stepper button{width:42px;height:42px;font-size:22px;color:var(--green-dark);font-weight:700;display:grid;place-items:center}
  .stepper button:active{background:var(--green-soft)}
  .stepper .num{font-family:var(--mono);font-weight:700;font-size:18px;min-width:34px;text-align:center}

  .sec-title{font-family:var(--disp);font-weight:600;font-size:18px;margin:26px 0 12px;letter-spacing:-.01em;
    display:flex;align-items:baseline;gap:10px}
  .sec-title::after{content:"";flex:1;height:1px;background:var(--line)}

  .ing{display:flex;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .ing .q{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--green-dark);
    min-width:78px;flex:none;transition:color .2s}
  .ing .n{font-size:15px}
  .ing.flash .q{color:var(--honey)}

  .step{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .step .no{font-family:var(--mono);font-weight:700;color:var(--honey);font-size:14px;flex:none;
    width:26px;height:26px;border-radius:50%;border:1.5px solid var(--honey);display:grid;place-items:center}
  .step .tx{font-size:15px;line-height:1.55}
  .step .tmr{margin-top:8px;display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);
    border-radius:9px;padding:6px 11px;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--paprika)}
  .step .tmr svg{width:14px;height:14px;stroke:var(--paprika);fill:none;stroke-width:2}

  .tip{background:var(--green-soft);border-radius:var(--r);padding:14px 16px;margin-top:22px;font-size:14px;line-height:1.55}
  .tip b{color:var(--green-dark)}

  .cook-btn{position:sticky;bottom:18px;width:100%;margin-top:26px;
    background:var(--green);color:#fff;border-radius:14px;padding:16px;font-weight:600;font-size:15.5px;
    box-shadow:0 8px 24px rgba(46,107,67,.35);display:flex;align-items:center;justify-content:center;gap:9px}
  .cook-btn:active{background:var(--green-dark)}

  /* ---------- Cook mode ---------- */
  .cook{position:fixed;inset:0;z-index:60;background:var(--green-dark);color:#fff;
    display:none;flex-direction:column;padding:max(20px,env(safe-area-inset-top)) 24px 30px}
  .cook.open{display:flex}
  .cook-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:auto}
  .cook-top .x{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
  .cook-top .x svg{width:20px;height:20px;stroke:#fff;stroke-width:2.2}
  .cook-dots{display:flex;gap:6px;flex-wrap:wrap;max-width:60%;justify-content:center}
  .cook-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}
  .cook-dots span.on{background:var(--honey)}
  .cook-dots span.done{background:#fff}
  .cook-body{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
  .cook-no{font-family:var(--mono);font-size:14px;letter-spacing:.2em;color:var(--honey);text-transform:uppercase}
  .cook-tx{font-family:var(--disp);font-weight:500;font-size:25px;line-height:1.32;margin-top:14px}
  .cook-timer{margin:24px auto 0;font-family:var(--mono);font-weight:700;font-size:46px;letter-spacing:.02em;display:none}
  .cook-timer.on{display:block}
  .cook-timer-btn{margin:18px auto 0;background:var(--honey);color:#241F1B;font-weight:700;
    border-radius:100px;padding:11px 22px;font-size:14px;display:none}
  .cook-timer-btn.show{display:inline-block}
  .cook-nav{display:flex;gap:12px;margin-top:auto}
  .cook-nav button{flex:1;border-radius:14px;padding:16px;font-weight:600;font-size:15px}
  .cook-nav .prev{background:rgba(255,255,255,.14);color:#fff}
  .cook-nav .next{background:#fff;color:var(--green-dark)}

  /* ---------- Bottom nav ---------- */
  .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:rgba(251,248,243,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    display:flex;max-width:680px;margin:0 auto;padding:8px 8px max(8px,env(safe-area-inset-bottom))}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--ink-soft);font-size:10.5px;font-weight:600}
  .tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8}
  .tab.on{color:var(--green)}
  .tab.add svg{stroke:#fff}
  .tab.add .ic{width:46px;height:38px;border-radius:13px;background:var(--green);display:grid;place-items:center;
    box-shadow:0 6px 16px rgba(46,107,67,.35);margin-top:-14px}

  /* ---------- Add form ---------- */
  .form{padding:18px}
  .form h2{font-family:var(--disp);font-weight:600;font-size:24px;margin-bottom:4px}
  .form .sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:20px}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
  .fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--surface);
    border-radius:12px;padding:12px 14px;color:var(--ink);outline:none}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .row2{display:flex;gap:10px}.row2>*{flex:1}
  .dyn-row{display:flex;gap:8px;margin-bottom:8px}
  .dyn-row input{flex:1}
  .dyn-row .q{flex:none;width:88px}
  .dyn-row .del{flex:none;width:42px;border:1px solid var(--line);border-radius:12px;color:var(--paprika);font-size:18px}
  .addline{font-size:13px;font-weight:600;color:var(--green);padding:8px 0}
  .save{width:100%;background:var(--green);color:#fff;border-radius:14px;padding:16px;font-weight:600;font-size:15.5px;margin-top:10px}
  .save:active{background:var(--green-dark)}
  .ghost{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;font-weight:600;color:var(--ink-soft);margin-top:10px}

  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:100px;font-size:13.5px;font-weight:500;
    opacity:0;transition:.3s;z-index:80;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- Módulo "¿Qué cocino?" ---------- */
  .pantry{padding:18px}
  .pantry-head{margin-bottom:18px}
  .pantry-head h2{font-family:var(--disp);font-weight:600;font-size:24px;letter-spacing:-.015em}
  .pantry-head p{color:var(--ink-soft);font-size:13.5px;margin-top:4px}
  .pgroup{margin-bottom:18px}
  .pgroup .gt{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
    color:var(--ink-soft);margin-bottom:9px;display:flex;align-items:center;gap:7px}
  .pgroup .gt .n{background:var(--green);color:#fff;border-radius:100px;padding:1px 7px;font-size:10.5px}
  .pills{display:flex;flex-wrap:wrap;gap:7px}
  .pill{border:1px solid var(--line);background:var(--surface);border-radius:100px;
    padding:7px 12px;font-size:13px;font-weight:500;color:var(--ink-soft);transition:.15s}
  .pill.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
  .pill.eq.on{background:var(--honey);border-color:var(--honey);color:#241F1B}
  .psearch{position:relative;margin-bottom:16px}
  .psearch input{width:100%;border:1px solid var(--line);background:var(--surface);
    border-radius:12px;padding:11px 14px;outline:none}
  .psearch input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}

  .pantry-bar{position:sticky;bottom:78px;z-index:15;padding-top:8px;
    background:linear-gradient(to top,var(--bg) 65%,transparent)}
  .go{width:100%;background:var(--green);color:#fff;border-radius:14px;padding:16px;
    font-weight:600;font-size:15.5px;box-shadow:0 8px 24px rgba(46,107,67,.32);
    display:flex;align-items:center;justify-content:center;gap:9px}
  .go:active{background:var(--green-dark)}
  .go.dim{background:var(--line);color:var(--ink-soft);box-shadow:none}
  .clearsel{width:100%;background:none;color:var(--ink-soft);font-size:13px;font-weight:600;padding:11px}

  .res-head{display:flex;align-items:center;gap:9px;margin:22px 0 12px}
  .res-head .badge{border-radius:100px;padding:4px 11px;font-size:11.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:.05em}
  .res-head .badge.ok{background:var(--green-soft);color:var(--green-dark)}
  .res-head .badge.near{background:#FBEBD9;color:#8A5410}
  .res-head span{font-size:12.5px;color:var(--ink-soft)}
  .res-card{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);padding:14px 15px;margin-bottom:10px;box-shadow:var(--sh);
    display:flex;gap:13px;align-items:flex-start;transition:transform .15s}
  .res-card:active{transform:scale(.985)}
  .res-card .ic{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;
    font-size:25px;flex:none}
  .res-card .rc-body{flex:1;min-width:0}
  .res-card .tec{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--green)}
  .res-card h4{font-family:var(--disp);font-weight:600;font-size:16.5px;line-height:1.15;margin:3px 0 5px}
  .res-card .rmeta{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);display:flex;gap:10px;flex-wrap:wrap}
  .miss{margin-top:7px;font-size:12.5px;color:#8A5410;background:#FBEBD9;border-radius:9px;padding:5px 9px;display:inline-block}
  .uses{margin-top:6px;font-size:12px;color:var(--ink-soft);line-height:1.4}

  .ai-box{border:1px dashed var(--line);border-radius:var(--r);padding:16px;margin-top:24px;background:var(--surface)}
  .ai-box h4{font-family:var(--disp);font-size:16px;font-weight:600;margin-bottom:5px}
  .ai-box p{font-size:13px;color:var(--ink-soft);line-height:1.5;margin-bottom:12px}
  .ai-btn{width:100%;background:linear-gradient(135deg,#5B3FA8,#7B5BD6);color:#fff;border-radius:12px;
    padding:14px;font-weight:600;font-size:14.5px}
  .ai-btn:disabled{opacity:.55}
  .ai-out{margin-top:14px;font-size:14px;line-height:1.6;white-space:pre-wrap}
  .ai-cfg{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    margin-bottom:10px;font-size:13px;outline:none}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">🍽️</div>
      <div>
        <h1>Recetario</h1>
        <small>Cocina del mundo</small>
      </div>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Buscar receta, ingrediente o país…" autocomplete="off">
    </div>
  </div>

  <div class="chips" id="chips"></div>

  <div class="wrap">
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- Detail sheet -->
<div class="sheet" id="sheet"><div class="sheet-inner" id="sheetInner"></div></div>

<!-- Cook mode -->
<div class="cook" id="cook">
  <div class="cook-top">
    <button class="x" id="cookClose" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="cook-dots" id="cookDots"></div>
    <div style="width:40px"></div>
  </div>
  <div class="cook-body">
    <div class="cook-no" id="cookNo"></div>
    <div class="cook-tx" id="cookTx"></div>
    <div class="cook-timer" id="cookTimer"></div>
    <button class="cook-timer-btn" id="cookTimerBtn"></button>
  </div>
  <div class="cook-nav">
    <button class="prev" id="cookPrev">Anterior</button>
    <button class="next" id="cookNext">Siguiente</button>
  </div>
</div>

<!-- Tab bar -->
<nav class="tabbar" id="tabbar"></nav>

<div class="toast" id="toast"></div>

<script>
/* ============ Storage (safe: works on Netlify, degrades in preview) ============ */
const store = {
  get(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

/* ============ Categories ============ */
const CATS = [
  {id:'all', name:'Todas', em:'✨'},
  {id:'desayuno', name:'Desayunos', em:'🍳'},
  {id:'sopa', name:'Sopas', em:'🥣'},
  {id:'carne', name:'Carnes', em:'🥩'},

/* ============ Quantity formatting + scaling ============ */
const FR = {0.25:'¼',0.5:'½',0.75:'¾',0.33:'⅓',0.67:'⅔',0.125:'⅛'};
function fmtQty(n){
  if(n===0) return '';
  const whole = Math.floor(n);
  let frac = +(n-whole).toFixed(2);
  // snap to nearest known fraction
  let best=null,bd=1;
  for(const k in FR){ const d=Math.abs(frac-k); if(d<bd){bd=d;best=k;} }
  if(best && bd<0.06){
    return (whole? whole+' ':'')+FR[best];
  }
  if(n<1) return (+n.toFixed(2)).toString();
  return (+n.toFixed(n<10?1:0)).toString();
}
function scaledIng(ing, base, cur){
  return ing.map(([q,u,name])=>{
    const v = q*(cur/base);
    return {q: fmtQty(v), u, name: (typeof ING!=='undefined' && ING[name]) ? ING[name] : name};
  });
}

/* ============ Render: grid ============ */
function matches(r){
  if(state.tab==='favs' && !isFav(r.id)) return false;
  if(state.cat!=='all' && r.cat!==state.cat) return false;
  if(state.q){
    const q=state.q.toLowerCase();
    const ingNames=r.ing.map(i=>(typeof ING!=='undefined'&&ING[i[2]])?ING[i[2]]:i[2]).join(' ');
    const hay=(r.name+' '+r.pais+' '+(r.tec||'')+' '+ingNames).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function renderGrid(){
  const grid=document.getElementById('grid');
  const count=document.getElementById('count');
  let list=allRecipes().filter(matches);
  count.textContent = list.length? `${list.length} receta${list.length>1?'s':''}` : '';
  if(!list.length){
    grid.innerHTML='';
    count.innerHTML=`<div class="empty"><span class="em">🔎</span>
      ${state.tab==='favs'?'Aún no tienes favoritos. Toca el corazón en una receta.':'No encontramos recetas con ese filtro.'}</div>`;
    return;
  }
  grid.innerHTML=list.map(r=>{const im=imgOf(r);return `
    <button class="card" data-id="${r.id}">
      <div class="thumb" style="${im?`background-image:url('${im}');background-size:cover;background-position:center;font-size:0`:`background:${tint(r.cat)}`}">
        ${im?'':(r.em||catEm(r.cat))}
        <span class="fav ${isFav(r.id)?'on':''}" data-fav="${r.id}">

        </span>
      </div>
      <div class="body">
        <div class="cat">${catName(r.cat)}</div>
        <h3>${r.name}</h3>
        <div class="meta"><span>⏱ ${r.min}m</span><span>👥 ${r.serv}</span></div>
      </div>
    </button>`;}).join('');
  grid.querySelectorAll('.card').forEach(c=>c.onclick=e=>{
    if(e.target.closest('[data-fav]')) return;
    openDetail(c.dataset.id);
  });
  grid.querySelectorAll('[data-fav]').forEach(f=>f.onclick=e=>{e.stopPropagation();toggleFav(f.dataset.fav);});
}
function tint(cat){
  const map={desayuno:'#FFF3DC',sopa:'#FDEBDB',carne:'#F6E0DC',ave:'#FBEFD7',pescado:'#DDEEF3',
    pasta:'#FDF0D6',arroz:'#F1EBDC',veg:'#E4F1E1',postre:'#FBE4EC',pan:'#F4E8D6',bebida:'#E2F0F2',salsa:'#F6E2D5'};
  return map[cat]||'#F2ECE0';
}

function toggleFav(id){
  if(isFav(id)) state.favs=state.favs.filter(x=>x!==id);
  else state.favs=[...state.favs,id];
  store.set('rec_favs',state.favs);
  renderGrid();
  if(state.current && state.current.id===id) updateHeartTop();
  toast(isFav(id)?'Agregada a favoritos':'Quitada de favoritos');
}

/* ============ Cook mode ============ */
function startCook(){
  state.cookStep=0;
  document.getElementById('cook').classList.add('open');
  renderCook();
}
function renderCook(){
  const r=state.current, steps=r.pasos, i=state.cookStep, p=steps[i];
  clearTimer();
  document.getElementById('cookNo').textContent=`Paso ${i+1} de ${steps.length}`;
  document.getElementById('cookTx').textContent=p[0];
  document.getElementById('cookDots').innerHTML=steps.map((_,j)=>
    `<span class="${j<i?'done':j===i?'on':''}"></span>`).join('');
  const tBtn=document.getElementById('cookTimerBtn'), tDisp=document.getElementById('cookTimer');
  tDisp.classList.remove('on');
  if(p[1]){
    tBtn.classList.add('show');
    tBtn.textContent=`▶ Iniciar temporizador (${p[1]} min)`;
    tBtn.onclick=()=>runTimer(p[1]*60);
  } else { tBtn.classList.remove('show'); }
  document.getElementById('cookPrev').style.visibility=i===0?'hidden':'visible';
  document.getElementById('cookNext').textContent=i===steps.length-1?'Terminar ✓':'Siguiente';
}
function runTimer(sec){
  clearTimer();
  const tDisp=document.getElementById('cookTimer'); tDisp.classList.add('on');
  let left=sec;
  const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  tDisp.textContent=fmt(left);
  state.timer=setInterval(()=>{
    left--; tDisp.textContent=fmt(left);
    if(left<=0){ clearTimer(); beep(); tDisp.textContent='¡Listo! ⏰'; }
  },1000);
}
function clearTimer(){ if(state.timer){clearInterval(state.timer);state.timer=null;} }
function beep(){
  try{ const a=new (window.AudioContext||window.webkitAudioContext)();
    const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);
    o.frequency.value=880;g.gain.value=0.15;o.start();
    setTimeout(()=>{o.stop();a.close();},600);
  }catch(e){}
}
document.getElementById('cookClose').onclick=()=>{clearTimer();document.getElementById('cook').classList.remove('open');};
document.getElementById('cookPrev').onclick=()=>{if(state.cookStep>0){state.cookStep--;renderCook();}};
document.getElementById('cookNext').onclick=()=>{
  if(state.cookStep<state.current.pasos.length-1){state.cookStep++;renderCook();}
  else{clearTimer();document.getElementById('cook').classList.remove('open');toast('¡Buen provecho! 🍽️');}
};

function parseQty(s){ // "2 taza" -> [2,'taza'] ; "harina" handled separately
  s=(s||'').trim(); const m=s.match(/^([\d.,/]+)\s*(.*)$/);
  if(!m) return [1,''];
  let num=m[1].replace(',','.'); if(num.includes('/')){const[a,b]=num.split('/');num=(+a/+b);}
  return [parseFloat(num)||1, m[2]||''];
}
function saveRecipe(){
  const v=id=>document.getElementById(id).value.trim();
  const name=v('f-name');
  if(!name){toast('Ponle un nombre a la receta');return;}
  const ing=[...document.querySelectorAll('#ingRows .dyn-row')].map(r=>{
    const q=r.querySelector('.ig-q').value, n=r.querySelector('.ig-n').value.trim();
    if(!n) return null; const [num,unit]=parseQty(q); return [num,unit,n];
  }).filter(Boolean);
  const pasos=[...document.querySelectorAll('#stepRows .dyn-row')].map(r=>{
    const t=r.querySelector('.st-t').value.trim(), m=parseInt(r.querySelector('.st-m').value);
    if(!t) return null; return m?[t,m]:[t];
  }).filter(Boolean);
  if(!ing.length||!pasos.length){toast('Agrega al menos un ingrediente y un paso');return;}
  const rec={id:'c'+Date.now(),custom:true,name,cat:v('f-cat'),pais:v('f-pais')||'—',
    min:+v('f-min')||30,dif:v('f-dif'),serv:+v('f-serv')||4,em:v('f-em'),ing,pasos,tip:''};
  state.custom=[rec,...state.custom]; store.set('rec_custom',state.custom);
  document.getElementById('sheet').classList.remove('open');
  switchTab('mine'); toast('Receta guardada ✓');
}
function delRecipe(id){

  closeDetail(); switchTab('mine'); toast('Receta eliminada');
}

/* ============================================================
   MOTOR DE COINCIDENCIAS
   ============================================================ */
let pantry = new Set(store.get('rec_pantry', BASICOS));
let equipo = new Set(store.get('rec_equipo', ['estufa','sarten','olla']));

function tengo(id){
  if(pantry.has(id)) return {ok:true, sust:null};
  const subs = SUSTITUTOS[id]||[];
  for(const s of subs) if(pantry.has(s)) return {ok:true, sust:s};
  return {ok:false, sust:null};
}

function evaluar(p){
  // equipos: si falta alguno, no se puede hacer
  const faltaEq = p.eq.filter(e=>!equipo.has(e));
  const req = p.ing.map(i=>i[2]);
  const falta=[], sustituciones=[], usa=[];
  req.forEach(id=>{
    const t=tengo(id);
    if(t.ok){ usa.push(id); if(t.sust) sustituciones.push([id,t.sust]); }
    else falta.push(id);
  });
  const extras = (p.opt||[]).filter(id=>pantry.has(id));
  // puntaje: cuántos de tus ingredientes aprovecha + qué tan completa está
  const cobertura = usa.length/req.length;
  const score = cobertura*100 + usa.length*4 + extras.length*3 - faltaEq.length*100;
  return {p, falta, faltaEq, sustituciones, extras, usa, cobertura, score};
}

function buscarPreparaciones(){
  const evaluadas = PREPS.map(evaluar).filter(r=>!r.faltaEq.length);
  const listas = evaluadas.filter(r=>r.falta.length===0).sort((a,b)=>b.score-a.score);
  const cerca  = evaluadas.filter(r=>r.falta.length>0 && r.falta.length<=2)
                          .sort((a,b)=>a.falta.length-b.falta.length || b.score-a.score);
  return {listas, cerca:cerca.slice(0,12)};
}

function renderPantry(){
  const app=document.getElementById('app');
  document.querySelector('.topbar').style.display='none';
  document.querySelector('.chips').style.display='none';
  document.querySelector('.wrap').innerHTML=`
   <div class="pantry">
     <div class="pantry-head">
       <h2>¿Qué cocino hoy?</h2>
       <p>Marca lo que tienes en casa y te digo qué puedes preparar ahora mismo.</p>
     </div>
     <div class="psearch"><input id="pq" placeholder="Buscar ingrediente…" autocomplete="off"></div>

     <div class="pgroup">
       <div class="gt">🔧 Con qué cocinas <span class="n" id="nEq">${equipo.size}</span></div>
       <div class="pills" id="eqPills"></div>
     </div>

     <div id="groups"></div>

     <div class="pantry-bar">
       <button class="go" id="goBtn"></button>
       <button class="clearsel" id="clearSel">Limpiar todo</button>
     </div>

     <div id="resultados"></div>
   </div>`;
  renderPills();
  document.getElementById('pq').addEventListener('input',e=>renderPills(e.target.value.toLowerCase()));
  document.getElementById('goBtn').onclick=mostrarResultados;
  document.getElementById('clearSel').onclick=()=>{
    pantry=new Set(BASICOS); savePantry(); renderPills();
    document.getElementById('resultados').innerHTML='';
    toast('Despensa reiniciada');
  };
  window.scrollTo(0,0);
}
function savePantry(){
  store.set('rec_pantry',[...pantry]); store.set('rec_equipo',[...equipo]);
}
function renderPills(filtro){
  const eq=document.getElementById('eqPills');
  eq.innerHTML=Object.keys(EQUIPOS).map(k=>
    `<button class="pill eq ${equipo.has(k)?'on':''}" data-eq="${k}">${EQUIPOS[k]}</button>`).join('');
  eq.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.eq; equipo.has(k)?equipo.delete(k):equipo.add(k);
    savePantry(); renderPills(filtro);
  });
  document.getElementById('nEq').textContent=equipo.size;

  document.getElementById('groups').innerHTML=GROUPS.map(g=>{
    const ids=g.ids.filter(id=>!filtro || ING[id].toLowerCase().includes(filtro));
    if(!ids.length) return '';
    const n=g.ids.filter(id=>pantry.has(id)).length;
    return `<div class="pgroup">
      <div class="gt">${g.em} ${g.t} ${n?`<span class="n">${n}</span>`:''}</div>
      <div class="pills">${ids.map(id=>
        `<button class="pill ${pantry.has(id)?'on':''}" data-ing="${id}">${ING[id]}</button>`).join('')}</div>
    </div>`;
  }).join('');
  document.querySelectorAll('[data-ing]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.ing; pantry.has(k)?pantry.delete(k):pantry.add(k);
    savePantry(); b.classList.toggle('on');
    actualizarBoton();
    document.querySelectorAll('.pgroup .gt .n').forEach(()=>{});
    renderPills(filtro);
  });
  actualizarBoton();
}
function actualizarBoton(){
  const b=document.getElementById('goBtn'); if(!b) return;
  const n=pantry.size;
  b.className='go'+(n<3?' dim':'');
  b.innerHTML = n<3 ? 'Marca al menos 3 ingredientes'
    : `🔎 Ver qué puedo cocinar con ${n} ingredientes`;
}

function mostrarResultados(){
  if(pantry.size<3){ toast('Marca al menos 3 ingredientes'); return; }
  const {listas,cerca}=buscarPreparaciones();
  const box=document.getElementById('resultados');
  let html='';

  html+=`<div class="res-head"><span class="badge ok">Puedes hacerlo ya</span>
         <span>${listas.length} preparacion${listas.length===1?'':'es'}</span></div>`;
  html+= listas.length
    ? listas.map(r=>cardHTML(r,false)).join('')
    : `<div class="empty" style="padding:26px"><span class="em">🧑‍🍳</span>
       Con esa combinación no sale un plato completo todavía.<br>Mira abajo lo que está a punto.</div>`;

  if(cerca.length){
    html+=`<div class="res-head"><span class="badge near">Te falta poco</span>
           <span>${cerca.length} a un paso</span></div>`;
    html+= cerca.map(r=>cardHTML(r,true)).join('');
  }

  html+=aiBoxHTML();
  box.innerHTML=html;

  box.querySelectorAll('[data-prep]').forEach(c=>c.onclick=()=>{
    const p=PREPS.find(x=>x.id===c.dataset.prep); if(p) openDetail(p);
  });
  document.getElementById('aiBtn').onclick=pedirIA;
  box.scrollIntoView({behavior:'smooth',block:'start'});
}
function cardHTML(r,esCerca){
  const p=r.p;
  const nombres=ids=>ids.map(i=>ING[i]||i).join(', ');
  return `<button class="res-card" data-prep="${p.id}">
    <div class="ic" style="background:${tint(p.cat)}">${p.em}</div>
    <div class="rc-body">
      <div class="tec">${p.tec} · ${p.pais}</div>
      <h4>${p.name}</h4>
      <div class="rmeta"><span>⏱ ${p.min}m</span><span>👥 ${p.serv}</span><span>${p.dif}</span></div>
      ${esCerca?`<div class="miss">Te falta: ${nombres(r.falta)}</div>`:''}
      ${r.sustituciones.length?`<div class="uses">↔ Puedes reemplazar ${nombres(r.sustituciones.map(s=>s[0]))} con ${nombres(r.sustituciones.map(s=>s[1]))}</div>`:''}
      ${(!esCerca&&r.extras.length)?`<div class="uses">✨ Mejóralo con: ${nombres(r.extras.slice(0,4))}</div>`:''}
    </div>
  </button>`;
}

/* ---------- Capa IA opcional ---------- */
function aiBoxHTML(){
  return `<div class="ai-box">
    <h4>✨ Sorpréndeme con IA</h4>
    <p>Ideas creativas fuera de la biblioteca, pensadas por un chef con IA usando justo lo que marcaste.</p>
    <button class="ai-btn" id="aiBtn">Proponerme algo creativo</button>
    <div class="ai-out" id="aiOut"></div>
  </div>`;
}
const AI_ENDPOINT = '/.netlify/functions/chef';  // mismo sitio, sin configurar nada

function md(t){  // Markdown mínimo → HTML (seguro: escapa primero)
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc(t)
    .replace(/^## (.+)$/gm,'<h4 style="font-family:var(--disp);font-size:17px;margin:18px 0 6px">$1</h4>')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/^(\d+)\.\s(.+)$/gm,'<div style="margin:3px 0 3px 4px">$1. $2</div>')
    .replace(/^-\s(.+)$/gm,'<div style="margin:3px 0 3px 4px">• $1</div>')
    .replace(/\n{2,}/g,'<br>');
}

async function pedirIA(){
  const out=document.getElementById('aiOut'), btn=document.getElementById('aiBtn');
  const lista=[...pantry].map(i=>ING[i]||i).join(', ');
  const eqs=[...equipo].map(e=>EQUIPOS[e]).join(', ');
  if(!lista){ out.textContent='Marca primero algunos ingredientes.'; return; }
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> El chef está pensando…'; out.textContent='';
  try{
    const res=await fetch(AI_ENDPOINT,{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ingredientes:lista,equipos:eqs})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok || data.error){
      out.textContent = data.error || `El servidor respondió ${res.status}.`;
    } else if(data.texto){
      out.innerHTML = md(data.texto);
    } else {
      out.textContent = 'Respuesta vacía del servidor.';
    }
  }catch(e){
    out.textContent='No se pudo conectar. Si estás abriendo el archivo localmente, esto solo funciona una vez publicado en Netlify.';
  }
  btn.disabled=false; btn.textContent='Proponerme algo creativo';
}

renderChips(); renderGrid(); renderTabs();
